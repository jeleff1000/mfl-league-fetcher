name: ESPN Fleet Import

# Imports multiple ESPN leagues in parallel using matrix strategy.
# Each league runs as its own independent job so failures are isolated.
#
# Usage:
#   source=full/quick/all: auto-discover from ___ops via Fly.io
#   source=custom: provide leagues_json
#   source=test: run tfl_of_extraordinary_gentleman only

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'League source: "full" (paid/grandfathered), "quick" (free only), "all", "test", or "custom"'
        required: true
        type: choice
        options:
          - full
          - quick
          - all
          - test
          - custom
        default: full
      leagues_json:
        description: 'JSON array of leagues (only used when source=custom). Format: [{"espn_league_id":"...", "database_name":"...", "start_year":2012, "end_year":2025}]'
        required: false
        type: string
      leagues_json_b64:
        description: 'Base64-encoded JSON array of leagues (safer for CLI/PowerShell custom runs).'
        required: false
        type: string
      max_parallel:
        description: 'Requested max parallel imports. Full-import fleets are capped server-side safe.'
        required: false
        type: number
        default: 10
      dry_run:
        description: 'Dry run - discover leagues but skip import'
        required: false
        type: boolean
        default: false
permissions:
  actions: write
  contents: read

jobs:
  # ================================================================
  # Job 1: Discover leagues and build the matrix
  # ================================================================
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      league_count: ${{ steps.build.outputs.league_count }}
      safe_max_parallel: ${{ steps.build.outputs.safe_max_parallel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build league matrix
        id: build
        env:
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          SOURCE: ${{ github.event.inputs.source }}
          LEAGUES_JSON: ${{ github.event.inputs.leagues_json }}
          LEAGUES_JSON_B64: ${{ github.event.inputs.leagues_json_b64 }}
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '10' }}
        run: |
          python - <<'PYEOF'
          import base64, json, os, sys, urllib.request

          def fly_query(sql, database="___ops"):
              url = os.environ["DATABASE_SERVER_URL"].rstrip("/") + "/query"
              token = os.environ["DATABASE_READ_TOKEN"]
              data = json.dumps({"sql": sql, "database": database}).encode()
              req = urllib.request.Request(url, data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          source = os.environ.get("SOURCE", "test")
          leagues_json_raw = os.environ.get("LEAGUES_JSON", "")
          leagues_json_b64 = os.environ.get("LEAGUES_JSON_B64", "")

          def parse_custom_leagues():
              raw = leagues_json_raw.strip()
              if leagues_json_b64.strip():
                  try:
                      raw = base64.b64decode(leagues_json_b64.strip()).decode("utf-8")
                  except Exception as exc:
                      print(f"ERROR: leagues_json_b64 is not valid base64 UTF-8: {exc}")
                      sys.exit(1)
              if not raw:
                  print("ERROR: source=custom requires leagues_json or leagues_json_b64")
                  sys.exit(1)
              try:
                  return json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"ERROR: custom league JSON is invalid: {exc}")
                  print("Use strict JSON with quoted keys/strings, or pass base64 JSON via leagues_json_b64.")
                  print(f"Received: {raw!r}")
                  sys.exit(1)

          if source == "custom":
              leagues = parse_custom_leagues()

          elif source == "test":
              leagues = [
                  {"espn_league_id": "71580", "database_name": "tfl_of_extraordinary_gentleman", "import_mode": "full"},
              ]

          elif source in ("all", "full", "quick"):
              raw_rows = fly_query("""
                  SELECT league_id, database_name, entitled_mode
                  FROM accounts.league_inventory
                  WHERE platform = 'espn'
                    AND league_id IS NOT NULL
                  ORDER BY database_name
              """)

              all_leagues = [
                  {"espn_league_id": str(r["league_id"]), "database_name": r["database_name"], "import_mode": r["entitled_mode"] or "quick"}
                  for r in raw_rows
              ]

              # Filter by source type
              if source == "full":
                  all_leagues = [v for v in all_leagues if v["import_mode"] == "full"]
                  print(f"Full-only fleet: {len(all_leagues)} paid/grandfathered leagues")
              elif source == "quick":
                  all_leagues = [v for v in all_leagues if v["import_mode"] == "quick"]
                  print(f"Quick-only fleet: {len(all_leagues)} free leagues")
              else:
                  print(f"All leagues: {len(all_leagues)} ({sum(1 for v in all_leagues if v['import_mode'] == 'full')} full, {sum(1 for v in all_leagues if v['import_mode'] != 'full')} quick)")

              leagues = all_leagues
          else:
              print(f"ERROR: Unknown source '{source}'")
              sys.exit(1)

          # Validate
          for lg in leagues:
              assert lg.get("espn_league_id"), f"Missing espn_league_id: {lg}"
              assert lg.get("database_name"), f"Missing database_name: {lg}"
              if "import_mode" not in lg:
                  lg["import_mode"] = "full"

          matrix = {"include": leagues}
          requested_parallel = int(os.environ.get("MAX_PARALLEL") or "10")
          has_full = any(str(lg.get("import_mode", "full")).lower() == "full" for lg in leagues)
          parallel_cap = 2 if has_full else 10
          safe_max_parallel = max(1, min(requested_parallel, parallel_cap))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"league_count={len(leagues)}\n")
              f.write(f"safe_max_parallel={safe_max_parallel}\n")

          print(f"Discovered {len(leagues)} ESPN leagues:")
          print(f"Requested max_parallel={requested_parallel}; safe_max_parallel={safe_max_parallel} (cap={parallel_cap}, has_full={has_full})")
          for lg in leagues:
              print(f"  {lg['database_name']} (ID={lg['espn_league_id']}, mode={lg['import_mode']})")
          PYEOF

  # ================================================================
  # Job 2: Import each league in parallel (matrix)
  # ================================================================
  import-league:
    needs: [discover]
    if: ${{ !inputs.dry_run && fromJson(needs.discover.outputs.league_count) > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      max-parallel: ${{ fromJson(needs.discover.outputs.safe_max_parallel) }}
      fail-fast: false

    env:
      PYTHONUNBUFFERED: 1
      DB_NAME: ${{ matrix.database_name }}
      ESPN_LEAGUE_ID: ${{ matrix.espn_league_id }}
      IMPORT_MODE: ${{ matrix.import_mode }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      FLY_UPLOAD_MAX_RETRIES: 40
      FLY_UPLOAD_RETRY_BASE_DELAY: 3
      FLY_UPLOAD_RETRY_MAX_DELAY: 30
      FLY_UPLOAD_RETRY_JITTER_SECONDS: 2
      FLY_PUBLISH_FORMAT: delta
      FLY_DELTA_FALLBACK_TO_DUCKDB: '0'
      FLY_FINALIZE_INVENTORY: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache from research lake
        shell: bash
        run: |
          test -s research_public_lake/ops_cache.duckdb

      - name: Log cached ops cache
        run: |
          echo "[ops-cache] key-prefix=ops-cache-v5-${{ runner.os }}-manual-"
          echo "[research-lake] restore-hit=${{ steps.research-lake.outputs.cache-hit }}"
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::research_public_lake/ops_cache.duckdb is missing from the canonical research lake cache."
            exit 1
          }
          echo "[ops-cache] size-bytes=$(stat -c%s "${OPS_CACHE_PATH}")"
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate venv
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ==================== RETRIEVE COOKIES ====================
      - name: Retrieve ESPN cookies
        id: cookies
        run: |
          python - <<'PYEOF'
          import json, os, sys, time, urllib.error, urllib.request

          RETRY_STATUS = {500, 502, 503, 504}
          MAX_RETRIES = 6
          RETRY_MAX_DELAY = 15

          def fly_query(sql, database="___ops"):
              url = os.environ["DATABASE_SERVER_URL"].rstrip("/") + "/query"
              token = os.environ["DATABASE_READ_TOKEN"]
              data = json.dumps({"sql": sql, "database": database}).encode()
              req = urllib.request.Request(url, data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
              })
              last_error = None
              for attempt in range(MAX_RETRIES):
                  try:
                      with urllib.request.urlopen(req, timeout=75) as resp:
                          return json.loads(resp.read())
                  except urllib.error.HTTPError as exc:
                      last_error = f"HTTP {exc.code}: {exc.read().decode(errors='replace')[:300]}"
                      should_retry = exc.code in RETRY_STATUS
                  except (TimeoutError, OSError, urllib.error.URLError) as exc:
                      last_error = str(exc)
                      should_retry = True

                  if should_retry and attempt < MAX_RETRIES - 1:
                      delay = min(2 ** attempt, RETRY_MAX_DELAY)
                      print(
                          f"[ESPN-COOKIES] Fly query attempt {attempt + 1}/{MAX_RETRIES} "
                          f"failed transiently: {last_error}. Retrying in {delay}s..."
                      )
                      time.sleep(delay)
                      continue
                  raise RuntimeError(f"Fly query failed after {attempt + 1}/{MAX_RETRIES} attempts: {last_error}")

              raise RuntimeError(f"Fly query exhausted retries: {last_error}")

          db_name = os.environ['DB_NAME']
          enc_key = os.environ.get('CREDENTIAL_ENCRYPTION_KEY', '')

          if not enc_key:
              print("No CREDENTIAL_ENCRYPTION_KEY — league may be public")
              with open(".espn_s2", "w") as f: f.write("")
              with open(".espn_swid", "w") as f: f.write("")
              sys.exit(0)

          safe_db_name = db_name.replace("'", "''")
          rows = fly_query(f"""
              SELECT encrypted_espn_s2, encrypted_swid
              FROM main.espn_leagues
              WHERE database_name = '{safe_db_name}'
          """)

          if not rows or not rows[0].get("encrypted_espn_s2"):
              print(f"No stored cookies for {db_name} — public league")
              with open(".espn_s2", "w") as f: f.write("")
              with open(".espn_swid", "w") as f: f.write("")
              sys.exit(0)

          from cryptography.fernet import Fernet
          f = Fernet(enc_key.encode())
          espn_s2 = f.decrypt(rows[0]["encrypted_espn_s2"].encode()).decode()
          swid = f.decrypt(rows[0]["encrypted_swid"].encode()).decode()

          with open(".espn_s2", "w") as fh: fh.write(espn_s2)
          with open(".espn_swid", "w") as fh: fh.write(swid)
          print(f"Decrypted ESPN cookies for {db_name}")
          PYEOF

      # ==================== CREATE CONTEXT ====================
      - name: Create ESPN context
        run: |
          python - <<'PYEOF'
          import json, os
          from pathlib import Path
          from datetime import datetime

          db_name = os.environ['DB_NAME']
          espn_league_id = int(os.environ['ESPN_LEAGUE_ID'])
          league_name = "${{ matrix.league_name || matrix.database_name }}"
          data_dir = Path(os.environ.get('GITHUB_WORKSPACE', '.')) / "fantasy_football_data" / f"espn_{db_name}"
          data_dir.mkdir(parents=True, exist_ok=True)

          espn_s2 = ""
          swid = ""
          try:
              with open(".espn_s2") as f: espn_s2 = f.read().strip()
              with open(".espn_swid") as f: swid = f.read().strip()
          except FileNotFoundError:
              pass

          # NFL season year = the calendar year a season starts in.
          # Through August: previous season is current; September+: this calendar year.
          today = datetime.now()
          current_nfl_year = today.year if today.month >= 9 else today.year - 1

          # Per-league overrides come in via the matrix; fall back to ESPN-fantasy-era defaults.
          start_year = int("${{ matrix.start_year || 2004 }}")
          end_year = int("${{ matrix.end_year || 0 }}") or current_nfl_year

          context = {
              "league_id": espn_league_id,
              "league_name": league_name,
              "database_name": db_name,
              "espn_s2": espn_s2,
              "swid": swid,
              "sport": "nfl",
              "start_year": start_year,
              "end_year": end_year,
              "data_directory": str(data_dir),
              "max_workers": 3,
              "enable_caching": True,
              "team_to_manager": {},
              "team_to_guid": {},
              "team_to_team_name": {},
              "manager_name_overrides": {},
              "franchise_merges": [],
              "external_column_maps": [],
              "external_identity_maps": {},
              "created_at": datetime.now().isoformat(),
              "platform": "espn",
              "import_mode": os.environ.get("IMPORT_MODE", "full"),
              "require_oauth": False,
              "league_ids": {},
          }

          with open("espn_context.json", "w") as f:
              json.dump(context, f, indent=2)

          # Also write data_dir for later steps
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"data_dir={data_dir}\n")

          print(f"ESPN context: {league_name} (ID={espn_league_id}, db={db_name})")
          PYEOF
        id: context

      # ==================== IMPORT ====================
      - name: Run import
        id: import
        working-directory: fantasy_football_data_scripts
        run: |
          source ../.venv/bin/activate
          echo "========================================"
          echo "Importing: ${{ env.DB_NAME }}"
          echo "League ID: ${{ env.ESPN_LEAGUE_ID }}"
          echo "Import mode: ${{ env.IMPORT_MODE }}"
          echo "========================================"
          set +e
          python espn_initial_import.py \
            --context ../espn_context.json \
            --import-mode ${{ env.IMPORT_MODE }} \
            --skip-track-2-upload \
            2>&1 | tee ../import_${{ env.DB_NAME }}.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          echo "data_dir=${{ steps.context.outputs.data_dir }}" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -ne 0 ]; then
            echo "IMPORT FAILED for ${{ env.DB_NAME }} (exit code ${EXIT_CODE})"
            tail -100 ../import_${{ env.DB_NAME }}.log
            exit $EXIT_CODE
          fi

      # ==================== COUNT MATCHUP ROWS ====================
      - name: Count matchup rows
        if: steps.import.outputs.exit_code == '0'
        id: matchup_rows
        run: |
          source .venv/bin/activate
          python - <<'PYEOF'
          import os
          import sys
          from pathlib import Path

          import duckdb

          db_name = os.environ["DB_NAME"]
          data_dir = Path("${{ steps.import.outputs.data_dir }}")
          db_path = data_dir / f"{db_name}.duckdb"

          if not db_path.exists():
              print(f"ERROR: Local DuckDB not found: {db_path}")
              sys.exit(1)

          conn = duckdb.connect(str(db_path), read_only=True)
          try:
              count = conn.execute("SELECT COUNT(*) FROM public.matchup").fetchone()[0]
          finally:
              conn.close()

          print(f"matchup: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matchup_count={count}\n")
          PYEOF

      # ==================== SIMS ====================
      - name: Calculate expected records
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.expected_record_v2 \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ steps.import.outputs.data_dir }} \
            --n-sims 10000

      - name: Calculate playoff odds
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.playoff_odds_import \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ steps.import.outputs.data_dir }} \
            --n-sims 10000

      # ==================== AGGREGATIONS ====================
      - name: Run aggregations
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python ../scripts/refresh_aggregates.py \
            --db ${{ matrix.database_name }} \
            --data-dir ${{ steps.import.outputs.data_dir }}

      # ==================== UPLOAD ====================
      - name: Upload to database
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python -c "
          from multi_league.core.local_db import LocalLeagueDB
          db = LocalLeagueDB('${{ steps.import.outputs.data_dir }}', '${{ env.DB_NAME }}')
          db.connect()
          db.upload_to_fly('${{ env.DB_NAME }}')
          print('Upload to Fly complete: ${{ env.DB_NAME }}')
          db.close()
          "

      # ==================== REVALIDATE + WARM VERCEL CACHE ====================
      - name: Revalidate and warm Vercel cache
        if: steps.import.outputs.exit_code == '0'
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          python scripts/warm_vercel_cache.py \
            --db "$DB_NAME" \
            --secret "$REVALIDATION_SECRET" \
            --site-url "https://www.leaguehistory.app" \
            --mode "$IMPORT_MODE" \
            --strategy expire \
            --jitter-seconds 0 \
            --warm-attempts 2 \
            --strict \
            --soft-warm-failures \
            --verify-hot

      # ==================== CLEANUP ====================
      - name: Cleanup sensitive files
        if: always()
        run: rm -f .espn_s2 .espn_swid

      # ==================== STATUS ====================
      - name: Print status
        if: always()
        run: |
          echo "========================================"
          echo "RESULT: ${{ env.DB_NAME }}"
          echo "Import: ${{ steps.import.outputs.exit_code == '0' && 'SUCCESS' || 'FAILED' }}"
          echo "========================================"

  # ================================================================
  # Job 3: Summary
  # ================================================================
  summary:
    needs: [discover, import-league]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fleet summary
        run: |
          echo "========================================"
          echo "ESPN FLEET IMPORT COMPLETE"
          echo "========================================"
          echo "Leagues attempted: ${{ needs.discover.outputs.league_count }}"
          echo "Source: ${{ github.event.inputs.source }}"
          echo "Max parallel: ${{ github.event.inputs.max_parallel || 5 }}"
          echo "========================================"
