name: Refresh Live NFL Ops
run-name: >-
  Refresh Live NFL Ops — ${{ github.event_name == 'repository_dispatch' && 'scheduled' || inputs.game_date || 'manual' }}

# Track 1 only: this workflow builds a complete local ___ops_nfl replacement
# from finalized NFLverse data. It never imports, reads, writes, or rebuilds
# any league table. Promotion is opt-in after the local eight-table artifact
# passes its receipt and schema gates.
on:
  # A dedicated timezone-aware scheduler dispatches this worker.  GitHub
  # Actions remains the only process that builds or writes the Ops artifact.
  repository_dispatch:
    types:
      - live-nfl-ops-refresh
  workflow_dispatch:
    inputs:
      year:
        description: NFL season to refresh
        required: true
        default: "2026"
        type: string
      week:
        description: NFL week to refresh
        required: true
        default: "1"
        type: string
      season_type:
        description: REG or POST scope for a manual refresh
        required: true
        default: REG
        type: choice
        options:
          - REG
          - POST
      game_date:
        description: Optional YYYY-MM-DD constraint for a manual refresh
        required: false
        default: ""
        type: string
      apply:
        description: Atomically replace ___ops_nfl after local validation
        required: true
        default: false
        type: boolean
      revisions_only:
        description: Materialize compact league-update revisions from already-published canonical Ops rows only
        required: false
        default: false
        type: boolean
      baseline_release_tag:
        description: Durable release holding the complete pre-refresh ___ops_nfl baseline
        required: true
        default: ops-nfl-live-current
        type: string

permissions:
  # The durable baseline lives in this worker repository, so the scoped
  # workflow token can replace only these release assets.
  contents: write

concurrency:
  group: live-nfl-ops-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.revisions_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 225
    env:
      OPS_REPOSITORY: ${{ github.repository }}
      BASELINE_RELEASE_TAG: ${{ inputs.baseline_release_tag || 'ops-nfl-live-current' }}
      GH_TOKEN: ${{ github.token }}
      BASELINE_PATH: ${{ github.workspace }}/baseline/ops_nfl.duckdb
      OUTPUT_PATH: ${{ github.workspace }}/output/ops_nfl.duckdb

    steps:
      - name: Checkout pipeline source
        uses: actions/checkout@v5
        with:
          path: code

      - name: Authorize dispatched refresh in the Eastern window
        id: boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python code/scripts/live_nfl_ops_dispatch_gate.py \
            --event "$EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        run: python -m pip install --disable-pip-version-check pandas duckdb pyarrow requests

      - name: Resolve final live refresh scope
        id: scope
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        working-directory: code
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_YEAR: ${{ inputs.year || '2026' }}
          MANUAL_WEEK: ${{ inputs.week || '1' }}
          MANUAL_SEASON_TYPE: ${{ inputs.season_type || 'REG' }}
          MANUAL_GAME_DATE: ${{ inputs.game_date || '' }}
          DISPATCH_GAME_DATE: ${{ github.event.client_payload.game_date || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            default_game_date=$(TZ=America/New_York date --date=yesterday +%F)
            game_date="${DISPATCH_GAME_DATE:-$default_game_date}"
            python scripts/discover_live_nfl_ops_refresh.py \
              --season 2026 \
              --game-date "$game_date" \
              --output refresh_scope.json
          else
            jq -n \
              --argjson year "$MANUAL_YEAR" \
              --argjson week "$MANUAL_WEEK" \
              --arg season_type "$MANUAL_SEASON_TYPE" \
              --arg game_date "$MANUAL_GAME_DATE" \
              '{
                status: "ready",
                game_date: (if $game_date == "" then null else $game_date end),
                scope: {
                  year: $year,
                  week: $week,
                  season_type: $season_type,
                  game_date: (if $game_date == "" then null else $game_date end)
                }
              }' > refresh_scope.json
          fi

          status=$(jq -r '.status' refresh_scope.json)
          if [[ "$status" == "ready" ]]; then
            test "$(jq -r '.scope | type' refresh_scope.json)" == "object"
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
            echo "refresh_year=$(jq -r '.scope.year' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_week=$(jq -r '.scope.week' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_season_type=$(jq -r '.scope.season_type' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_game_date=$(jq -r '.scope.game_date // empty' refresh_scope.json)" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "no-op" ]]; then
            test "$(jq -r '.scope' refresh_scope.json)" == "null"
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
            echo "refresh_year=" >> "$GITHUB_OUTPUT"
            echo "refresh_week=" >> "$GITHUB_OUTPUT"
            echo "refresh_season_type=" >> "$GITHUB_OUTPUT"
            echo "refresh_game_date=" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected refresh scope status: $status" >&2
            exit 1
          fi

      - name: Upload refresh scope receipt
        if: ${{ always() && steps.boundary.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-scope-${{ github.run_id }}
          path: code/refresh_scope.json
          if-no-files-found: warn
          retention-days: 30

      - name: Reconstruct and verify the durable baseline
        if: ${{ steps.scope.outputs.should_refresh == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline parts
          gh release download "$BASELINE_RELEASE_TAG" \
            --repo "$OPS_REPOSITORY" \
            --pattern 'ops_nfl.duckdb.part-*' \
            --dir parts
          gh release download "$BASELINE_RELEASE_TAG" \
            --repo "$OPS_REPOSITORY" \
            --pattern 'ops_nfl.duckdb.sha256' \
            --dir baseline
          mapfile -t part_files < <(find parts -maxdepth 1 -type f -name 'ops_nfl.duckdb.part-*' | LC_ALL=C sort)
          test "${#part_files[@]}" -gt 0
          cat "${part_files[@]}" > "$BASELINE_PATH"
          # The release manifest retains the artifact's original
          # output/ops_nfl.duckdb filename. Compare its digest to the file we
          # just reconstructed at BASELINE_PATH instead of resolving that old
          # filename relative to the runner workspace.
          expected_hash=$(awk '{print $1}' baseline/ops_nfl.duckdb.sha256)
          actual_hash=$(sha256sum "$BASELINE_PATH" | awk '{print $1}')
          if [[ -z "$expected_hash" || "$actual_hash" != "$expected_hash" ]]; then
            echo "::error::durable baseline SHA-256 mismatch"
            exit 1
          fi
          rm -rf parts

      - name: Build and verify the local eight-table candidate
        if: ${{ steps.scope.outputs.should_refresh == 'true' }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          refresh_args=(
            --base "$BASELINE_PATH"
            --output "$OUTPUT_PATH"
            --year "${{ steps.scope.outputs.refresh_year }}"
            --week "${{ steps.scope.outputs.refresh_week }}"
            --season-type "${{ steps.scope.outputs.refresh_season_type }}"
          )
          if [[ -n "${{ steps.scope.outputs.refresh_game_date }}" ]]; then
            refresh_args+=(--game-date "${{ steps.scope.outputs.refresh_game_date }}")
          fi
          python scripts/refresh_live_nfl_ops.py "${refresh_args[@]}"

      - name: Publish the verified candidate as the next durable baseline
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || inputs.apply) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          split --bytes=1800M --numeric-suffixes=0 --suffix-length=2 \
            "$OUTPUT_PATH" publish/ops_nfl.duckdb.part-
          sha256sum "$OUTPUT_PATH" > publish/ops_nfl.duckdb.sha256
          if gh release view "$BASELINE_RELEASE_TAG" --repo "$OPS_REPOSITORY" >/dev/null 2>&1; then
            # `gh release view --json id` returns a GraphQL node ID.  The
            # REST asset-list endpoint needs the numeric REST release ID.
            release_id=$(gh api "repos/$OPS_REPOSITORY/releases/tags/$BASELINE_RELEASE_TAG" --jq .id)
            while read -r asset_id; do
              test -z "$asset_id" || gh api --method DELETE \
                "repos/$OPS_REPOSITORY/releases/assets/$asset_id"
            done < <(gh api --paginate "repos/$OPS_REPOSITORY/releases/$release_id/assets" \
              --jq '.[] | select(.name == "ops_nfl.duckdb.sha256" or (.name | startswith("ops_nfl.duckdb.part-"))) | .id')
          else
            gh release create "$BASELINE_RELEASE_TAG" --repo "$OPS_REPOSITORY" \
              --target main --title "Current live NFL ops baseline" \
              --notes "Verified full ___ops_nfl baseline for the live refresh worker."
          fi
          gh release upload "$BASELINE_RELEASE_TAG" publish/ops_nfl.duckdb.part-* \
            publish/ops_nfl.duckdb.sha256 --repo "$OPS_REPOSITORY"

      - name: Atomically promote the verified ops artifact
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || inputs.apply) }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code:${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
          FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.refresh_live_nfl_ops import promote_complete_artifact

          output = Path(os.environ["OUTPUT_PATH"])
          baseline = Path(os.environ["BASELINE_PATH"])
          receipt = json.loads(output.with_suffix(".manifest.json").read_text(encoding="utf-8"))
          promote_complete_artifact(
              output,
              baseline,
              receipt["table_counts"],
              receipt["schema_columns"],
          )
          PY

      - name: Materialize compact league-update NFL revisions
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || inputs.apply) }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
          FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
        run: |
          python scripts/materialize_league_update_nfl_revisions.py \
            --year "${{ steps.scope.outputs.refresh_year }}" \
            --week "${{ steps.scope.outputs.refresh_week }}"

      - name: Verify promoted Fly receipt
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || inputs.apply) }}
        env:
          PYTHONPATH: ${{ github.workspace }}/code:${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          python code/scripts/verify_live_nfl_ops_receipt.py \
            --scope code/refresh_scope.json \
            --candidate "$OUTPUT_PATH" \
            --output output/ops_nfl.fly-receipt.json

      - name: Upload the local validation receipt
        if: ${{ always() && steps.scope.outputs.should_refresh == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-receipt-${{ steps.scope.outputs.refresh_year }}-w${{ steps.scope.outputs.refresh_week }}-${{ github.run_id }}
          path: |
            output/ops_nfl.manifest.json
            output/ops_nfl.fly-receipt.json
          if-no-files-found: warn
          retention-days: 30

  materialize-revisions-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.revisions_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/fantasy_football_data_scripts
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
    steps:
      - name: Checkout public canonical source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compact revision dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Enforce explicit canonical REG apply scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.apply }}" != "true" ]]; then
            echo "revisions_only requires apply=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.season_type }}" != "REG" ]]; then
            echo "compact league-update revisions currently support REG only" >&2
            exit 1
          fi

      - name: Materialize already-published week revisions
        run: |
          python scripts/materialize_league_update_nfl_revisions.py \
            --year "${{ inputs.year }}" \
            --week "${{ inputs.week }}"
