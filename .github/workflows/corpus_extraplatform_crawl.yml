name: Corpus Extra-Platform Crawl

# Crawls MFL or Fleaflicker leagues into the research corpus and ships one folded snapshot
# artifact per batch, mirroring corpus_crawl_worker.yml. Same offline guarantees: CORPUS_MODE=1
# and NO Fly credentials, so the ingest reads the super-table/draft baseline from the local
# ops cache and can never touch Fly (proven by the extra-platform smoke).
#
# Unlike the Sleeper crawl (CPU-bound), these are API-THROTTLE-bound (MFL hard 429 at ~15/min
# per IP; Fleaflicker soft 403). Throughput therefore comes from MORE matrix jobs (each its own
# runner IP), not more workers -- keep workers low and batch_size small.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which corpus to crawl'
        required: true
        type: choice
        options: ['mfl', 'fleaflicker']
      mode:
        description: 'full = importer + playoff runner + clutch (required for playoff-quality lake rows); direct = fetch-only + enrich-lite'
        required: false
        type: choice
        options: ['direct', 'full']
        default: 'full'
      batches:
        description: 'How many disjoint slices (each its own runner/IP). All run; max_parallel caps concurrency.'
        required: false
        type: string
        default: '10'
      batch_start:
        description: 'First deterministic batch index (for continuation waves)'
        required: false
        type: string
        default: '0'
      max_parallel:
        description: 'Concurrent slices. Account cap is 20 across ALL repos -- leave slack for customer imports.'
        required: false
        type: string
        default: '10'
      batch_size:
        description: 'Leagues per job. MFL ~15 min/league (use 20-30); Fleaflicker 10-40 min/league (use 15-20).'
        required: false
        type: string
        default: '20'
      workers:
        description: 'Parallel ingests per runner. Rate limit divides across them, so keep at 1 (MFL) or 2 (Fleaflicker).'
        required: false
        type: string
        default: '1'
      prune:
        description: 'Delete each raw league dir after folding (ONE-WAY: cannot re-fold/re-sim without re-crawling). Off for pilots.'
        required: false
        type: boolean
        default: false
permissions:
  actions: write
  contents: read

concurrency:
  group: corpus-extraplatform-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      batch_list: ${{ steps.mk.outputs.batch_list }}
      max_parallel: ${{ steps.mk.outputs.max_parallel }}
    steps:
      - name: Build batch index list
        id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          start = int("${{ github.event.inputs.batch_start || '0' }}")
          n  = int("${{ github.event.inputs.batches || '10' }}")
          mp = min(int("${{ github.event.inputs.max_parallel || '10' }}"), n)
          print("batch_list=" + json.dumps(list(range(start, start + n))))
          print("max_parallel=" + str(mp))
          print(f"[prepare] {n} batches, max {mp} concurrent", file=sys.stderr)
          PY

  crawl:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batch_list) }}

    env:
      CORPUS_DIR: ${{ github.workspace }}/corpus
      YAHOO_OAUTH_ROOT: ${{ github.workspace }}/code
      CORPUS_MODE: 1
      CORPUS_DEPENDENCY_DIR: ${{ github.workspace }}/corpus_dependencies
      OPS_CACHE_PATH: ${{ github.workspace }}/corpus_dependencies/ops_cache.duckdb
      DRAFT_GLOBAL_SOURCE_PATH: ${{ github.workspace }}/corpus_dependencies/draft_global_source.parquet
      CORPUS_DEPENDENCY_KEY: corpus-dependencies-v1-Linux-20260717

    steps:
      - name: Checkout crawl seed (this repo)
        uses: actions/checkout@v5
        with:
          path: crawl

      - name: Checkout pipeline code (private)
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r code/requirements.txt

      - name: Restore corpus dependencies
        id: corpus-dependencies
        uses: actions/cache/restore@v5
        with:
          path: corpus_dependencies
          key: ${{ env.CORPUS_DEPENDENCY_KEY }}

      - name: Fail fast if corpus dependencies are missing
        if: steps.corpus-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "::error::corpus dependency miss (key=${CORPUS_DEPENDENCY_KEY}). Run 'Seed Corpus Dependencies' first."
          exit 1

      - name: Assert this job has NO Fly credentials (offline proof)
        run: |
          if [ -n "${DATABASE_SERVER_URL:-}" ] || [ -n "${DATABASE_READ_TOKEN:-}" ] || [ -n "${DATABASE_WRITE_TOKEN:-}" ]; then
            echo "::error::Fly credentials present -- this crawl MUST run with no Fly access."; exit 1
          fi
          echo "[offline] no Fly credentials; any Fly access will fail hard."

      - name: Stage crawl seed
        run: |
          mkdir -p "$CORPUS_DIR/discovery" "$CORPUS_DIR/leagues"
          cp "crawl/corpus_seed/${{ github.event.inputs.platform }}_crawl_seed.json" "$CORPUS_DIR/discovery/"
          python3 -c "import json;d=json.load(open('$CORPUS_DIR/discovery/${{ github.event.inputs.platform }}_crawl_seed.json'));print('[seed]', len(d.get('leagues',[])), 'leagues')"

      - name: Crawl slice ${{ matrix.batch }}
        env:
          OFFSET: ${{ matrix.batch }}
          SIZE: ${{ github.event.inputs.batch_size || '20' }}
        run: |
          set -o pipefail
          LOG="crawl_${{ matrix.batch }}.log"
          if [ "${{ github.event.inputs.mode || 'direct' }}" = "direct" ]; then
            # DIRECT mode (2026-07-18): fetch-only + enrich-lite via direct_corpus_pilot.py.
            # No transforms, no sims -- the stages every failed crawl died in. A/B-validated
            # against the full pipeline (see the script docstring). A skip list of already-
            # landed db_names rides in the seed dir when present.
            # Combined skip input: landed leagues + permanently dead IDs +
            # QC-gate rejects (revisit gate_rejected.txt after enrich improvements).
            SKIPFILE="$RUNNER_TEMP/skip_dbs.txt"
            cat crawl/corpus_seed/landed_dbs.txt crawl/corpus_seed/dead_leagues.txt crawl/corpus_seed/gate_rejected.txt 2>/dev/null | sort -u > "$SKIPFILE" || true
            SKIP=""
            if [ -s "$SKIPFILE" ]; then SKIP="--skip-list $SKIPFILE"; fi
            python code/scripts/extraplatform_corpus/direct_corpus_pilot.py \
              --platform "${{ github.event.inputs.platform }}" \
              --from-seed \
              --offset   "$(( OFFSET * SIZE ))" \
              --limit    "$SIZE" \
              --fold-into "$CORPUS_DIR/corpus_slice_${{ github.event.inputs.platform }}_${{ matrix.batch }}.duckdb" \
              $SKIP \
              > "$LOG" 2>&1 || CRAWL_RC=$?
            OK=$(grep -c '] PASS' "$LOG" || true)
            FAILED=$(grep -cE '] (FAIL|GATE_FAIL|FOLD_FAIL)' "$LOG" || true)
            SKIPPED=$(grep -cE '] SKIP' "$LOG" || true)
            echo "[crawl-direct] rc=${CRAWL_RC:-0}  ok=$OK  failed=$FAILED  skipped=$SKIPPED"
            if [ "$FAILED" -gt 0 ]; then
              echo "::group::failures"; grep -E '] (FAIL|GATE_FAIL|FOLD_FAIL)' "$LOG" | head -20; echo "::endgroup::"
            fi
            # skipped leagues (no exposure / already landed) are not failures; only hard-fail
            # on a total wipeout (nothing worked AND nothing was legitimately skipped) --
            # an exhausted seed window with a tail of dead IDs is a finished slice, not a
            # broken one.
            if [ "$OK" -eq 0 ] && [ "$FAILED" -gt 0 ] && [ "$SKIPPED" -eq 0 ]; then
              echo "::error::0 ok vs $FAILED failed with nothing skipped -- nothing worked."; exit 1
            fi
            exit 0
          fi
          PRUNE=""
          if [ "${{ github.event.inputs.prune }}" = "true" ]; then PRUNE="--prune"; fi
          python code/scripts/extraplatform_corpus/batch_ingest_extraplatform.py \
            --platform "${{ github.event.inputs.platform }}" \
            --workers  "${{ github.event.inputs.workers || '1' }}" \
            --offset   "$(( OFFSET * SIZE ))" \
            --limit    "$SIZE" \
            --fold-into "$CORPUS_DIR/corpus_slice_${{ github.event.inputs.platform }}_${{ matrix.batch }}.duckdb" \
            $PRUNE \
            > "$LOG" 2>&1 || CRAWL_RC=$?
          OK=$(grep -c ' -> OK' "$LOG" || true)
          FAILED=$(grep -cE ' -> (IMPORT_FAILED|SIM_FAILED)' "$LOG" || true)
          echo "[crawl] rc=${CRAWL_RC:-0}  ok=$OK  failed=$FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::group::failure reasons (first 20)"; grep -E ' -> (IMPORT_FAILED|SIM_FAILED)' "$LOG" | head -20; echo "::endgroup::"
            echo "::group::driver tail (last 60)"; tail -60 "$LOG"; echo "::endgroup::"
          fi
          # An exhausted seed window is a finished slice, not a broken one: when the matrix
          # is sized above the remaining seed the tail jobs plan 0 leagues and must exit
          # green (run 30307350629 burned two red shards on this).  Defaults to 1 so a
          # parse miss keeps the old fail-closed behaviour.
          PLANNED=$(sed -n 's/^\[plan\] [a-z]*: [0-9]* in seed, \([0-9]*\) in this slice.*/\1/p' "$LOG" | head -1)
          if [ "${PLANNED:-1}" -eq 0 ]; then
            echo "[crawl] empty slice (seed window exhausted) -- nothing to do."; exit 0
          fi
          if [ "$OK" -eq 0 ]; then
            echo "::error::0 of $((OK+FAILED)) leagues ingested -- nothing worked."; exit 1
          fi
          if [ "$FAILED" -gt "$OK" ]; then
            echo "::error::$FAILED failed vs $OK ok -- majority failure."; exit 1
          fi
          exit "${CRAWL_RC:-0}"

      - name: Slice summary
        if: always()
        run: |
          SLICE="$CORPUS_DIR/corpus_slice_${{ github.event.inputs.platform }}_${{ matrix.batch }}.duckdb"
          if [ -s "$SLICE" ]; then
            python3 - <<PY
          import duckdb
          c = duckdb.connect("$SLICE", read_only=True)
          import os; print(f"[slice ${{ matrix.batch }}] {c.execute('SELECT COUNT(*) FROM _sources').fetchone()[0]} leagues, {os.path.getsize('$SLICE')/1048576:.1f} MB")
          for t in ("league_settings","draft","transactions","player_fantasy"):
              print(f"   {t}: {c.execute(f'SELECT COUNT(*) FROM public.{t}').fetchone()[0]:,} rows")
          PY
          fi

      - name: Upload slice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-slice-${{ github.event.inputs.platform }}-${{ matrix.batch }}
          # The driver log rides along: per-league failure reasons die with the runner
          # otherwise (run 29626415574 required job-log archaeology to diagnose).
          # The .wal rides along too: the fold connection is long-lived and its close()
          # never runs when the runner is SIGKILLed at timeout-minutes, so un-checkpointed
          # leagues live only in the WAL.  Run 30307350629 lost 96 of 579 crawled leagues
          # because the .wal stayed on the dead runner.  The driver now CHECKPOINTs after
          # every fold; this is the second line of defence.
          path: |
            ${{ github.workspace }}/corpus/corpus_slice_${{ github.event.inputs.platform }}_${{ matrix.batch }}.duckdb
            ${{ github.workspace }}/corpus/corpus_slice_${{ github.event.inputs.platform }}_${{ matrix.batch }}.duckdb.wal
            crawl_${{ matrix.batch }}.log
          if-no-files-found: ignore
