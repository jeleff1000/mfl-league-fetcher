name: Remove forbidden legacy research cache

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: jeleff1000/mfl-league-fetcher
      CACHE_KEY: research-public-lake-v4-Linux-20260806-signal-rescue-canonical

    steps:
      - name: Delete forbidden legacy cache if present
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh api --paginate \
            "/repos/${REPOSITORY}/actions/caches?key=${CACHE_KEY}" \
            --jq '.total_count')
          echo "legacy-cache-count=$count"
          if [ "$count" -gt 0 ]; then
            gh api --method DELETE \
              "/repos/${REPOSITORY}/actions/caches?key=${CACHE_KEY}&ref=refs/heads/main"
            echo "Deleted forbidden legacy cache; no replacement will be written."
          else
            echo "Forbidden legacy cache is absent."
          fi
