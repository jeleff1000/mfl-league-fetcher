name: MFL Historical Discovery (256 contiguous ID shards)

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Deterministic discovery shards (256 per workflow)"
        required: false
        default: "256"
        type: string
      max_parallel:
        description: "Concurrent runners; Enterprise ceiling is 500"
        required: false
        default: "500"
        type: string
      start_year:
        description: "Oldest season to probe"
        required: false
        default: "1997"
        type: string
      end_year:
        description: "Newest season to probe"
        required: false
        default: "1998"
        type: string
      chain_next_window:
        description: "Dispatch the next season window after merge"
        required: false
        default: "true"
        type: string
      shard_indices:
        description: "Optional comma-separated shard indices to run; empty means all shards"
        required: false
        default: ""
        type: string
      directory_only:
        description: "Run only the named-directory search; do not run numeric shards"
        required: false
        default: "false"
        type: string
      id_bands:
        description: "Inclusive numeric MFL ID bands"
        required: false
        default: "1-9999,10000-29999,30000-59999,60000-80000"
        type: string
      request_sleep:
        description: "Seconds between MFL requests per runner"
        required: false
        default: "5.0"
        type: string
      id_start:
        description: "First inclusive MFL ID"
        required: false
        default: "0"
        type: string
      id_end:
        description: "Last inclusive MFL ID"
        required: false
        default: "999"
        type: string
      artifact_namespace:
        description: "Optional namespace for nested windows sharing one workflow run"
        required: false
        default: ""
        type: string
      merge_only:
        description: "Merge artifacts from source_run_id without running discovery shards"
        required: false
        default: "false"
        type: string
      source_run_id:
        description: "Completed run whose shard artifacts should be merged"
        required: false
        default: ""
        type: string
      additional_source_run_ids:
        description: "Optional comma-separated recovery run IDs to add during merge"
        required: false
        default: ""
        type: string
      additional_artifact_namespaces:
        description: "Optional comma-separated namespaces paired with recovery run IDs"
        required: false
        default: ""
        type: string
      task_manifest:
        description: "Path in yahoo_oauth checkout to an uncovered task-plan JSON"
        required: false
        default: ""
        type: string
      task_window:
        description: "Zero-based task-plan window"
        required: false
        default: "0"
        type: string
  workflow_call:
    inputs:
      shard_count:
        required: false
        default: "256"
        type: string
      max_parallel:
        required: false
        default: "500"
        type: string
      start_year:
        required: false
        default: "1997"
        type: string
      end_year:
        required: false
        default: "1998"
        type: string
      chain_next_window:
        required: false
        default: "false"
        type: string
      shard_indices:
        required: false
        default: ""
        type: string
      directory_only:
        required: false
        default: "false"
        type: string
      id_bands:
        required: false
        default: "1-9999,10000-29999,30000-59999,60000-80000"
        type: string
      request_sleep:
        required: false
        default: "5.0"
        type: string
      id_start:
        required: false
        default: "0"
        type: string
      id_end:
        required: false
        default: "999"
        type: string
      artifact_namespace:
        required: false
        default: ""
        type: string
      merge_only:
        required: false
        default: "false"
        type: string
      source_run_id:
        required: false
        default: ""
        type: string
      additional_source_run_ids:
        required: false
        default: ""
        type: string
      additional_artifact_namespaces:
        required: false
        default: ""
        type: string
      task_manifest:
        required: false
        default: ""
        type: string
      task_window:
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  # Independent year/ID windows may run concurrently. Identical windows still
  # share a lock so recovery dispatches cannot duplicate an active sweep.
  group: mfl-historical-discovery-${{ inputs.start_year || '1997' }}-${{ inputs.end_year || '1998' }}-${{ inputs.id_start || '0' }}-${{ inputs.id_end || '999' }}
  queue: max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          n = min(max(int("${{ inputs.shard_count || '256' }}"), 1), 256)
          mp = min(max(int("${{ inputs.max_parallel || '500' }}"), 1), 500, n)
          directory_only = "${{ inputs.directory_only || 'false' }}".strip().lower() == "true"
          raw = "${{ inputs.shard_indices || '' }}".strip()
          if directory_only:
              shards = []
          elif raw:
              shards = sorted({int(part.strip()) for part in raw.split(",") if part.strip()})
              if any(shard < 0 or shard >= n for shard in shards):
                  raise SystemExit(f"shard_indices must be within 0..{n - 1}")
          else:
              shards = list(range(n))
          print("shards=" + json.dumps(shards, separators=(",", ":")))
          print("max_parallel=" + str(min(mp, len(shards)) if shards else 1))
          PY

  discover:
    if: ${{ (inputs.directory_only || 'false') != 'true' && (inputs.merge_only || 'false') != 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/
            /corpus_seed/mfl_uncovered_task_plan.json
            /fantasy_football_data_scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run historical MFL shard
        run: |
          mkdir -p out
          task_args=()
          # A zero-width ID sentinel is used by the quota campaign. Keep the
          # normal numeric workflow unchanged, but make the quota manifest a
          # local default so a dispatch that drops optional inputs cannot
          # silently run empty shards.
          if [ "${{ inputs.id_start }}" = "0" ] && [ "${{ inputs.id_end }}" = "0" ]; then
            task_manifest="${{ inputs.task_manifest || 'corpus_seed/mfl_uncovered_task_plan.json' }}"
            task_window="${{ inputs.task_window || '0' }}"
            if [ -f "code/${task_manifest}" ]; then
              task_args=(--task-manifest "code/${task_manifest}" --task-window "${task_window}")
              echo "task_mode manifest=${task_manifest} window=${task_window}"
            else
              echo "task manifest not found: code/${task_manifest}" >&2
              exit 2
            fi
          elif [ -n "${{ inputs.task_manifest || '' }}" ]; then
            task_args=(--task-manifest "code/${{ inputs.task_manifest }}" --task-window "${{ inputs.task_window || '0' }}")
            echo "task_mode manifest=${{ inputs.task_manifest }} window=${{ inputs.task_window || '0' }}"
          fi
          python code/scripts/extraplatform_corpus/discover_mfl_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ inputs.shard_count || '256' }}" \
            --start-year "${{ inputs.start_year || '1997' }}" \
            --end-year "${{ inputs.end_year || '1998' }}" \
            --id-start "${{ inputs.id_start || '0' }}" \
            --id-end "${{ inputs.id_end || '999' }}" \
            --id-bands "${{ inputs.id_bands || '1-9999,10000-29999,30000-59999,60000-80000' }}" \
            --sleep "${{ inputs.request_sleep || '5.0' }}" \
            "${task_args[@]}" \
            --out "out/mfl_shard_${{ matrix.shard }}.json"

      - name: Upload shard artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mfl-discovery-shard-${{ matrix.shard }}-${{ github.run_id }}${{ inputs.artifact_namespace && format('-{0}', inputs.artifact_namespace) || '' }}
          path: out/mfl_shard_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  # The numeric matrix finds IDs that have no searchable name.  Run the public
  # directory search as a separate, single runner so named dynasty/keeper/IDP
  # leagues are included without turning every matrix shard into a duplicate
  # keyword crawl.  It starts only after the matrix, keeping total concurrency
  # at the requested maximum of 500 runners.
  directory:
    # Named-directory discovery is supplemental.  Keep it out of the numeric
    # sweep's critical path; invoke this workflow with directory_only=true when
    # we explicitly want a directory crawl.
    if: ${{ always() && (inputs.directory_only || 'false') == 'true' && (inputs.merge_only || 'false') != 'true' }}
    needs: [prepare, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Search named public MFL directories
        shell: bash
        run: |
          mkdir -p out /tmp
          YEARS=$(seq -s, "${{ inputs.start_year || '1997' }}" "${{ inputs.end_year || '1998' }}")
          # Keep the named-directory pass within the same ~10-minute runner
          # budget as the numeric shards: 120 requests at the configured 5s
          # throttle, with validation consuming the final 40%.
          export MFL_YEARS="$YEARS"
          export MFL_REQ_CAP=120
          export MFL_TARGET=200
          export MFL_ALLOW_EXPIRED_CERT=1
          export MFL_HTTP_TIMEOUT=8
          export MFL_SLEEP="${{ inputs.request_sleep || '5.0' }}"
          export MFL_SEED_OUT="$PWD/out/mfl_directory_seed.json"
          export MFL_DISCOVERY_PROGRESS="$PWD/out/mfl_directory_progress.txt"
          set +e
          timeout --foreground 900s \
            python -u code/scripts/extraplatform_corpus/discover_mfl_leagues.py
          status=$?
          if [ "$status" -eq 124 ]; then
            echo "named-directory crawl hit the 15-minute watchdog; preserving numeric results"
            printf '%s\n' '{"schema_version":"mfl_directory_seed_v1","rows":[],"timed_out":true}' \
              > out/mfl_directory_seed.json
            exit 0
          fi
          exit "$status"

      - name: Upload directory artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfl-directory-discovery-${{ github.run_id }}${{ inputs.artifact_namespace && format('-{0}', inputs.artifact_namespace) || '' }}
          path: out/mfl_directory_seed.json
          if-no-files-found: error
          retention-days: 30

  merge:
    if: ${{ always() && needs.discover.result != 'cancelled' && needs.directory.result != 'cancelled' }}
    needs: [prepare, discover, directory]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/

      - name: Checkout worker seed repository
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Download shard artifacts by exact artifact ID
        if: ${{ (inputs.directory_only || 'false') != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          ARTIFACT_NAMESPACE: ${{ inputs.artifact_namespace || '' }}
          ADDITIONAL_SOURCE_RUN_IDS: ${{ inputs.additional_source_run_ids || '' }}
          ADDITIONAL_ARTIFACT_NAMESPACES: ${{ inputs.additional_artifact_namespaces || '' }}
        run: |
          mkdir -p shards
          python3 - <<'PY'
          import io
          import json
          import os
          import re
          import urllib.request
          import urllib.error
          import zipfile

          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          api_opener = urllib.request.build_opener(NoRedirect)

          def download_archive(artifact_id):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/${{github.repository}}/actions/artifacts/{artifact_id}/zip",
                  headers=headers,
              )
              try:
                  return api_opener.open(req).read()
              except urllib.error.HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  signed_url = exc.headers["Location"]
                  # The signed artifact URL is already authorized.  Do not
                  # forward the GitHub API bearer token to blob storage.
                  with urllib.request.urlopen(urllib.request.Request(signed_url)) as response:
                      return response.read()

          primary_run = os.environ["SOURCE_RUN_ID"]
          primary_namespace = os.environ.get("ARTIFACT_NAMESPACE", "")
          extra_runs = [x.strip() for x in os.environ.get("ADDITIONAL_SOURCE_RUN_IDS", "").split(",") if x.strip()]
          extra_namespaces = [x.strip() for x in os.environ.get("ADDITIONAL_ARTIFACT_NAMESPACES", "").split(",")]
          if len(extra_namespaces) < len(extra_runs):
              raise SystemExit("additional_artifact_namespaces must pair with additional_source_run_ids")
          sources = [(primary_run, primary_namespace)] + list(zip(extra_runs, extra_namespaces))
          selected = []
          selected_by_index = {}
          for source_position, (source_run, namespace) in enumerate(sources):
              suffix = f"-{namespace}" if namespace else ""
              expected_names = re.compile(rf"mfl-discovery-shard-\d+-{re.escape(source_run)}{re.escape(suffix)}$")
              artifacts = []
              for page in range(1, 100):
                  url = f"https://api.github.com/repos/${{github.repository}}/actions/runs/{source_run}/artifacts?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      payload = json.load(response)
                  artifacts.extend(payload.get("artifacts", []))
                  if len(artifacts) >= payload.get("total_count", len(artifacts)) or not payload.get("artifacts"):
                      break
              for artifact in sorted((a for a in artifacts if expected_names.fullmatch(a["name"])), key=lambda a: int(a["name"].split("-")[3])):
                  index = int(artifact["name"].split("-")[3])
                  # A supplemental source is normally a repair run.  Let it
                  # replace the primary artifact for the same shard instead
                  # of silently keeping a known incomplete primary copy.
                  if index in selected_by_index and source_position == 0:
                      continue
                  selected_by_index[index] = artifact
              selected = [selected_by_index[index] for index in sorted(selected_by_index)]
              print(f"source_run={source_run} matching_shard_artifacts={len(artifacts)} selected_total={len(selected)}")
          if not selected:
              raise SystemExit("no matching shard artifacts found")

          for artifact in selected:
              archive = download_archive(artifact["id"])
              with zipfile.ZipFile(io.BytesIO(archive)) as zf:
                  for member in zf.infolist():
                      if re.fullmatch(r"mfl_shard_\d+\.json", os.path.basename(member.filename)):
                          with zf.open(member) as source, open(os.path.join("shards", os.path.basename(member.filename)), "wb") as target:
                              target.write(source.read())
          print("exact artifact downloads complete")

      - name: Download named directory artifact
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: mfl-directory-discovery-${{ inputs.source_run_id || github.run_id }}${{ inputs.artifact_namespace && format('-{0}', inputs.artifact_namespace) || '' }}
          path: directory
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure directory input exists
        if: ${{ always() }}
        run: |
          mkdir -p directory
          if [ ! -f directory/mfl_directory_seed.json ]; then
            printf '%s\n' '{"schema_version":"mfl_directory_seed_v1","rows":[],"directory_unavailable":true}' > directory/mfl_directory_seed.json
          fi

      - name: Merge season records and lineages
        run: |
          mkdir -p out
          SEED=""
          if [ -f worker/corpus_seed/mfl_crawl_seed.json ]; then
            SEED="--existing-seed worker/corpus_seed/mfl_crawl_seed.json"
          fi
          # Feed named-directory results through the same season/id dedupe and
          # lineage merge as numeric shards.
          mkdir -p shards
          MFL_EXPECTED_SHARDS="${{ inputs.shard_count || '256' }}" \
          MFL_SHARD_INDICES="${{ inputs.shard_indices || '' }}" \
          MFL_DIRECTORY_ONLY="${{ inputs.directory_only || 'false' }}" \
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          if os.environ.get("MFL_DIRECTORY_ONLY", "false").lower() != "true":
              raw = os.environ.get("MFL_SHARD_INDICES", "").strip()
              expected = len([part for part in raw.split(",") if part.strip()]) if raw else int(os.environ["MFL_EXPECTED_SHARDS"])
              received = len([
                  path for path in Path("shards").glob("mfl_shard_*.json")
                  if re.fullmatch(r"mfl_shard_\d+\.json", path.name)
              ])
              print(f"shard_coverage expected={expected} received={received}")
              if received != expected:
                  raise SystemExit(f"refusing silent partial merge: expected {expected} numeric shards, received {received}")
          PY
          cp directory/mfl_directory_seed.json shards/mfl_shard_directory.json
          python code/scripts/extraplatform_corpus/merge_mfl_shards.py \
            --input-glob "shards/mfl_shard_[0-9]*.json" \
            $SEED \
            --out out/mfl_discovery_merged.json
          python3 - <<'PY'
          import json
          d=json.load(open("out/mfl_discovery_merged.json"))
          print(f"season_leagues={d['unique_season_leagues']}")
          print(f"draft_records={d['records_with_draft']}")
          print(f"lineages={d['lineage_count']}")
          PY

      - name: Write completed-window manifest
        env:
          MFL_START_YEAR: ${{ inputs.start_year || '1997' }}
          MFL_END_YEAR: ${{ inputs.end_year || '1998' }}
          MFL_SHARD_COUNT: ${{ inputs.shard_count || '256' }}
          MFL_MAX_PARALLEL: ${{ inputs.max_parallel || '500' }}
          MFL_ID_BANDS: ${{ inputs.id_bands || '1-9999,10000-29999,30000-59999,60000-80000' }}
          MFL_REQUEST_SLEEP: ${{ inputs.request_sleep || '5.0' }}
          MFL_ID_START: ${{ inputs.id_start || '0' }}
          MFL_ID_END: ${{ inputs.id_end || '999' }}
          MFL_SHARD_INDICES: ${{ inputs.shard_indices || '' }}
          MFL_DIRECTORY_ONLY: ${{ inputs.directory_only || 'false' }}
          MFL_PRIMARY_SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
          MFL_ADDITIONAL_SOURCE_RUN_IDS: ${{ inputs.additional_source_run_ids || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          manifest = {
              "platform": "mfl",
              "source_run_id": os.environ["MFL_PRIMARY_SOURCE_RUN_ID"],
              "reconciled_by_run_id": os.environ["GITHUB_RUN_ID"],
              "additional_source_run_ids": os.environ["MFL_ADDITIONAL_SOURCE_RUN_IDS"],
              "start_year": os.environ["MFL_START_YEAR"],
              "end_year": os.environ["MFL_END_YEAR"],
              "shard_count": os.environ["MFL_SHARD_COUNT"],
              "max_parallel": os.environ["MFL_MAX_PARALLEL"],
              "id_bands": os.environ["MFL_ID_BANDS"],
              "request_sleep": os.environ["MFL_REQUEST_SLEEP"],
              "id_start": os.environ["MFL_ID_START"],
              "id_end": os.environ["MFL_ID_END"],
              "shard_indices": os.environ["MFL_SHARD_INDICES"],
              "directory_only": os.environ["MFL_DIRECTORY_ONLY"],
          }
          with open("out/mfl_window_manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
          PY

      - name: Upload completed-window manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-window-manifest-${{ github.run_id }}${{ inputs.artifact_namespace && format('-{0}', inputs.artifact_namespace) || '' }}
          path: out/mfl_window_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload merged inventory
        uses: actions/upload-artifact@v4
        with:
          name: mfl-discovery-merged-${{ github.run_id }}${{ inputs.artifact_namespace && format('-{0}', inputs.artifact_namespace) || '' }}
          path: out/mfl_discovery_merged.json
          if-no-files-found: error
          retention-days: 30
