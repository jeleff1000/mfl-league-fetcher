name: Multi-Platform Full Import Worker

# Imports ordered platform segments (Yahoo, Sleeper, ESPN in any order), then
# uploads the final target segment and Fly-copies the earlier source segment
# years into the target db via merge_sources.

on:
  workflow_dispatch:
    inputs:
      import_data_b64:
        description: 'Base64 JSON with ordered segments[] and target_segment_index'
        required: true
        type: string
      user_id:
        description: 'Unique identifier for this import job'
        required: true
        type: string
      import_lock_key:
        description: 'Stable import concurrency key, usually the resolved db_name'
        required: false
        type: string
      verify_only:
        description: 'Run all segment imports, merge, enrichments, simulations, and aggregates without publishing'
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [multi_platform_full_import]


permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key || github.event.inputs.user_id || github.event.client_payload.user_id || github.run_id }}
  cancel-in-progress: false

jobs:
  import-multi-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      FLY_UPLOAD_MAX_RETRIES: 40
      FLY_UPLOAD_RETRY_BASE_DELAY: 3
      FLY_UPLOAD_RETRY_MAX_DELAY: 30
      FLY_UPLOAD_RETRY_JITTER_SECONDS: 2
      FLY_PUBLISH_FORMAT: delta
      FLY_DELTA_FALLBACK_TO_DUCKDB: '0'
      FLY_FINALIZE_INVENTORY: '1'
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
      VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only || false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache from research lake
        shell: bash
        run: test -s research_public_lake/ops_cache.duckdb

      - name: Log cached ops cache
        run: |
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::research_public_lake/ops_cache.duckdb is missing from the canonical research lake cache."
            exit 1
          }
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate venv
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      - name: Parse import plan
        env:
          IMPORT_DATA_B64: ${{ github.event.inputs.import_data_b64 || github.event.client_payload.import_data_b64 || github.event.client_payload.league_data_b64 }}
        run: |
          python .github/scripts/run_multi_platform_import.py --plan-only

      - name: Run multi-platform import
        env:
          IMPORT_DATA_B64: ${{ github.event.inputs.import_data_b64 || github.event.client_payload.import_data_b64 || github.event.client_payload.league_data_b64 }}
        run: |
          args=()
          if [ "${VERIFY_ONLY}" = "true" ]; then
            args+=(--verify-only)
          fi
          python .github/scripts/run_multi_platform_import.py "${args[@]}"

      # G10 remediation (2026-07-06): artifact upload removed. Logs and
      # data files on a PUBLIC repo are downloadable by any GitHub user
      # and contained league/manager-identifying data. Diagnostics belong
      # in PRIVATE storage (see weekly-update-system-plan.md, G10).

      - name: Summary
        if: always()
        run: |
          echo "# Multi-Platform Full Import" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f multi_platform_summary.json ]; then
            python - <<'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open("multi_platform_summary.json", encoding="utf-8") as handle:
              summary = json.load(handle)
          print(f"- Target DB: `{summary.get('target_db')}`")
          print(f"- Target platform: `{summary.get('target_platform')}`")
          print("")
          print("| # | Role | Platform | DB | Years |")
          print("|---|---|---|---|---|")
          for segment in summary.get("segments", []):
              years = segment.get("years") or []
              year_label = f"{min(years)}-{max(years)}" if years else ""
              print(
                  f"| {segment.get('index')} | {segment.get('role')} | "
                  f"{segment.get('platform')} | `{segment.get('database_name')}` | {year_label} |"
              )
          PYEOF
          else
            echo "No summary file was produced." >> $GITHUB_STEP_SUMMARY
          fi
