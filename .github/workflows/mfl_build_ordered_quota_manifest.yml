name: MFL Build ordered quota manifest

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  MFL_INDEX_KEY: mfl-registered-2004-2018-v2-index-recover-mass-remaining-v31-r9-20260816-1
  REGISTRY_PATH: code/derived/mfl_register/mfl_discovered_ids_2000_2018.csv.gz

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout registry source
        uses: actions/checkout@v5
        with:
          path: code
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /derived/mfl_register/mfl_discovered_ids_2000_2018.csv.gz

      - name: Restore authoritative 39k MFL index
        uses: actions/cache/restore@v5
        with:
          path: index_state
          key: ${{ env.MFL_INDEX_KEY }}
          fail-on-cache-miss: true

      - name: Validate index and build ordered manifest
        env:
          REGISTRY_PATH: ${{ env.REGISTRY_PATH }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, gzip, json, os, re
          from collections import defaultdict
          from pathlib import Path

          expected = {2004:4780,2005:935,2006:7719,2007:2136,2008:2195,2009:2133,2010:2155,2011:2170,2012:1801,2013:1288,2014:865,2015:836,2016:9114,2017:468,2018:773}
          index_path = Path("index_state/mfl_register_all_runs.json")
          if not index_path.exists():
              raise SystemExit(f"authoritative MFL index missing: {index_path}")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          accepted = {int(y): int(n) for y, n in index.get("accepted_by_year", {}).items()}
          if accepted != expected or int(index.get("league_count", -1)) != sum(expected.values()):
              raise SystemExit(f"authoritative 39k index ledger mismatch: expected={expected}, accepted={accepted}, league_count={index.get('league_count')}")

          def normalize(season, db_name):
              raw = str(db_name).strip()
              if re.fullmatch(r"\d{5}", raw):
                  return raw
              match = re.fullmatch(r"mfl_(\d{4})_(\d{5})", raw)
              if match and int(match.group(1)) == int(season):
                  return match.group(2)
              raise SystemExit(f"unsupported MFL index db_name: {raw!r} season={season}")

          live = defaultdict(set)
          for row in index.get("leagues", []):
              season = int(row["season"])
              live[season].add(normalize(season, row["db_name"]))
          actual = {year: len(live[year]) for year in expected}
          if actual != expected:
              raise SystemExit(f"authoritative 39k index duplicate/membership mismatch: expected={expected}, actual={actual}")
          if sum(len(ids) for ids in live.values()) != 39368:
              raise SystemExit(f"authoritative 39k index total mismatch: {sum(len(ids) for ids in live.values())}")

          discovered = defaultdict(set)
          malformed_discovered = defaultdict(set)
          with gzip.open(os.environ["REGISTRY_PATH"], mode="rt", newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  season = int(row["season"])
                  raw_id = str(row["league_id"]).strip()
                  if re.fullmatch(r"\d{1,5}", raw_id):
                      discovered[season].add(raw_id.zfill(5))
                  else:
                      malformed_discovered[season].add(raw_id)

          current = {year: len(live[year]) for year in range(2000, 2019)}
          rows = []
          used = defaultdict(set)
          for stage, target, years in [(1, 2000, range(2000, 2019)), (2, 5000, range(2002, 2019)), (3, 10000, range(2003, 2019))]:
              for year in years:
                  need = max(0, target - current[year] - len(used[year]))
                  available = sorted(discovered[year] - live[year] - used[year], key=lambda value: (int(value), value))
                  selected = available[:need]
                  used[year].update(selected)
                  for ordinal, league_id in enumerate(selected, 1):
                      rows.append({"stage": stage, "target_per_year": target, "year_order": year, "year_ordinal": ordinal, "season": year, "league_id": league_id, "source": "registry_minus_authoritative_39k_index"})

          fields = ["stage", "target_per_year", "year_order", "year_ordinal", "season", "league_id", "source"]
          with open("mfl_ordered_quota_manifest.csv", "w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          Path("mfl_ordered_quota_manifest.json").write_text(json.dumps({"rows": rows}, indent=2) + "\n", encoding="utf-8")

          scoreboard = [{"year": year, "authoritative_39k_ids": len(live[year]), "registry_discovered_ids": len(discovered[year]), "stage1_needed": max(0, 2000 - current[year]), "stage2_needed_after_stage1": max(0, 5000 - max(current[year], 2000)), "stage3_needed_after_stage2": max(0, 10000 - max(current[year], 5000))} for year in range(2000, 2019)]
          Path("mfl_quota_validation.json").write_text(json.dumps({"authoritative_index_key": os.environ["MFL_INDEX_KEY"], "authoritative_index_path": str(index_path), "authoritative_39k_total": 39368, "malformed_discovered_ids": {str(y): sorted(values) for y, values in malformed_discovered.items()}, "rows_in_manifest": len(rows), "scoreboard": scoreboard}, indent=2) + "\n", encoding="utf-8")
          print(f"authoritative 39k index pairs: {sum(len(ids) for ids in live.values())}")
          print(f"manifest rows: {len(rows)}")
          print(f"first ordered rows: {rows[:5]}")
          for item in scoreboard:
              print(item)
          PY

      - name: Upload validated manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-ordered-quota-manifest-${{ github.run_id }}
          retention-days: 180
          path: |
            mfl_ordered_quota_manifest.csv
            mfl_ordered_quota_manifest.json
            mfl_quota_validation.json
