name: MFL Historical Discovery Scheduler B

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - MFL Historical Discovery Scheduler A
      - MFL Historical Gap Fill (1997-2006)
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: mfl-historical-discovery-scheduler-b
  cancel-in-progress: false

jobs:
  read-window:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      continue: ${{ steps.next.outputs.continue }}
      start_year: ${{ steps.next.outputs.start_year }}
      end_year: ${{ steps.next.outputs.end_year }}
      shard_count: ${{ steps.resolve.outputs.shard_count }}
      max_parallel: ${{ steps.resolve.outputs.max_parallel }}
      id_bands: ${{ steps.resolve.outputs.id_bands }}
      request_sleep: ${{ steps.resolve.outputs.request_sleep }}
      id_start: ${{ steps.next.outputs.id_start }}
      id_end: ${{ steps.next.outputs.id_end }}
    steps:
      - name: Download completed-window manifest
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: mfl-window-manifest-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: window

      - name: Resolve completed-window parameters
        id: resolve
        shell: bash
        env:
          BOOTSTRAP_END_YEAR: ${{ inputs.bootstrap_end_year || '2006' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            cat >> "$GITHUB_OUTPUT" <<EOF
          shard_count=256
          max_parallel=15
          id_bands=1-9999,10000-29999,30000-59999,60000-80000
          request_sleep=5.0
          id_start=0
          id_end=999
          completed_start_year=$((BOOTSTRAP_END_YEAR - 1))
          completed_end_year=${BOOTSTRAP_END_YEAR}
          EOF
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          path = Path("window/mfl_window_manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("platform") != "mfl":
              raise SystemExit("manifest platform is not mfl")
          if str(data.get("directory_only", "false")).lower() == "true":
              raise SystemExit("directory-only runs cannot advance the historical window")
          if str(data.get("shard_indices", "")):
              raise SystemExit("partial-shard runs cannot advance the historical window")
  
          for key in ("shard_count", "id_bands", "request_sleep", "id_start", "id_end"):
              print(f"{key}={data[key]}")
          # Recovery/merge manifests may record one merge runner; full
          # historical discovery always uses the campaign cap of 15.
          print("max_parallel=15")
          print(f"completed_start_year={int(data['start_year'])}")
          print(f"completed_end_year={int(data['end_year'])}")
          PY

      - name: Compute next ID band and season window
        id: next
        shell: bash
        env:
          COMPLETED_START: ${{ steps.resolve.outputs.completed_start_year }}
          COMPLETED_END: ${{ steps.resolve.outputs.completed_end_year }}
          COMPLETED_ID_START: ${{ steps.resolve.outputs.id_start }}
          COMPLETED_ID_END: ${{ steps.resolve.outputs.id_end }}
        run: |
          set -euo pipefail
          if { [ "$COMPLETED_ID_START" -eq 0 ] && [ "$COMPLETED_ID_END" -gt 999 ] && [ "$COMPLETED_ID_END" -lt 80000 ]; } || { [ "$COMPLETED_ID_START" -eq 10001 ] && [ "$COMPLETED_ID_END" -eq 11000 ]; }; then
            next_start_year=$COMPLETED_START
            next_end_year=$COMPLETED_END
            next_id_start=1000
            next_id_end=1999
          elif [ "$COMPLETED_ID_END" -lt 80000 ]; then
            next_start_year=$COMPLETED_START
            next_end_year=$COMPLETED_END
            next_id_start=$((COMPLETED_ID_END + 1))
            next_id_end=$((next_id_start + 999))
            if [ "$next_id_end" -gt 80000 ]; then next_id_end=80000; fi
          else
            next_start_year=$((COMPLETED_END + 1))
            if [ "$next_start_year" -gt 2025 ]; then
              echo "continue=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            next_end_year=$((next_start_year + 1))
            if [ "$next_end_year" -gt 2025 ]; then next_end_year=2025; fi
            next_id_start=0
            next_id_end=999
          fi
          if [ "$next_start_year" -gt 2025 ]; then
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "start_year=${next_start_year}" >> "$GITHUB_OUTPUT"
          echo "end_year=${next_end_year}" >> "$GITHUB_OUTPUT"
          echo "id_start=${next_id_start}" >> "$GITHUB_OUTPUT"
          echo "id_end=${next_id_end}" >> "$GITHUB_OUTPUT"

  next-window:
    needs: read-window
    if: ${{ needs.read-window.outputs.continue == 'true' }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: ${{ needs.read-window.outputs.shard_count }}
      max_parallel: ${{ needs.read-window.outputs.max_parallel }}
      start_year: ${{ needs.read-window.outputs.start_year }}
      end_year: ${{ needs.read-window.outputs.end_year }}
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: ${{ needs.read-window.outputs.id_bands }}
      request_sleep: ${{ needs.read-window.outputs.request_sleep }}
      id_start: ${{ needs.read-window.outputs.id_start }}
      id_end: ${{ needs.read-window.outputs.id_end }}
    secrets: inherit
