name: Sleeper Fleet Import

# Imports multiple Sleeper leagues in parallel using matrix strategy.
# Each league runs as its own independent job so failures are isolated.
#
# Usage:
#   Manual: provide leagues_json with array of {sleeper_league_id, database_name, start_year}
#   Or: set source=all to auto-discover from ___ops via Fly.io
#   Or: set source=test to run the 7 test leagues

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'League source: "full" (paid/grandfathered), "quick" (free only), "all", "test", or "custom"'
        required: true
        type: choice
        options:
          - full
          - quick
          - all
          - test
          - custom
        default: full
      leagues_json:
        description: 'JSON array of leagues (only used when source=custom). Format: [{"sleeper_league_id":"...", "database_name":"...", "start_year":2021}]'
        required: false
        type: string
      leagues_json_b64:
        description: 'Base64-encoded JSON array of leagues (safer for CLI/PowerShell custom runs).'
        required: false
        type: string
      max_parallel:
        description: 'Requested max parallel imports. Full-import fleets are capped at 20 for pressure testing.'
        required: false
        type: number
        default: 10
      batch:
        description: 'Batch number for all source (1=first 250, 2=remaining). Ignored for test/custom.'
        required: false
        type: number
        default: 1
      exclude_dbs:
        description: 'Comma-separated database names to skip (e.g. already reimported)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - discover leagues but skip import'
        required: false
        type: boolean
        default: false
permissions:
  actions: write
  contents: read

jobs:
  # ================================================================
  # Job 1: Discover leagues and build the matrix
  # ================================================================
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      league_count: ${{ steps.build.outputs.league_count }}
      safe_max_parallel: ${{ steps.build.outputs.safe_max_parallel }}

    steps:
      - name: Require canonical public main for publication
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build league matrix
        id: build
        env:
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          SOURCE: ${{ github.event.inputs.source }}
          LEAGUES_JSON: ${{ github.event.inputs.leagues_json }}
          LEAGUES_JSON_B64: ${{ github.event.inputs.leagues_json_b64 }}
          MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '10' }}
          BATCH: ${{ github.event.inputs.batch || '1' }}
          EXCLUDE_DBS: ${{ github.event.inputs.exclude_dbs || '' }}
        run: |
          python - <<'PYEOF'
          import base64, json, os, sys, urllib.request

          def fly_query(sql, database="___ops"):
              url = os.environ["DATABASE_SERVER_URL"].rstrip("/") + "/query"
              token = os.environ["DATABASE_READ_TOKEN"]
              data = json.dumps({"sql": sql, "database": database}).encode()
              req = urllib.request.Request(url, data=data, headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {token}",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read())

          source = os.environ.get("SOURCE", "test")
          leagues_json_raw = os.environ.get("LEAGUES_JSON", "")
          leagues_json_b64 = os.environ.get("LEAGUES_JSON_B64", "")

          def parse_custom_leagues():
              raw = leagues_json_raw.strip()
              if leagues_json_b64.strip():
                  try:
                      raw = base64.b64decode(leagues_json_b64.strip()).decode("utf-8")
                  except Exception as exc:
                      print(f"ERROR: leagues_json_b64 is not valid base64 UTF-8: {exc}")
                      sys.exit(1)
              if not raw:
                  print("ERROR: source=custom requires leagues_json or leagues_json_b64")
                  sys.exit(1)
              try:
                  return json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"ERROR: custom league JSON is invalid: {exc}")
                  print("Use strict JSON with quoted keys/strings, or pass base64 JSON via leagues_json_b64.")
                  print(f"Received: {raw!r}")
                  sys.exit(1)

          if source == "custom":
              leagues = parse_custom_leagues()

          elif source == "test":
              # 7 Sleeper test leagues with correct IDs and actual start years
              leagues = [
                  {"sleeper_league_id": "1253478574636138496", "database_name": "champions_branch_out", "import_mode": "full"},
                  {"sleeper_league_id": "1314686478772600832", "database_name": "degenerate_gamblers_football_league", "import_mode": "full"},
                  {"sleeper_league_id": "1209663934118768640", "database_name": "l_14_big_booms", "import_mode": "full"},
                  {"sleeper_league_id": "1194644814116040704", "database_name": "nyu_ffl", "import_mode": "full"},
                  {"sleeper_league_id": "1312076046484373504", "database_name": "playing_for_keeps_league", "import_mode": "full"},
                  {"sleeper_league_id": "1257088277819691008", "database_name": "the_real_ff_league", "import_mode": "full"},
                  {"sleeper_league_id": "1180216138503110656", "database_name": "zootown_dynasty", "import_mode": "full"},
              ]

          elif source in ("all", "full", "quick"):
              # Read from league_inventory via Fly.io DuckDB server
              raw_rows = fly_query("""
                  SELECT league_id, database_name, entitled_mode
                  FROM accounts.league_inventory
                  WHERE platform = 'sleeper'
                    AND league_id IS NOT NULL
                  ORDER BY database_name
              """)
              rows = [(r["league_id"], r["database_name"], r["entitled_mode"]) for r in raw_rows]

              # Deduplicate by database_name, take the latest (highest numeric) league_id
              db_map = {}
              for lid, db, mode in rows:
                  try:
                      lid_int = int(lid)
                  except (ValueError, TypeError):
                      continue
                  if db not in db_map or lid_int > db_map[db]["lid_int"]:
                      db_map[db] = {"lid_int": lid_int, "sleeper_league_id": str(lid), "database_name": db, "import_mode": mode or "quick"}

              all_leagues = sorted(db_map.values(), key=lambda x: x["database_name"])

              # Filter by source type
              if source == "full":
                  all_leagues = [v for v in all_leagues if v["import_mode"] == "full"]
                  print(f"Full-only fleet: {len(all_leagues)} paid/grandfathered leagues")
              elif source == "quick":
                  all_leagues = [v for v in all_leagues if v["import_mode"] == "quick"]
                  print(f"Quick-only fleet: {len(all_leagues)} free leagues")
              else:
                  # "all" = all leagues, respecting entitled_mode
                  print(f"All leagues: {len(all_leagues)} ({sum(1 for v in all_leagues if v['import_mode'] == 'full')} full, {sum(1 for v in all_leagues if v['import_mode'] != 'full')} quick)")

              # Exclude specific databases
              exclude = set(x.strip() for x in os.environ.get("EXCLUDE_DBS", "").split(",") if x.strip())
              if exclude:
                  all_leagues = [v for v in all_leagues if v["database_name"] not in exclude]
                  print(f"Excluding {len(exclude)} databases: {exclude}")

              # Batch: split into chunks of 250 (GH Actions matrix limit = 256)
              batch = int(os.environ.get("BATCH", "1"))
              batch_size = 250
              start = (batch - 1) * batch_size
              end = start + batch_size
              batched = all_leagues[start:end]
              print(f"Batch {batch}: leagues {start+1}-{min(end, len(all_leagues))} of {len(all_leagues)}")

              leagues = [
                  {"sleeper_league_id": v["sleeper_league_id"], "database_name": v["database_name"], "import_mode": v["import_mode"]}
                  for v in batched
              ]
          else:
              print(f"ERROR: Unknown source '{source}'")
              sys.exit(1)

          # Validate
          for lg in leagues:
              assert lg.get("sleeper_league_id"), f"Missing sleeper_league_id: {lg}"
              assert lg.get("database_name"), f"Missing database_name: {lg}"
              if "import_mode" not in lg:
                  lg["import_mode"] = "quick"

          matrix = {"include": leagues}
          requested_parallel = int(os.environ.get("MAX_PARALLEL") or "10")
          has_full = any(str(lg.get("import_mode", "quick")).lower() == "full" for lg in leagues)
          parallel_cap = 20 if has_full else 10
          safe_max_parallel = max(1, min(requested_parallel, parallel_cap))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"league_count={len(leagues)}\n")
              f.write(f"safe_max_parallel={safe_max_parallel}\n")

          print(f"Discovered {len(leagues)} leagues:")
          print(f"Requested max_parallel={requested_parallel}; safe_max_parallel={safe_max_parallel} (cap={parallel_cap}, has_full={has_full})")
          for lg in leagues:
              print(f"  {lg['database_name']} (ID={lg['sleeper_league_id']}, mode={lg['import_mode']})")
          PYEOF

  # ================================================================
  # Job 2: Import each league in parallel (matrix)
  # ================================================================
  import-league:
    needs: [discover]
    if: ${{ !inputs.dry_run && fromJson(needs.discover.outputs.league_count) > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: league-update-${{ matrix.database_name }}
      cancel-in-progress: false
      queue: max

    strategy:
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
      max-parallel: ${{ fromJson(needs.discover.outputs.safe_max_parallel) }}
      fail-fast: false  # Don't cancel other leagues if one fails

    env:
      PYTHONUNBUFFERED: 1
      DB_NAME: ${{ matrix.database_name }}
      SLEEPER_LEAGUE_ID: ${{ matrix.sleeper_league_id }}
      IMPORT_MODE: ${{ matrix.import_mode }}
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      FLY_UPLOAD_MAX_RETRIES: 40
      FLY_UPLOAD_RETRY_BASE_DELAY: 3
      FLY_UPLOAD_RETRY_MAX_DELAY: 30
      FLY_UPLOAD_RETRY_JITTER_SECONDS: 2
      FLY_PUBLISH_FORMAT: delta
      REQUIRE_IMPORT_BASE_GENERATION: '1'
      FLY_DELTA_FALLBACK_TO_DUCKDB: '0'
      FLY_FINALIZE_INVENTORY: '0'

    steps:
      - name: Require canonical public main for publication
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Capture fleet league generation
        run: python scripts/capture_import_generation.py --db-name "${DB_NAME}"

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache from research lake
        shell: bash
        run: |
          test -s research_public_lake/ops_cache.duckdb

      - name: Log cached ops cache
        run: |
          echo "[ops-cache] key-prefix=ops-cache-v5-${{ runner.os }}-manual-"
          echo "[research-lake] restore-hit=${{ steps.research-lake.outputs.cache-hit }}"
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::research_public_lake/ops_cache.duckdb is missing from the canonical research lake cache."
            exit 1
          }
          echo "[ops-cache] size-bytes=$(stat -c%s "${OPS_CACHE_PATH}")"
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate venv
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ==================== IMPORT ====================
      - name: Run import
        id: import
        working-directory: fantasy_football_data_scripts
        run: |
          source ../.venv/bin/activate
          echo "========================================"
          echo "Importing: ${{ env.DB_NAME }}"
          echo "League ID: ${{ env.SLEEPER_LEAGUE_ID }}"
          echo "Import mode: ${{ env.IMPORT_MODE }}"
          echo "========================================"
          DATA_DIR="${{ github.workspace }}/fantasy_football_data/sleeper_${{ env.DB_NAME }}"
          mkdir -p "$DATA_DIR"

          set +e
          python sleeper_initial_import.py \
            --league-id ${{ env.SLEEPER_LEAGUE_ID }} \
            --data-dir "$DATA_DIR" \
            --import-mode ${{ env.IMPORT_MODE }} \
            --database-name ${{ env.DB_NAME }} \
            --skip-track-2-upload \
            2>&1 | tee ../import_${{ env.DB_NAME }}.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
          echo "data_dir=${DATA_DIR}" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -ne 0 ]; then
            echo "IMPORT FAILED for ${{ env.DB_NAME }} (exit code ${EXIT_CODE})"
            tail -100 ../import_${{ env.DB_NAME }}.log
            exit $EXIT_CODE
          fi

      # ==================== COUNT MATCHUP ROWS ====================
      - name: Count matchup rows
        if: steps.import.outputs.exit_code == '0'
        id: matchup_rows
        run: |
          source .venv/bin/activate
          python - <<'PYEOF'
          import os
          import sys
          from pathlib import Path

          import duckdb

          db_name = os.environ["DB_NAME"]
          data_dir = Path("${{ steps.import.outputs.data_dir }}")
          db_path = data_dir / f"{db_name}.duckdb"

          if not db_path.exists():
              print(f"ERROR: Local DuckDB not found: {db_path}")
              sys.exit(1)

          conn = duckdb.connect(str(db_path), read_only=True)
          try:
              count = conn.execute("SELECT COUNT(*) FROM public.matchup").fetchone()[0]
          finally:
              conn.close()

          print(f"matchup: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matchup_count={count}\n")
          PYEOF

      # ==================== DIAGNOSTICS: is_playoffs checkpoint ====================
      - name: "[DIAG] is_playoffs after import"
        if: steps.import.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          cd fantasy_football_data_scripts
          python -c "
          import duckdb
          from pathlib import Path
          p = Path('${{ steps.import.outputs.data_dir }}') / '${{ env.DB_NAME }}.duckdb'
          conn = duckdb.connect(str(p), read_only=True)
          rows = conn.execute('''
              SELECT year,
                     SUM(CASE WHEN CAST(is_playoffs AS INTEGER) = 1 THEN 1 ELSE 0 END) as po,
                     SUM(CASE WHEN CAST(champion AS INTEGER) = 1 THEN 1 ELSE 0 END) as ch,
                     ANY_VALUE(typeof(is_playoffs)) as tp
              FROM public.matchup GROUP BY year ORDER BY year
          ''').fetchall()
          for r in rows:
              status = 'OK' if r[1] > 0 else '*** MISSING ***'
              print(f'[DIAG:post-import] {r[0]}: is_playoffs={r[1]}, champion={r[2]}, type={r[3]} {status}')
          conn.close()
          "

      # ==================== SIMS ====================
      - name: Calculate expected records
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.expected_record_v2 \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ steps.import.outputs.data_dir }} \
            --n-sims 10000

      - name: "[DIAG] is_playoffs after expected_record"
        if: steps.import.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          cd fantasy_football_data_scripts
          python -c "
          import duckdb
          from pathlib import Path
          p = Path('${{ steps.import.outputs.data_dir }}') / '${{ env.DB_NAME }}.duckdb'
          conn = duckdb.connect(str(p), read_only=True)
          rows = conn.execute('''
              SELECT year,
                     SUM(CASE WHEN CAST(is_playoffs AS INTEGER) = 1 THEN 1 ELSE 0 END) as po
              FROM public.matchup GROUP BY year ORDER BY year
          ''').fetchall()
          for r in rows:
              status = 'OK' if r[1] > 0 else '*** MISSING ***'
              print(f'[DIAG:post-expected-record] {r[0]}: is_playoffs={r[1]} {status}')
          conn.close()
          "

      - name: Calculate playoff odds
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.playoff_odds_import \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ steps.import.outputs.data_dir }} \
            --n-sims 10000

      - name: "[DIAG] is_playoffs after playoff_odds"
        if: steps.import.outputs.exit_code == '0'
        continue-on-error: true
        run: |
          cd fantasy_football_data_scripts
          python -c "
          import duckdb
          from pathlib import Path
          p = Path('${{ steps.import.outputs.data_dir }}') / '${{ env.DB_NAME }}.duckdb'
          conn = duckdb.connect(str(p), read_only=True)
          rows = conn.execute('''
              SELECT year,
                     SUM(CASE WHEN CAST(is_playoffs AS INTEGER) = 1 THEN 1 ELSE 0 END) as po
              FROM public.matchup GROUP BY year ORDER BY year
          ''').fetchall()
          for r in rows:
              status = 'OK' if r[1] > 0 else '*** MISSING ***'
              print(f'[DIAG:post-playoff-odds] {r[0]}: is_playoffs={r[1]} {status}')
          conn.close()
          "

      # ==================== AGGREGATIONS ====================
      - name: Run aggregations
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python ../scripts/refresh_aggregates.py \
            --db ${{ matrix.database_name }} \
            --data-dir ${{ steps.import.outputs.data_dir }}

      # ==================== UPLOAD ====================
      - name: Upload to database
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python -c "
          from multi_league.core.local_db import LocalLeagueDB
          db = LocalLeagueDB('${{ steps.import.outputs.data_dir }}', '${{ env.DB_NAME }}')
          db.connect()
          db.upload_to_fly('${{ env.DB_NAME }}')
          print('Upload to Fly complete: ${{ env.DB_NAME }}')
          db.close()
          "

      # ==================== REVALIDATE + WARM VERCEL CACHE ====================
      - name: Revalidate and warm Vercel cache
        if: steps.import.outputs.exit_code == '0'
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          python scripts/warm_vercel_cache.py \
            --db "$DB_NAME" \
            --secret "$REVALIDATION_SECRET" \
            --site-url "https://www.leaguehistory.app" \
            --mode "$IMPORT_MODE" \
            --strategy expire \
            --jitter-seconds 0 \
            --warm-attempts 2 \
            --strict \
            --soft-warm-failures \
            --verify-hot

      # ==================== STATUS ====================
      - name: Print status
        if: always()
        run: |
          echo "========================================"
          echo "RESULT: ${{ env.DB_NAME }}"
          echo "Import: ${{ steps.import.outputs.exit_code == '0' && 'SUCCESS' || 'FAILED' }}"
          echo "========================================"

  # ================================================================
  # Job 3: Summary
  # ================================================================
  summary:
    needs: [discover, import-league]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fleet summary
        run: |
          echo "========================================"
          echo "SLEEPER FLEET IMPORT COMPLETE"
          echo "========================================"
          echo "Leagues attempted: ${{ needs.discover.outputs.league_count }}"
          echo "Source: ${{ github.event.inputs.source }}"
          echo "Max parallel: ${{ github.event.inputs.max_parallel || 5 }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"
          echo "========================================"
