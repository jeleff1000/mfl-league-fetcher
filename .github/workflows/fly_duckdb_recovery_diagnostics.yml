name: Fly DuckDB Recovery Diagnostics

on:
  workflow_dispatch:
    inputs:
      preserve_current_volume:
        description: Create a recovery snapshot of the current volume before inspection
        required: false
        default: false
        type: boolean
      validate_snapshot_id:
        description: Optional snapshot ID to restore to a temporary volume and validate read-only
        required: false
        default: ""
        type: string
      inspect_existing_volume_id:
        description: Optional unattached wkupd_rebuild volume to inspect read-only without restoring another snapshot
        required: false
        default: ""
        type: string
      inspect_db_name:
        description: League db_name whose saved manager identity mapping should be compared with live Fly
        required: false
        default: ""
        type: string
      cleanup_recovery_resources:
        description: Remove only temporary wkupd_* validation machines and volumes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Install flyctl
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Inspect app, volume snapshots, and database files
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: league-history-duckdb
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          PRESERVE_CURRENT_VOLUME: ${{ inputs.preserve_current_volume }}
          VALIDATE_SNAPSHOT_ID: ${{ inputs.validate_snapshot_id }}
          INSPECT_EXISTING_VOLUME_ID: ${{ inputs.inspect_existing_volume_id }}
          INSPECT_DB_NAME: ${{ inputs.inspect_db_name }}
          CLEANUP_RECOVERY_RESOURCES: ${{ inputs.cleanup_recovery_resources }}
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP"
          flyctl machines list --app "$FLY_APP" --json | tee machines.json
          flyctl volumes list --app "$FLY_APP" --json | tee volumes.json

          if [ "$CLEANUP_RECOVERY_RESOURCES" = "true" ]; then
            jq -r '.[] | select(.name | startswith("wkupd_")) | [.id, (.attached_machine_id // "")] | @tsv' volumes.json \
              | while IFS=$'\t' read -r recovery_volume recovery_machine; do
                  [ -n "$recovery_volume" ] || continue
                  if [ -n "$recovery_machine" ]; then
                    flyctl machine destroy "$recovery_machine" --app "$FLY_APP" --force
                  fi
                  flyctl volumes destroy "$recovery_volume" --app "$FLY_APP" --yes
                done
            flyctl machines list --app "$FLY_APP" --json | tee machines-after-cleanup.json
            flyctl volumes list --app "$FLY_APP" --json | tee volumes-after-cleanup.json
          fi

          jq -r '.[].id' volumes.json | while IFS= read -r volume_id; do
            [ -n "$volume_id" ] || continue
            if [ "${PRESERVE_CURRENT_VOLUME}" = "true" ]; then
              echo "Creating recovery snapshot for volume ${volume_id}"
              flyctl volumes snapshots create "$volume_id" --app "$FLY_APP" --json \
                | tee "created-snapshot-${volume_id}.json"
            fi
            echo "Snapshots for volume ${volume_id}"
            flyctl volumes snapshots list "$volume_id" --app "$FLY_APP" --json \
              | tee "snapshots-${volume_id}.json"
          done

          machine_id="$(jq -r 'map(select(.state == "started"))[0].id // .[0].id // empty' machines.json)"
          if [ -n "$machine_id" ]; then
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" \
              -C "/bin/sh -lc 'ls -lah /data/___leagues.duckdb* /data/___ops.duckdb* 2>/dev/null || true'"
          fi

          if [ -n "$INSPECT_EXISTING_VOLUME_ID" ]; then
            [[ "$INSPECT_EXISTING_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]] || { echo "Invalid existing volume ID" >&2; exit 2; }
            [[ "$INSPECT_DB_NAME" =~ ^[a-z0-9_]+$ ]] || { echo "Invalid db_name" >&2; exit 2; }
            inspect_name="$(jq -r --arg id "$INSPECT_EXISTING_VOLUME_ID" 'map(select(.id == $id))[0].name // empty' volumes.json)"
            inspect_region="$(jq -r --arg id "$INSPECT_EXISTING_VOLUME_ID" 'map(select(.id == $id))[0].region // empty' volumes.json)"
            inspect_state="$(jq -r --arg id "$INSPECT_EXISTING_VOLUME_ID" 'map(select(.id == $id))[0].state // empty' volumes.json)"
            inspect_attachment="$(jq -r --arg id "$INSPECT_EXISTING_VOLUME_ID" 'map(select(.id == $id))[0].attached_machine_id' volumes.json)"
            [[ "$inspect_name" == wkupd_rebuild_* ]]
            [ "$inspect_state" = "created" ]
            [ "$inspect_attachment" = "null" ]

            cat > identity_snapshot_probe.py <<'PY'
          import json
          import os
          import urllib.request

          import duckdb

          db_name = os.environ["INSPECT_DB_NAME"]
          quoted_db = db_name.replace("'", "''")
          path = "/data/___leagues.duckdb"

          def columns(connection, table):
              return {
                  row[0]
                  for row in connection.execute(f'DESCRIBE public."{table}"').fetchall()
              }

          def snapshot_payload():
              connection = duckdb.connect(path, read_only=True)
              try:
                  context_columns = columns(connection, "league_context")
                  context_fields = [
                      field
                      for field in (
                          "db_name",
                          "manager_name_overrides_json",
                          "franchise_merges_json",
                          "updated_at",
                      )
                      if field in context_columns
                  ]
                  context = connection.execute(
                      f"SELECT {', '.join(context_fields)} FROM public.league_context "
                      f"WHERE db_name = '{quoted_db}' LIMIT 1"
                  ).fetchall()
                  context_rows = [dict(zip(context_fields, row)) for row in context]

                  manager_overrides = []
                  table_names = {
                      row[0]
                      for row in connection.execute(
                          "SELECT table_name FROM information_schema.tables WHERE table_schema='public'"
                      ).fetchall()
                  }
                  if "manager_overrides" in table_names:
                      override_columns = columns(connection, "manager_overrides")
                      select_fields = [
                          field
                          for field in (
                              "operation", "from_name", "to_name", "applied_at"
                          )
                          if field in override_columns
                      ]
                      rows = connection.execute(
                          f"SELECT {', '.join(select_fields)} FROM public.manager_overrides "
                          f"WHERE db_name = '{quoted_db}' ORDER BY applied_at, from_name, to_name"
                      ).fetchall()
                      manager_overrides = [dict(zip(select_fields, row)) for row in rows]

                  matchup_columns = columns(connection, "matchup")
                  identity_fields = [
                      field
                      for field in ("manager", "franchise_id", "manager_guid")
                      if field in matchup_columns
                  ]
                  group_fields = ", ".join(identity_fields)
                  identities = connection.execute(
                      f"SELECT {group_fields}, MIN(year) AS first_year, MAX(year) AS last_year, "
                      f"COUNT(*) AS rows FROM public.matchup WHERE db_name = '{quoted_db}' "
                      f"GROUP BY {group_fields} ORDER BY first_year, manager, franchise_id"
                  ).fetchall()
                  identity_names = identity_fields + ["first_year", "last_year", "rows"]
                  identity_rows = [dict(zip(identity_names, row)) for row in identities]
                  return {
                      "league_context": context_rows,
                      "manager_overrides": manager_overrides,
                      "matchup_identities": identity_rows,
                  }
              finally:
                  connection.close()

          def live_query(sql):
              request = urllib.request.Request(
                  os.environ["DATABASE_SERVER_URL"].rstrip("/") + "/query",
                  data=json.dumps({"database": "___leagues", "sql": sql}).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["DATABASE_READ_TOKEN"],
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          live = {
              "league_context": live_query(
                  "SELECT manager_name_overrides_json, franchise_merges_json, updated_at "
                  "FROM public.league_context "
                  f"WHERE db_name = '{quoted_db}' LIMIT 1"
              ),
              "matchup_identities": live_query(
                  "SELECT manager, franchise_id, manager_guid, MIN(year) AS first_year, "
                  "MAX(year) AS last_year, COUNT(*) AS rows FROM public.matchup "
                  f"WHERE db_name = '{quoted_db}' "
                  "GROUP BY manager, franchise_id, manager_guid "
                  "ORDER BY first_year, manager, franchise_id"
              ),
          }
          print(json.dumps({"db_name": db_name, "snapshot": snapshot_payload(), "live": live}, default=str, sort_keys=True))
          PY

            inspect_machine_name="wkupd-identity-probe-${GITHUB_RUN_ID}"
            inspect_machine_id=""
            cleanup_inspect_machine() {
              if [ -n "$inspect_machine_id" ]; then
                flyctl machine destroy "$inspect_machine_id" --app "$FLY_APP" --force || true
              fi
            }
            trap cleanup_inspect_machine EXIT
            image_ref="$(jq -r 'map(select(.state == "started"))[0].config.image // empty' machines.json)"
            flyctl machine run "$image_ref" --app "$FLY_APP" --region "$inspect_region" \
              --name "$inspect_machine_name" --volume "$INSPECT_EXISTING_VOLUME_ID:/data" \
              --entrypoint /bin/sh --file-local "/tmp/identity_snapshot_probe.py=identity_snapshot_probe.py" \
              --restart no --detach --vm-cpus 1 --vm-memory 2048 -- -lc 'sleep 900' \
              | tee identity-probe-machine.log
            for _ in $(seq 1 30); do
              inspect_machine_id="$(flyctl machines list --app "$FLY_APP" --json \
                | jq -r --arg name "$inspect_machine_name" 'map(select(.name == $name))[0].id // empty')"
              [ -n "$inspect_machine_id" ] && break
              sleep 2
            done
            [ -n "$inspect_machine_id" ]
            for _ in $(seq 1 60); do
              inspect_machine_state="$(flyctl machines list --app "$FLY_APP" --json \
                | jq -r --arg id "$inspect_machine_id" '.[] | select(.id == $id) | .state')"
              [ "$inspect_machine_state" = "started" ] && break
              sleep 2
            done
            [ "${inspect_machine_state:-}" = "started" ]
            flyctl ssh console --app "$FLY_APP" --machine "$inspect_machine_id" \
              -C "/bin/sh -lc \"INSPECT_DB_NAME='$INSPECT_DB_NAME' DATABASE_SERVER_URL='$DATABASE_SERVER_URL' DATABASE_READ_TOKEN='$DATABASE_READ_TOKEN' python /tmp/identity_snapshot_probe.py\"" \
              | tee identity-snapshot-probe.jsonl
            cleanup_inspect_machine
            inspect_machine_id=""
            trap - EXIT
          fi

          if [ -n "$VALIDATE_SNAPSHOT_ID" ]; then
            if ! [[ "$VALIDATE_SNAPSHOT_ID" =~ ^vs_[A-Za-z0-9]+$ ]]; then
              echo "Invalid snapshot ID" >&2
              exit 2
            fi

            volume_name="wkupd_${GITHUB_RUN_ID}"
            recovery_volume_id=""
            recovery_machine_id=""
            cleanup() {
              if [ -n "$recovery_machine_id" ]; then
                flyctl machine destroy "$recovery_machine_id" --app "$FLY_APP" --force || true
              fi
              if [ -n "$recovery_volume_id" ]; then
                flyctl volumes destroy "$recovery_volume_id" --app "$FLY_APP" --yes || true
              fi
            }
            trap cleanup EXIT

            source_region="$(jq -r '.[0].region' volumes.json)"
            source_size_gb="$(jq -r '.[0].size_gb' volumes.json)"
            image_ref="$(jq -r 'map(select(.state == "started"))[0].config.image' machines.json)"
            recovery_json="$(flyctl volumes create "$volume_name" --app "$FLY_APP" \
              --region "$source_region" --size "$source_size_gb" \
              --snapshot-id "$VALIDATE_SNAPSHOT_ID" --scheduled-snapshots=false \
              --require-unique-zone=false --yes --json)"
            printf '%s\n' "$recovery_json" | tee recovery-volume.json
            recovery_volume_id="$(printf '%s' "$recovery_json" | jq -r '.id')"
            if [ -z "$recovery_volume_id" ] || [ "$recovery_volume_id" = "null" ]; then
              echo "Snapshot restore did not return a recovery volume ID" >&2
              exit 3
            fi
            # Large restored volumes routinely remain in Fly's `restoring`
            # state for more than twenty minutes.  Let the platform finish
            # instead of destroying a healthy in-progress restore and starting
            # the same work again.
            for _ in $(seq 1 720); do
              recovery_state="$(flyctl volumes show "$recovery_volume_id" --app "$FLY_APP" --json | jq -r '.state')"
              if [ "$recovery_state" = "created" ]; then
                break
              fi
              sleep 5
            done
            if [ "${recovery_state:-}" != "created" ]; then
              echo "Recovery volume did not finish restoring: ${recovery_state:-unknown}" >&2
              exit 4
            fi

            cat > snapshot_probe.py <<'PY'
          import json
          import os
          import sys

          import duckdb

          path = "/data/___leagues.duckdb"
          checks = {
              "league_settings": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.league_settings",
              "league_context": "SELECT COUNT(*), COUNT(DISTINCT db_name) FROM public.league_context",
              "matchup": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.matchup",
              "player_fantasy": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.player_fantasy",
          }
          deep_tables = [
              "homepage_manager_rankings",
              "matchup_h2h_career",
              "player_fantasy_season",
              "player_fantasy_season_all",
              "standings_by_year",
          ]
          result = {"path": path, "checks": {}, "errors": {}}
          connection = duckdb.connect(path, read_only=True)
          try:
              for name, sql in checks.items():
                  try:
                      result["checks"][name] = connection.execute(sql).fetchone()
                  except Exception as exc:
                      result["errors"][name] = str(exc)
              for name in deep_tables:
                  try:
                      columns = [row[0] for row in connection.execute(
                          f'DESCRIBE public."{name}"'
                      ).fetchall()]
                      quoted = ", ".join('"' + column.replace('"', '""') + '"' for column in columns)
                      result["checks"][name] = connection.execute(
                          f'SELECT COUNT(*), BIT_XOR(hash({quoted})) FROM public."{name}"'
                      ).fetchone()
                  except Exception as exc:
                      result["errors"][name] = str(exc)
          finally:
              connection.close()
          inspect_db_name = os.environ.get("INSPECT_DB_NAME", "")
          if inspect_db_name:
              quoted_db = inspect_db_name.replace("'", "''")
              connection = duckdb.connect(path, read_only=True)
              try:
                  context_columns = {
                      row[0]
                      for row in connection.execute("DESCRIBE public.league_context").fetchall()
                  }
                  context_fields = [
                      field
                      for field in (
                          "db_name",
                          "manager_name_overrides_json",
                          "franchise_merges_json",
                          "updated_at",
                      )
                      if field in context_columns
                  ]
                  context_rows = connection.execute(
                      f"SELECT {', '.join(context_fields)} FROM public.league_context "
                      f"WHERE db_name = '{quoted_db}' LIMIT 1"
                  ).fetchall()
                  matchup_columns = {
                      row[0]
                      for row in connection.execute("DESCRIBE public.matchup").fetchall()
                  }
                  identity_fields = [
                      field
                      for field in ("manager", "franchise_id", "manager_guid")
                      if field in matchup_columns
                  ]
                  group_fields = ", ".join(identity_fields)
                  identity_names = identity_fields + ["first_year", "last_year", "rows"]
                  identity_rows = connection.execute(
                      f"SELECT {group_fields}, MIN(year), MAX(year), COUNT(*) "
                      f"FROM public.matchup WHERE db_name = '{quoted_db}' "
                      f"GROUP BY {group_fields} ORDER BY MIN(year), manager, franchise_id"
                  ).fetchall()
                  result["identity_snapshot"] = {
                      "db_name": inspect_db_name,
                      "league_context": [dict(zip(context_fields, row)) for row in context_rows],
                      "matchup_identities": [dict(zip(identity_names, row)) for row in identity_rows],
                  }
              finally:
                  connection.close()
          print(json.dumps(result, sort_keys=True))
          sys.exit(1 if result["errors"] else 0)
          PY
            recovery_machine_name="wkupd-probe-${GITHUB_RUN_ID}"
            flyctl machine run "$image_ref" --app "$FLY_APP" --region "$source_region" \
              --name "$recovery_machine_name" \
              --volume "$recovery_volume_id:/data" --entrypoint /bin/sh \
              --file-local "/tmp/snapshot_probe.py=snapshot_probe.py" \
              --restart no --detach --vm-cpus 1 --vm-memory 2048 \
              -- -lc 'sleep 900' | tee recovery-machine-run.log
            for _ in $(seq 1 30); do
              recovery_machine_id="$(flyctl machines list --app "$FLY_APP" --json \
                | jq -r --arg name "$recovery_machine_name" 'map(select(.name == $name))[0].id // empty')"
              [ -n "$recovery_machine_id" ] && break
              sleep 2
            done
            if [ -z "$recovery_machine_id" ] || [ "$recovery_machine_id" = "null" ]; then
              echo "Snapshot probe did not return a recovery machine ID" >&2
              exit 5
            fi
            flyctl machines list --app "$FLY_APP" --json \
              | jq --arg id "$recovery_machine_id" '.[] | select(.id == $id)' \
              | tee recovery-machine.json
            for _ in $(seq 1 60); do
              recovery_machine_state="$(flyctl machines list --app "$FLY_APP" --json \
                | jq -r --arg id "$recovery_machine_id" '.[] | select(.id == $id) | .state')"
              if [ "$recovery_machine_state" = "started" ]; then
                break
              fi
              sleep 2
            done
            if [ "${recovery_machine_state:-}" != "started" ]; then
              echo "Recovery machine did not start: ${recovery_machine_state:-unknown}" >&2
              exit 6
            fi
            flyctl ssh console --app "$FLY_APP" --machine "$recovery_machine_id" \
              -C "/bin/sh -lc \"INSPECT_DB_NAME='$INSPECT_DB_NAME' python /tmp/snapshot_probe.py\"" \
              | tee snapshot-validation.jsonl
            trap - EXIT
            cleanup
          fi

      - name: Upload diagnostic inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fly-duckdb-recovery-diagnostics-${{ github.run_id }}
          path: |
            machines.json
            machines-after-cleanup.json
            volumes.json
            volumes-after-cleanup.json
            created-snapshot-*.json
            snapshots-*.json
            recovery-volume.json
            recovery-machine.json
            recovery-machine-run.log
            snapshot-validation.jsonl
            identity-probe-machine.log
            identity-snapshot-probe.jsonl
          if-no-files-found: warn
          retention-days: 7
