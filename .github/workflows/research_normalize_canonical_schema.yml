name: Retired research cache normalizer (no cache writes)

on:
  workflow_dispatch:
    inputs:

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: write

concurrency:
  group: canonical-research-cache-replacement
  cancel-in-progress: false

jobs:
  normalize:
    # Research rollups consume the established GitHub cache in place.  This
    # workflow is deliberately disabled: it must never create a new cache
    # lineage, evict the seed cache, or rewrite the ops cache.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Fingerprint ops cache before rebuild
        run: |
          set -euo pipefail
          test -s research_public_lake/ops_cache.duckdb
          sha256sum research_public_lake/ops_cache.duckdb | awk '{print "OPS_SHA_BEFORE="$1}' >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Materialize one canonical player schema
        run: |
          python code/scripts/research_cohorts/normalize_canonical_research_schema.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out research_public_lake/corpus_snapshot.normalized.duckdb \
            --ops-cache research_public_lake/ops_cache.duckdb
          mv -f research_public_lake/corpus_snapshot.normalized.duckdb research_public_lake/corpus_snapshot.duckdb
      - name: Fail-fast ops cache preservation gate
        run: |
          set -euo pipefail
          test -s research_public_lake/ops_cache.duckdb
          ops_sha_after=$(sha256sum research_public_lake/ops_cache.duckdb | awk '{print $1}')
          test "$ops_sha_after" = "$OPS_SHA_BEFORE"
          echo "[ops-cache] preserved sha256=$ops_sha_after"
      - name: Fail-fast canonical schema gate
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          p={r[0] for r in c.execute('DESCRIBE public.player_fantasy').fetchall()}
          forbidden={'is_playoffs_bf','made_po_bf','made_po'} & p
          required={'is_playoffs','made_playoffs','cohort_teams','cohort_roster',
                    'cohort_scoring','cohort_pass_td','cohort_playoff_teams',
                    'cohort_dynasty','cohort_best_ball','cohort_position_eligible'} - p
          platform_null=c.execute("SELECT COUNT(*) FROM public.player_fantasy WHERE platform IS NULL OR TRIM(CAST(platform AS VARCHAR))=''").fetchone()[0]
          cohort_null=c.execute("SELECT COUNT(*) FROM public.player_fantasy WHERE " + ' OR '.join(f'{x} IS NULL' for x in sorted({'cohort_teams','cohort_roster','cohort_scoring','cohort_pass_td','cohort_playoff_teams','cohort_dynasty','cohort_best_ball','cohort_position_eligible'}))).fetchone()[0]
          cmc_rows=c.execute("SELECT COUNT(*) FROM public.player_fantasy WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280' AND CAST(year AS INTEGER)=2025").fetchone()[0]
          cmc_position_null=c.execute("SELECT COUNT(*) FROM public.player_fantasy WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280' AND CAST(year AS INTEGER)=2025 AND position IS NULL").fetchone()[0]
          cmc_week1_eligible=c.execute("""
            SELECT COUNT(DISTINCT db_name) FROM public.player_fantasy
            WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280' AND CAST(year AS INTEGER)=2025 AND week=1
              AND cohort_teams='12t' AND cohort_roster='flx' AND cohort_scoring='half'
              AND cohort_pass_td='4pt' AND cohort_playoff_teams='6po'
              AND CAST(cohort_position_eligible AS INTEGER)=1
          """).fetchone()[0]
          league_years=c.execute("SELECT COUNT(*) FROM (SELECT DISTINCT db_name, CAST(year AS INTEGER) AS year FROM public.player_fantasy)").fetchone()[0]
          if forbidden or required or platform_null or cohort_null or cmc_rows < 5000 or cmc_position_null or cmc_week1_eligible < 300 or league_years < 50000: raise SystemExit(f'bad canonical schema forbidden={forbidden} missing={required} platform_null={platform_null} cohort_null={cohort_null} cmc_rows={cmc_rows} cmc_position_null={cmc_position_null} cmc_week1_eligible={cmc_week1_eligible} league_years={league_years}')
          print({'player_columns':len(p),'player_rows':c.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0],'platform_null':platform_null,'cohort_null':cohort_null,'cmc_rows_2025':cmc_rows,'cmc_position_null':cmc_position_null,'cmc_week1_eligible':cmc_week1_eligible,'league_years':league_years})
          PY
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-schema-manifest-${{ github.run_id }}
          path: research_public_lake/corpus_snapshot.duckdb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
