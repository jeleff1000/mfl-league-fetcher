name: Classify Exact Outcome Targets

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Comma-separated runs containing exact target partitions
        required: true
        default: "31059385445,31060749133"
      target_artifact:
        description: Comma-separated exact target artifact names in the same order
        required: true
        default: "research-outcome-targets-combined-0-90000,research-outcome-targets-combined-90000-1145460"
      manifest_run_id:
        description: Run containing the source-id manifest
        required: true
        default: "31112241570"
      shards:
        description: Deterministic source-classification shards
        required: true
        default: "256"
      target_filter:
        description: ALL or DST; DST runs only the affected team-defense targets
        required: true
        default: "ALL"
      selection_run_id:
        description: Classification run used by MAP_MISSING target selection
        required: false
        default: ""
      selection_artifact:
        description: Classification artifact used by MAP_MISSING target selection
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARDS"])
          if n <= 0 or n > 256:
              raise SystemExit("shards must be between 1 and 256")
          print("shards=" + json.dumps(list(range(n))))
          PY

  classify:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private research code and historical player map
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install classifier dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4
      - name: Download exact target artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/targets
          IFS=',' read -ra RUNS <<< '${{ inputs.target_run_id }}'
          IFS=',' read -ra NAMES <<< '${{ inputs.target_artifact }}'
          test "${#RUNS[@]}" -eq "${#NAMES[@]}"
          for i in "${!RUNS[@]}"; do
            mkdir -p "input/targets/$i"
            gh run download "${RUNS[$i]}" --repo '${{ github.repository }}' \
              --name "${NAMES[$i]}" --dir "input/targets/$i"
          done
          python - <<'PY'
          import duckdb
          from pathlib import Path
          paths = sorted(str(p).replace('\\', '/') for p in Path('input/targets').glob('**/*.parquet'))
          if len(paths) != 2:
              raise SystemExit(f'expected two target partitions, found {len(paths)}: {paths}')
          sql_paths = '[' + ','.join("'" + p.replace("'", "''") + "'" for p in paths) + ']'
          con = duckdb.connect()
          con.execute(f"COPY (SELECT * FROM read_parquet({sql_paths}, union_by_name=true)) TO 'input/targets/all_targets.parquet' (FORMAT PARQUET)")
          n = con.execute("SELECT COUNT(*) FROM read_parquet('input/targets/all_targets.parquet')").fetchone()[0]
          if n != 1145460:
              raise SystemExit(f'exact target count mismatch: {n}')
          target_filter = '${{ inputs.target_filter }}'.upper()
          if target_filter not in {'ALL', 'DST', 'MAP_MISSING', 'DISCREPANCIES'} and not (target_filter.startswith('DEF-') and target_filter[4:].isdigit()):
              raise SystemExit(f'unsupported target_filter: {target_filter}')
          if target_filter == 'MAP_MISSING':
              import os, subprocess
              run_id='${{ inputs.selection_run_id }}'; artifact='${{ inputs.selection_artifact }}'
              if not run_id or not artifact: raise SystemExit('MAP_MISSING requires selection_run_id and selection_artifact')
              subprocess.run(['gh','run','download',run_id,'--repo',os.environ['GITHUB_REPOSITORY'],'--name',artifact,'--dir','input/selection'],check=True)
              paths=sorted(str(p).replace('\\','/') for p in Path('input/selection').glob('**/*.parquet'))
              if len(paths)!=1: raise SystemExit(f'expected one selection parquet, found {paths}')
              where=f"WHERE target_ordinal IN (SELECT target_ordinal FROM read_parquet('{paths[0]}') WHERE status='player_map_missing' AND NFL_player_id NOT LIKE 'DEF-%')"
          elif target_filter == 'DISCREPANCIES':
              import os, subprocess
              run_id='${{ inputs.selection_run_id }}'; artifact='${{ inputs.selection_artifact }}'
              if not run_id or not artifact: raise SystemExit('DISCREPANCIES requires selection_run_id and selection_artifact')
              subprocess.run(['gh','run','download',run_id,'--repo',os.environ['GITHUB_REPOSITORY'],'--name',artifact,'--dir','input/selection'],check=True)
              paths=sorted(str(p).replace('\\','/') for p in Path('input/selection').glob('**/*.parquet'))
              if len(paths)!=1: raise SystemExit(f'expected one selection parquet, found {paths}')
              where=f"WHERE target_ordinal IN (SELECT target_ordinal FROM read_parquet('{paths[0]}') WHERE status IN ('not_on_week_roster','rostered_not_started'))"
          else:
              where = "" if target_filter == 'ALL' else ("WHERE NFL_player_id LIKE 'DEF-%'" if target_filter == 'DST' else f"WHERE NFL_player_id = '{target_filter}'")
          con.execute(f"COPY (SELECT * FROM read_parquet('input/targets/all_targets.parquet') {where}) TO 'input/targets/selected_targets.parquet' (FORMAT PARQUET)")
          selected = con.execute("SELECT COUNT(*) FROM read_parquet('input/targets/selected_targets.parquet')").fetchone()[0]
          if not selected:
              raise SystemExit('selected target population is empty')
          print({'target_files': paths, 'target_rows': n, 'selected_rows': selected, 'target_filter': target_filter})
          PY
      - name: Download source manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/manifest
          gh run download '${{ inputs.manifest_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-outcome-source-target-manifest-${{ inputs.manifest_run_id }}' \
            --dir input/manifest
      - name: Classify exact target rows through source roster and matchup
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/classify_outcome_targets.py \
            --targets input/targets/selected_targets.parquet \
            --manifest "$(find input/manifest -name '*.json' -type f | head -1)" \
            --player-map code/ops_data/public/sleeper_nfl_player_map.parquet \
            --player-bio code/ops_data/nfl_historical/player_bio.parquet \
            --identity-overrides code/ops_data/public/sleeper_research_identity_overrides.json \
            --shard '${{ matrix.shard }}' \
            --shards '${{ inputs.shards }}' \
            --out out/outcome_target_classification_${{ matrix.shard }}.parquet
      - name: Fail fast on transport/source errors
        run: |
          python - <<'PY'
          import json, glob
          path = glob.glob('out/*.json')[0]
          report = json.load(open(path))
          bad = {k: v for k, v in report['statuses'].items() if k == 'source_error'}
          print(report)
          if bad:
              raise SystemExit(f'source errors require focused retry: {bad}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-outcome-target-classification-${{ matrix.shard }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
