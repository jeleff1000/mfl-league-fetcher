name: MFL Register Batch Campaign

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Private checkout manifest containing season-scoped MFL rows'
        required: false
        type: string
        default: corpus_seed/mfl_population_manifest_2004_2018_expanded.json
      batch_start:
        description: 'First batch number in this wave'
        required: false
        type: string
        default: '0'
      batch_count:
        description: 'Number of batches in this wave'
        required: false
        type: string
        default: '16'
      batch_size:
        description: 'Leagues processed sequentially by one runner'
        required: false
        type: string
        default: '2'
      max_parallel:
        description: 'Concurrent batch runners; each runner has its own MFL limiter'
        required: false
        type: string
        default: '20'
      cache_namespace:
        description: 'Immutable Actions cache namespace'
        required: false
        type: string
        default: mfl-population-batch-v1
      canonical_namespace:
        description: 'Immutable canonical cache namespace for campaign finalization'
        required: false
        type: string
        default: mfl-registered-2004-2018-v2
      attempt_suffix:
        description: 'Optional immutable retry suffix for a failed wave'
        required: false
        type: string
        default: ''
      continue_population:
        description: 'Dispatch the next batch wave after a successful combine'
        required: false
        type: string
        default: 'false'
      collect_all:
        description: 'Process every manifest row; ignore the per-year target stop condition'
        required: false
        type: string
        default: 'false'
      retry_rejected:
        description: 'Build the fetch queue from recorded rejected keys only'
        required: false
        type: string
        default: 'false'
      prior_state_key:
        description: 'Exact cumulative-state cache key from the preceding wave'
        required: false
        type: string
        default: ''
      prior_index_key:
        description: 'Exact immutable chunk-index cache key from the preceding wave'
        required: false
        type: string
        default: ''
      prior_index_cache_path:
        description: 'Path used when the preceding index cache was saved'
        required: false
        type: string
        default: index_state
      prior_index_artifact_run_id:
        description: 'Retained reducer run to use if the predecessor cache was evicted'
        required: false
        type: string
        default: ''
      prior_index_artifact_name:
        description: 'Artifact containing mfl_register_all_runs.json from the predecessor reducer'
        required: false
        type: string
        default: ''
      reservation_artifact_run_id:
        description: 'Planner run whose reservation artifact excludes already-assigned league-years'
        required: false
        type: string
        default: ''
      reservation_artifact_name:
        description: 'Reservation artifact name from the planner run'
        required: false
        type: string
        default: ''
      storage_mode:
        description: 'Cache storage mode: snapshot, chunked, or fetch_only'
        required: false
        type: string
        default: 'chunked'
      population_total:
        description: 'Total candidate rows in the manifest'
        required: false
        type: string
        default: '0'
      accepted_by_year:
        description: 'Cumulative accepted receipts from previous waves'
        required: false
        type: string
        default: '{}'
      target_per_year:
        description: 'Accepted target per required year'
        required: false
        type: string
        default: '10000'
      target_years:
        description: 'Comma-separated required years'
        required: false
        type: string
        default: '2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018'
      mfl_rate_limit:
        description: 'Per-runner MFL requests/minute; keep aggregate below MFL throttle'
        required: false
        type: string
        default: '6'

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      records: ${{ steps.manifest.outputs.records }}
      batches: ${{ steps.manifest.outputs.batches }}
      max_parallel: ${{ steps.manifest.outputs.max_parallel }}
    steps:
      - name: Checkout private manifest
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /corpus_seed/
            /derived/mfl_register/quota_planning/
            /scripts/extraplatform_corpus/
            /requirements.txt
      - name: Setup Python for shared worker environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore shared Python environment
        id: python_env
        uses: actions/cache/restore@v5
        with:
          path: .venv
          key: mfl-python-venv-v2-${{ runner.os }}-py311-${{ hashFiles('code/requirements.txt') }}
      - name: Build shared Python environment
        if: steps.python_env.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r code/requirements.txt
      - name: Save shared Python environment
        if: steps.python_env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .venv
          key: mfl-python-venv-v2-${{ runner.os }}-py311-${{ hashFiles('code/requirements.txt') }}
      - name: Restore canonical index for pending queue
        if: ${{ inputs.storage_mode == 'fetch_only' && inputs.prior_index_key != '' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ inputs.prior_index_cache_path }}
          key: ${{ inputs.prior_index_key }}
          fail-on-cache-miss: true
      - name: Restore canonical index from retained reducer proof
        if: ${{ inputs.storage_mode == 'fetch_only' && inputs.prior_index_key == '' && inputs.prior_index_artifact_run_id != '' && inputs.prior_index_artifact_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 240s gh run download "${{ inputs.prior_index_artifact_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.prior_index_artifact_name }}" \
            --dir canonical_index_state
          test -s canonical_index_state/mfl_register_all_runs.json
      - name: Stage pending queue index at index_state
        if: ${{ inputs.storage_mode == 'fetch_only' && (inputs.prior_index_key != '' || inputs.prior_index_artifact_run_id != '') && (inputs.prior_index_cache_path != 'index_state' || inputs.prior_index_artifact_run_id != '') }}
        run: |
          if [ -n "${{ inputs.prior_index_artifact_run_id }}" ]; then
            source="canonical_index_state/mfl_register_all_runs.json"
          else
            source="${{ inputs.prior_index_cache_path }}/mfl_register_all_runs.json"
          fi
          if [ ! -s "$source" ]; then source="${{ inputs.prior_index_cache_path }}/canonical_mfl_register_all_runs.json"; fi
          test -s "$source"
          mkdir -p index_state
          cp "$source" index_state/mfl_register_all_runs.json
      - name: Build disjoint pending manifest
        if: ${{ inputs.storage_mode == 'fetch_only' }}
        env:
          SOURCE_MANIFEST: code/${{ inputs.manifest_path }}
          INDEX_PATH: index_state/mfl_register_all_runs.json
          TARGET_PER_YEAR: ${{ inputs.target_per_year }}
          TARGET_YEARS: ${{ inputs.target_years }}
          COLLECT_ALL: ${{ inputs.collect_all }}
          RETRY_REJECTED: ${{ inputs.retry_rejected }}
        run: |
          test -s "$INDEX_PATH"
          python code/scripts/extraplatform_corpus/build_mfl_pending_manifest.py \
            --manifest "$SOURCE_MANIFEST" --index "$INDEX_PATH" \
            --output pending_manifest.json --target-per-year "$TARGET_PER_YEAR" \
            --target-years "$TARGET_YEARS" \
            $([ "$COLLECT_ALL" = true ] && echo --collect-all) \
            $([ "$RETRY_REJECTED" = true ] && echo --retry-rejected)
      - name: Apply planner reservations
        if: ${{ inputs.storage_mode == 'fetch_only' && inputs.reservation_artifact_run_id != '' && inputs.reservation_artifact_name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_COUNT: ${{ inputs.batch_count }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          gh run download "${{ inputs.reservation_artifact_run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.reservation_artifact_name }}" \
            --dir reservations
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          reserved={
              (int(row['season']), str(row['league_id']))
              for row in json.loads(Path('reservations/reserved_keys.json').read_text())['rows']
          }
          path=Path('pending_manifest.json')
          payload=json.loads(path.read_text())
          payload['rows']=[
              row for row in payload['rows']
              if (int(row['season']), str(row['league_id'])) not in reserved
          ]
          payload['reserved_excluded']=len(reserved)
          wave_path=Path('reservations/next_wave_plan.json')
          if wave_path.is_file():
              wave=json.loads(wave_path.read_text())
              planned=wave.get('planned_league_years',[])
              start=int(os.environ['BATCH_START'])*int(os.environ['BATCH_SIZE'])
              limit=int(os.environ['BATCH_COUNT'])*int(os.environ['BATCH_SIZE'])
              payload['rows']=planned[start:start+limit]
              payload['planned_wave_slice']={'start':start,'limit':limit,'total':len(planned)}
          path.write_text(json.dumps(payload, indent=2)+'\n')
          print(json.dumps({'reserved_excluded':len(reserved),'remaining':len(payload['rows']),'planned_wave_slice':payload.get('planned_wave_slice')},sort_keys=True))
      - name: Publish pending manifest to ingest runners
        if: ${{ inputs.storage_mode == 'fetch_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: mfl-pending-manifest-${{ github.run_id }}
          retention-days: 30
          path: pending_manifest.json
      - name: Stage selected manifest for ingest runners
        run: |
          mkdir -p wave_manifest
          if [ "${{ inputs.storage_mode }}" = "fetch_only" ]; then
            cp pending_manifest.json wave_manifest/wave_manifest.json
          else
            cp "code/${{ inputs.manifest_path }}" wave_manifest/wave_manifest.json
          fi
          test -s wave_manifest/wave_manifest.json
      - name: Publish selected manifest to ingest runners
        uses: actions/upload-artifact@v4
        with:
          name: mfl-wave-manifest-${{ github.run_id }}
          retention-days: 30
          path: wave_manifest/wave_manifest.json
      - name: Select wave batches
        id: manifest
        env:
          MANIFEST: ${{ inputs.storage_mode == 'fetch_only' && 'pending_manifest.json' || format('code/{0}', inputs.manifest_path) }}
          START: ${{ inputs.batch_start }}
          COUNT: ${{ inputs.batch_count }}
          SIZE: ${{ inputs.batch_size }}
          MAX: ${{ inputs.max_parallel }}
          STORAGE_MODE: ${{ inputs.storage_mode }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d=json.load(open(os.environ['MANIFEST'], encoding='utf-8'))
          rows=d.get('rows', d.get('leagues', d))
          start=int(os.environ['START']); count=int(os.environ['COUNT']); size=int(os.environ['SIZE'])
          if os.environ['STORAGE_MODE'] == 'fetch_only':
              # Planner reservations already narrowed this manifest to this campaign slice.
              selected=rows
              batch_start=0
          else:
              end=min(len(rows), (start+count)*size)
              selected=rows[start*size:end]
              batch_start=start
          batches=list(range(batch_start, batch_start+((len(selected)+size-1)//size)))
          # Chunked combines read the checked-out manifest directly. Avoid
          # serializing thousands of records into a GitHub job output.
          if os.environ['STORAGE_MODE'] in {'chunked', 'fetch_only'}:
              print('records=[]')
          else:
              print('records='+json.dumps(selected,separators=(',',':')))
          print('batches='+json.dumps(batches,separators=(',',':')))
          print('max_parallel='+str(min(max(1,int(os.environ['MAX'])),len(batches))))
          PY
      - name: Write durable batch plan
        env:
          MANIFEST: ${{ inputs.storage_mode == 'fetch_only' && 'pending_manifest.json' || format('code/{0}', inputs.manifest_path) }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_COUNT: ${{ inputs.batch_count }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
          ATTEMPT_SUFFIX: ${{ inputs.attempt_suffix }}
          STORAGE_MODE: ${{ inputs.storage_mode }}
          PRIOR_INDEX_KEY: ${{ inputs.prior_index_key }}
          TARGET_YEARS: ${{ inputs.target_years }}
          TARGET_PER_YEAR: ${{ inputs.target_per_year }}
          COLLECT_ALL: ${{ inputs.collect_all }}
          RETRY_REJECTED: ${{ inputs.retry_rejected }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.load(open(os.environ['MANIFEST'], encoding='utf-8'))
          rows=rows.get('rows', rows.get('leagues', rows))
          start=int(os.environ['BATCH_START']); count=int(os.environ['BATCH_COUNT']); size=int(os.environ['BATCH_SIZE'])
          if os.environ['STORAGE_MODE'] == 'fetch_only':
              selected=rows
          else:
              selected=rows[start*size:min(len(rows),(start+count)*size)]
          ns=os.environ['CACHE_NAMESPACE']; suffix=os.environ['ATTEMPT_SUFFIX']
          plan={
            'schema_version':'mfl_batch_plan_v1',
            'source_run_id':os.environ['SOURCE_RUN_ID'],
            'created_at':os.environ.get('GITHUB_RUN_ATTEMPT',''),
            'storage_mode':os.environ['STORAGE_MODE'],
            'batch_start':start,'batch_count':count,'batch_size':size,
            'max_parallel':int(os.environ['MAX_PARALLEL']),
            'cache_namespace':ns,'attempt_suffix':suffix,
            'prior_index_key':os.environ['PRIOR_INDEX_KEY'],
            'target_years':[x.strip() for x in os.environ['TARGET_YEARS'].split(',') if x.strip()],
            'target_per_year':int(os.environ['TARGET_PER_YEAR']),
            'collect_all':os.environ['COLLECT_ALL'].lower()=='true',
            'retry_rejected':os.environ['RETRY_REJECTED'].lower()=='true',
            'planned_league_years':[{'season':int(r['season']),'league_id':str(r['league_id'])} for r in selected],
            'source_cache_keys':{
              'chunk':f'{ns}-chunk-{start}-{count}{suffix}',
              'index':f'{ns}-index-{start}-{count}{suffix}',
              'research_overlay':f'{ns}-research-overlay-{start}-{count}{suffix}',
            },
          }
          Path('batch_plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True),encoding='utf-8')
          PY
      - name: Publish durable batch plan
        uses: actions/upload-artifact@v4
        with:
          name: mfl-batch-plan-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: ignore
          path: batch_plan.json

  ingest:
    needs: prepare
    # Individual league failures are recorded in batch receipts; they must not
    # prevent combine from publishing the successful league databases.
    continue-on-error: true
    runs-on: ubuntu-latest
    # A single unresponsive MFL league must not hold the entire campaign for
    # hours.  Batch receipts are uploaded with `if: always()`, and combine is
    # also guarded with `if: always()`, so timed-out runners remain partial
    # failures while successful leagues are still merged.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        batch: ${{ fromJSON(needs.prepare.outputs.batches) }}
    env:
      CORPUS_MODE: '1'
      MFL_RATE_LIMIT_PER_MIN: ${{ inputs.mfl_rate_limit }}
      PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
      OPS_CACHE_PATH: ${{ github.workspace }}/corpus_dependencies/ops_cache.duckdb
      DRAFT_GLOBAL_SOURCE_PATH: ${{ github.workspace }}/corpus_dependencies/draft_global_source.parquet
      CORPUS_DEPENDENCY_DIR: ${{ github.workspace }}/corpus_dependencies
      CORPUS_DEPENDENCY_KEY: corpus-dependencies-v1-Linux-20260717
      MFL_PLAYER_CACHE_KEY: ${{ inputs.cache_namespace }}-players-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v5
        with:
          path: worker
      - name: Checkout private pipeline
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /corpus_seed/
            /fantasy_football_data_scripts/
            /scripts/extraplatform_corpus/
            /scripts/extraplatform_corpus/merge_mfl_saved_chunk.py
            /scripts/research_cohorts/build_mfl_research_overlay.py
            /requirements.txt
            /pyproject.toml
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore prepared Python environment
        uses: actions/cache/restore@v5
        with:
          path: .venv
          key: mfl-python-venv-v2-${{ runner.os }}-py311-${{ hashFiles('code/requirements.txt') }}
          fail-on-cache-miss: true
      - name: Activate prepared Python environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify prepared Python environment
        shell: bash
        run: |
          VENV_PY=.venv/bin/python3.11
          if [ ! -x "$VENV_PY" ]; then
            rm -rf .venv
            python3.11 -m venv .venv
          fi
          if ! "$VENV_PY" -c 'import pandas, duckdb'; then
            "$VENV_PY" -m pip install -r code/requirements.txt
          fi
          "$VENV_PY" -c 'import pandas, duckdb'

      - name: Restore corpus dependencies
        id: deps
        uses: actions/cache/restore@v5
        with:
          path: corpus_dependencies
          key: corpus-dependencies-v1-Linux-20260717
      - name: Require offline dependency cache
        if: steps.deps.outputs.cache-hit != 'true'
        run: exit 1
      - name: Restore MFL player catalog cache
        uses: actions/cache/restore@v5
        with:
          path: mfl_player_cache
          key: ${{ env.MFL_PLAYER_CACHE_KEY }}
          restore-keys: |
            ${{ inputs.cache_namespace }}-players-
      - name: Download selected work manifest
        uses: actions/download-artifact@v4
        with:
          name: mfl-wave-manifest-${{ github.run_id }}
          path: pending_work
      - name: Run validated MFL batch
        env:
          MANIFEST: pending_work/wave_manifest.json
          BATCH_START: ${{ inputs.batch_start }}
          BATCH: ${{ matrix.batch }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          MFL_PLAYERS_CACHE_DIR: ${{ github.workspace }}/mfl_player_cache
        run: |
          mkdir -p batch_output
            # Keep a slow/broken league from holding an entire bulk chunk hostage.
            # Its receipt is retained for the targeted retry queue on the next pass.
            timeout --signal=TERM --kill-after=30s 600s .venv/bin/python3.11 code/scripts/extraplatform_corpus/mfl_register_batch.py \
            --manifest "$MANIFEST" \
            --offset "$(( (BATCH - BATCH_START) * BATCH_SIZE + BATCH_START * BATCH_SIZE ))" \
            --limit "$BATCH_SIZE" \
            --output batch_output \
            --code-root code
      - name: Upload batch receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfl-register-batch-${{ matrix.batch }}
          # These are same-run transport inputs for `combine`, which has a
          # 90-minute timeout. The immutable chunk snapshot below is the
          # durable, 90-day recovery artifact.
          retention-days: 1
          path: |
            batch_output/*/league.duckdb
            batch_output/*/receipt.json
            batch_output/*/import.log
            batch_output/batch_receipt.json
            mfl_player_cache

  combine:
    needs: [prepare, ingest]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for batch artifacts to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Matrix uploads can become visible after the matrix reports complete.
          # Wait for the artifact API before invoking download-artifact.
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("mfl-register-batch-"))] | length' 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "Found ${count} batch artifacts on attempt ${attempt}"
              exit 0
            fi
            echo "Batch artifacts not visible yet (attempt ${attempt}/24); waiting 5s"
            sleep 5
          done
          echo "No batch artifacts became visible before timeout; combine will report the empty wave"

      - name: Download batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mfl-register-batch-*
          path: receipts
          merge-multiple: false
      - name: Checkout canonical schema
        uses: actions/checkout@v5
        with:
          path: code
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/multi_league/core/canonical_player.py
            /scripts/extraplatform_corpus/merge_mfl_chunk.py
            /scripts/extraplatform_corpus/merge_mfl_saved_chunk.py
            /scripts/research_cohorts/build_mfl_research_overlay.py
            /corpus_seed/
            /requirements.txt
      - name: Restore prior MFL player catalog cache
        uses: actions/cache/restore@v5
        with:
          path: mfl_player_cache
          key: ${{ inputs.cache_namespace }}-players-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          restore-keys: |
            ${{ inputs.cache_namespace }}-players-
      - name: Restore prior cumulative register state
        if: ${{ inputs.storage_mode == 'snapshot' && inputs.batch_start != '0' && inputs.prior_state_key != '' }}
        uses: actions/cache/restore@v5
        with:
          path: prior_state
          key: ${{ inputs.prior_state_key }}
      - name: Restore prior chunk index
        if: ${{ (inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only') && inputs.prior_index_key != '' }}
        uses: actions/cache/restore@v5
        with:
          # The cache version includes the path.  Restore to the same path
          # that is used by the save step, then let the merger read it there.
          path: ${{ inputs.prior_index_cache_path }}
          key: ${{ inputs.prior_index_key }}
          fail-on-cache-miss: true
      - name: Stage reducer index at index_state
        if: ${{ (inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only') && inputs.prior_index_key != '' && inputs.prior_index_cache_path != 'index_state' }}
        run: |
          source="${{ inputs.prior_index_cache_path }}/mfl_register_all_runs.json"
          if [ ! -s "$source" ]; then source="${{ inputs.prior_index_cache_path }}/canonical_mfl_register_all_runs.json"; fi
          test -s "$source"
          mkdir -p index_state
          cp "$source" index_state/mfl_register_all_runs.json
      - name: Stage prior canonical index for finalizer
        if: ${{ (inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only') && inputs.prior_index_key != '' }}
        shell: bash
        run: |
          test -s index_state/mfl_register_all_runs.json
          mkdir -p prior_canonical_index
          cp index_state/mfl_register_all_runs.json prior_canonical_index/mfl_register_all_runs.json
      - name: Download pending work manifest for combine
        if: ${{ inputs.storage_mode == 'fetch_only' }}
        uses: actions/download-artifact@v4
        with:
          name: mfl-pending-manifest-${{ github.run_id }}
          path: pending_work
      - name: Merge player catalogs from ingest runners
        shell: bash
        run: |
          mkdir -p receipts mfl_player_cache
          find receipts -type f -name 'mfl_players_*.json' -print0 | while IFS= read -r -d '' src; do
            name="$(basename "$src")"
            test -s "mfl_player_cache/$name" || cp "$src" "mfl_player_cache/$name"
          done
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore prepared Python environment
        id: combine_python_env
        uses: actions/cache/restore@v5
        with:
          path: .venv
          key: mfl-python-venv-v2-${{ runner.os }}-py311-${{ hashFiles('code/requirements.txt') }}
          fail-on-cache-miss: true
      - name: Activate and verify cached Python environment
        shell: bash
        run: |
          test -x .venv/bin/python3.11
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python3.11 -c 'import duckdb, pandas'
      - name: Build canonical batch snapshot
        if: ${{ inputs.storage_mode == 'snapshot' }}
        env:
          EXPECTED: ${{ needs.prepare.outputs.records }}
          ACCEPTED_BY_YEAR: ${{ inputs.accepted_by_year }}
          TARGET_PER_YEAR: ${{ inputs.target_per_year }}
          TARGET_YEARS: ${{ inputs.target_years }}
          COLLECT_ALL: ${{ inputs.collect_all }}
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          python3 - <<'PY'
          import json, pathlib, duckdb, os
          from multi_league.core.canonical_player import PLAYER_FANTASY_COLUMNS
          expected=json.loads(os.environ['EXPECTED']); root=pathlib.Path('receipts')
          pairs=[]; receipts=[]
          for receipt_path in sorted(root.rglob('receipt.json')):
              r=json.loads(receipt_path.read_text(encoding='utf-8')); receipts.append(r)
              pairs.append((receipt_path.parent/'league.duckdb',r))
          keys={(int(r['season']),str(r['league_id'])) for r in expected}
          got={(int(r['season']),str(r['league_id'])) for r in receipts}
          if not got: raise SystemExit('batch wave produced no valid receipts')
          prior_root=pathlib.Path('prior_state')
          prior_json={}
          prior_path=prior_root/'mfl_register_all_runs.json'
          prior_db=prior_root/'mfl_register_snapshot.duckdb'
          if prior_path.is_file():
              prior_json=json.loads(prior_path.read_text(encoding='utf-8'))
          prior_leagues=list(prior_json.get('leagues', []))
          prior_rejected=list(prior_json.get('rejected', []))
          expected_by_key={(int(r['season']),str(r['league_id'])):r for r in expected}
          prior_by_key={(int(r['season']),str(r['league_id'])):r for r in prior_leagues}
          current_by_key={(int(r['season']),str(r['league_id'])):r for r in receipts}
          if len(current_by_key) != len(receipts):
              raise SystemExit('duplicate successful receipt keys in batch')
          for key, old in prior_by_key.items():
              new=current_by_key.get(key)
              if new is not None and old.get('lineage_id') and new.get('lineage_id') and old['lineage_id'] != new['lineage_id']:
                  raise SystemExit(f'lineage changed for {key}: {old["lineage_id"]} -> {new["lineage_id"]}')
          for key, receipt in current_by_key.items():
              manifest=expected_by_key.get(key)
              if manifest is None:
                  raise SystemExit(f'receipt not present in manifest: {key}')
              if manifest.get('lineage_id') and receipt.get('lineage_id') != manifest['lineage_id']:
                  raise SystemExit(f'receipt lineage mismatch for {key}')
          print(f'validated {len(got)}/{len(keys)} candidates; rejected {len(keys-got)}')
          prior={str(k):int(v) for k,v in json.loads(os.environ.get('ACCEPTED_BY_YEAR','{}') or '{}').items()}
          for year,count in __import__('collections').Counter(int(r['season']) for r in receipts).items():
              prior[str(year)]=prior.get(str(year),0)+count
          target=int(os.environ.get('TARGET_PER_YEAR','10000'))
          target_years=[y.strip() for y in os.environ.get('TARGET_YEARS','').split(',') if y.strip()]
          collect_all=os.environ.get('COLLECT_ALL','false').lower() == 'true'
          complete_targets=(not collect_all) and bool(target_years) and all(prior.get(y,0)>=target for y in target_years)
          schema_by_table={}
          before_rows={}
          added_rows={table:0 for table in ('league_settings','matchup','player_fantasy')}
          if prior_db.is_file():
              prior_read=duckdb.connect(str(prior_db), read_only=True)
              for table in ('league_settings','matchup','player_fantasy'):
                  if prior_read.execute("select count(*) from information_schema.tables where table_schema='main' and table_name=?",[table]).fetchone()[0]:
                      schema_by_table[table]=tuple(r[0] for r in prior_read.execute(f'describe "{table}"').fetchall())
                      before_rows[table]=int(prior_read.execute(f'select count(*) from "{table}"').fetchone()[0])
              prior_read.close()
          out=duckdb.connect('mfl_register_snapshot.duckdb')
          if prior_db.is_file():
              out.execute(f"ATTACH '{prior_db.as_posix()}' AS prior (READ_ONLY)")
              for table in ('league_settings','matchup','player_fantasy'):
                  if out.execute("select count(*) from information_schema.tables where table_catalog='prior' and table_schema='main' and table_name=?",[table]).fetchone()[0]:
                      out.execute(f'create table "{table}" as select * from prior."{table}"')
              out.execute('DETACH prior')
          for db,r in pairs:
              out.execute(f"ATTACH '{db.as_posix()}' AS src (READ_ONLY)")
              for table in ('league_settings','matchup','player_fantasy'):
                  if not out.execute("select count(*) from information_schema.tables where table_catalog='src' and table_schema='public' and table_name=?",[table]).fetchone()[0]: continue
                  source_schema=tuple(x[0] for x in out.execute(f'describe src.public."{table}"').fetchall())
                  if table in schema_by_table and schema_by_table[table] != source_schema:
                      raise SystemExit(f'cache schema changed for {table}')
                  schema_by_table.setdefault(table, source_schema)
                  added_rows[table] += int(out.execute(f'select count(*) from src.public."{table}" where year={int(r["season"])}').fetchone()[0])
                  if not out.execute("select count(*) from information_schema.tables where table_schema='main' and table_name=?",[table]).fetchone()[0]:
                      out.execute(f'create table "{table}" as select * from src.public."{table}" where year={int(r["season"])}')
                  else: out.execute(f'insert into "{table}" select * from src.public."{table}" where year={int(r["season"])}')
              out.execute('DETACH src')
          out.close()
          current_rejected=[{'season':y,'league_id':lid} for y,lid in sorted(keys-got)]
          all_leagues=prior_leagues + receipts
          all_rejected=prior_rejected + current_rejected
          all_by_key={(int(r['season']),str(r['league_id'])):r for r in all_leagues}
          if len(all_by_key) != len(all_leagues):
              raise SystemExit('duplicate league-year key in cumulative cache')
          if not set(prior_by_key).issubset(all_by_key):
              raise SystemExit('prior cache rows were removed')
          if set(prior_by_key) & set(current_by_key) and not set(prior_by_key).isdisjoint(current_by_key):
              raise SystemExit('batch attempted to append an existing league-year key')
          final_read=duckdb.connect('mfl_register_snapshot.duckdb', read_only=True)
          final_rows={table:int(final_read.execute(f'select count(*) from "{table}"').fetchone()[0]) for table in added_rows if final_read.execute("select count(*) from information_schema.tables where table_schema='main' and table_name=?",[table]).fetchone()[0]}
          final_read.close()
          for table, added in added_rows.items():
              if final_rows.get(table,0) - before_rows.get(table,0) != added:
                  raise SystemExit(f'cache append row-count mismatch for {table}')
          if set(schema_by_table.get('player_fantasy',())) != set(PLAYER_FANTASY_COLUMNS):
              raise SystemExit('player_fantasy cache schema is not canonical')
          pathlib.Path('cache_append_proof.json').write_text(json.dumps({'schema_unchanged':True,'prior_rows':before_rows,'added_rows':added_rows,'final_rows':final_rows,'prior_league_count':len(prior_leagues),'added_league_count':len(receipts),'final_league_count':len(all_leagues),'prior_rows_preserved':set(prior_by_key).issubset(all_by_key),'new_lineage':False,'duplicate_league_year_keys':False},indent=2,sort_keys=True),encoding='utf-8')
          pathlib.Path('mfl_register_all_runs.json').write_text(json.dumps({'schema_version':'mfl_register_results_v1','expected_count':int(prior_json.get('expected_count',0))+len(keys),'league_count':len(all_leagues),'rejected_count':len(all_rejected),'rejected':all_rejected,'accepted_by_year':prior,'target_per_year':target,'target_years':target_years,'complete_targets':complete_targets,'collect_all':collect_all,'leagues':sorted(all_leagues,key=lambda r:(int(r['season']),str(r['league_id'])))},indent=2,sort_keys=True),encoding='utf-8')
          PY
      - name: Build immutable canonical cache chunk
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        env:
          EXPECTED_PATH: ${{ github.workspace }}/${{ inputs.storage_mode == 'fetch_only' && 'pending_work/pending_manifest.json' || format('code/{0}', inputs.manifest_path) }}
          CHUNK_KEY: ${{ inputs.cache_namespace }}-chunk-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          python3 code/scripts/extraplatform_corpus/merge_mfl_chunk.py \
            --receipts receipts \
            --expected "$EXPECTED_PATH" \
            --prior-index index_state/mfl_register_all_runs.json \
            --output-db mfl_register_chunk.duckdb \
            --output-index mfl_register_all_runs.json \
            --proof cache_append_proof.json \
            --chunk-key "$CHUNK_KEY"
      - name: Build exact research-lake source overlay
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        run: |
          python3 code/scripts/research_cohorts/build_mfl_research_overlay.py \
            --chunk mfl_register_chunk.duckdb \
            --output mfl_research_overlay.duckdb
          python3 - <<'PY'
          import json, duckdb
          expected={
            'league_settings': ['db_name','year','num_teams','is_dynasty','max_keepers','sleeper_best_ball','waiver_budget','waiver_type','roster_QB','roster_RB','roster_WR','roster_TE','roster_FLX','roster_SUPER_FLEX','roster_IDP','roster_DL','roster_LB','roster_DB','roster_DB_LB','roster_DL_LB','scoring_rec','scoring_pass_td','playoff_start_week','playoff_teams','regular_season_weeks','end_week','has_multiweek_championship','roster_K','roster_DEF','roster_BN','roster_TAXI','roster_IR','platform','league_key'],
            'player_fantasy': ['db_name','year','week','NFL_player_id','player','position','fantasy_position','platform','team_key','team_name','nfl_team_api','yahoo_player_id','sleeper_player_id','espn_player_id','fleaflicker_player_id','mfl_player_id','is_started','is_rostered','fantasy_points','win','champion','clutch_equity','manager_lamar','manager','team_points','final_playoff_seed','is_playoffs','made_po_bf','is_playoffs_bf','made_po','has_po_signal'],
            'matchup': ['db_name','year','week','manager','franchise_id','opponent','team_points','opponent_points','win','loss','tie','is_playoffs','playoff_seed','final_playoff_seed','champion','is_championship','p_champ'],
          }
          c=duckdb.connect('mfl_research_overlay.duckdb',read_only=True); rows={}; schemas={}
          for table, cols in expected.items():
              actual=[r[0] for r in c.execute(f'DESCRIBE "{table}"').fetchall()]
              if actual != cols: raise SystemExit(f'{table} research schema mismatch: {actual}')
              rows[table]=c.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]; schemas[table]=actual
              if rows[table] <= 0: raise SystemExit(f'{table} overlay is empty')
          json.dump({'schema_unchanged':True,'rows':rows,'columns':schemas,'new_lineage':False},open('mfl_research_overlay_proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'rows':rows,'schema_unchanged':True},sort_keys=True)); c.close()
          PY
      - name: Finalize canonical successor cache
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        env:
          PRIOR_INDEX_KEY: ${{ inputs.prior_index_key }}
          CANONICAL_CHUNK_KEY: ${{ inputs.canonical_namespace }}-chunk-campaign-${{ github.run_id }}
        run: |
