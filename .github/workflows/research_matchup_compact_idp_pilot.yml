name: Research matchup compact IDP pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  idp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and gate Myles Garrett compact IDP rows
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import (
              _IDP_SOURCE_POSITIONS,
              materialize_season_bracket_grade_position_batch,
              materialize_season_compact_outer_rows,
              materialize_season_core_cohort_position_batch,
              materialize_weekly_core_cohort_position_batch,
          )

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          ids = c.execute("""
            SELECT DISTINCT CAST(NFL_player_id AS VARCHAR)
            FROM ops.nfl_historical.nfl_player_stats_all
            WHERE CAST(year AS INTEGER)=2025 AND LOWER(TRIM(CAST(player AS VARCHAR)))='myles garrett'
          """).fetchall()
          assert len(ids) == 1, ids
          myles_id = ids[0][0]
          positions = c.execute("""
            SELECT DISTINCT CAST(position AS VARCHAR)
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER)=2025 AND CAST(NFL_player_id AS VARCHAR)=?
          """, [myles_id]).fetchall()
          assert positions, (myles_id, positions)
          assert all(position[0] in _IDP_SOURCE_POSITIONS for position in positions), (myles_id, positions)
          materialize_weekly_core_cohort_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='idp_weekly', year=2025, position='IDP', split_threshold=150,
              player_id=myles_id,
          )
          materialize_season_core_cohort_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='myles_core', year=2025, position='IDP', split_threshold=50, player_id=myles_id,
          )
          materialize_season_bracket_grade_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='myles_grade', year=2025, position='IDP', split_threshold=50, player_id=myles_id,
          )
          materialize_season_compact_outer_rows(
              c, core_outer_table='myles_core', grade_outer_table='myles_grade', output_table='myles_season',
          )
          weekly = c.execute("""
            SELECT COUNT(*), MIN(week), MAX(week)
            FROM idp_weekly WHERE NFL_player_id=?
          """, [myles_id]).fetchone()
          core = c.execute("""
            SELECT cell.eligible_leagues, cell.rostered_league_weeks, cell.started_league_weeks,
              cell.valid_started_outcomes, cell.active_weeks, cell.inactive_weeks
            FROM myles_season, UNNEST(cohort_cells) AS u(cell)
            WHERE cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL'
              AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'
          """).fetchone()
          grade = c.execute("""
            SELECT cell.eligible_leagues, cell.playoff_leagues, cell.champ_leagues
            FROM myles_season, UNNEST(grade_cells) AS u(cell)
            WHERE cell.q_playoff_teams='ALL'
          """).fetchone()
          assert weekly[0] > 0 and weekly[1] >= 1 and weekly[2] <= 18, weekly
          assert core is not None and grade is not None
          assert 0 < core[0] and 0 <= core[3] <= core[2] <= core[1], core
          assert 0 <= grade[2] <= grade[1] <= grade[0], grade
          print('myles_idp_2025=' + json.dumps({'id': myles_id, 'weekly': weekly, 'core': core, 'grade': grade}))
          PY
