name: Refresh League Cache

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: "Completed league database name to revalidate and warm"
        required: true
        type: string
      import_mode:
        description: "Warm the quick or full public route surface"
        required: true
        default: full
        type: choice
        options:
          - quick
          - full
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
    steps:
      - name: Checkout importer
        uses: actions/checkout@v5
        with:
          path: yahoo_oauth

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Revalidate and warm Vercel cache
        working-directory: yahoo_oauth
        run: >-
          python scripts/warm_vercel_cache.py
          --db "${{ inputs.database_name }}"
          --secret "${REVALIDATION_SECRET}"
          --site-url "https://www.leaguehistory.app"
          --mode "${{ inputs.import_mode }}"
          --strategy expire
          --jitter-seconds 0
          --strict
          --verify-hot
