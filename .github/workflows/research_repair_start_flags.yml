name: Repair Research Starter Flags

on:
  workflow_dispatch:
    inputs:
      base_cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      output_cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-start-flags-refresh

permissions:
  actions: write
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repair only missing starter flags
        run: |
          python -m pip install duckdb==1.5.1
          python - <<'PY'
          import duckdb
          con = duckdb.connect('research_public_lake/corpus_snapshot.duckdb')
          before = con.execute('SELECT COUNT(*) FROM public.player_fantasy WHERE is_started IS NULL').fetchone()[0]
          con.execute("""
            UPDATE public.player_fantasy
            SET is_started = CASE
              WHEN fantasy_position IS NULL THEN NULL
              WHEN UPPER(TRIM(CAST(fantasy_position AS VARCHAR)))
                   IN ('BN','IR','TAXI','BENCH','RESERVE','FA','WAIVERS','') THEN 0
              ELSE 1 END
            WHERE is_started IS NULL AND fantasy_position IS NOT NULL
          """)
          after = con.execute('SELECT COUNT(*) FROM public.player_fantasy WHERE is_started IS NULL').fetchone()[0]
          print(f'starter_nulls_before={before:,} starter_nulls_after={after:,}')
          print(con.execute('''SELECT UPPER(TRIM(CAST(fantasy_position AS VARCHAR))) slot,
              is_started, COUNT(*) n FROM public.player_fantasy
              GROUP BY 1,2 ORDER BY 1,2''').fetchall())
          con.close()
          PY
      - name: Validate repaired public lake
        run: |
          python -m pip install pyarrow==15.0.2
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      - name: Verify repaired cache
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          echo "saved=research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613"
