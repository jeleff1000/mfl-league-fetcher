          else
            cp mfl_register_chunk.duckdb canonical_mfl_register_chunk.duckdb
            cp mfl_register_all_runs.json canonical_mfl_register_all_runs.json
            cp cache_append_proof.json canonical_append_proof.json
          fi
          python3 - <<'PY'
          import json
          proof=json.load(open('canonical_append_proof.json', encoding='utf-8'))
          required={'schema_unchanged':True,'prior_rows_preserved':True,'new_lineage':False,'duplicate_league_year_keys':False}
          for key,value in required.items():
              if proof.get(key) != value:
