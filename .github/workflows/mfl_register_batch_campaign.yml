      - name: Build compact accepted league-year receipt
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          register=json.loads(Path('mfl_register_all_runs.json').read_text(encoding='utf-8'))
          rows=[]
          seen=set()
          for item in register.get('leagues', []):
              key=(int(item['season']), str(item['league_id']))
              if key in seen:
                  continue
              seen.add(key)
              rows.append({'season':key[0], 'league_id':key[1]})
          if not rows:
              raise SystemExit('accepted league-year receipt is empty')
          Path('accepted_keys.json').write_text(json.dumps({
              'schema_version':'mfl_accepted_keys_v1',
              'source_run_id':int('${{ github.run_id }}'),
              'rows':sorted(rows, key=lambda row:(row['season'], row['league_id'])),
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps({'accepted_keys':len(rows)}, sort_keys=True))
          PY

      - name: Upload compact accepted league-year receipt
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/upload-artifact@v4
        with:
          name: mfl-accepted-keys-${{ github.run_id }}
          retention-days: 90
          path: accepted_keys.json

      - name: Purge consumed batch transport artifacts
        # `combine` has already downloaded every batch receipt and published
        # the durable snapshot/chunk. Do not retain the matrix transport
        # copies in Actions storage after that point.
        if: ${{ inputs.storage_mode == 'snapshot' || inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("mfl-register-batch-")) | .id' |
          while read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
          done
  verify_cache:
    needs: [combine]
    if: ${{ always() && needs.combine.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore exact saved cumulative cache
        if: ${{ inputs.storage_mode == 'snapshot' }}
        uses: actions/cache/restore@v5
        with:
          path: prior_state
          key: ${{ inputs.cache_namespace }}-state-${{ inputs.batch_start }}-${{ inputs.batch_count }}
