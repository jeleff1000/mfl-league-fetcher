name: Live Ops Runner Timing Probe
run-name: Live Ops clock probe ${{ github.event.client_payload.dispatch_key || inputs.dispatch_key }}

on:
  repository_dispatch:
    types: [live-nfl-ops-clock-probe]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner labels as a JSON array
        default: '["ubuntu-latest"]'
        type: string
      dispatch_key:
        description: Probe correlation key
        required: true
        type: string
      scheduled_for:
        description: Intended clock trigger time
        required: true
        type: string

permissions: {}

jobs:
  timestamp:
    runs-on: ${{ fromJSON(inputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 1
    steps:
      - name: Record actual runner execution
        env:
          DISPATCH_KEY: ${{ github.event.client_payload.dispatch_key || inputs.dispatch_key }}
          SCHEDULED_FOR: ${{ github.event.client_payload.scheduled_for || inputs.scheduled_for }}
          DISPATCHED_AT: ${{ github.event.client_payload.dispatched_at || '' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          started = datetime.now(timezone.utc)
          due = datetime.fromisoformat(os.environ['SCHEDULED_FOR'].replace('Z', '+00:00'))
          receipt = {
              'dispatch_key': os.environ['DISPATCH_KEY'],
              'scheduled_for': due.isoformat(),
              'dispatched_at': os.environ['DISPATCHED_AT'],
              'runner_started_at': started.isoformat(),
              'start_latency_seconds': round((started - due).total_seconds(), 3),
              'runner_name': os.environ['RUNNER_NAME'],
              'database_access': False,
          }
          print(json.dumps(receipt))
          with open('clock-probe-receipt.json', 'w') as handle:
              json.dump(receipt, handle)
          assert 0 <= receipt['start_latency_seconds'] <= 60, receipt
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-probe-receipt
          path: clock-probe-receipt.json
          retention-days: 7
