name: Research matchup RB compact read-only pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and validate compact RB 2025 outer rows
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          started=$(date +%s)
          python code/scripts/research_cohorts/build_compact_matchup_bundle.py --snapshot research_public_lake/corpus_snapshot.duckdb --ops-cache research_public_lake/ops_cache.duckdb --output /tmp/rb_2025_compact.duckdb --year 2025 --position RB
          python - <<'PY'
          import duckdb,json
          c=duckdb.connect('/tmp/rb_2025_compact.duckdb',read_only=True)
          weekly=c.execute('SELECT COUNT(*),SUM(array_length(cohort_cells)) FROM research_matchup_compact_weekly').fetchone()
          season=c.execute('SELECT COUNT(*),SUM(array_length(cohort_cells)),SUM(array_length(grade_cells)) FROM research_matchup_compact_season').fetchone()
          duplicates=c.execute("SELECT COUNT(*) FROM (SELECT NFL_player_id,year,week FROM research_matchup_compact_weekly GROUP BY 1,2,3 HAVING COUNT(*)<>1)").fetchone()[0]
          cmc=c.execute("SELECT cell.eligible_leagues,cell.rostered_league_weeks,cell.eligible_league_weeks,cell.started_league_weeks,cell.valid_started_outcomes,cell.win_equivalent,cell.active_weeks,cell.inactive_weeks FROM research_matchup_compact_season,UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
          assert weekly[0] > 100 and season[0] > 100 and duplicates==0,(weekly,season,duplicates)
          assert cmc == (9980,157712,158687,155272,149661,91505.0,17,0),cmc
          print('rb_2025_compact_readonly_pilot='+json.dumps({'weekly_outer_rows':weekly[0],'weekly_cells':weekly[1],'season_outer_rows':season[0],'season_cells':season[1],'grade_cells':season[2],'cmc_full_pool':cmc}))
          PY
          echo "compact_rb_seconds=$(( $(date +%s) - started ))"
