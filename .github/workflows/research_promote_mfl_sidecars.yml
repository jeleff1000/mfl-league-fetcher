name: Promote validated MFL sidecars into canonical research cache

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed MFL rescue run whose successful artifacts are promoted
        required: true
        default: "31218764865"
permissions:
  contents: read
  actions: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  CANONICAL_RELEASE_TAG: research-public-lake-v4-legacy-signal-rescue-canonical

concurrency:
  group: canonical-research-cache-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private research code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: false
      - name: Restore canonical base and prefer the verified corpus-only asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s research_public_lake/corpus_snapshot.duckdb ]; then
            rm -rf research_public_lake release_parts
            mkdir -p research_public_lake release_parts
            gh release download "$CANONICAL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'research-public-lake.tar.part-*' --dir release_parts
            cat release_parts/research-public-lake.tar.part-* | tar -xf - -C research_public_lake
          fi
          mkdir -p corpus_parts
          if gh release download "$CANONICAL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'corpus_snapshot.duckdb.part-*' --dir corpus_parts; then
            test -n "$(find corpus_parts -name 'corpus_snapshot.duckdb.part-*' -print -quit)"
            gh release download "$CANONICAL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'corpus_snapshot.duckdb.sha256' --dir corpus_parts
            cat corpus_parts/corpus_snapshot.duckdb.part-* > research_public_lake/corpus_snapshot.duckdb
            (cd research_public_lake && sha256sum -c ../corpus_parts/corpus_snapshot.duckdb.sha256)
            echo "[corpus] restored verified corpus-only release asset"
          else
            echo "[corpus] corpus-only release asset is absent; using the legacy bundle corpus"
          fi
          test -s research_public_lake/corpus_snapshot.duckdb
      - name: Restore immutable ops seed without changing its cache or release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p immutable_ops
          gh release download ops-cache-v6-2000-plus-player-bio \
            --repo jeleff1000/league-history-workers \
            --pattern ops_cache.duckdb --dir immutable_ops
          test -s immutable_ops/ops_cache.duckdb
          cp immutable_ops/ops_cache.duckdb research_public_lake/ops_cache.duckdb
          sha256sum research_public_lake/ops_cache.duckdb > ops_seed_before.sha256
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download successful MFL artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p sidecars
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --dir sidecars
          test -n "$(find sidecars -name 'mfl_underpopulated_week_rescue_*.parquet' -print -quit)"
      - name: Compare and build same-schema candidate
        run: |
          set -euo pipefail
          python code/scripts/research_cohorts/promote_mfl_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --sidecars sidecars \
            --out promoted_corpus_snapshot.duckdb
          cp promoted_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - name: Verify the immutable ops seed was not changed
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_seed_after.sha256
          cmp ops_seed_before.sha256 ops_seed_after.sha256
      - name: Preserve merged corpus candidate and audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-sidecar-merged-corpus-${{ github.run_id }}
          path: |
            promoted_corpus_snapshot.duckdb
            promoted_corpus_snapshot.json
            ops_seed_before.sha256
            ops_seed_after.sha256
          retention-days: 180
