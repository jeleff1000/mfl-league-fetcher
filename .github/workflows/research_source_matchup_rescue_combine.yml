name: Combine Targeted Source Matchup Rescue

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed targeted source rescue run
        required: true
        default: "31061989974"
      source_run_ids:
        description: Optional comma-separated rescue runs to combine; overrides source_run_id
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download rescue artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          RUNS='${{ inputs.source_run_ids }}'
          if [ -z "$RUNS" ]; then RUNS='${{ inputs.source_run_id }}'; fi
          IFS=',' read -ra IDS <<< "$RUNS"
          for ID in "${IDS[@]}"; do
            gh run download "$ID" \
              --repo '${{ github.repository }}' \
              --pattern 'research-source-matchup-rescue-*' \
              --dir input || true
            gh run download "$ID" \
              --repo '${{ github.repository }}' \
              --pattern 'research-sparse-playoff-championship-rescue-*' \
              --dir input || true
            gh run download "$ID" \
              --repo '${{ github.repository }}' \
              --pattern 'research-sparse-playoff-championship-retry-*' \
              --dir input || true
          done
          test -n "$(find input -type f -name '*.parquet' -print -quit)"
      - name: Combine and validate
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/combine_source_matchup_rescue_sidecar.py \
            --input-dir input \
            --out out/source_matchup_rescue.parquet \
            --status-out out/source_matchup_rescue_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-matchup-rescue-combined-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
