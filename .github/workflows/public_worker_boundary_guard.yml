name: Public Worker Boundary Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-worker-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Reject private or enterprise worker dependencies
        run: python scripts/validate_public_worker_boundaries.py
      - name: Test the boundary validator and workflow migration
        run: >-
          python -m pytest
          tests/test_validate_public_worker_boundaries.py
          tests/test_migrate_public_worker_workflows.py
          -q
      - name: Prove weekly worker process deadlines without production access
        run: timeout --signal=KILL 38s python -m pytest tests/test_weekly_refresh_deadlines.py -q
