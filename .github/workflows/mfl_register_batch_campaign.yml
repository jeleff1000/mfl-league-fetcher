          cp canonical_mfl_register_all_runs.json canonical_append_proof.json canonical_mfl_research_overlay_proof.json canonical_index_state/
          cp canonical_mfl_research_overlay.duckdb canonical_mfl_research_overlay_proof.json canonical_research_overlay_state/
      - name: Save immutable chunk cache
