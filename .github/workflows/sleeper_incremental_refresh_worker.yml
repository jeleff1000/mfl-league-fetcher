name: Sleeper Active-Season Refresh Worker

on:
  workflow_dispatch:
    inputs:
      db_name:
        description: 'Existing Sleeper league db_name to refresh'
        required: true
        type: string
      league_id:
        description: 'Optional current Sleeper ID from the saved onboarding chain'
        required: false
        type: string
      year:
        description: 'Optional active NFL season override, e.g. 2026'
        required: false
        type: string
      through_week:
        description: 'Optional finalized-week ceiling, e.g. 1'
        required: false
        type: string
      execute:
        description: 'Publish the scoped active-season refresh to Fly (false is read-only)'
        required: true
        type: boolean
        default: false
      cache_only:
        description: 'Finish a previously committed cache publication without refetching'
        required: false
        type: boolean
        default: false
      dispatch_token:
        description: 'Opaque UI claim token; blank for manual/QA runs'
        required: false
        type: string
      attempt_id:
        description: 'Attempt identity paired with the UI claim token'
        required: false
        type: string
      claim_version:
        description: 'Compare-and-swap version for the claimed attempt'
        required: false
        default: '1'
        type: string
      observed_manifest_digest:
        description: 'Exact provider/NFL source manifest claimed by the UI'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: sleeper-active-season-refresh-${{ inputs.db_name }}
  cancel-in-progress: false

jobs:
  sleeper-active-season-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}

    steps:
      - name: Checkout application code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore canonical research ops cache
        if: ${{ !inputs.cache_only }}
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache
        if: ${{ !inputs.cache_only }}
        run: test -s "${OPS_CACHE_PATH}"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate virtualenv
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate cache-only recovery request
        if: inputs.cache_only
        env:
          UI_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          test "${EXECUTE}" = "true"
          test -n "${UI_DISPATCH_TOKEN}"

      - name: Recover committed cache publication
        if: inputs.cache_only && inputs.execute && inputs.dispatch_token != ''
        run: >-
          python scripts/recover_league_update_cache.py
          --db "${{ inputs.db_name }}"
          --platform sleeper
          --dispatch-token "${{ inputs.dispatch_token }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --claim-version "${{ inputs.claim_version }}"

      - name: Claim paid UI update
        if: ${{ !inputs.cache_only && inputs.dispatch_token != '' }}
        run: >-
          python scripts/record_league_update_status.py
          --db "${{ inputs.db_name }}"
          --platform sleeper
          --status running
          --dispatch-token "${{ inputs.dispatch_token }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --claim-version "${{ inputs.claim_version }}"
          --require-entitled

      - name: Refresh Sleeper active season
        if: ${{ !inputs.cache_only }}
        env:
          DB_NAME: ${{ inputs.db_name }}
          LEAGUE_ID: ${{ inputs.league_id }}
          YEAR: ${{ inputs.year }}
          THROUGH_WEEK: ${{ inputs.through_week }}
          EXECUTE: ${{ inputs.execute }}
          OBSERVED_MANIFEST_DIGEST: ${{ inputs.observed_manifest_digest }}
        run: |
          set -euo pipefail
          args=(--db "${DB_NAME}" --json-out sleeper_active_season_refresh.json)
          if [ -n "${LEAGUE_ID}" ]; then
            args+=(--league-id "${LEAGUE_ID}")
          fi

          if [ -n "${YEAR}" ]; then
            args+=(--year "${YEAR}")
          fi
          if [ -n "${THROUGH_WEEK}" ]; then
            args+=(--through-week "${THROUGH_WEEK}")
          fi
          if [ "${EXECUTE}" = "true" ]; then
            args+=(--execute)
          fi
          if [ -n "${OBSERVED_MANIFEST_DIGEST}" ]; then
            args+=(--observed-manifest-digest "${OBSERVED_MANIFEST_DIGEST}")
          fi
          python scripts/refresh_sleeper_active_season.py "${args[@]}"

      - name: Classify Fly publication
        id: publication
        if: ${{ !inputs.cache_only && inputs.execute }}
        env:
          UI_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
        run: |
          set -euo pipefail
          args=(--receipt sleeper_active_season_refresh.json)
          if [ -n "${UI_DISPATCH_TOKEN}" ]; then
            args+=(--require-publication)
          fi
          python scripts/league_update_workflow_receipt.py "${args[@]}"

      - name: Record Fly commit
        if: inputs.execute && inputs.dispatch_token != '' && steps.publication.outputs.committed == 'true'
        run: >-
          python scripts/record_league_update_status.py
          --db "${{ inputs.db_name }}"
          --platform sleeper
          --status committed
          --dispatch-token "${{ inputs.dispatch_token }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --claim-version "${{ inputs.claim_version }}"
          --receipt sleeper_active_season_refresh.json

      - name: Publish refreshed cache
        if: inputs.execute && steps.publication.outputs.committed == 'true'
        run: >-
          python scripts/warm_vercel_cache.py
          --db "${{ inputs.db_name }}"
          --secret "${REVALIDATION_SECRET}"
          --site-url "https://www.leaguehistory.app"
          --mode quick
          --strategy expire
          --jitter-seconds 0
          --strict
          --verify-hot

      - name: Complete UI update
        if: inputs.execute && inputs.dispatch_token != '' && steps.publication.outputs.committed == 'true'
        run: >-
          python scripts/record_league_update_status.py
          --db "${{ inputs.db_name }}"
          --platform sleeper
          --status succeeded
          --dispatch-token "${{ inputs.dispatch_token }}"
          --attempt-id "${{ inputs.attempt_id }}"
          --claim-version "${{ inputs.claim_version }}"
          --receipt sleeper_active_season_refresh.json
          --cache-verified

      - name: Fail UI update
        if: ${{ failure() && !inputs.cache_only && inputs.dispatch_token != '' }}
        run: |
          set -euo pipefail
          recovery_status=$(python scripts/league_update_workflow_receipt.py --receipt sleeper_active_season_refresh.json --failure-status)
          args=(
            --db "${{ inputs.db_name }}"
            --platform sleeper
            --status "${recovery_status}"
            --dispatch-token "${{ inputs.dispatch_token }}"
            --attempt-id "${{ inputs.attempt_id }}"
            --claim-version "${{ inputs.claim_version }}"
          )
          if [ "${recovery_status}" = "committed_cache_pending" ]; then
            args+=(--receipt sleeper_active_season_refresh.json --error "Data published; cache finalization requires retry")
          else
            args+=(--error "Sleeper active-season refresh did not publish")
          fi
          python scripts/record_league_update_status.py "${args[@]}"

      - name: Upload refresh receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sleeper-active-season-refresh-${{ github.run_id }}
          path: sleeper_active_season_refresh.json
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "# Sleeper Active-Season Refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f sleeper_active_season_refresh.json ]; then
            python - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("sleeper_active_season_refresh.json", encoding="utf-8") as handle:
              receipt = json.load(handle)

          print(f"- **League:** `{receipt.get('db_name', 'unknown')}`")
          print(f"- **Provider league ID:** `{receipt.get('league_id', 'unknown')}`")
          print(f"- **Year:** `{receipt.get('year', 'unknown')}`")
          print(f"- **Weeks:** `{receipt.get('refresh_weeks', [])}`")
          print(f"- **Status:** `{receipt.get('status', 'missing receipt')}`")
          print(f"- **Execute:** `{receipt.get('executed', False)}`")
          print("")
          print("## Provider rows")
          for name, count in sorted((receipt.get("fetch_rows") or {}).items()):
              print(f"- `{name}`: {count}")
          PYEOF
          else
            echo "No receipt was written; inspect the failed worker step." >> "$GITHUB_STEP_SUMMARY"
          fi
