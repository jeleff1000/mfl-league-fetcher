name: MFL Historical Shape Probe

on:
  workflow_dispatch:
    inputs:
      season:
        required: true
        type: string
        default: '1993'
      league_id:
        required: true
        type: string
        default: '24135'
permissions:
  actions: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/
            /requirements.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r code/requirements.txt
      - name: Capture historical endpoint shapes
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          SEASON: ${{ inputs.season }}
          LEAGUE_ID: ${{ inputs.league_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from multi_league.data_fetchers.mfl.mfl_api_client import MFLAPIClient, MFLAPIConfig
          y=int(os.environ['SEASON']); lid=os.environ['LEAGUE_ID']; c=MFLAPIClient(MFLAPIConfig(rate_limit_per_min=5,http_max_retries=0))
          league=c.fetch_league(lid,y) or {}
          out={'season':y,'league_id':lid,'league_keys':sorted(league),'league_sample':league}
          try:
              schedule=c._get(y,'schedule',{'L':lid},raise_on_error_payload=True) or {}
              out['schedule_sample']=schedule
          except Exception as e: out['schedule_error']=str(e)
          for w in range(1,18):
              try:
                  p=c.fetch_weekly_results(lid,y,w) or {}
                  out[f'week_{w}']={'keys':sorted(p),'matchup_type':type(p.get('matchup')).__name__,'matchup_len':len(p.get('matchup',[])) if isinstance(p.get('matchup'),list) else None}
                  if w == 1: out['week_1_sample'] = p
              except Exception as e: out[f'week_{w}']={'error':str(e)}
          json.dump(out,open('mfl_shape.json','w'),indent=2,sort_keys=True)
          print(json.dumps(out,indent=2)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mfl-shape-${{ inputs.season }}-${{ inputs.league_id }}
          retention-days: 30
          path: mfl_shape.json
