name: Probe Live Ops Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-ops-scheduler-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Prove Fly credential and isolated app access
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: timeout 40s python scripts/probe_live_ops_scheduler.py
