name: Inventory GH matchup artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_runs:
        description: Comma-separated Actions run IDs whose matchup artifacts should be inspected
        required: false
        default: ''
      since:
        description: Inspect research artifacts created at or after this UTC timestamp when artifact_runs is empty
        required: false
        default: '2026-08-05T00:00:00Z'
      shard_index:
        description: Zero-based read-only artifact inventory shard
        required: false
        default: '0'
      shard_count:
        description: Number of read-only artifact inventory shards
        required: false
        default: '1'
      years:
        description: JSON list of years to retain in the report
        required: true
        default: '[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]'

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUNS: ${{ inputs.artifact_runs }}
      SINCE: ${{ inputs.since }}
      SHARD_INDEX: ${{ inputs.shard_index }}
      SHARD_COUNT: ${{ inputs.shard_count }}
      YEARS: ${{ inputs.years }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download and inspect selected GH artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, os, re, urllib.request, urllib.parse, zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import duckdb

          years = set(json.loads(os.environ['YEARS']))
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  h = dict(req.headers)
                  if urllib.parse.urlparse(newurl).netloc != urllib.parse.urlparse(req.full_url).netloc:
                      h.pop('Authorization', None)
                  return urllib.request.Request(newurl, req.data, h, method=req.get_method())
          opener = urllib.request.build_opener(Redirect)
          artifacts = []
          run_ids = [x.strip() for x in os.environ['ARTIFACT_RUNS'].split(',') if x.strip()]
          since = os.environ['SINCE']
          shard_index = int(os.environ['SHARD_INDEX'])
          shard_count = int(os.environ['SHARD_COUNT'])
          if not 0 <= shard_index < shard_count:
              raise SystemExit('invalid artifact inventory shard')
          def research_name(name):
              n = name.lower()
              return any(term in n for term in (
                  'matchup', 'sidecar', 'rescue', 'promot', 'outcome', 'signal',
                  'player', 'lineage', 'settings', 'cohort', 'canonical',
              ))
          if not run_ids:
              page = 1
              while True:
                  url = f'https://api.github.com/repos/jeleff1000/mfl-league-fetcher/actions/artifacts?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  with opener.open(req, timeout=120) as response: payload = json.load(response)
                  batch = payload.get('artifacts', [])
                  for item in batch:
                      if item['created_at'] >= since and not item['expired'] and research_name(item['name']):
                          if int(item['id']) % shard_count == shard_index:
                              artifacts.append(('', item))
                  if len(batch) < 100: break
                  page += 1
          for run_id in run_ids:
              page = 1
              while True:
                  url = f'https://api.github.com/repos/jeleff1000/mfl-league-fetcher/actions/runs/{run_id}/artifacts?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers=headers)
                  with opener.open(req, timeout=120) as response: payload = json.load(response)
                  batch = payload.get('artifacts', [])
                  for item in batch:
                      if not research_name(item['name']):
                          continue
                      if int(item['id']) % shard_count != shard_index:
                          continue
                      found_years = {int(x) for x in re.findall(r'(?<!\d)(20\d{2})(?!\d)', item['name'])}
                      if found_years & years or not found_years:
                          artifacts.append((str(run_id), item))
                  if len(batch) < 100: break
                  page += 1
          if not artifacts: raise SystemExit('no matching research artifacts for this shard')

          root = Path('inventory'); root.mkdir(exist_ok=True)
          def inspect(pair):
              run_id, item = pair
              req = urllib.request.Request(item['archive_download_url'], headers=headers)
              with opener.open(req, timeout=600) as response: data = response.read()
              target = root / f"{run_id}_{item['id']}"; target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  for member in archive.infolist():
                      destination = (target / member.filename).resolve()
                      if target.resolve() not in destination.parents:
                          raise SystemExit(f'unsafe artifact member: {member.filename}')
                  archive.extractall(target)
              rows = []
              con = duckdb.connect()
              for path in sorted(target.rglob('*.parquet')):
                  cols = [r[0] for r in con.execute('DESCRIBE SELECT * FROM read_parquet(?)', [str(path)]).fetchall()]
                  has_expected = {'expected_wins','expected_losses','expected_starts'} <= set(cols)
                  distinct_years = [int(r[0]) for r in con.execute('SELECT DISTINCT CAST(year AS INTEGER) FROM read_parquet(?) ORDER BY 1', [str(path)]).fetchall() if r[0] is not None] if 'year' in cols else []
                  bad = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE expected_wins IS NOT NULL AND expected_losses IS NOT NULL AND expected_starts IS NOT NULL AND ABS(expected_wins + expected_losses - expected_starts) > 0.0002', [str(path)]).fetchone()[0] if has_expected else None
                  required = {'rostered_league_weeks','roster_eligible_league_weeks','started_team_game_weeks','team_game_eligible_league_weeks','started_active_weeks','healthy_eligible_league_weeks','wins_started','losses_started','expected_wins','expected_losses','expected_starts','champ_elig_leagues','n_champ_start_leagues','n_started_po','n_final_po','playoff_eligible_leagues','active_weeks','inactive_weeks'}
                  checks = {}
                  if required <= set(cols):
                      checks['roster_numerator_gt_denominator'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE rostered_league_weeks > roster_eligible_league_weeks + 0.0001',[str(path)]).fetchone()[0]
                      checks['start_numerator_gt_denominator'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE started_team_game_weeks > team_game_eligible_league_weeks + 0.0001',[str(path)]).fetchone()[0]
                      checks['healthy_numerator_gt_denominator'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE started_active_weeks > healthy_eligible_league_weeks + 0.0001',[str(path)]).fetchone()[0]
                      checks['wins_losses_exceed_starts'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE wins_started + losses_started > started_team_game_weeks + 0.0001',[str(path)]).fetchone()[0]
                      checks['champ_starts_gt_champ_eligible'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE n_champ_start_leagues > champ_elig_leagues + 0.0001',[str(path)]).fetchone()[0]
                      checks['playoff_total_gt_playoff_eligible'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE n_final_po > playoff_eligible_leagues + 0.0001',[str(path)]).fetchone()[0]
                      checks['playoff_starts_gt_playoff_eligible'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE n_started_po > playoff_eligible_leagues + 0.0001',[str(path)]).fetchone()[0]
                  if {'inactive_weeks','inactive_week_mask'} <= set(cols):
                      checks['inactive_mask_mismatch'] = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE inactive_weeks <> bit_count(COALESCE(inactive_week_mask,0))',[str(path)]).fetchone()[0]
                  diagnostics = {}
                  # Grain-aware diagnostics.  Season-only exposure fields must not be
                  # required on weekly rows, but when they exist we validate their actual
                  # values rather than treating schema presence as proof of correctness.
                  if has_expected:
                      diagnostics['expected_wl_balance_bad'] = con.execute(
                          'SELECT COUNT(*) FROM read_parquet(?) '
                          'WHERE expected_wins IS NOT NULL AND expected_losses IS NOT NULL '
                          'AND expected_starts IS NOT NULL '
                          'AND ABS(expected_wins + expected_losses - expected_starts) > 0.0002',
                          [str(path)]).fetchone()[0]
                  if {'wins_started','losses_started','started_weeks'} <= set(cols):
                      diagnostics['raw_wl_gt_started_weeks'] = con.execute(
                          'SELECT COUNT(*) FROM read_parquet(?) '
                          'WHERE wins_started IS NOT NULL AND losses_started IS NOT NULL '
                          'AND started_weeks IS NOT NULL '
                          'AND wins_started + losses_started > started_weeks + 0.0001',
                          [str(path)]).fetchone()[0]
                  if {'wins_started','losses_started','started_team_game_weeks'} <= set(cols):
                      diagnostics['raw_wl_gt_team_game_weeks'] = con.execute(
                          'SELECT COUNT(*) FROM read_parquet(?) '
                          'WHERE wins_started IS NOT NULL AND losses_started IS NOT NULL '
                          'AND started_team_game_weeks IS NOT NULL '
                          'AND wins_started + losses_started > started_team_game_weeks + 0.0001',
                          [str(path)]).fetchone()[0]
                  denominator_fields = [
                      'roster_eligible_leagues','team_game_eligible_leagues',
                      'healthy_eligible_leagues','roster_eligible_league_weeks',
                      'team_game_eligible_league_weeks','healthy_eligible_league_weeks',
                      'champ_elig_leagues','playoff_eligible_leagues',
                      'active_weeks','inactive_weeks',
                  ]
                  for field in denominator_fields:
                      if field in cols:
                          diagnostics[f'{field}_null_rows'] = con.execute(
                              f'SELECT COUNT(*) FROM read_parquet(?) WHERE "{field}" IS NULL',
                              [str(path)]).fetchone()[0]
                  rows.append({'run_id':run_id,'artifact_id':item['id'],'artifact':item['name'],'file':path.name,'years':distinct_years,'rows':con.execute('SELECT COUNT(*) FROM read_parquet(?)',[str(path)]).fetchone()[0],'schema_columns':len(cols),'missing_required':sorted(required-set(cols)),'denominator_check_failures':checks,'metric_diagnostics':diagnostics,'expected_identity_failures':bad,'kind':'final' if has_expected and 'rostered_weeks' not in cols else 'raw_or_normalized','columns':cols})
              if not rows:
                  rows.append({'run_id':run_id,'artifact_id':item['id'],'artifact':item['name'],'file':'','years':[],'rows':None,'schema_columns':None,'missing_required':[],'denominator_check_failures':{},'metric_diagnostics':{},'expected_identity_failures':None,'kind':'non_parquet_or_empty','columns':[]})
              con.close()
              return rows
          result=[]
          with ThreadPoolExecutor(max_workers=3) as pool:
              for future in as_completed([pool.submit(inspect, x) for x in artifacts]): result.extend(future.result())
          result.sort(key=lambda x:(x['artifact'],x['file']))
          Path('out').mkdir(exist_ok=True)
          Path('out/matchup_artifact_inventory.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          with open('out/matchup_artifact_inventory.csv','w',newline='',encoding='utf-8') as fh:
              fields=['run_id','artifact_id','artifact','file','years','rows','schema_columns','missing_required','expected_identity_failures','kind']
              w=csv.DictWriter(fh,fieldnames=fields); w.writeheader()
              for row in result: w.writerow({k:row[k] for k in fields})
          print(f'inventoried {len(artifacts)} artifacts and {len(result)} parquet files')
          for row in result:
              print(row['artifact'], row['file'], row['years'], row['kind'], row['missing_required'], row['denominator_check_failures'], row['expected_identity_failures'], flush=True)
          PY
      - name: Upload GH artifact inventory
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-artifact-inventory-${{ github.run_id }}
          path: out/matchup_artifact_inventory.*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
