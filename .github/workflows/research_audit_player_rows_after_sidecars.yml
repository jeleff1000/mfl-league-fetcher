name: Audit Player Rows After Sidecars

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      position_run_id:
        required: true
        default: '31267902834'
      settings_run_id:
        required: true
        default: '31270742427'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download immutable sidecars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p position settings out
          gh run download "${{ inputs.position_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "cohort-dimension-fills-${{ inputs.position_run_id }}" --dir position
          gh run download "${{ inputs.settings_run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "combined-settings-sidecar-${{ inputs.settings_run_id }}" --dir settings
          test -f position/player_position_updates.parquet
          test -f settings/league_settings_updates_combined.parquet
      - name: Run complete player-row league-week audit
        run: |
          python code/scripts/research_cohorts/audit_player_rows_after_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --position position/player_position_updates.parquet \
            --settings settings/league_settings_updates_combined.parquet \
            --out out
      - uses: actions/upload-artifact@v4
        with:
          name: player-row-audit-after-sidecars-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
