name: Retired NFL Super Table Writer

# This compatibility entry point is deliberately fail-closed. The former
# in-place writer receives only an active-week source frame and can overwrite
# all-time rank fields with current-week-only values. Production Ops changes
# must use Refresh Live NFL Ops, which rebuilds the rank surface against its
# complete durable artifact before atomically promoting it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the safe replacement
        run: |
          echo "::error::LEGACY_OPS_WRITER_DISABLED: use the Refresh Live NFL Ops workflow instead."
          exit 1
