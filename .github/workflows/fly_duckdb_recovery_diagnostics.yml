name: Fly DuckDB Recovery Diagnostics

on:
  workflow_dispatch:
    inputs:
      preserve_current_volume:
        description: Create a recovery snapshot of the current volume before inspection
        required: false
        default: false
        type: boolean
      validate_snapshot_id:
        description: Optional snapshot ID to restore to a temporary volume and validate read-only
        required: false
        default: ""
        type: string
      cleanup_recovery_resources:
        description: Remove only temporary wkupd_* validation machines and volumes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install flyctl
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Inspect app, volume snapshots, and database files
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: league-history-duckdb
          PRESERVE_CURRENT_VOLUME: ${{ inputs.preserve_current_volume }}
          VALIDATE_SNAPSHOT_ID: ${{ inputs.validate_snapshot_id }}
          CLEANUP_RECOVERY_RESOURCES: ${{ inputs.cleanup_recovery_resources }}
        run: |
          set -euo pipefail
          flyctl status --app "$FLY_APP"
          flyctl machines list --app "$FLY_APP" --json | tee machines.json
          flyctl volumes list --app "$FLY_APP" --json | tee volumes.json

          if [ "$CLEANUP_RECOVERY_RESOURCES" = "true" ]; then
            jq -r '.[] | select(.name | startswith("wkupd_")) | [.id, (.attached_machine_id // "")] | @tsv' volumes.json \
              | while IFS=$'\t' read -r recovery_volume recovery_machine; do
                  [ -n "$recovery_volume" ] || continue
                  if [ -n "$recovery_machine" ]; then
                    flyctl machine destroy "$recovery_machine" --app "$FLY_APP" --force
                  fi
                  flyctl volumes destroy "$recovery_volume" --app "$FLY_APP" --yes
                done
            flyctl machines list --app "$FLY_APP" --json | tee machines-after-cleanup.json
            flyctl volumes list --app "$FLY_APP" --json | tee volumes-after-cleanup.json
          fi

          jq -r '.[].id' volumes.json | while IFS= read -r volume_id; do
            [ -n "$volume_id" ] || continue
            if [ "${PRESERVE_CURRENT_VOLUME}" = "true" ]; then
              echo "Creating recovery snapshot for volume ${volume_id}"
              flyctl volumes snapshots create "$volume_id" --app "$FLY_APP" --json \
                | tee "created-snapshot-${volume_id}.json"
            fi
            echo "Snapshots for volume ${volume_id}"
            flyctl volumes snapshots list "$volume_id" --app "$FLY_APP" --json \
              | tee "snapshots-${volume_id}.json"
          done

          machine_id="$(jq -r 'map(select(.state == "started"))[0].id // .[0].id // empty' machines.json)"
          if [ -n "$machine_id" ]; then
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" \
              -C "/bin/sh -lc 'ls -lah /data/___leagues.duckdb* /data/___ops.duckdb* 2>/dev/null || true'"
          fi

          if [ -n "$VALIDATE_SNAPSHOT_ID" ]; then
            if ! [[ "$VALIDATE_SNAPSHOT_ID" =~ ^vs_[A-Za-z0-9]+$ ]]; then
              echo "Invalid snapshot ID" >&2
              exit 2
            fi

            volume_name="wkupd_${GITHUB_RUN_ID}"
            recovery_volume_id=""
            recovery_machine_id=""
            cleanup() {
              if [ -n "$recovery_machine_id" ]; then
                flyctl machine destroy "$recovery_machine_id" --app "$FLY_APP" --force || true
              fi
              if [ -n "$recovery_volume_id" ]; then
                flyctl volumes destroy "$recovery_volume_id" --app "$FLY_APP" --yes || true
              fi
            }
            trap cleanup EXIT

            source_region="$(jq -r '.[0].region' volumes.json)"
            source_size_gb="$(jq -r '.[0].size_gb' volumes.json)"
            image_ref="$(jq -r 'map(select(.state == "started"))[0].config.image' machines.json)"
            recovery_json="$(flyctl volumes create "$volume_name" --app "$FLY_APP" \
              --region "$source_region" --size "$source_size_gb" \
              --snapshot-id "$VALIDATE_SNAPSHOT_ID" --scheduled-snapshots=false \
              --require-unique-zone=false --yes --json)"
            printf '%s\n' "$recovery_json" | tee recovery-volume.json
            recovery_volume_id="$(printf '%s' "$recovery_json" | jq -r '.id')"
            if [ -z "$recovery_volume_id" ] || [ "$recovery_volume_id" = "null" ]; then
              echo "Snapshot restore did not return a recovery volume ID" >&2
              exit 3
            fi
            for _ in $(seq 1 240); do
              recovery_state="$(flyctl volumes show "$recovery_volume_id" --app "$FLY_APP" --json | jq -r '.state')"
              if [ "$recovery_state" = "created" ]; then
                break
              fi
              sleep 5
            done
            if [ "${recovery_state:-}" != "created" ]; then
              echo "Recovery volume did not finish restoring: ${recovery_state:-unknown}" >&2
              exit 4
            fi

            cat > snapshot_probe.py <<'PY'
          import json
          import sys

          import duckdb

          path = "/data/___leagues.duckdb"
          checks = {
              "league_settings": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.league_settings",
              "league_context": "SELECT COUNT(*), COUNT(DISTINCT db_name) FROM public.league_context",
              "matchup": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.matchup",
              "player_fantasy": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.player_fantasy",
          }
          result = {"path": path, "checks": {}, "errors": {}}
          connection = duckdb.connect(path, read_only=True)
          try:
              for name, sql in checks.items():
                  try:
                      result["checks"][name] = connection.execute(sql).fetchone()
                  except Exception as exc:
                      result["errors"][name] = str(exc)
          finally:
              connection.close()
          print(json.dumps(result, sort_keys=True))
          sys.exit(1 if result["errors"] else 0)
          PY
            probe_b64="$(base64 -w0 snapshot_probe.py)"
            recovery_machine_json="$(flyctl machine run "$image_ref" --app "$FLY_APP" --region "$source_region" \
              --volume "$recovery_volume_id:/data" --entrypoint /bin/sh \
              --file-literal "/tmp/snapshot_probe.py=$probe_b64" \
              --restart no --detach --vm-cpus 1 --vm-memory 2048 --json \
              -- -lc 'sleep 900')"
            printf '%s\n' "$recovery_machine_json" | tee recovery-machine.json
            recovery_machine_id="$(printf '%s' "$recovery_machine_json" | jq -r '.id')"
            if [ -z "$recovery_machine_id" ] || [ "$recovery_machine_id" = "null" ]; then
              echo "Snapshot probe did not return a recovery machine ID" >&2
              exit 5
            fi
            for _ in $(seq 1 60); do
              recovery_machine_state="$(flyctl machines list --app "$FLY_APP" --json \
                | jq -r --arg id "$recovery_machine_id" '.[] | select(.id == $id) | .state')"
              if [ "$recovery_machine_state" = "started" ]; then
                break
              fi
              sleep 2
            done
            if [ "${recovery_machine_state:-}" != "started" ]; then
              echo "Recovery machine did not start: ${recovery_machine_state:-unknown}" >&2
              exit 6
            fi
            flyctl ssh console --app "$FLY_APP" --machine "$recovery_machine_id" \
              -C "python /tmp/snapshot_probe.py" | tee snapshot-validation.jsonl
            trap - EXIT
            cleanup
          fi

      - name: Upload diagnostic inventory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fly-duckdb-recovery-diagnostics-${{ github.run_id }}
          path: |
            machines.json
            machines-after-cleanup.json
            volumes.json
            volumes-after-cleanup.json
            created-snapshot-*.json
            snapshots-*.json
            recovery-volume.json
            recovery-machine.json
            snapshot-validation.jsonl
          if-no-files-found: warn
          retention-days: 7
