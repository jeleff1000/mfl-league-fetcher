name: Apply Outcome Sidecar Only

on:
  workflow_dispatch:
    inputs:
      outcome_run_id_a:
        description: Successful combined outcome sidecar run for targets 0-90000
        required: true
        default: "31059385445"
      outcome_run_id_b:
        description: Successful combined outcome sidecar run for targets 90000-1145460
        required: true
        default: "31060749133"
      classification_run_id:
        description: Audited classification overlay containing recovered and unresolved target statuses
        required: true
        default: "31144084870"
      expected_recovered:
        description: Exact recovered rows expected in the audited classification
        required: true
        default: "6789"
      base_cache_key:
        description: Current canonical source lake cache
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical-final
      output_cache_key:
        description: Versioned cache key for the outcome-applied lake
        required: true
        default: research-public-lake-v4-Linux-20260806-outcomes-applied

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download audited classification and materialize recoveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p classification
          gh run download '${{ inputs.classification_run_id }}' --repo '${{ github.repository }}' \
            --name research-outcome-target-classification-overlay-${{ inputs.classification_run_id }} --dir classification
          CLASSIFICATION=$(find classification -name 'outcome_target_classification.parquet' | head -1)
          test -s "$CLASSIFICATION"
          python code/scripts/research_cohorts/materialize_recovered_outcomes.py \
            --input "$CLASSIFICATION" --output outcome_overlay.duckdb \
            --expected-recovered '${{ inputs.expected_recovered }}'
      - name: Apply outcome overlay only
        run: |
          python code/scripts/research_cohorts/apply_outcome_sidecar_only.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out merged_corpus_snapshot.duckdb \
            --outcomes outcome_overlay.duckdb
          mv merged_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
          python - <<'PY'
          import duckdb
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          con.execute("attach 'outcome_overlay.duckdb' as outcomes (read_only)")
          applied=con.execute("""
            select count(*)
            from outcomes.public.outcome_targets o
            join public.player_fantasy p
              on cast(p.db_name as varchar)=cast(o.db_name as varchar)
             and cast(p.year as integer)=cast(o.year as integer)
             and cast(p.week as integer)=cast(o.week as integer)
             and cast(p.NFL_player_id as varchar)=cast(o.NFL_player_id as varchar)
            where p.win is not null and p.team_points is not null
          """).fetchone()[0]
          if applied != int('${{ inputs.expected_recovered }}'):
              raise SystemExit(f'exact recovered outcome validation failed: {applied}')
          print({'exact_recovered_outcomes_applied': applied})
          con.close()
          PY
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      - uses: actions/upload-artifact@v4
        with:
          name: research-outcome-applied-lake-${{ github.run_id }}
          path: research_public_lake/corpus_snapshot.duckdb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
