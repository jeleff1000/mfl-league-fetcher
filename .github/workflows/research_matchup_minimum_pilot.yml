name: Research Matchup Minimum Compute Pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public research lake cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical-final
      year:
        description: One season to pilot
        required: true
        default: '2025'
      batches:
        description: Balanced batches for the season
        required: true
        default: '256'
      batch:
        description: One balanced batch to build
        required: true
        default: '0'

concurrency:
  group: research-matchup-minimum-pilot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ inputs.year }}
      RESEARCH_YEAR_END: ${{ inputs.year }}
      RESEARCH_LEAGUE_BATCHES: ${{ inputs.batches }}
      RESEARCH_LEAGUE_BATCH: ${{ inputs.batch }}
      RESEARCH_LEAGUE_BATCH_PLAN: ${{ github.workspace }}/plan/league_batch_plan.parquet
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: "1"
      RESEARCH_READER_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_THREADS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 pytest==8.3.3

      - name: Run planner contract test
        working-directory: code
        run: python -m pytest -q scripts/research_cohorts/test_build_league_batch_plan.py

      - name: Verify public-only inputs
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out plan

      - name: Build minimum balanced plan
        run: |
          python code/scripts/research_cohorts/build_league_batch_plan.py \
            --years "${{ inputs.year }}" \
            --batches "${{ inputs.batches }}" \
            --out plan/league_batch_plan.parquet
          test -s plan/league_batch_plan.parquet

      - name: Build one weighted matchup batch
        run: python code/scripts/research_cohorts/build_research_matchup_cohort.py

      - name: Fail-fast validate matchup shard
        run: |
          python code/scripts/research_cohorts/validate_research_matchup_shard.py \
            --out out \
            --year-start "${{ inputs.year }}" \
            --year-end "${{ inputs.year }}"

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-minimum-pilot-${{ inputs.year }}-batch${{ inputs.batch }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
