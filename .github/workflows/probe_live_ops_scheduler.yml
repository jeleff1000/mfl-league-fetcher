name: Probe Live Ops Scheduler

on:
  workflow_dispatch:
    inputs:
      update_clock:
        description: Update the existing production clock from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-ops-scheduler-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Prove Fly credential access
        if: ${{ !inputs.update_clock }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: timeout 40s python scripts/manage_live_ops_scheduler.py --inspect-only
      - name: Update only the running clock and verify startup
        if: ${{ inputs.update_clock }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python scripts/manage_live_ops_scheduler.py --update --revision "$GITHUB_SHA"
          curl -fsSL https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          for attempt in $(seq 1 8); do
            if flyctl logs --app league-history-ops-clock --machine 8ed954ef456048 --no-tail | grep -F "\"revision\": \"$GITHUB_SHA\"" | grep -F '"github_receipt_access": true'; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::Updated clock did not report startup and GitHub receipt access"
          exit 1
