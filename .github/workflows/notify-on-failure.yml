name: Import Failure Alert

# Triggers when any worker workflow fails
# GitHub already sends email to repo owner on failure, but this workflow
# creates a persistent issue for tracking and ensures visibility.

on:
  workflow_run:
    workflows:
      - "Yahoo Full Import Worker (Paid Tier)"
      - "Yahoo Quick Import Worker (Free Tier)"
      - "Sleeper Full Import Worker (All Years)"
      - "Sleeper Quick Import Worker (Current Year Only)"
      - "ESPN Full Import Worker (Paid ESPN)"
      - "ESPN Quick Import Worker (Current Year Only)"
      - "Playoff Odds & Expected Record Calculator"
      - "Update NFL Super Table"
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `[Import Failure] ${run.name} - ${run.head_branch}`;
            const body = [
              `## Import Pipeline Failure`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| **Workflow** | ${run.name} |`,
              `| **Branch** | ${run.head_branch} |`,
              `| **Trigger** | ${run.event} |`,
              `| **Started** | ${run.created_at} |`,
              `| **Failed** | ${run.updated_at} |`,
              `| **Run URL** | ${run.html_url} |`,
              ``,
              `Review the [workflow logs](${run.html_url}) for details.`,
            ].join('\n');

            // Check for existing open issue with same workflow name to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'import-failure',
              per_page: 10,
            });

            const existing = issues.find(i => i.title.includes(run.name));
            if (existing) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Another failure detected:\n\n${body}`,
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['import-failure'],
              });
            }
