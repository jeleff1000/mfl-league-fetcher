name: Apply Research Player Sidecar Candidate

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Validation run containing player-sidecar-delta artifacts
        required: true
      base_cache_key:
        description: Frozen canonical research cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private research code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Restore frozen canonical cache read-only
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - name: Download validated player deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sidecars
          gh run download '${{ inputs.validation_run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'player-sidecar-delta-*' \
            --dir sidecars
          test -n "$(find sidecars -name 'promotable_player_delta.parquet' -print -quit)"
      - name: Apply and validate candidate
        run: |
          set -euo pipefail
          python code/scripts/research_cohorts/apply_player_sidecar_delta.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --sidecars sidecars \
            --out promoted_corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py \
            promoted_corpus_snapshot.duckdb
      - name: Upload validated candidate and report
        uses: actions/upload-artifact@v4
        with:
          name: research-player-sidecar-candidate-${{ github.run_id }}
          path: |
            promoted_corpus_snapshot.duckdb
            promoted_corpus_snapshot.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
