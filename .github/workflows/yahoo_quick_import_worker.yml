name: Yahoo Quick Import Worker (Free Tier)

# Free Yahoo import: fetches current year, runs sims + aggregations locally,
# uploads via Fly.io once at the end. Self-contained — no trigger-downstream.
# Called from: Next.js frontend via repository_dispatch

on:
  workflow_dispatch:
    inputs:
      league_data_b64:
        description: 'Base64-encoded JSON with league configuration'
        required: false
        type: string
      user_id:
        description: 'Unique identifier for this user/import job'
        required: true
        type: string
      import_lock_key:
        description: 'Stable import concurrency key, usually the resolved db_name'
        required: true
        type: string
  repository_dispatch:
    types: [yahoo_quick_import]


permissions:
  actions: write
  contents: read

concurrency:
  group: league-update-${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
  cancel-in-progress: false
  queue: max

jobs:
  quick-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Quick imports should be fast

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      FLY_UPLOAD_MAX_RETRIES: 40
      FLY_UPLOAD_RETRY_BASE_DELAY: 3
      FLY_UPLOAD_RETRY_MAX_DELAY: 30
      FLY_UPLOAD_RETRY_JITTER_SECONDS: 2
      FLY_PUBLISH_FORMAT: delta
      REQUIRE_IMPORT_BASE_GENERATION: '1'
      FLY_DELTA_FALLBACK_TO_DUCKDB: '0'
      FLY_FINALIZE_INVENTORY: '1'
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb

    steps:
      - name: Require canonical public main for publication
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Validate import lock key
        env:
          IMPORT_LOCK_KEY: ${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
        run: |
          if [ -z "${IMPORT_LOCK_KEY}" ]; then
            echo 'A resolved import_lock_key is required before any league write.' >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Capture import publication generation
        id: snapshot
        env:
          IMPORT_LOCK_KEY: ${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
        run: python scripts/capture_import_generation.py --db-name "$IMPORT_LOCK_KEY"

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache from research lake
        shell: bash
        run: |
          test -s research_public_lake/ops_cache.duckdb

      - name: Log cached ops cache
        run: |
          echo "[ops-cache] key-prefix=ops-cache-v5-${{ runner.os }}-manual-"
          echo "[research-lake] restore-hit=${{ steps.research-lake.outputs.cache-hit }}"
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::research_public_lake/ops_cache.duckdb is missing from the canonical research lake cache."
            exit 1
          }
          echo "[ops-cache] size-bytes=$(stat -c%s "${OPS_CACHE_PATH}")"
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate virtualenv
        run: echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH

      # ==================== PARSE LEAGUE DATA ====================
      - name: Parse league data
        id: parse
        uses: ./.github/actions/parse-league-data
        with:
          league_data_b64: ${{ github.event.inputs.league_data_b64 || github.event.client_payload.league_data_b64 || '' }}
          import_mode: ${{ github.event.client_payload.import_mode || github.event.inputs.import_mode || 'quick' }}
          yahoo_client_id: ${{ secrets.YAHOO_CLIENT_ID }}
          yahoo_client_secret: ${{ secrets.YAHOO_CLIENT_SECRET }}
          database_server_url: ${{ secrets.DATABASE_SERVER_URL }}
          database_read_token: ${{ secrets.DATABASE_READ_TOKEN }}
          credential_encryption_key: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}

      - name: Verify resolved import lock
        env:
          IMPORT_LOCK_KEY: ${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
          RESOLVED_TARGET_DB: ${{ steps.parse.outputs.database_name }}
        run: python .github/scripts/verify_import_lock.py --lock "$IMPORT_LOCK_KEY" --target "$RESOLVED_TARGET_DB"

      # ==================== COMPUTE DATA_DIR / DB_NAME ====================
      - name: Set DATA_DIR and DB_NAME
        id: dirs
        run: |
          DB_NAME="${{ steps.parse.outputs.database_name }}"
          DATA_DIR="${{ github.workspace }}/fantasy_football_data"
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV
          echo "DATA_DIR=${DATA_DIR}" >> $GITHUB_ENV
          echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT
          echo "data_dir=${DATA_DIR}" >> $GITHUB_OUTPUT
          echo "DB_NAME=${DB_NAME}"
          echo "DATA_DIR=${DATA_DIR}"

      # ==================== REFRESH OAUTH TOKEN ====================
      - name: Refresh OAuth token
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
        run: |
          echo "Refreshing OAuth token..."
          python - <<'PYEOF'
          import json
          import os
          import time
          import requests

          with open("oauth/Oauth.json", 'r') as f:
              oauth_data = json.load(f)

          refresh_token = oauth_data.get('refresh_token')
          if not refresh_token:
              print("No refresh_token found - will try with existing access_token")
              exit(0)

          consumer_key = os.environ.get('YAHOO_CLIENT_ID')
          consumer_secret = os.environ.get('YAHOO_CLIENT_SECRET')

          if not consumer_key or not consumer_secret:
              print("Missing Yahoo credentials - cannot refresh token")
              exit(0)

          try:
              response = requests.post(
                  "https://api.login.yahoo.com/oauth2/get_token",
                  data={
                      'grant_type': 'refresh_token',
                      'refresh_token': refresh_token,
                      'client_id': consumer_key,
                      'client_secret': consumer_secret,
                  },
                  headers={'Content-Type': 'application/x-www-form-urlencoded'},
                  timeout=30
              )

              if response.status_code == 200:
                  new_tokens = response.json()
                  oauth_data['access_token'] = new_tokens.get('access_token')
                  oauth_data['refresh_token'] = new_tokens.get('refresh_token', refresh_token)
                  oauth_data['token_time'] = time.time()
                  oauth_data['expires_in'] = new_tokens.get('expires_in', 3600)

                  with open("oauth/Oauth.json", 'w') as f:
                      json.dump(oauth_data, f, indent=2)

                  print(f"Token refreshed successfully!")
              else:
                  print(f"Token refresh failed: {response.status_code}")
          except Exception as e:
              print(f"Token refresh error: {e}")
          PYEOF

      # ==================== STORE CREDENTIALS (EARLY) ====================
      # Store credentials immediately after token refresh so they're available
      # for debugging even if the import fails downstream.
      - name: Store credentials (early)
        env:
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          DATABASE_NAME: ${{ steps.parse.outputs.database_name }}
          LEAGUE_ID: ${{ steps.parse.outputs.league_id }}
          LEAGUE_NAME: ${{ steps.parse.outputs.league_name }}
        run: |
          if [ -z "$CREDENTIAL_ENCRYPTION_KEY" ]; then
            echo "CREDENTIAL_ENCRYPTION_KEY not set - skipping"
            exit 0
          fi

          python - <<'PYEOF'
          import json
          import sys
          sys.path.insert(0, 'fantasy_football_data_scripts')

          from multi_league.utils.credential_store import store_league_credentials
          import os

          with open("oauth/Oauth.json", 'r') as f:
              oauth_data = json.load(f)

          refresh_token = oauth_data.get('refresh_token')
          if not refresh_token:
              print("No refresh_token found - skipping early credential store")
              exit(0)

          success = store_league_credentials(
              database_name=os.environ['DATABASE_NAME'],
              refresh_token=refresh_token,
              league_id=os.environ['LEAGUE_ID'],
              league_name=os.environ['LEAGUE_NAME']
          )
          if success:
              print("Credentials stored (early)")
          else:
              print("Credentials were not stored (early)")
          PYEOF

      # ==================== CREATE DATA DIRECTORIES ====================
      - name: Create data directory
        run: |
          mkdir -p fantasy_football_data/{matchup_data,player_data,draft_data,transaction_data,schedule_data}

      # ==================== CREATE LEAGUE CONTEXT ====================
      - name: Create league context
        id: create_quick_context
        run: |
          python - <<'PYEOF'
          import json
          import os
          from pathlib import Path

          with open("league_data_input.json") as f:
              league_data = json.load(f)

          oauth_file = Path("oauth/Oauth.json").resolve()

          # Quick import: use the league's most recent mapped year when available.
          season = int(league_data.get('quick_import_year', league_data.get('season', league_data.get('end_year'))))
          actual_start_year = int(league_data.get('actual_start_year', league_data.get('start_year', season)) or season)
          quick_start_year = season
          if actual_start_year < season:
              quick_start_year = max(actual_start_year, season - 1)

          import_mode = league_data.get('import_mode', 'quick')  # "quick" (free) or "quick_to_full" (paid)

          context = {
              "league_id": league_data.get('league_id'),
              "league_name": league_data.get('league_name'),
              "oauth_file_path": str(oauth_file),
              "game_code": league_data.get('game_code', 'nfl'),
              "start_year": quick_start_year,  # Quick target shell plus prior fallback when available
              "end_year": season,
              "num_teams": int(league_data.get('num_teams', 10)),
              "playoff_teams": int(league_data.get('playoff_teams', 6)),
              "regular_season_weeks": int(league_data.get('regular_season_weeks', 14)),
              "data_directory": str(Path("fantasy_football_data").resolve()),
              "max_workers": 5,
              "enable_caching": True,
              "rate_limit_per_sec": 4.0,
              "manager_name_overrides": league_data.get('manager_name_overrides', {}),
              "franchise_merges": league_data.get('franchise_merges', []),
              "external_column_maps": league_data.get('external_column_maps', []),
              "external_identity_maps": league_data.get('external_identity_maps', {}),
              "keeper_rules": league_data.get('keeper_rules'),
              "has_external_data": league_data.get('has_external_data', False),
              "merge_source": league_data.get('merge_source'),
              "merge_sources": league_data.get('merge_sources', []),
              "import_mode": "quick" if import_mode == "quick_to_full" else import_mode,
              "database_name": "${{ steps.parse.outputs.database_name }}",
          }

          if league_data.get('league_ids'):
              context['league_ids'] = league_data['league_ids']

          with open("league_context.json", 'w') as f:
              json.dump(context, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"season={season}\n")

          print(
              f"[QUICK IMPORT] League context created for years {quick_start_year}-{season} "
              f"(db: {context.get('database_name', 'N/A')})"
          )
          PYEOF

      # NOTE: Clean-slate table drop is handled by initial_import_v3.py Phase 0
      # (drop_league_tables) — no need for a separate workflow step.

      # ==================== RUN INITIAL IMPORT ====================
      - name: Run initial import
        id: import
        env:
          AUTO_CONFIRM: "1"
        working-directory: fantasy_football_data_scripts
        run: |
          echo "========================================"
          echo "QUICK IMPORT: ${{ steps.parse.outputs.league_name }}"
          echo "Year: ${{ steps.create_quick_context.outputs.season }}"
          echo "========================================"

          # v3 uses --quick flag instead of --import-mode
          IMPORT_MODE="${{ steps.parse.outputs.import_mode }}"
          QUICK_FLAG=""
          if [ "$IMPORT_MODE" == "quick" ] || [ "$IMPORT_MODE" == "quick_to_full" ]; then
            QUICK_FLAG="--quick"
          fi

          set +e
          python initial_import_v3.py \
            --context ../league_context.json \
            ${QUICK_FLAG} \
            --skip-track-2-upload 2>&1 | tee ../import.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT

          if [ $EXIT_CODE -ne 0 ]; then
            echo "Import failed with exit code ${EXIT_CODE}"
            tail -100 ../import.log
            exit $EXIT_CODE
          fi

          echo "Import completed successfully"

      # ==================== COUNT MATCHUP ROWS ====================
      - name: Count matchup rows
        if: steps.import.outputs.exit_code == '0'
        id: matchup_rows
        run: |
          source .venv/bin/activate
          python - <<'PYEOF'
          import os
          import sys
          from pathlib import Path

          import duckdb

          db_name = os.environ["DB_NAME"]
          data_dir = Path(os.environ["DATA_DIR"])
          db_path = data_dir / f"{db_name}.duckdb"

          if not db_path.exists():
              print(f"ERROR: Local DuckDB not found: {db_path}")
              sys.exit(1)

          conn = duckdb.connect(str(db_path), read_only=True)
          try:
              count = conn.execute("SELECT COUNT(*) FROM public.matchup").fetchone()[0]
          finally:
              conn.close()

          print(f"matchup: {count}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matchup_count={count}\n")
          PYEOF

      # ==================== CALCULATE EXPECTED RECORDS ====================
      - name: Calculate expected records
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.expected_record_v2 \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ env.DATA_DIR }} \
            --n-sims 10000

      # ==================== CALCULATE PLAYOFF ODDS ====================
      - name: Calculate playoff odds
        if: steps.import.outputs.exit_code == '0' && steps.matchup_rows.outputs.matchup_count != '0'
        run: |
          cd fantasy_football_data_scripts
          python -m multi_league.transformations.matchup.playoff_odds_import \
            --db ${{ env.DB_NAME }} \
            --data-dir ${{ env.DATA_DIR }} \
            --n-sims 10000

      # ==================== RUN AGGREGATIONS ====================
      - name: Run aggregations
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python ../scripts/refresh_aggregates.py \
            --db ${{ steps.parse.outputs.database_name }} \
            --data-dir ${{ env.DATA_DIR }}

      # ==================== UPLOAD LEAGUE DATA ====================
      - name: Upload league data
        if: steps.import.outputs.exit_code == '0'
        run: |
          cd fantasy_football_data_scripts
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, '.')
          from multi_league.core.local_db import LocalLeagueDB

          data_dir = os.environ['DATA_DIR']
          db_name = os.environ['DB_NAME']
          db = LocalLeagueDB(data_dir, db_name)
          db.connect()

          db.upload_to_fly(db_name)
          print('Upload to Fly complete')

          db.close()
          PYEOF

      # ==================== REVALIDATE + WARM VERCEL CACHE ====================
      - name: Revalidate and warm Vercel cache
        if: steps.import.outputs.exit_code == '0'
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          DB_NAME: ${{ env.DB_NAME }}
        run: |
          python scripts/warm_vercel_cache.py \
            --db "$DB_NAME" \
            --secret "$REVALIDATION_SECRET" \
            --site-url "https://www.leaguehistory.app" \
            --mode quick \
            --strategy expire \
            --jitter-seconds 0 \
            --warm-attempts 2 \
            --strict \
            --soft-warm-failures \
            --verify-hot

      # ==================== STORE CREDENTIALS ====================
      # Always store credentials, even if import fails — they're needed for
      # future re-imports and weekly updates. store_league_credentials uses
      # INSERT OR REPLACE so re-runs are idempotent.
      - name: Store credentials for weekly updates
        if: always()
        env:
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          DATABASE_NAME: ${{ steps.parse.outputs.database_name }}
          LEAGUE_ID: ${{ steps.parse.outputs.league_id }}
          LEAGUE_NAME: ${{ steps.parse.outputs.league_name }}
        run: |
          if [ -z "$CREDENTIAL_ENCRYPTION_KEY" ]; then
            echo "CREDENTIAL_ENCRYPTION_KEY not set - skipping"
            exit 0
          fi

          python - <<'PYEOF'
          import json
          import sys
          sys.path.insert(0, 'fantasy_football_data_scripts')

          from multi_league.utils.credential_store import store_league_credentials
          import os

          with open("oauth/Oauth.json", 'r') as f:
              oauth_data = json.load(f)

          refresh_token = oauth_data.get('refresh_token')
          if not refresh_token:
              exit(0)

          success = store_league_credentials(
              database_name=os.environ['DATABASE_NAME'],
              refresh_token=refresh_token,
              league_id=os.environ['LEAGUE_ID'],
              league_name=os.environ['LEAGUE_NAME']
          )
          if success:
              print("Credentials stored")
          else:
              print("Credentials were not stored")
          PYEOF

      # ==================== UPDATE JOB STATUS - FINAL ====================

      # ==================== UPLOAD ARTIFACTS ====================
      # G10 remediation (2026-07-06): artifact upload removed. Logs and
      # data files on a PUBLIC repo are downloadable by any GitHub user
      # and contained league/manager-identifying data. Diagnostics belong
      # in PRIVATE storage (see weekly-update-system-plan.md, G10).
