name: Scan matchup join gaps

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
      years:
        description: Space-separated seasons to scan
        required: true
        default: '2024'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - name: Scan strict and fallback joins
        shell: bash
        env:
          YEARS: ${{ inputs.years }}
        run: |
          set -euo pipefail
          python code/scripts/research_cohorts/scan_matchup_join_gaps.py \
            --root research_public_lake --years ${YEARS} --out matchup_join_gap_scan.json
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-join-gap-scan-${{ github.run_id }}
          path: matchup_join_gap_scan.json
          if-no-files-found: error
