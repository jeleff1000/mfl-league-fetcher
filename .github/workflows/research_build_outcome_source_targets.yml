name: Build outcome source target manifest

on:
  workflow_dispatch:
    inputs:
      outcome_run_id_a:
        required: true
        default: "31059385445"
      outcome_run_id_b:
        required: true
        default: "31060749133"
      base_cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical-final
      exclude_source_run_id:
        description: Optional completed source rescue run whose successful targets should be excluded
        required: false
        default: ""
      include_continuation:
        description: Include the 90000-plus continuation slice
        required: false
        default: "false"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download target inventories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/a inputs/b
          gh run download '${{ inputs.outcome_run_id_a }}' --repo '${{ github.repository }}' --name research-outcome-targets-combined-0-90000 --dir inputs/a
          if [ '${{ inputs.include_continuation }}' = 'true' ]; then
            gh run download '${{ inputs.outcome_run_id_b }}' --repo '${{ github.repository }}' --name research-outcome-targets-combined-90000-1145460 --dir inputs/b
          fi
      - name: Build source manifest
        run: |
          mkdir -p out
          ARGS=(
            --snapshot research_public_lake/corpus_snapshot.duckdb
            --input inputs/a/outcome_targets_0_90000.parquet
            --out out/outcome_source_targets.json
          )
          if [ '${{ inputs.include_continuation }}' = 'true' ]; then
            ARGS+=(--input inputs/b/outcome_targets_90000_1145460.parquet)
          fi
          python code/scripts/research_cohorts/build_outcome_source_targets.py \
            "${ARGS[@]}"
      - name: Exclude already successful source targets
        if: inputs.exclude_source_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p exclude
          gh run download '${{ inputs.exclude_source_run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'research-source-matchup-rescue-*' \
            --dir exclude
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('out/outcome_source_targets.json')
          payload = json.loads(manifest.read_text())
          done = set()
          for path in Path('exclude').rglob('*.jsonl'):
              for line in path.read_text().splitlines():
                  if line.strip():
                      row = json.loads(line)
                      if row.get('status') == 'done':
                          done.add((str(row['db_name']), int(row['year'])))
          before = len(payload['targets'])
          payload['targets'] = [r for r in payload['targets'] if (str(r['db_name']), int(r['year'])) not in done]
          payload['target_rows'] = sum(int(r['target_rows']) for r in payload['targets'])
          manifest.write_text(json.dumps(payload, indent=2) + '\n')
          print({'excluded_successful_league_years': before - len(payload['targets']), 'remaining': len(payload['targets']), 'player_week_targets': payload['target_rows']})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-outcome-source-target-manifest-${{ github.run_id }}
          path: out/outcome_source_targets.json
          if-no-files-found: error
          retention-days: 30
