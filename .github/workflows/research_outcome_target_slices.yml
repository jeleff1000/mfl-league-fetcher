name: Research Outcome Sidecar Target Slices

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      max_rows:
        required: true
        default: "90000"
      start_row:
        description: Inclusive global target ordinal; use 90000 for the continuation pass
        required: true
        default: "0"
      shard_count:
        required: true
        default: "256"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - id: matrix
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shard_count }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARD_COUNT"])
          if n <= 0 or n > 256: raise SystemExit("shard_count must be 1..256")
          print("shards=" + json.dumps(list(range(n))))
          PY
  slice:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1
      - run: |
          mkdir -p out
          python code/scripts/research_cohorts/materialize_outcome_targets.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --out "out/outcome_targets_${{ matrix.shard }}.parquet" \
            --start-row '${{ inputs.start_row }}' \
            --max-rows '${{ inputs.max_rows }}' \
            --shard-index '${{ matrix.shard }}' \
            --shard-count '${{ inputs.shard_count }}'
      - uses: actions/upload-artifact@v4
        with:
          name: research-outcome-targets-${{ matrix.shard }}-${{ github.run_id }}
          path: out/outcome_targets_*.parquet
          if-no-files-found: error
          retention-days: 14
