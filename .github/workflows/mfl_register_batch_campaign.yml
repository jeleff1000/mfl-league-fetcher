        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/cache/restore@v5
        with:
          path: chunk_state
          key: ${{ inputs.cache_namespace }}-chunk-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          fail-on-cache-miss: true
      - name: Restore exact saved chunk index
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/cache/restore@v5
        with:
          path: index_state
          key: ${{ inputs.cache_namespace }}-index-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          fail-on-cache-miss: true
      - name: Restore exact canonical successor chunk
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/cache/restore@v5
        with:
          path: canonical_chunk_state
          key: ${{ inputs.canonical_namespace }}-chunk-campaign-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Restore exact canonical successor index
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/cache/restore@v5
        with:
          path: canonical_index_state
          key: ${{ inputs.canonical_namespace }}-index-campaign-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Restore exact canonical successor overlay
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        uses: actions/cache/restore@v5
        with:
          path: canonical_research_overlay_state
          key: ${{ inputs.canonical_namespace }}-research-overlay-campaign-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Validate live cumulative cache append proof
        if: ${{ inputs.storage_mode == 'snapshot' }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('prior_state')
          proof=json.loads((root/'cache_append_proof.json').read_text(encoding='utf-8'))
          required={'schema_unchanged':True,'prior_rows_preserved':True,'new_lineage':False,'duplicate_league_year_keys':False}
          for key,value in required.items():
              if proof.get(key) != value:
                  raise SystemExit(f'live cache proof failed: {key}={proof.get(key)!r}')
          for table,before in proof['prior_rows'].items():
              added=proof['added_rows'].get(table,0)
              final=proof['final_rows'].get(table,0)
              if final-before != added:
                  raise SystemExit(f'live cache proof row delta failed: {table}')
           print(json.dumps({'live_cache_validated':True, **proof}, sort_keys=True))
           PY
      - name: Validate live chunk append proof
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          chunk=pathlib.Path('chunk_state')
          index=pathlib.Path('index_state')
          proof=json.loads((chunk/'cache_append_proof.json').read_text(encoding='utf-8'))
          register=json.loads((index/'mfl_register_all_runs.json').read_text(encoding='utf-8'))
          required={'schema_unchanged':True,'prior_rows_preserved':True,'new_lineage':False,'duplicate_league_year_keys':False}
          for key,value in required.items():
              if proof.get(key) != value:
                  raise SystemExit(f'live chunk proof failed: {key}={proof.get(key)!r}')
          if register.get('league_count') != proof.get('final_league_count'):
              raise SystemExit('live chunk index league count mismatch')
          if not any(c.get('cache_key') == proof.get('chunk_cache_key') for c in register.get('chunks', [])):
              raise SystemExit('live chunk index does not reference the saved chunk')
          for table,before in proof['prior_rows'].items():
              if proof['final_rows'].get(table,0)-before != proof['added_rows'].get(table,0):
                  raise SystemExit(f'live chunk row delta failed: {table}')
          print(json.dumps({'live_cache_validated':True, **proof}, sort_keys=True))
          PY
      - name: Validate canonical successor cache
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          chunk=pathlib.Path('canonical_chunk_state')
          index=pathlib.Path('canonical_index_state')
          overlay=pathlib.Path('canonical_research_overlay_state')
          proof=json.loads((chunk/'canonical_append_proof.json').read_text(encoding='utf-8'))
          register=json.loads((index/'canonical_mfl_register_all_runs.json').read_text(encoding='utf-8'))
          required={'schema_unchanged':True,'prior_rows_preserved':True,'new_lineage':False,'duplicate_league_year_keys':False}
          for key,value in required.items():
              if proof.get(key) != value:
                  raise SystemExit(f'canonical proof failed: {key}={proof.get(key)!r}')
          if proof.get('added_league_count', 0) <= 0:
              raise SystemExit('canonical successor added no leagues')
          if register.get('league_count') != proof.get('final_league_count'):
              raise SystemExit('canonical successor index league count mismatch')
          if not any(c.get('cache_key') == proof.get('chunk_cache_key') for c in register.get('chunks', [])):
              raise SystemExit('canonical successor index does not reference its chunk')
          overlay_proof=json.loads((overlay/'canonical_mfl_research_overlay_proof.json').read_text(encoding='utf-8'))
          if overlay_proof.get('schema_unchanged') is not True or overlay_proof.get('new_lineage') is not False:
              raise SystemExit('canonical research overlay proof failed')
          print(json.dumps({'canonical_cache_validated':True, **proof}, sort_keys=True))
          PY
      - name: Dispatch next batch wave after live validation
        if: ${{ inputs.continue_population == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          BATCH_START: ${{ inputs.batch_start }}
          BATCH_COUNT: ${{ inputs.batch_count }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          POPULATION_TOTAL: ${{ inputs.population_total }}
          CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
          CANONICAL_NAMESPACE: ${{ inputs.canonical_namespace }}
          TARGET_PER_YEAR: ${{ inputs.target_per_year }}
          TARGET_YEARS: ${{ inputs.target_years }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          MFL_RATE: ${{ inputs.mfl_rate_limit }}
          COLLECT_ALL: ${{ inputs.collect_all }}
          CURRENT_STATE_KEY: ${{ inputs.cache_namespace }}-state-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          CURRENT_INDEX_KEY: ${{ inputs.cache_namespace }}-index-${{ inputs.batch_start }}-${{ inputs.batch_count }}${{ inputs.attempt_suffix }}
          CANONICAL_INDEX_KEY: ${{ inputs.canonical_namespace }}-index-campaign-${{ github.run_id }}
          ATTEMPT_SUFFIX: ${{ inputs.attempt_suffix }}
          STORAGE_MODE: ${{ inputs.storage_mode }}
        run: |
          if [ "$STORAGE_MODE" = chunked ] || [ "$STORAGE_MODE" = fetch_only ]; then ROOT=index_state; else ROOT=prior_state; fi
          export ROOT
          state=$(python3 -c 'import json,os; print(json.dumps(json.load(open(os.path.join(os.environ["ROOT"],"mfl_register_all_runs.json"),encoding="utf-8")).get("accepted_by_year",{}),separators=(",",":")))')
          complete=$(python3 -c 'import json,os; d=json.load(open(os.path.join(os.environ["ROOT"],"mfl_register_all_runs.json"),encoding="utf-8")); print("true" if d.get("complete_targets") else "false")')
          total=${POPULATION_TOTAL:-0}; next=$((BATCH_START+BATCH_COUNT))
          if [ "$complete" = true ] || [ "$total" -le 0 ] || [ "$((next*BATCH_SIZE))" -ge "$total" ]; then exit 0; fi
          if [ "$STORAGE_MODE" = chunked ] || [ "$STORAGE_MODE" = fetch_only ]; then
            PRIOR_INDEX_KEY="$CANONICAL_INDEX_KEY"
            PRIOR_INDEX_CACHE_PATH=canonical_index_state
          else
            PRIOR_INDEX_KEY="$CURRENT_INDEX_KEY"
            PRIOR_INDEX_CACHE_PATH=index_state
          fi
          gh workflow run mfl_register_batch_campaign.yml --repo "$REPOSITORY" --ref "$REF_NAME" \
            --raw-field manifest_path="$MANIFEST_PATH" \
            --raw-field batch_start="$next" --raw-field batch_count="$BATCH_COUNT" --raw-field batch_size="$BATCH_SIZE" \
            --raw-field max_parallel="$MAX_PARALLEL" --raw-field cache_namespace="$CACHE_NAMESPACE" \
            --raw-field canonical_namespace="$CANONICAL_NAMESPACE" \
            --raw-field continue_population=true --raw-field population_total="$total" \
            --raw-field accepted_by_year="$state" --raw-field target_per_year="$TARGET_PER_YEAR" \
            --raw-field target_years="$TARGET_YEARS" --raw-field mfl_rate_limit="$MFL_RATE" \
            --raw-field collect_all="$COLLECT_ALL" \
            --raw-field storage_mode="$STORAGE_MODE" --raw-field prior_state_key="$CURRENT_STATE_KEY" \
            --raw-field prior_index_key="$PRIOR_INDEX_KEY" --raw-field prior_index_cache_path="$PRIOR_INDEX_CACHE_PATH" \
            --raw-field attempt_suffix="$ATTEMPT_SUFFIX"
      - name: Trigger watchdog after campaign completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 336916468 --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || true
