name: Draft Score Backfill Worker

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Apply score, aggregate, and homepage updates"
        required: true
        type: boolean
        default: false
      db_names:
        description: "Optional comma/newline-separated db_name list. Leave blank for fleet."
        required: false
        type: string
      skip_aggregates:
        description: "Skip draft aggregate table rebuilds"
        required: true
        type: boolean
        default: false
      skip_homepage:
        description: "Skip homepage draft highlight refresh"
        required: true
        type: boolean
        default: false
      timeout_seconds:
        description: "Fly write timeout per phase"
        required: false
        type: string
        default: "1800"
permissions:
  contents: read

jobs:
  draft-score-bulk-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      DRAFT_SCORE_BULK_MAX_RETRIES: "2"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate virtualenv
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Run bulk draft score backfill
        env:
          EXECUTE: ${{ inputs.execute }}
          DB_NAMES: ${{ inputs.db_names }}
          SKIP_AGGREGATES: ${{ inputs.skip_aggregates }}
          SKIP_HOMEPAGE: ${{ inputs.skip_homepage }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          args=(--timeout-seconds "${TIMEOUT_SECONDS}")
          if [ "${EXECUTE}" = "true" ]; then
            args+=(--apply)
          else
            args+=(--dry-run)
          fi
          if [ "${SKIP_AGGREGATES}" = "true" ]; then
            args+=(--skip-aggregates)
          fi
          if [ "${SKIP_HOMEPAGE}" = "true" ]; then
            args+=(--skip-homepage)
          fi
          normalized_db_names="${DB_NAMES//$'\n'/,}"
          if [ -n "${normalized_db_names}" ]; then
            args+=(--db "${normalized_db_names}")
          fi
          python scripts/bulk_backfill_draft_scores.py "${args[@]}"

      - name: Summary
        if: always()
        run: |
          echo "# Draft Score Bulk Backfill" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Execute: ${{ inputs.execute }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: ${{ inputs.db_names || 'fleet' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skip aggregates: ${{ inputs.skip_aggregates }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skip homepage: ${{ inputs.skip_homepage }}" >> "$GITHUB_STEP_SUMMARY"
