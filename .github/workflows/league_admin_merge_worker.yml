name: League Admin Merge Worker

on:
  workflow_dispatch:
    inputs:
      merge_data_b64:
        description: 'Base64-encoded JSON with source_db, target_db, and merge_years'
        required: true
        type: string
      user_id:
        description: 'Unique identifier for this merge job'
        required: true
        type: string
      import_lock_key:
        description: 'Stable merge concurrency key, usually target/source db names'
        required: false
        type: string
  repository_dispatch:
    types: [league_admin_merge]


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key || github.event.inputs.user_id || github.event.client_payload.user_id || github.run_id }}
  cancel-in-progress: false

jobs:
  merge-league:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run league merge
        env:
          MERGE_DATA_B64: ${{ github.event.inputs.merge_data_b64 || github.event.client_payload.merge_data_b64 }}
        run: python scripts/merge_league_admin.py
