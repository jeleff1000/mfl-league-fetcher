name: Research matchup compact CMC cache gates

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      run_career_benchmark:
        description: Run the intentionally unoptimized all-years CMC benchmark.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cache_only_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Inventory bounded RB 2025 batch input from cache
        run: |
          python - <<'PY'
          import duckdb, json
          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          summary = c.execute("""
            SELECT
              COUNT(*)::BIGINT AS source_rows,
              COUNT(DISTINCT CAST(NFL_player_id AS VARCHAR))::BIGINT AS players,
              COUNT(DISTINCT CAST(db_name AS VARCHAR))::BIGINT AS leagues,
              COUNT(DISTINCT (CAST(NFL_player_id AS VARCHAR), CAST(db_name AS VARCHAR), CAST(week AS INTEGER)))::BIGINT
                AS player_league_weeks,
              COUNT(DISTINCT CAST(week AS INTEGER))::BIGINT AS source_weeks
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER) = 2025 AND CAST(position AS VARCHAR) = 'RB'
          """).fetchone()
          weekly = c.execute("""
            SELECT CAST(week AS INTEGER) AS week,
              COUNT(DISTINCT CAST(db_name AS VARCHAR)) FILTER (WHERE CAST(cohort_position_eligible AS INTEGER) = 1)::BIGINT
                AS eligible_rb_leagues
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER) = 2025 AND CAST(position AS VARCHAR) = 'RB'
            GROUP BY 1 ORDER BY 1
          """).fetchall()
          selector_cardinality = c.execute("""
            SELECT
              COUNT(DISTINCT CAST(cohort_teams AS VARCHAR)) AS teams,
              COUNT(DISTINCT CAST(cohort_roster AS VARCHAR)) AS roster,
              COUNT(DISTINCT CAST(cohort_scoring AS VARCHAR)) AS scoring,
              COUNT(DISTINCT CAST(cohort_pass_td AS VARCHAR)) AS pass_td,
              COUNT(DISTINCT CAST(cohort_dynasty AS VARCHAR)) AS dynasty,
              COUNT(DISTINCT CAST(cohort_best_ball AS VARCHAR)) AS best_ball
            FROM lake.public.player_fantasy
            WHERE CAST(year AS INTEGER) = 2025 AND CAST(position AS VARCHAR) = 'RB'
          """).fetchone()
          print('rb_2025_cache_preflight=' + json.dumps({
              'summary': summary, 'weekly_eligible': weekly,
              'selector_cardinality': selector_cardinality,
          }, default=str))
          assert summary[0] > 0 and summary[1] > 0 and summary[2] >= 5000, summary
          assert weekly[0] == (1, 9838), weekly
          assert all(count >= 150 for observed_week, count in weekly if 1 <= observed_week <= 18), weekly
          PY
      - name: Print cache-only cohort and active-bye contract
        run: |
          python - <<'PY'
          import duckdb, json
          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          def emit(name, sql):
              print(name + '=' + json.dumps(c.execute(sql).fetchall(), default=str))
          emit('player_fantasy_cohort_contract', """
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='lake' AND table_schema='public' AND table_name='player_fantasy'
              AND (column_name LIKE 'cohort\\_%' ESCAPE '\\' OR column_name IN ('position','is_rostered','is_started','win','champion','is_playoffs','made_playoffs','clutch_equity'))
            ORDER BY ordinal_position
          """)
          emit('ops_player_activity_contract', """
            SELECT column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='ops' AND table_schema='nfl_historical' AND table_name='nfl_player_stats_all'
              AND (lower(column_name) LIKE '%team%' OR lower(column_name) LIKE '%snap%' OR column_name IN ('NFL_player_id','year','week','position','season_type'))
            ORDER BY ordinal_position
          """)
          emit('ops_bye_contract', """
            SELECT table_schema, table_name, column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='ops'
              AND (lower(table_name) LIKE '%bye%' OR lower(column_name) LIKE '%bye%')
            ORDER BY table_schema, table_name, ordinal_position
          """)
          emit('ops_table_catalog', """
            SELECT table_schema, table_name
            FROM information_schema.tables
            WHERE table_catalog='ops'
            ORDER BY table_schema, table_name
          """)
          emit('lake_bye_or_schedule_contract', """
            SELECT table_schema, table_name, column_name, data_type
            FROM information_schema.columns
            WHERE table_catalog='lake'
              AND (lower(table_name) LIKE '%bye%' OR lower(table_name) LIKE '%schedule%'
                   OR lower(column_name) LIKE '%bye%')
            ORDER BY table_schema, table_name, ordinal_position
          """)
          fanout_columns = ", ".join(
              f"cohort_{dimension}_{slot}"
              for slot in range(1, 13)
              for dimension in ('teams', 'roster', 'scoring', 'pass_td', 'playoff_teams', 'dynasty', 'best_ball', 'position_eligible')
          )
          emit('cmc_week1_fanout_sample',
               "SELECT " + fanout_columns + " FROM lake.public.player_fantasy "
               "WHERE NFL_player_id='00-0033280' AND year=2025 AND week=1 LIMIT 1")
          PY
      - name: Run tested compact outer-row primitive against cache
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_outer_rows

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          materialize_weekly_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              output_table='cmc_week1_outer',
              year=2025,
              week=1,
              player_id='00-0033280',
          )
          rows = c.execute("""
            SELECT o.NFL_player_id, o.year, o.week, o.position,
              cell.cohort_key, cell.rostered_leagues, cell.started_leagues,
              cell.eligible_leagues, cell.valid_started_outcomes,
              cell.win_equivalent, cell.roster_rate_pct, cell.start_rate_pct,
              cell.win_rate_pct, cell.expected_starts, cell.expected_wins,
              cell.expected_losses, cell.clutch_weekly_average
            FROM cmc_week1_outer o, UNNEST(o.cohort_cells) AS u(cell)
          """).fetchall()
          assert len(rows) == 1, rows
          columns = [d[0] for d in c.description]
          row = dict(zip(columns, rows[0]))
          expected = {
              'NFL_player_id': '00-0033280', 'year': 2025, 'week': 1,
              'position': 'RB', 'cohort_key': 'ALL',
              'rostered_leagues': 9768, 'started_leagues': 9600,
              'eligible_leagues': 9838, 'valid_started_outcomes': 9578,
              'win_equivalent': 6019.0,
          }
          for key, value in expected.items():
              assert row[key] == value, (key, row, expected)
          floats = {
              'roster_rate_pct': 99.28847326692417,
              'start_rate_pct': 97.58080910754218,
              'win_rate_pct': 62.841929421591146,
              'expected_starts': 0.9758080910754219,
              'expected_wins': 0.6132166318837924,
          }
          for key, value in floats.items():
              assert abs(row[key] - value) < 1e-9, (key, row, floats)
          print('cmc_2025_week1_compact_outer=' + json.dumps(row, default=str))
          PY
      - name: Fail fast on all real CMC 2025 player weeks
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_outer_rows

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          raw_source_weeks = c.execute("""
            SELECT CAST(week AS INTEGER), COUNT(*)::BIGINT
            FROM lake.public.player_fantasy
            WHERE NFL_player_id='00-0033280' AND CAST(year AS INTEGER)=2025
            GROUP BY 1 ORDER BY 1
          """).fetchall()
          assert sum(count for _, count in raw_source_weeks) == 167625, raw_source_weeks
          c.execute("""
            CREATE TEMP TABLE cached_regular_player_weeks AS
            SELECT DISTINCT
              CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
              CAST(year AS INTEGER) AS year,
              CAST(week AS INTEGER) AS week
            FROM ops.nfl_historical.nfl_player_stats_all
            WHERE CAST(year AS INTEGER)=2025
              AND COALESCE(season_type, 'REG')='REG'
              AND NFL_player_id IS NOT NULL AND week IS NOT NULL
          """)
          source_weeks = c.execute("""
            SELECT week
            FROM cached_regular_player_weeks
            WHERE NFL_player_id='00-0033280'
            ORDER BY week
          """).fetchall()
          expected_weeks = list(range(1, 14)) + list(range(15, 19))
          assert [week for (week,) in source_weeks] == expected_weeks, source_weeks
          materialize_weekly_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              valid_player_weeks_table='cached_regular_player_weeks',
              output_table='cmc_2025_outer',
              year=2025,
              week=None,
              player_id='00-0033280',
          )
          outer_rows = c.execute("""
            SELECT NFL_player_id, year, week, position, array_length(cohort_cells)
            FROM cmc_2025_outer ORDER BY week
          """).fetchall()
          assert len(outer_rows) == 17, outer_rows
          assert [(row[0], row[1], row[2], row[3]) for row in outer_rows] == [
              ('00-0033280', 2025, week, 'RB') for week in expected_weeks
          ], outer_rows
          assert all(cell_count == 1 for *_, cell_count in outer_rows), outer_rows
          print('cmc_2025_compact_outer=' + json.dumps({
              'raw_source_week_counts': raw_source_weeks,
              'cached_regular_weeks': source_weeks,
              'outer_rows': outer_rows,
          }, default=str))
          PY
      - name: Resolve real CMC week 1 core cohort cells independently
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_core_cohort_cells

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          materialize_weekly_core_cohort_cells(
              c,
              source_table='lake.public.player_fantasy',
              output_table='cmc_week1_core_cells',
              year=2025,
              week=1,
              player_id='00-0033280',
              split_threshold=150,
          )
          rows = c.execute("""
            SELECT
              o.NFL_player_id, o.year, o.week, o.position,
              cell.q_teams, cell.q_roster, cell.q_scoring, cell.q_pass_td,
              cell.q_dynasty, cell.q_best_ball, cell.eligible_leagues,
              cell.rostered_leagues, cell.started_leagues, cell.valid_started_outcomes,
              cell.win_equivalent, cell.roster_rate_pct, cell.start_rate_pct,
              cell.win_rate_pct, cell.expected_starts, cell.expected_wins,
              cell.expected_losses, cell.clutch_weekly_average
            FROM cmc_week1_core_cells o, UNNEST(o.cohort_cells) AS u(cell)
            ORDER BY cell.q_teams, cell.q_roster, cell.q_scoring, cell.q_pass_td,
              cell.q_dynasty, cell.q_best_ball
          """).fetchall()
          assert rows and {row[0] for row in rows} == {'00-0033280'}, rows
          columns = [d[0] for d in c.description]
          records = [dict(zip(columns, row)) for row in rows]
          keys = [
              (r['q_teams'], r['q_roster'], r['q_scoring'], r['q_pass_td'], r['q_dynasty'], r['q_best_ball'])
              for r in records
          ]
          assert len(keys) == len(set(keys)), keys
          selected = [r for r in records if (
              r['q_teams'], r['q_roster'], r['q_scoring'], r['q_pass_td'], r['q_dynasty'], r['q_best_ball']
          ) == ('12t', 'flx', 'half', '4pt', 'redraft', 'managed')]
          # This is the explicit Dynasty + Best Ball filter, not the unfiltered
          # default.  It must clear the weekly split floor on its own.
          assert len(selected) == 1 and selected[0]['eligible_leagues'] >= 150, selected
          assert 'q_playoff_teams' not in selected[0], selected[0]
          full_pool = [r for r in records if (
              r['q_teams'], r['q_roster'], r['q_scoring'], r['q_pass_td'], r['q_dynasty'], r['q_best_ball']
          ) == ('ALL', 'ALL', 'ALL', 'ALL', 'ALL', 'ALL')]
          assert len(full_pool) == 1, full_pool
          full = full_pool[0]
          assert (
              full['eligible_leagues'], full['rostered_leagues'], full['started_leagues'],
              full['valid_started_outcomes'], full['win_equivalent']
          ) == (9838, 9768, 9600, 9578, 6019.0), full
          assert abs(full['roster_rate_pct'] - 99.28847326692417) < 1e-9, full
          assert abs(full['start_rate_pct'] - 97.58080910754218) < 1e-9, full
          assert abs(full['win_rate_pct'] - 62.841929421591146) < 1e-9, full
          print('cmc_2025_week1_core_cells=' + json.dumps(records, default=str))
          PY
      - name: Materialize one real CMC 2025 season record for cache validation
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_season_outer_rows

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='cmc_2025_season_outer',
              year=2025,
              player_id='00-0033280',
          )
          rows = c.execute("""
            SELECT o.NFL_player_id, o.year, o.position, cell.*
            FROM cmc_2025_season_outer o, UNNEST(o.cohort_cells) AS u(cell)
          """).fetchall()
          assert len(rows) == 1, rows
          columns = [d[0] for d in c.description]
          row = dict(zip(columns, rows[0]))
          assert row['NFL_player_id'] == '00-0033280', row
          assert row['year'] == 2025 and row['position'] == 'RB', row
          assert row['cohort_key'] == 'ALL', row
          integers = {
              'eligible_leagues': 9980,
              'rostered_league_weeks': 157712,
              'eligible_league_weeks': 158687,
              'started_league_weeks': 155272,
              'valid_started_outcomes': 149661,
              'win_equivalent': 91505.0,
              'playoff_leagues': 6853,
              'champ_leagues': 2031,
              'active_weeks': 17,
              'inactive_weeks': 0,
          }
          for key, expected in integers.items():
              assert row[key] == expected, (key, row)
          floats = {
              'roster_rate_pct': 99.38558294000138,
              'start_rate_pct': 97.84796486164588,
              'healthy_start_rate_pct': 97.84796486164588,
              'win_rate_pct': 61.14151315305925,
              'expected_starts': 16.634154026479802,
              'expected_wins': 10.170373472000282,
              'expected_losses': 6.46378055447952,
              'clutch_season_sum': 10.5456027157515,
              'playoff_rate_pct': 68.66733466933867,
              'champ_rate_pct': 20.350701402805612,
          }
          for key, expected in floats.items():
              assert abs(row[key] - expected) < 1e-9, (key, row)
          assert abs(row['expected_wins'] + row['expected_losses'] - row['expected_starts']) < 1e-9, row
          assert 0 <= row['champ_leagues'] <= row['playoff_leagues'] <= row['eligible_leagues'], row
          print('cmc_2025_season_compact_outer=' + json.dumps(row, default=str))
          PY
      - name: Resolve CMC 2025 season core cohort cells independently
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_season_core_cohort_cells

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_core_cohort_cells(
              c,
              source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='cmc_2025_season_core_cells',
              year=2025,
              player_id='00-0033280',
              split_threshold=50,
          )
          outer_count, cell_count = c.execute("""
            SELECT COUNT(*), SUM(array_length(cohort_cells))
            FROM cmc_2025_season_core_cells
          """).fetchone()
          assert outer_count == 1 and cell_count > 0, (outer_count, cell_count)
          row = c.execute("""
            SELECT
              cell.eligible_leagues, cell.rostered_league_weeks,
              cell.eligible_league_weeks, cell.started_league_weeks,
              cell.healthy_started_league_weeks, cell.healthy_eligible_league_weeks,
              cell.valid_started_outcomes, cell.win_equivalent,
              cell.roster_rate_pct, cell.start_rate_pct, cell.healthy_start_rate_pct,
              cell.win_rate_pct, cell.expected_starts, cell.expected_wins,
              cell.expected_losses, cell.clutch_season_sum,
              cell.active_weeks, cell.inactive_weeks
            FROM cmc_2025_season_core_cells o, UNNEST(o.cohort_cells) AS u(cell)
            WHERE cell.q_teams = 'ALL' AND cell.q_roster = 'ALL'
              AND cell.q_scoring = 'ALL' AND cell.q_pass_td = 'ALL'
              AND cell.q_dynasty = 'ALL' AND cell.q_best_ball = 'ALL'
          """).fetchone()
          assert row is not None, row
          expected = (9980, 157712, 158687, 155272, 155272, 158687, 149661, 91505.0)
          assert row[:8] == expected, row
          expected_floats = (99.38558294000138, 97.84796486164588, 97.84796486164588,
                             61.14151315305925, 16.634154026479802, 10.170373472000282,
                             6.46378055447952, 10.5456027157515)
          assert all(abs(actual - expected) < 1e-9 for actual, expected in zip(row[8:16], expected_floats)), row
          assert row[16:] == (17, 0), row
          print('cmc_2025_season_core_full_pool=' + json.dumps({
              'outer_count': outer_count, 'cell_count': cell_count,
              'full_pool': row,
          }, default=str))
          PY
      - name: Pilot factorized RB 2025 season batch from cache
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_season_core_cohort_position_batch
          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_core_cohort_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='rb_2025_season_batch', year=2025, position='RB', split_threshold=50,
          )
          outer_rows = c.execute('SELECT COUNT(*) FROM rb_2025_season_batch').fetchone()[0]
          matched_regular_players = c.execute("""
            SELECT COUNT(DISTINCT CAST(p.NFL_player_id AS VARCHAR))
            FROM lake.public.player_fantasy p
            INNER JOIN ops.nfl_historical.nfl_player_stats_all s
              ON CAST(s.NFL_player_id AS VARCHAR)=CAST(p.NFL_player_id AS VARCHAR)
             AND CAST(s.year AS INTEGER)=CAST(p.year AS INTEGER)
             AND COALESCE(s.season_type, 'REG')='REG'
            WHERE CAST(p.year AS INTEGER)=2025 AND CAST(p.position AS VARCHAR)='RB'
          """).fetchone()[0]
          assert outer_rows == matched_regular_players == 164, (outer_rows, matched_regular_players)
          cmc = c.execute("""
            SELECT cell.eligible_leagues, cell.rostered_league_weeks,
              cell.eligible_league_weeks, cell.started_league_weeks,
              cell.valid_started_outcomes, cell.win_equivalent,
              cell.active_weeks, cell.inactive_weeks
            FROM rb_2025_season_batch o, UNNEST(o.cohort_cells) AS u(cell)
            WHERE o.NFL_player_id='00-0033280'
              AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL'
              AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'
          """).fetchone()
          assert cmc == (9980, 157712, 158687, 155272, 149661, 91505.0, 17, 0), cmc
          cells = c.execute("SELECT SUM(array_length(cohort_cells)) FROM rb_2025_season_batch").fetchone()[0]
          print('rb_2025_factorized_batch=' + json.dumps({'outer_rows': outer_rows, 'matched_regular_players': matched_regular_players, 'cells': cells, 'cmc_full_pool': cmc}))
          PY
      - name: Pilot factorized RB 2025 bracket-grade batch
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb
          from scripts.research_cohorts.compact_matchup_cells import materialize_season_bracket_grade_position_batch
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_bracket_grade_position_batch(c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all', output_table='rb_2025_grade_batch', year=2025, position='RB')
          assert c.execute('SELECT COUNT(*) FROM rb_2025_grade_batch').fetchone()[0] == 164
          cmc=c.execute("""SELECT cell.eligible_leagues,cell.playoff_leagues,cell.champ_leagues FROM rb_2025_grade_batch o,UNNEST(o.grade_cells) u(cell) WHERE o.NFL_player_id='00-0033280' AND cell.q_playoff_teams='ALL'""").fetchone()
          assert cmc == (9980,6853,2031), cmc
          print('rb_2025_grade_batch_cmc_all=' + str(cmc))
          PY
      - name: Resolve CMC 2025 bracket-grade cells with full denominators
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_season_bracket_grade_cells

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_bracket_grade_cells(
              c,
              source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='cmc_2025_bracket_grades',
              year=2025,
              player_id='00-0033280',
              split_threshold=50,
          )
          rows = c.execute("""
            SELECT o.NFL_player_id, o.year, o.position,
              cell.q_playoff_teams, cell.eligible_leagues,
              cell.playoff_leagues, cell.champ_leagues,
              cell.playoff_rate_pct, cell.champ_rate_pct
            FROM cmc_2025_bracket_grades o, UNNEST(o.grade_cells) AS u(cell)
            ORDER BY cell.q_playoff_teams
          """).fetchall()
          assert rows and {row[0] for row in rows} == {'00-0033280'}, rows
          columns = [d[0] for d in c.description]
          records = [dict(zip(columns, row)) for row in rows]
          assert len({r['q_playoff_teams'] for r in records}) == len(records), records
          assert any(r['q_playoff_teams'] == '6po' for r in records), records
          for row in records:
              assert 0 <= row['champ_leagues'] <= row['playoff_leagues'] <= row['eligible_leagues'], row
              assert 0 <= row['champ_rate_pct'] <= row['playoff_rate_pct'] <= 100, row
          print('cmc_2025_bracket_grade_cells=' + json.dumps(records, default=str))
          PY
      - name: Fail fast on one real all-years CMC career record
