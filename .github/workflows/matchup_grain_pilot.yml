name: Matchup Grain Pilot - CMC Week 1

on:
  push:
    paths:
      - ".matchup_grain_pilot_dispatch_once"

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 requests
      - name: Build only CMC 2025 week 1
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/build_direct_matchup_cache.py             --snapshot research_public_lake/corpus_snapshot.duckdb             --ops-cache research_public_lake/ops_cache.duckdb             --output out/cmc_week1.duckdb             --year-start 2025 --year-end 2025             --position-group RB --player-id 00-0033280 --week 1             --threads 2 --memory-limit-mb 6000
      - name: Compare pilot to source and live Fly schema
        run: |
          python - <<'PY'
          import duckdb, json, os, requests
          source=duckdb.connect("research_public_lake/corpus_snapshot.duckdb", read_only=True)
          source_rows=source.execute("""
            select count(*) as row_count, count(distinct db_name) as leagues,
                   count(*) filter (where position is null) position_nulls
            from public.player_fantasy
            where NFL_player_id='00-0033280' and cast(year as integer)=2025 and cast(week as integer)=1
          """).fetchone()
          source.close()
          out=duckdb.connect("out/cmc_week1.duckdb", read_only=True)
          tables=[r[0] for r in out.execute("select table_name from information_schema.tables where table_schema='main'").fetchall()]
          weekly_cols=[r[0] for r in out.execute("describe research_matchup_adaptive_weekly").fetchall()]
          pilot=out.execute("""
            select count(*) as row_count, count(distinct q_teams || '|' || q_roster || '|' || q_ppr || '|' ||
              q_td || '|' || q_bracket || '|' || q_league_type || '|' || q_lineup_mode) lanes,
              count(*) filter (where NFL_player_id='00-0033280') cmc_rows,
              max(n_leagues) filter (where NFL_player_id='00-0033280') max_cmc_leagues
            from research_matchup_adaptive_weekly
          """).fetchone()
          out.close()
          def fly(sql):
              r=requests.post(os.environ["DATABASE_SERVER_URL"].rstrip("/")+"/query",
                headers={"Authorization":"Bearer "+os.environ["DATABASE_READ_TOKEN"]},
                json={"sql":sql,"database":"___ops"},timeout=75)
              r.raise_for_status()
              return r.json()
          live_cols=[r["column_name"] for r in fly("""
            select column_name from information_schema.columns
            where table_schema='nfl_historical'
              and table_name='research_matchup_adaptive_weekly'
            order by ordinal_position
          """)]
          missing=sorted(set(live_cols)-set(weekly_cols))
          extra=sorted(set(weekly_cols)-set(live_cols))
          print(json.dumps({"source_rows":source_rows,"output_tables":tables,
            "pilot_weekly":pilot,"output_columns":len(weekly_cols),
            "live_columns":len(live_cols),"missing_live_columns":missing,
            "extra_output_columns":extra},default=str,indent=2))
          assert source_rows[2] == 0
          assert not missing, missing
          assert not extra, extra
          assert pilot[2] > 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: matchup-grain-pilot-${{ github.run_id }}
          path: out/cmc_week1.duckdb
          retention-days: 1
          compression-level: 0
