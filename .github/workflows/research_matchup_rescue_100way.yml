name: Research Matchup Rescue 100-Way

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public-only corpus + ops cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        description: JSON list of seasons to rebuild (defaults to the two thickest seasons)
        required: true
        default: '[2024,2025]'
      buckets:
        description: Optional JSON list of modulo-100 bucket IDs; [] means all 100
        required: true
        default: '[]'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          YEARS: ${{ inputs.years }}
          BUCKETS: ${{ inputs.buckets }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          years = [int(y) for y in json.loads(os.environ["YEARS"])]
          requested = json.loads(os.environ["BUCKETS"])
          buckets = [int(b) for b in requested] if requested else list(range(100))
          if any(b < 0 or b >= 100 for b in buckets):
              raise SystemExit(f"bucket IDs must be in 0..99: {buckets}")
          matrix = [{"year": year, "bucket": bucket}
                    for year in years for bucket in buckets]
          if not matrix:
              raise SystemExit("empty rescue matrix")
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY

  matchup:
    needs: plan
    strategy:
      fail-fast: false
      # Keep the Actions pool available for validation/assembly jobs.
      max-parallel: 15
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ matrix.year }}
      RESEARCH_YEAR_END: ${{ matrix.year }}
      RESEARCH_LEAGUE_BUCKETS: "100"
      RESEARCH_LEAGUE_BUCKET: ${{ matrix.bucket }}
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: "1"
      RESEARCH_READER_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_THREADS: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1

      - name: Verify public-only inputs
        shell: bash
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out

      - name: Build matchup modulo-100 subshard
        run: python code/scripts/research_cohorts/build_research_matchup_cohort.py

      - name: Verify artifact year and bucket bounds
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb
          year = int(os.environ["RESEARCH_YEAR_START"])
          files = list(Path("out").glob("*.parquet"))
          assert files, "builder emitted no parquet"
          con = duckdb.connect()
          for path in files:
              cols = {r[0] for r in con.execute(
                  f"DESCRIBE SELECT * FROM read_parquet('{path.as_posix()}')").fetchall()}
              if "year" not in cols:
                  continue
              got = con.execute(
                  f"SELECT MIN(year), MAX(year), COUNT(*) FROM read_parquet('{path.as_posix()}')"
              ).fetchone()
              if got[2] == 0:
                  continue
              assert got[0] == got[1] == year, (path, got, year)
          PY

      - name: Fail-fast validate matchup shard
        run: |
          python code/scripts/research_cohorts/validate_research_matchup_shard.py \
            --out out \
            --year-start "${RESEARCH_YEAR_START}" \
            --year-end "${RESEARCH_YEAR_END}"

      - name: Upload additive modulo-100 subshard
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-${{ matrix.year }}-subb${{ matrix.bucket }}-of100-${{ github.sha }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
