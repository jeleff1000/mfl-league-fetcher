name: Cohort Decile Bootstrap RB WR

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        required: true
        default: '[2025]'
      confidence:
        required: true
        default: '0.85'
      reps:
        required: true
        default: '400'

permissions:
  contents: read

jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        position: [RB, WR]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4
      - run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          mkdir -p out
      - name: Build decile bootstrap shards
        env:
          PYTHONPATH: ${{ github.workspace }}/code/scripts/research_cohorts
        run: |
          for year in $(python -c "import json; print(*json.loads('${{ inputs.years }}'))"); do
            python code/scripts/research_cohorts/build_cohort_decile_bootstrap.py \
              --snapshot research_public_lake/corpus_snapshot.duckdb \
              --ops research_public_lake/ops_cache.duckdb \
              --year "$year" --position '${{ matrix.position }}' \
              --confidence '${{ inputs.confidence }}' --reps '${{ inputs.reps }}' \
              --out "out/bootstrap_${year}_${{ matrix.position }}.parquet"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: decile-bootstrap-${{ matrix.position }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 30
