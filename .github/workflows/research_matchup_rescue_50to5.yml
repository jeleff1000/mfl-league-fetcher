name: Research Matchup Rescue 50-to-5 Combine

on:
  workflow_dispatch:
    inputs:
      subshard_run:
        description: Completed modulo-50 rescue run ID
        required: true
      supplemental_run:
        description: Optional second run containing preserved successful buckets
        required: false
        default: ''
      years:
        description: JSON list of seasons to combine
        required: true
        default: '[2022,2023,2024,2025]'
      parents:
        description: JSON list of five parent bucket IDs
        required: true
        default: '[0,1,2,3,4]'

permissions:
  contents: read
  actions: read

jobs:
  combine:
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        year: ${{ fromJSON(inputs.years) }}
        parent: ${{ fromJSON(inputs.parents) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download this year's modulo-50 subshards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESCUE_RUN: ${{ inputs.subshard_run }}
          RESCUE_SUPPLEMENTAL_RUN: ${{ inputs.supplemental_run }}
          RESCUE_YEAR: ${{ matrix.year }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.request, zipfile
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          run_ids = [os.environ['RESCUE_RUN']]
          if os.environ.get('RESCUE_SUPPLEMENTAL_RUN'):
              run_ids.append(os.environ['RESCUE_SUPPLEMENTAL_RUN'])
          year = int(os.environ['RESCUE_YEAR'])
          api = 'https://api.github.com/repos/jeleff1000/mfl-league-fetcher/actions/runs'
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'}
          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  clean = {k: v for k, v in req.headers.items() if k.lower() != 'authorization'}
                  return urllib.request.Request(newurl, req.data, clean, method=req.get_method())
          opener = urllib.request.build_opener(NoAuthRedirect)
          out = Path('shards/raw'); out.mkdir(parents=True, exist_ok=True)
          found = {}
          for run_id in run_ids:
              page = 1
              while True:
                  req = urllib.request.Request(f'{api}/{run_id}/artifacts?per_page=100&page={page}', headers=headers)
                  with opener.open(req) as resp:
                      payload = json.load(resp)
                  batch = payload.get('artifacts', [])
                  if not batch:
                      break
                  for artifact in batch:
                      match = re.fullmatch(
                          rf'research-matchup-{year}-subb([0-9]+)-of50-[0-9a-f]+', artifact['name'])
                      if match:
                          bucket = int(match.group(1))
                          if bucket in found:
                              raise SystemExit(f'duplicate bucket {bucket} for {year}: {found[bucket]["name"]} and {artifact["name"]}')
                          found[bucket] = artifact
                  if len(batch) < 100:
                      break
                  page += 1
          if sorted(found) != list(range(50)):
              raise SystemExit(f'expected buckets 0..49 for {year}, found {sorted(found)}')
          for artifact in found.values():
              req = urllib.request.Request(artifact['archive_download_url'], headers=headers)
              with opener.open(req) as resp:
                  data = resp.read()
              target = out / artifact['name']; target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(__import__('io').BytesIO(data)) as zf:
                  zf.extractall(target)
          print(f'downloaded {len(found)} artifacts for {year} from {len(run_ids)} run(s)')
          PY

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2

      - name: Combine ten modulo-50 residues into one parent bucket
        env:
          RESCUE_YEAR: ${{ matrix.year }}
          RESCUE_PARENT: ${{ matrix.parent }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from pathlib import Path
          import os
          import duckdb

          year = int(os.environ['RESCUE_YEAR'])
          parent = int(os.environ['RESCUE_PARENT'])
          raw = Path('shards/raw')
          out = Path('out')
          residues = range(parent * 10, parent * 10 + 10)
          con = duckdb.connect()
          target = out / f'research-matchup-{year}-b{parent}'
          target.mkdir(parents=True, exist_ok=True)
          for name in ('research_matchup_player_season.parquet',
                       'research_matchup_weekly.parquet'):
              paths = []
              for residue in residues:
                  matches = [p for p in raw.rglob(name)
                             if f'{year}-subb{residue}-of50-' in str(p)]
                  assert len(matches) == 1, (year, parent, residue, matches)
                  paths.append(str(matches[0]).replace("'", "''"))
              quoted = '[' + ','.join("'" + p + "'" for p in paths) + ']'
              dest = (target / name).resolve().as_posix().replace("'", "''")
              con.execute(
                  f"COPY (SELECT * FROM read_parquet({quoted}, union_by_name=true)) "
                  f"TO '{dest}' (FORMAT PARQUET, COMPRESSION ZSTD)"
              )
          manifest = (target / 'shard_manifest.parquet').resolve().as_posix().replace("'", "''")
          con.execute(
              f"COPY (SELECT 'matchup' AS \"table\", {year} AS year_start, "
              f"{year} AS year_end, {parent} AS bucket, 5 AS buckets, "
              "NULL::VARCHAR AS fingerprint) "
              f"TO '{manifest}' (FORMAT PARQUET)"
          )
          con.close()
          print(f'combined year {year} parent {parent} into five-way release bucket')
          PY

      - name: Verify parent artifact
        run: |
          test -s out/research-matchup-${{ matrix.year }}-b${{ matrix.parent }}/research_matchup_player_season.parquet
          test -s out/research-matchup-${{ matrix.year }}-b${{ matrix.parent }}/research_matchup_weekly.parquet
          test -s out/research-matchup-${{ matrix.year }}-b${{ matrix.parent }}/shard_manifest.parquet

      - name: Upload normalized five-way artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-${{ matrix.year }}-b${{ matrix.parent }}-normalized-5way-${{ github.sha }}
          path: out/research-matchup-${{ matrix.year }}-b${{ matrix.parent }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
