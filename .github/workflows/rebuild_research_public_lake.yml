name: Rebuild Research Public Lake After Backfill

on:
  workflow_dispatch:
    inputs:
      backfill_run:
        description: Source playoff/clutch backfill workflow run ID
        required: false
        default: ''
      schema_only:
        description: 'Fan out and validate the existing immutable cache only; do not rebuild raw corpus data'
        required: false
        default: 'false'
      audit_only:
        description: 'Read-only inventory of missing league team counts; do not materialize or save a cache'
        required: false
        default: 'false'
      base_cache_key:
        description: Existing public lake cache containing ops and auxiliary files
        required: true
        default: research-public-lake-v3-Linux-20260730
      output_cache_key:
        description: New immutable cache key
        required: true
      release_tag:
        description: Private release tag for the rebuilt public lake archive
        required: true
      private_repo_ref:
        description: yahoo_oauth ref containing the snapshot builder and validator
        required: false
        default: main

permissions:
  actions: read
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      CORPUS_DIR: ${{ github.workspace }}/source_corpus

    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore base public lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - name: Download deterministic native identity crosswalk
        if: inputs.schema_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-native-id-crosswalk-v4 \
            --repo jeleff1000/mfl-league-fetcher \
            --pattern native_id_crosswalk.parquet \
            --clobber \
            --dir research_public_lake
          echo "RESEARCH_NATIVE_ID_CROSSWALK=${{ github.workspace }}/research_public_lake/native_id_crosswalk.parquet" >> "$GITHUB_ENV"
      - name: Download processed source shards
        if: inputs.schema_only != 'true'
        uses: actions/download-artifact@v5
        with:
          path: source_results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jeleff1000/mfl-league-fetcher
          run-id: ${{ inputs.backfill_run }}
          pattern: research-source-backfill-result-*
          merge-multiple: true
      - name: Unpack processed source shards
        if: inputs.schema_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CORPUS_DIR"
          shopt -s nullglob
          parts=(source_results/research-source-backfill-result-*.tar)
          test "${#parts[@]}" -eq 15
          for part in "${parts[@]}"; do tar -xf "$part" -C "$CORPUS_DIR"; done
          test -d "$CORPUS_DIR/leagues"
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Rebuild corpus snapshot with outcome columns
        if: inputs.schema_only != 'true'
        run: python code/scripts/sleeper_corpus/build_corpus_snapshot.py
      - name: Normalize literal cohorts and validate public lake
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ inputs.audit_only }}' = 'true' ]; then
            test -z '${{ inputs.backfill_run }}'
            python code/scripts/research_cohorts/normalize_canonical_research_schema.py \
              --audit-team-count-input research_public_lake/corpus_snapshot.duckdb
            exit 0
          fi
          if [ '${{ inputs.schema_only }}' = 'true' ]; then
            test -z '${{ inputs.backfill_run }}'
            base_snapshot='research_public_lake/corpus_snapshot.duckdb'
            normalized_snapshot="$RUNNER_TEMP/normalized_corpus_snapshot.duckdb"
          else
            test -n '${{ inputs.backfill_run }}'
            python code/scripts/sleeper_corpus/merge_public_corpus_snapshot.py \
              --base research_public_lake/corpus_snapshot.duckdb \
              --overlay "$CORPUS_DIR/corpus_snapshot.duckdb" \
              --out "$CORPUS_DIR/merged_corpus_snapshot.duckdb" \
              --crosswalk research_public_lake/native_id_crosswalk.parquet \
              --espn-map code/ops_data/public/espn_nfl_player_map.parquet \
              --aliases code/scripts/research_cohorts/research_identity_aliases.csv
            base_snapshot="$CORPUS_DIR/merged_corpus_snapshot.duckdb"
            normalized_snapshot="$CORPUS_DIR/normalized_corpus_snapshot.duckdb"
          fi
          python code/scripts/research_cohorts/normalize_canonical_research_schema.py \
            --base "$base_snapshot" \
            --out "$normalized_snapshot" \
            --ops-cache research_public_lake/ops_cache.duckdb
          mv "$normalized_snapshot" research_public_lake/corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - name: Archive rebuilt public lake
        if: inputs.audit_only != 'true'
        run: |
          python code/scripts/research_cohorts/archive_research_public_lake.py \
            research_public_lake research-public-lake.tar
          mkdir -p public_parts
          python code/scripts/research_cohorts/split_release_archive.py \
            research-public-lake.tar public_parts --part-size 1800000000
      # Cache is the authoritative Actions handoff.  Keep it before the optional
      # private-release upload so a PAT lacking release scope cannot discard a
      # validated rebuild.
      - name: Save immutable rebuilt cache
        if: inputs.audit_only != 'true'
        uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ inputs.output_cache_key }}
      - name: Publish private public-lake release (optional)
        if: inputs.audit_only != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ inputs.release_tag }}" --repo jeleff1000/mfl-league-fetcher >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" --repo jeleff1000/mfl-league-fetcher \
              --title "${{ inputs.release_tag }}" --notes "Rebuilt public research lake"
          gh release upload "${{ inputs.release_tag }}" --repo jeleff1000/mfl-league-fetcher \
            public_parts/research-public-lake.tar.part-* \
            research_public_lake/ops_cache.duckdb --clobber
