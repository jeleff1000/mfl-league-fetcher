name: Research Myles Garrett IDP Pilot

on:
  push:
    paths:
      - ".myles_garrett_pilot_dispatch_once"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  myles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - name: Install dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 requests
      - name: Resolve Myles Garrett and run pilots
        run: |
          set -euo pipefail
          mkdir -p out
          player_id=$(python - <<'PY'
          import duckdb, sys
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          rows=c.execute("""
            SELECT DISTINCT NFL_player_id, player
            FROM ops.nfl_historical.nfl_player_stats_all
            WHERE LOWER(CAST(player AS VARCHAR)) LIKE '%myles%garrett%'
          """).fetchall()
          print({'resolved':rows}, file=sys.stderr)
          assert rows
          print(rows[0][0])
          PY
          )
          echo "myles_player_id=$player_id"
          python - "$player_id" <<'PY'
          import duckdb, sys
          player_id=sys.argv[1]
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          rows=c.execute("""
            SELECT
              COUNT(*) AS rows,
              COUNT(DISTINCT db_name) AS leagues,
              COUNT(DISTINCT db_name) FILTER (WHERE CAST(week AS INTEGER)=1) AS week1_leagues,
              COUNT(DISTINCT db_name) FILTER (WHERE LOWER(CAST(position AS VARCHAR)) IN ('dl','de','lb','db','idp')) AS idp_position_leagues,
              COUNT(DISTINCT db_name) FILTER (WHERE CAST(week AS INTEGER)=1 AND LOWER(CAST(position AS VARCHAR)) IN ('dl','de','lb','db','idp')) AS week1_idp_position_leagues
            FROM lake.public.player_fantasy
            WHERE CAST(NFL_player_id AS VARCHAR)=?
              AND CAST(year AS INTEGER)=2025
          """,[player_id]).fetchone()
          positions=c.execute("""
            SELECT CAST(position AS VARCHAR) AS position, COUNT(*) AS rows, COUNT(DISTINCT db_name) AS leagues
            FROM lake.public.player_fantasy
            WHERE CAST(NFL_player_id AS VARCHAR)=? AND CAST(year AS INTEGER)=2025
            GROUP BY 1 ORDER BY 1
          """,[player_id]).fetchall()
          print({'source_player_inventory':rows,'positions':positions})
          PY
          for scope in week1 season; do
            args=(--year-start 2025 --year-end 2025 --position-group IDP --player-id "$player_id")
            if [ "$scope" = week1 ]; then args+=(--week 1); fi
            python code/scripts/research_cohorts/build_bounded_matchup_cache.py \
              --snapshot research_public_lake/corpus_snapshot.duckdb \
              --ops-cache research_public_lake/ops_cache.duckdb \
              --output "out/myles_${scope}.duckdb" "${args[@]}"
            python - "$scope" "out/myles_${scope}.duckdb" <<'PY'
          import duckdb,sys
          scope,path=sys.argv[1:]
          c=duckdb.connect(path,read_only=True)
          counts={t:c.execute(f'select count(*) from "{t}"').fetchone()[0] for t in ('research_matchup_adaptive','research_matchup_adaptive_weekly','research_matchup_adaptive_career')}
          print({'scope':scope,'counts':counts})
          assert all(v>0 for v in counts.values())
          PY
          done
