name: Cohort Top-10 Stability

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public research lake cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        description: JSON array of seasons to pool
        required: true
        default: '[1997,1998,2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]'
      only_group:
        description: Optional single matrix group to run (QB, RB, WR, TE, or K_DEF)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  top10:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(inputs.only_group == '' && '["QB","RB","WR","TE","K_DEF"]' || format('["{0}"]', inputs.only_group)) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4
      - name: Verify public-only cache
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Build pooled top10 stability shard
        if: ${{ inputs.only_group == '' || matrix.group == inputs.only_group }}
        env:
          PYTHONPATH: ${{ github.workspace }}/code/scripts/research_cohorts
        run: |
          positions='${{ matrix.group }}'
          if [ "$positions" = "K_DEF" ]; then positions='K DEF'; fi
          for position in $positions; do
            python code/scripts/research_cohorts/build_cohort_top10_pooled.py \
              --snapshot research_public_lake/corpus_snapshot.duckdb \
              --ops research_public_lake/ops_cache.duckdb \
              --years '${{ inputs.years }}' \
              --position "$position" \
              --memory-mb 3000 \
              --out "out/top10_pooled_${position}.parquet"
          done
      - if: ${{ inputs.only_group == '' || matrix.group == inputs.only_group }}
        uses: actions/upload-artifact@v4
        with:
          name: cohort-top10-${{ matrix.group }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 30
