name: Research Matchup Failed Parent Rescue

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public-only corpus + ops cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      tasks:
        description: JSON parent tasks, each split into five modulo-25 subshards
        required: true
        default: '[{"year":2023,"parent":1},{"year":2023,"parent":3},{"year":2024,"parent":0},{"year":2024,"parent":1},{"year":2024,"parent":2},{"year":2024,"parent":3},{"year":2025,"parent":1}]'

permissions:
  contents: read

jobs:
  matchup:
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
        subshard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ matrix.task.year }}
      RESEARCH_YEAR_END: ${{ matrix.task.year }}
      RESEARCH_LEAGUE_BUCKETS: "25"
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: "1"
      RESEARCH_READER_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_THREADS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Verify public-only inputs
        shell: bash
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Build modulo-25 subshard
        shell: bash
        env:
          PARENT_BUCKET: ${{ matrix.task.parent }}
          SUBSHARD: ${{ matrix.subshard }}
        run: |
          export RESEARCH_LEAGUE_BUCKET=$((PARENT_BUCKET + 5 * SUBSHARD))
          python code/scripts/research_cohorts/build_research_matchup_cohort.py
      - name: Verify artifact year bounds
        shell: bash
        env:
          EXPECTED_YEAR: ${{ matrix.task.year }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb
          year = int(os.environ['EXPECTED_YEAR'])
          files = list(Path('out').glob('*.parquet'))
          assert files, 'builder emitted no parquet'
          con = duckdb.connect()
          for path in files:
              cols = {r[0] for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{path.as_posix()}')").fetchall()}
              if 'year' not in cols:
                  continue
              got = con.execute(f"SELECT MIN(year), MAX(year), COUNT(*) FROM read_parquet('{path.as_posix()}')").fetchone()
              if got[2]:
                  assert got[0] == got[1] == year, (path, got, year)
          PY
      - name: Upload rescue subshard
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-${{ matrix.task.year }}-parent${{ matrix.task.parent }}-sub${{ matrix.subshard }}-of5-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
