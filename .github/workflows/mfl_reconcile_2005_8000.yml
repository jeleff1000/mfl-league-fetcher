name: MFL Historical Reconcile 2005-06 (8000-8999)

on:
  push:
    paths:
      - .github/mfl_reconcile_2005_8000
  workflow_run:
    workflows:
      - MFL Historical Resume 2005-06 (8000-8999)
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "1"
      start_year: "2005"
      end_year: "2006"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: "8000"
      id_end: "8999"
      merge_only: "true"
      source_run_id: "31406871174"
      additional_source_run_ids: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '31408950801' }}
      additional_artifact_namespaces: ""
    secrets: inherit
