name: Fly DuckDB One-Table Storage Pilot

on:
  workflow_dispatch:
    inputs:
      recovery_volume_id:
        description: Existing unattached wkupd_rebuild volume; never primary
        required: true
        type: string
      expected_source_sha:
        description: Exact public main revision
        required: true
        type: string
      action:
        description: Inspect one block without SQL, locate, or test removal of one old table
        required: true
        default: locate
        type: choice
        options: [inspect, locate, remove, donor_headers]
      target_table:
        description: One confirmed blocker
        required: true
        default: player_fantasy_season
        type: choice
        options: [player_fantasy_season, player_fantasy_season_all, homepage_manager_rankings, matchup_h2h_career, standings_by_year]
      witness_db_name:
        description: Existing league used for an unrelated matchup preservation witness
        required: true
        default: nyu_ffl
        type: string

permissions:
  contents: read

concurrency:
  group: fly-duckdb-storage-recovery
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FLY_APP: league-history-duckdb
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PILOT_MACHINE_NAME: wkupd-table-pilot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify public main and exact revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = "jeleff1000/mfl-league-fetcher"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install flyctl (setup, not storage work)
        run: |
          curl --fail --max-time 15 -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: One-table pilot - 40 second hard ceiling including machine startup
        env:
          RECOVERY_VOLUME_ID: ${{ inputs.recovery_volume_id }}
          PILOT_ACTION: ${{ inputs.action }}
          TARGET_TABLE: ${{ inputs.target_table }}
          WITNESS_DB_NAME: ${{ inputs.witness_db_name }}
        run: |
          set -euo pipefail
          export PILOT_DEADLINE="$(( $(date +%s) + 38 ))"
          timeout --signal=KILL 40s bash <<'PILOT' 2>&1 | tee table-pilot.jsonl
          set -euo pipefail
          echo "stage=pilot_start utc=$(date -u +%FT%TZ) hard_deadline=$PILOT_DEADLINE"
          [[ "$RECOVERY_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          test "$RECOVERY_VOLUME_ID" != vol_rkg7mmd17llez224
          [[ "$WITNESS_DB_NAME" =~ ^[a-z0-9_]+$ ]]
          case "$PILOT_ACTION" in inspect|locate|remove|donor_headers) ;; *) exit 2 ;; esac
          case "$TARGET_TABLE" in player_fantasy_season|player_fantasy_season_all|homepage_manager_rankings|matchup_h2h_career|standings_by_year) ;; *) exit 2 ;; esac
          flyctl machines list --app "$FLY_APP" --json > machines.json
          flyctl volumes show "$RECOVERY_VOLUME_ID" --app "$FLY_APP" --json > volume.json
          if [ "$PILOT_ACTION" = donor_headers ]; then
            test "$RECOVERY_VOLUME_ID" = vol_vp26dp2g9x3167j4
            jq -e '.state == "created" and .name == "wkupd_35290038040" and ((.attached_machine_id // "") == "")' volume.json
          else
            jq -e '.state == "created" and (.name | startswith("wkupd_rebuild_")) and ((.attached_machine_id // "") == "")' volume.json
          fi
          region="$(jq -r '.region' volume.json)"
          image="$(jq -r '.[] | select(.id == "1781e011b69068" and .state == "started") | .config.image' machines.json)"
          test -n "$image"
          echo "stage=isolated_machine_start utc=$(date -u +%FT%TZ)"
          flyctl machine run "$image" --app "$FLY_APP" --region "$region" \
            --name "$PILOT_MACHINE_NAME" --volume "$RECOVERY_VOLUME_ID:/data" \
            --entrypoint /bin/sh --restart no --detach --vm-cpus 1 --vm-memory 512 \
            --file-local "/tmp/fly_table_storage_pilot.py=scripts/fly_table_storage_pilot.py" \
            --file-local "/tmp/fly_duckdb_block_probe.py=scripts/fly_duckdb_block_probe.py" \
            -- -lc 'sleep 45'
          machine_id="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg name "$PILOT_MACHINE_NAME" '.[] | select(.name == $name) | .id')"
          test -n "$machine_id"
          test "$machine_id" != 1781e011b69068
          remaining="$(( PILOT_DEADLINE - $(date +%s) ))"
          test "$remaining" -gt 0
          echo "stage=sql_pilot_start remaining_seconds=$remaining"
          flyctl ssh console --app "$FLY_APP" --machine "$machine_id" \
            -C "/bin/sh -lc 'remaining=\$(( $PILOT_DEADLINE - \$(date +%s) )); test \"\$remaining\" -gt 0 || exit 124; exec timeout --signal=KILL \"\${remaining}s\" python -u /tmp/fly_table_storage_pilot.py --action $PILOT_ACTION --target-table $TARGET_TABLE --db-name $WITNESS_DB_NAME --machine-id $machine_id --volume-id $RECOVERY_VOLUME_ID --deadline $PILOT_DEADLINE'"
          echo "stage=pilot_finished utc=$(date -u +%FT%TZ)"
          PILOT

      - name: Remove only this disposable pilot machine (never its volume)
        if: always()
        run: |
          timeout --signal=KILL 20s bash <<'CLEANUP'
          set -euo pipefail
          ids="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg name "$PILOT_MACHINE_NAME" '.[] | select(.name == $name) | .id')"
          for id in $ids; do
            test "$id" != 1781e011b69068
            flyctl machine destroy "$id" --app "$FLY_APP" --force
          done
          CLEANUP

      - name: Upload small pilot receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fly-table-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            machines.json
            volume.json
            table-pilot.jsonl
          if-no-files-found: warn
