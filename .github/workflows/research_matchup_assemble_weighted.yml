name: Assemble weighted research matchup run

on:
  workflow_dispatch:
    inputs:
      shard_run:
        description: Successful weighted matchup shard run ID
        required: true
      supplemental_run:
        description: Optional rescue run containing replacement shard artifacts
        required: false
        default: ''
      year:
        description: Season represented by the run
        required: true
      batches:
        description: Expected number of weighted batches
        required: true
        default: '256'
      cache_key:
        description: Immutable public research cache key
        required: true
        default: research-public-lake-v3-Linux-20260730

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_ASSEMBLE_MEMORY_MB: '12000'
      RESEARCH_ASSEMBLE_THREADS: '2'
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Enumerate every weighted shard artifact
        id: artifact_ids
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_YEAR: ${{ inputs.year }}
          EXPECTED_BATCHES: ${{ inputs.batches }}
          SUPPLEMENTAL_RUN: ${{ inputs.supplemental_run }}
        run: |
          set -euo pipefail
          prefix="research-matchup-${EXPECTED_YEAR}-batch"
          runs="${{ inputs.shard_run }}"
          if [ -n "${SUPPLEMENTAL_RUN}" ]; then runs="${runs},${SUPPLEMENTAL_RUN}"; fi
          ids="$(for run in ${runs//,/ }; do
            gh api --paginate \
              "/repos/jeleff1000/mfl-league-fetcher/actions/runs/${run}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | startswith(\"${prefix}\")) | .id"
          done | sort -u | paste -sd, -)"
          count="$(tr ',' '\n' <<<"${ids}" | grep -c .)"
          test "${count}" -eq "${EXPECTED_BATCHES}"
          echo "ids=${ids}" >> "${GITHUB_OUTPUT}"
          echo "enumerated ${count} weighted shard artifact IDs"

      - name: Download weighted shard artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_RUN: ${{ inputs.shard_run }}
          SUPPLEMENTAL_RUN: ${{ inputs.supplemental_run }}
          EXPECTED_YEAR: ${{ inputs.year }}
          EXPECTED_BATCHES: ${{ inputs.batches }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          token = os.environ['GH_TOKEN']
          run_id = os.environ['SHARD_RUN']
          prefix = f"research-matchup-{os.environ['EXPECTED_YEAR']}-batch"
          expected = int(os.environ['EXPECTED_BATCHES'])
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'league-history-weighted-assembly',
          }

          class GitHubRedirectHandler(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  next_headers = dict(request.headers)
                  if urllib.parse.urlparse(newurl).netloc != urllib.parse.urlparse(request.full_url).netloc:
                      next_headers.pop('Authorization', None)
                  return urllib.request.Request(
                      newurl,
                      headers=next_headers,
                      method=request.get_method(),
                  )

          opener = urllib.request.build_opener(GitHubRedirectHandler)

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with opener.open(request, timeout=120) as response:
                  return json.load(response)

          artifacts_by_name = {}
          runs = [run_id]
          supplemental = os.environ.get('SUPPLEMENTAL_RUN', '').strip()
          if supplemental:
              runs.extend(part.strip() for part in supplemental.split(',') if part.strip())
          for source_run in runs:
              api = f"https://api.github.com/repos/jeleff1000/mfl-league-fetcher/actions/runs/{source_run}/artifacts"
              page = 1
              while True:
                  payload = get_json(f'{api}?per_page=100&page={page}')
                  for item in payload.get('artifacts', []):
                      if item['name'].startswith(prefix):
                          artifacts_by_name[item['name']] = item
                  if len(payload.get('artifacts', [])) < 100:
                      break
                  page += 1
          artifacts = list(artifacts_by_name.values())
          if len(artifacts) != expected:
              raise SystemExit(f'expected {expected} source artifacts, found {len(artifacts)}')
          print(f'found {len(artifacts)} source artifacts; downloading in parallel', flush=True)

          out = Path('shards')
          out.mkdir(parents=True, exist_ok=True)

          def download(item):
              target = out / item['name']
              target.mkdir(parents=True, exist_ok=True)
              last = None
              for attempt in range(4):
                  try:
                      request = urllib.request.Request(item['archive_download_url'], headers=headers)
                      with opener.open(request, timeout=300) as response:
                          data = response.read()
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          for member in archive.infolist():
                              member_path = Path(member.filename)
                              if member_path.is_absolute() or '..' in member_path.parts:
                                  raise RuntimeError(f'unsafe artifact member: {member.filename}')
                          archive.extractall(target)
                      return item['name']
                  except Exception as exc:
                      last = exc
                      if attempt < 3:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f"{item['name']}: {last}")

          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(download, item) for item in artifacts]
              for index, future in enumerate(as_completed(futures), 1):
                  print(f'downloaded {index}/{len(futures)}: {future.result()}', flush=True)
          PY

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 requests

      - name: Verify complete weighted coverage
        shell: bash
        env:
          EXPECTED_YEAR: ${{ inputs.year }}
          EXPECTED_BATCHES: ${{ inputs.batches }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb

          year = int(os.environ['EXPECTED_YEAR'])
          batches = int(os.environ['EXPECTED_BATCHES'])
          manifests = sorted(Path('shards').rglob('shard_manifest.parquet'))
          if len(manifests) != batches:
              raise SystemExit(f'expected {batches} manifests, found {len(manifests)}')
          con = duckdb.connect()
          rows = con.execute(
              "SELECT DISTINCT year_start, year_end, bucket, buckets, fingerprint "
              "FROM read_parquet(?) ORDER BY bucket",
              [[str(p) for p in manifests]],
          ).fetchall()
          if len(rows) != batches:
              raise SystemExit(f'expected {batches} distinct manifest rows, found {len(rows)}')
          if any(y0 != year or y1 != year for y0, y1, *_ in rows):
              raise SystemExit(f'manifests do not all represent {year}: {rows[:3]}')
          if any(width != batches for *_, width, _ in rows):
              raise SystemExit('manifest batch width mismatch')
          bucket_ids = [bucket for *_, bucket, width, fingerprint in rows]
          expected = list(range(batches))
          if bucket_ids != expected:
              raise SystemExit(f'missing or duplicate batch IDs: expected 0..{batches-1}, got {bucket_ids}')
          fingerprints = {fingerprint for *_, fingerprint in rows}
          if len(fingerprints) != 1:
              raise SystemExit(f'mixed source fingerprints: {fingerprints}')
          for name in ('research_matchup_weekly.parquet', 'research_matchup_player_season.parquet'):
              files = sorted(Path('shards').rglob(name))
              if len(files) != batches:
                  raise SystemExit(f'{name}: expected {batches}, found {len(files)}')
          print(f'PASS: {year} has {batches} disjoint weighted batches, fingerprint={next(iter(fingerprints))}')
          PY

      - name: Build population denominator lattices
        run: |
          mkdir -p out/denominators
          python code/scripts/research_cohorts/build_population_denominators.py \
            --output "${{ github.workspace }}/out/denominators" \
            --ops-cache "${{ github.workspace }}/research_public_lake/ops_cache.duckdb"

      - name: Assemble season
        shell: bash
        env:
          EXPECTED_YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          roots=()
          while IFS= read -r root; do roots+=(--input "$root"); done < <(
            find shards -mindepth 1 -maxdepth 2 -type d -name "research-matchup-${EXPECTED_YEAR}-*" -print
          )
          test "${#roots[@]}" -gt 0
          python code/scripts/research_cohorts/assemble_research_shards.py \
            --table matchup "${roots[@]}" \
            --denom-season "${{ github.workspace }}/out/denominators/research_matchup_denom_season.parquet" \
            --denom-week "${{ github.workspace }}/out/denominators/research_matchup_denom_week.parquet" \
            --pos-grp "${{ github.workspace }}/out/denominators/research_matchup_pos_grp.parquet" \
            --output "${{ github.workspace }}/out/assembled"

      - name: Upload assembled cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-assembled-${{ inputs.year }}-run-${{ inputs.shard_run }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/assembled/research_matchup_weekly.parquet
            out/assembled/research_matchup_player_season.parquet
            out/assembled/research_matchup_player_career.parquet
            out/assembled/research_matchup_manifest.parquet
