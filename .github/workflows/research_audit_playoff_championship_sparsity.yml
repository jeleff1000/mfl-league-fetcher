name: Research Audit - Sparse Playoff and Championship Player Coverage

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable canonical research lake cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pandas==2.2.3 pyarrow==15.0.2
      - name: Audit sparse player coverage
        run: |
          python code/scripts/research_cohorts/audit_playoff_championship_sparsity.py \
            --root research_public_lake \
            --out out
      - uses: actions/upload-artifact@v4
        with:
          name: playoff-championship-sparsity-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
