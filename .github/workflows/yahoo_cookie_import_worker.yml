name: Yahoo Cookie Import Worker

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: "Registered Yahoo database name"
        required: true
        type: string
      league_name:
        description: "Yahoo league display name"
        required: true
        type: string
      team_count:
        description: "Yahoo league team count from discovery"
        required: true
        type: string
      start_year:
        description: "First Yahoo season"
        required: true
        type: string
      end_year:
        description: "Last Yahoo season"
        required: true
        type: string
      league_keys_json:
        description: "JSON object mapping each Yahoo season to its league key"
        required: true
        type: string
      request_delay:
        description: "Seconds between Yahoo web requests"
        required: false
        default: "0.5"
        type: string
      throttle_retries:
        description: "Retries after Yahoo HTTP 999 responses"
        required: false
        default: "1"
        type: string
      year_throttle_cooldown:
        description: "Seconds to wait between live Yahoo seasons; leave at 0 unless Yahoo is throttling"
        required: false
        default: "0"
        type: string
      throttle_recovery_retries:
        description: "Retries for a throttled year using cached pages"
        required: false
        default: "1"
        type: string
      throttle_recovery_cooldown:
        description: "Seconds to wait before retrying a throttled year"
        required: false
        default: "300"
        type: string
      import_mode:
        description: "Shared Yahoo import mode"
        required: false
        default: full
        type: choice
        options:
          - quick
          - full
      cache_only:
        description: "Rebuild only from an existing Yahoo page cache; never call Yahoo"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yahoo-cookie-${{ inputs.database_name }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      DRAFT_GLOBAL_SOURCE_PATH: ${{ github.workspace }}/corpus_dependencies/draft_global_source.parquet
      CORPUS_DEPENDENCY_KEY: corpus-dependencies-v1-Linux-20260717
      FLY_PUBLISH_FORMAT: delta
      FLY_FINALIZE_INVENTORY: "1"
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
      DATABASE_NAME: ${{ inputs.database_name }}
      COOKIE_DATA_DIR: ${{ github.workspace }}/yahoo_oauth/cookie_worker_output
      COOKIE_BACKUP_CACHE_ONLY: ${{ inputs.cache_only && '1' || '0' }}
    steps:
      - name: Checkout worker
        uses: actions/checkout@v5

      - name: Checkout importer
        uses: actions/checkout@v5
        with:
          path: yahoo_oauth

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: yahoo_oauth
        run: python -m pip install -r requirements.txt

      - name: Restore canonical research public lake
        uses: ./yahoo_oauth/.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Restore draft baseline bundle
        uses: actions/cache/restore@v5
        with:
          path: corpus_dependencies
          key: ${{ env.CORPUS_DEPENDENCY_KEY }}

      - name: Verify draft baseline
        shell: bash
        run: test -s "${DRAFT_GLOBAL_SOURCE_PATH}"

      - name: Restore Yahoo cookie capture cache
        uses: actions/cache/restore@v4
        with:
          path: yahoo_oauth/cookie_worker_output/[0-9][0-9][0-9][0-9]
          key: yahoo-cookie-pages-v5-${{ inputs.database_name }}-${{ inputs.start_year }}-${{ inputs.end_year }}-${{ github.run_id }}
          restore-keys: |
            yahoo-cookie-pages-v5-${{ inputs.database_name }}-${{ inputs.start_year }}-${{ inputs.end_year }}-
            yahoo-cookie-pages-v4-${{ inputs.database_name }}-${{ inputs.start_year }}-${{ inputs.end_year }}-

      - name: Run quick Yahoo cookie track
        if: inputs.import_mode == 'quick' || inputs.import_mode == 'full'
        working-directory: yahoo_oauth
        run: >-
          python scripts/yahoo_cookie_worker.py
          --db-name "${{ inputs.database_name }}"
          --league-name "${{ inputs.league_name }}"
          --team-count "${{ inputs.team_count }}"
          --start-year "${{ inputs.start_year }}"
          --end-year "${{ inputs.end_year }}"
          --league-keys-json '${{ inputs.league_keys_json }}'
          --import-mode "quick"
          --skip-upload
          --ops-cache "${{ env.OPS_CACHE_PATH }}"
          --draft-global-source "${{ env.DRAFT_GLOBAL_SOURCE_PATH }}"
          --request-delay "${{ inputs.request_delay }}"
          --throttle-retries "${{ inputs.throttle_retries }}"
          --year-throttle-cooldown "${{ inputs.year_throttle_cooldown }}"
          --throttle-recovery-retries "${{ inputs.throttle_recovery_retries }}"
          --throttle-recovery-cooldown "${{ inputs.throttle_recovery_cooldown }}"
          --output-dir "cookie_worker_output"

      - name: Run quick cookie post-import calculations
        if: inputs.import_mode == 'quick' || inputs.import_mode == 'full'
        working-directory: yahoo_oauth/fantasy_football_data_scripts
        run: |
          MATCHUP_ROWS="$(python - <<'PY'
          import duckdb
          import os
          from pathlib import Path

          db_path = Path(os.environ["COOKIE_DATA_DIR"]) / f"{os.environ['DATABASE_NAME']}.duckdb"
          with duckdb.connect(str(db_path), read_only=True) as conn:
              print(conn.execute("SELECT COUNT(*) FROM public.matchup").fetchone()[0])
          PY
          )"
          if [ "${MATCHUP_ROWS}" -gt 0 ]; then
            python -m multi_league.transformations.matchup.expected_record_v2 \
              --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}" --n-sims 10000
            python -m multi_league.transformations.matchup.playoff_odds_import \
              --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}" --n-sims 10000
          fi
          python ../scripts/refresh_aggregates.py \
            --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}"

      - name: Upload quick cookie import
        if: inputs.import_mode == 'quick' || inputs.import_mode == 'full'
        working-directory: yahoo_oauth/fantasy_football_data_scripts
        run: |
          python - <<'PY'
          import os
          from multi_league.core.local_db import LocalLeagueDB

          db_name = os.environ["DATABASE_NAME"]
          db = LocalLeagueDB(os.environ["COOKIE_DATA_DIR"], db_name)
          db.connect()
          try:
              db.upload_to_fly(db_name)
          finally:
              db.close()
          PY

      - name: Publish quick cookie import
        if: inputs.import_mode == 'quick' || inputs.import_mode == 'full'
        working-directory: yahoo_oauth
        run: >-
          python scripts/warm_vercel_cache.py
          --db "${{ inputs.database_name }}"
          --secret "${{ env.REVALIDATION_SECRET }}"
          --site-url "https://www.leaguehistory.app"
          --mode "quick"
          --strategy expire
          --jitter-seconds 0
          --strict
          --verify-hot

      - name: Run full Yahoo cookie track
        if: inputs.import_mode == 'full'
        working-directory: yahoo_oauth
        run: >-
          python scripts/yahoo_cookie_worker.py
          --db-name "${{ inputs.database_name }}"
          --league-name "${{ inputs.league_name }}"
          --team-count "${{ inputs.team_count }}"
          --start-year "${{ inputs.start_year }}"
          --end-year "${{ inputs.end_year }}"
          --league-keys-json '${{ inputs.league_keys_json }}'
          --import-mode "full"
          --skip-upload
          --ops-cache "${{ env.OPS_CACHE_PATH }}"
          --draft-global-source "${{ env.DRAFT_GLOBAL_SOURCE_PATH }}"
          --request-delay "${{ inputs.request_delay }}"
          --throttle-retries "${{ inputs.throttle_retries }}"
          --year-throttle-cooldown "${{ inputs.year_throttle_cooldown }}"
          --throttle-recovery-retries "${{ inputs.throttle_recovery_retries }}"
          --throttle-recovery-cooldown "${{ inputs.throttle_recovery_cooldown }}"
          --output-dir "cookie_worker_output"

      - name: Run full cookie post-import calculations
        if: inputs.import_mode == 'full'
        working-directory: yahoo_oauth/fantasy_football_data_scripts
        run: |
          MATCHUP_ROWS="$(python - <<'PY'
          import duckdb
          import os
          from pathlib import Path

          db_path = Path(os.environ["COOKIE_DATA_DIR"]) / f"{os.environ['DATABASE_NAME']}.duckdb"
          with duckdb.connect(str(db_path), read_only=True) as conn:
              print(conn.execute("SELECT COUNT(*) FROM public.matchup").fetchone()[0])
          PY
          )"
          if [ "${MATCHUP_ROWS}" -gt 0 ]; then
            python -m multi_league.transformations.matchup.expected_record_v2 \
              --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}" --n-sims 10000
            python -m multi_league.transformations.matchup.playoff_odds_import \
              --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}" --n-sims 10000
          fi
          python ../scripts/refresh_aggregates.py \
            --db "${{ inputs.database_name }}" --data-dir "${COOKIE_DATA_DIR}"

      - name: Upload full cookie import
        if: inputs.import_mode == 'full'
        working-directory: yahoo_oauth/fantasy_football_data_scripts
        run: |
          python - <<'PY'
          import os
          from multi_league.core.local_db import LocalLeagueDB

          db_name = os.environ["DATABASE_NAME"]
          db = LocalLeagueDB(os.environ["COOKIE_DATA_DIR"], db_name)
          db.connect()
          try:
              db.upload_to_fly(db_name)
          finally:
              db.close()
          PY

      - name: Publish full cookie import
        if: inputs.import_mode == 'full'
        working-directory: yahoo_oauth
        run: >-
          python scripts/warm_vercel_cache.py
          --db "${{ inputs.database_name }}"
          --secret "${{ env.REVALIDATION_SECRET }}"
          --site-url "https://www.leaguehistory.app"
          --mode "full"
          --strategy expire
          --jitter-seconds 0
          --strict
          --verify-hot
      - name: Save Yahoo cookie capture cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: yahoo_oauth/cookie_worker_output/[0-9][0-9][0-9][0-9]
          key: yahoo-cookie-pages-v5-${{ inputs.database_name }}-${{ inputs.start_year }}-${{ inputs.end_year }}-${{ github.run_id }}
