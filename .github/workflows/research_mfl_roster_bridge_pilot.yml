name: Research MFL roster bridge pilot

on:
  workflow_dispatch:
    inputs:
      max_groups:
        description: "Exact first N sorted flagged MFL league-week groups; pilot only"
        required: true
        default: "15"
        type: string

permissions:
  contents: read
  actions: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
  TARGET_RUN_ID: "31217899167"
  TARGET_ARTIFACT: mfl-underpopulated-week-targets-31217899167

jobs:
  bridge-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private MFL client only
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pandas==2.2.3 pyarrow==15.0.2 requests==2.32.4 polars==1.35.2
      - name: Record immutable cache and ops prestate
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('cache_before.json').write_text(json.dumps({
            'schema': con.execute('DESCRIBE public.player_fantasy').fetchall(),
            'rows': int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          }, indent=2)+'\n')
          con.close()
          PY
      - name: Download exact retained target population
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          gh run download "$TARGET_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$TARGET_ARTIFACT" --dir inventory
      - name: Fetch only the pilot's flagged league-weeks
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          MFL_RATE_LIMIT_PER_MIN: "25"
        run: |
          mkdir -p out
          python scripts/research_cohorts/extract_mfl_target_roster_memberships.py \
            --manifest inventory/mfl_underpopulated_week_targets.json \
            --shard 0 --shards 1 --max-groups '${{ inputs.max_groups }}' \
            --out-memberships out/mfl_roster_memberships.parquet \
            --out-player-directory out/mfl_player_directory.parquet \
            --out-report out/mfl_roster_extract_report.json
      - name: Build protected ESPN to NFL crosswalk
        run: |
          python scripts/research_cohorts/build_mfl_roster_player_crosswalk.py \
            --directory out/mfl_player_directory.parquet \
            --ops-cache research_public_lake/ops_cache.duckdb \
            --out out/mfl_roster_crosswalk.parquet \
            --report out/mfl_roster_crosswalk_report.json
      - name: Build read-only canonical bridge receipt
        run: |
          python scripts/research_cohorts/build_mfl_roster_bridge_receipt.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --memberships out/mfl_roster_memberships.parquet \
            --crosswalk out/mfl_roster_crosswalk.parquet \
            --out out/mfl_roster_bridge_resolved.parquet \
            --diagnostic-out out/mfl_roster_bridge_diagnostic.parquet \
            --report out/mfl_roster_bridge_report.json
      - name: Fail fast on any cache or ops mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('cache_before.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          assert con.execute('DESCRIBE public.player_fantasy').fetchall() == [tuple(row) for row in before['schema']]
          assert int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) == before['rows']
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda: handle.read(1024*1024), b''):
                  digest.update(block)
          assert digest.hexdigest() == Path('ops_before.sha256').read_text().split()[0]
          reports=[json.loads(Path(name).read_text()) for name in [
              'out/mfl_roster_extract_report.json',
              'out/mfl_roster_crosswalk_report.json',
              'out/mfl_roster_bridge_report.json',
          ]]
          assert all(report['read_only'] and not report['cache_mutated'] and not report['new_lineage'] for report in reports)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mfl-roster-bridge-pilot-${{ github.run_id }}
          path: |
            out/
            cache_before.json
            ops_before.sha256
          retention-days: 90
          compression-level: 0
