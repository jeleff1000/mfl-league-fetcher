name: Research Matchup Rescue Combine

on:
  workflow_dispatch:
    inputs:
      subshard_run:
        description: Completed modulo-10 rescue subshard run ID
        required: true
      year:
        description: Year being normalized
        required: true
        default: '2023'

permissions:
  contents: read
  actions: read

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download modulo-10 rescue subshards
        uses: actions/download-artifact@v5
        with:
          path: shards/raw
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: jeleff1000/mfl-league-fetcher
          run-id: ${{ inputs.subshard_run }}

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2

      - name: Combine subshards into normalized 5-bucket artifacts
        env:
          RESCUE_YEAR: ${{ inputs.year }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import duckdb

          year = int(os.environ["RESCUE_YEAR"])
          raw = Path("shards/raw")
          out = Path("out")
          out.mkdir(parents=True, exist_ok=True)
          # hash % 10 residues (1,6) cover hash % 5 == 1; (3,8) cover hash % 5 == 3.
          pairs = {1: (1, 6), 3: (3, 8)}
          con = duckdb.connect()
          for parent, residues in pairs.items():
              target = out / f"parent_{parent}"
              target.mkdir(parents=True, exist_ok=True)
              for name in ("research_matchup_player_season.parquet", "research_matchup_weekly.parquet"):
                  paths = []
                  for residue in residues:
                      matches = [p for p in raw.rglob(name) if f"subb{residue}-of10" in str(p)]
                      assert len(matches) == 1, (name, residue, matches)
                      paths.append(str(matches[0].resolve()).replace("'", "''"))
                  quoted = "[" + ",".join("'" + p + "'" for p in paths) + "]"
                  dest = (target / name).resolve().as_posix().replace("'", "''")
                  con.execute(
                      f"COPY (SELECT * FROM read_parquet({quoted}, union_by_name=true)) "
                      f"TO '{dest}' (FORMAT PARQUET, COMPRESSION ZSTD)"
                  )
              manifest = target / "shard_manifest.parquet"
              con.execute(
                  "COPY (SELECT 'matchup' AS \"table\", ? AS year_start, ? AS year_end, "
                  "? AS bucket, 5 AS buckets, NULL::VARCHAR AS fingerprint) "
                  f"TO '{manifest.resolve().as_posix().replace(chr(39), chr(39)*2)}' "
                  "(FORMAT PARQUET)", [year, year, parent]
              )
          con.close()
          print("normalized parent buckets", sorted(pairs))
          PY

      - name: Verify normalized cover
        run: |
          python - <<'PY'
          from pathlib import Path
          import duckdb
          paths = list(Path('out').rglob('shard_manifest.parquet'))
          assert len(paths) == 2, paths
          rows = duckdb.connect().execute(
              "SELECT bucket, buckets, year_start, year_end FROM read_parquet(?)", [[str(p) for p in paths]]
          ).fetchall()
          assert sorted(rows) == [(1, 5, 2023, 2023), (3, 5, 2023, 2023)], rows
          print(rows)
          PY

      - name: Upload normalized 5-bucket rescue artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-${{ inputs.year }}-b1-of5-rescue-${{ github.run_id }}
          path: out/parent_1/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Upload normalized 5-bucket rescue artifacts (bucket 3)
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-${{ inputs.year }}-b3-of5-rescue-${{ github.run_id }}
          path: out/parent_3/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
