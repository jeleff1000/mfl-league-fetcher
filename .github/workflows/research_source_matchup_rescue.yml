name: Targeted Source Matchup Signal Rescue
# Targeted-rescue dispatch revision: platform/year filters are fail-closed.

on:
  workflow_dispatch:
    inputs:
      inventory_run_id:
        description: Successful inventory run whose artifact contains rescue targets
        required: true
        default: "31061624385"
      target_manifest_run_id:
        description: Optional outcome-source target manifest run; overrides inventory_run_id
        required: false
        default: ""
      shards:
        description: Number of API workers
        required: true
        default: "15"
      shard_list:
        description: Optional comma-separated shard numbers to run; empty runs all shards
        required: false
        default: ""
      target_limit:
        description: Optional per-worker target limit for pilots
        required: false
        default: "0"
      platform:
        description: Optional platform filter (mfl, fleaflicker, sleeper)
        required: false
        default: ""
      target_year:
        description: Optional target season filter
        required: false
        default: "0"

concurrency:
  group: research-source-rescue-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install preflight dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4 polars==1.35.2 scipy==1.14.1 pytest==8.3.3
      - name: Run denominator and rescue contract tests
        working-directory: code
        run: |
          python -m pytest -q \
            scripts/research_cohorts/test_source_backfill_readiness.py \
            scripts/research_cohorts/test_weekly_denominator_contract.py \
            scripts/research_cohorts/test_outcome_sidecar_contract.py

  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      shard_list: ${{ steps.matrix.outputs.shard_list }}
    steps:
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
          SHARD_LIST: ${{ inputs.shard_list }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["SHARDS"])
          requested = [x.strip() for x in os.environ.get("SHARD_LIST", "").split(",") if x.strip()]
          values = [int(x) for x in requested] if requested else list(range(n))
          if any(x < 0 or x >= n for x in values):
              raise SystemExit(f"shard_list must be within 0..{n-1}: {values}")
          print("shard_list=" + json.dumps(values))
          PY

  rescue:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install API-sidecar dependencies
        run: python -m pip install pandas==2.2.3 pyarrow==15.0.2 duckdb==1.5.1 requests==2.32.4 polars==1.35.2
      - name: Download inventory artifact
        if: inputs.target_manifest_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          gh run download '${{ inputs.inventory_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-matchup-league-year-inventory-${{ inputs.inventory_run_id }}' \
            --dir inventory
      - name: Download outcome-source target manifest
        if: inputs.target_manifest_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          gh run download '${{ inputs.target_manifest_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-outcome-source-target-manifest-${{ inputs.target_manifest_run_id }}' \
            --dir inventory
          cp inventory/outcome_source_targets.json targets.json
      - name: Build signal-only target manifest
        if: inputs.target_manifest_run_id == ''
        run: |
          test -s inventory/actionable_gap_inventory.json
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('inventory/matchup_rescue_targets.json')
          bundle = json.loads(Path('inventory/actionable_gap_inventory.json').read_text())
          rows = json.loads(source.read_text())
          expected = int(bundle.get('summary', {}).get('actionable_league_years', -1))
          if expected != len(rows):
              raise SystemExit(f'actionable inventory mismatch: summary={expected} targets={len(rows)}')
          wanted = {'no_championship_signal', 'no_playoff_signal', 'no_team_game_denominator_source'}
          rows = [r for r in rows if wanted.intersection(r.get('reason_codes') or []) and r.get('platform') and r.get('source_id')]
          # The inventory is signal-grained: one league-season can have more
          # than one missing-signal reason. Fetch each source season once and
          # union its reasons before sharding, otherwise every shard emits
          # duplicate matchup keys.
          unique = {}
          for row in rows:
              key = (str(row['db_name']), int(row['year']))
              if key not in unique:
                  unique[key] = dict(row)
                  unique[key]['reason_codes'] = sorted(set(row.get('reason_codes') or []))
              else:
                  unique[key]['reason_codes'] = sorted(
                      set(unique[key].get('reason_codes') or []) | set(row.get('reason_codes') or [])
                  )
          rows = list(unique.values())
          Path('targets.json').write_text(json.dumps({'schema_version': 1, 'targets': rows}, indent=2) + '\n')
          print({'targets': len(rows), 'db_names': len({r['db_name'] for r in rows})})
          if not rows:
              raise SystemExit('empty signal target manifest')
          PY
      - name: Filter exact platform and season targets
        env:
          TARGET_PLATFORM: ${{ inputs.platform }}
          TARGET_YEAR: ${{ inputs.target_year }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('targets.json').read_text())
          rows = payload.get('targets', payload) if isinstance(payload, dict) else payload
          platform = os.environ.get('TARGET_PLATFORM', '').strip().lower()
          year = int(os.environ.get('TARGET_YEAR', '0') or 0)
          if platform:
              rows = [r for r in rows if str(r.get('platform', '')).lower() == platform]
          if year:
              rows = [r for r in rows if int(r.get('year', 0)) == year]
          if not rows:
              raise SystemExit(f'empty filtered target manifest platform={platform!r} year={year}')
          payload['targets'] = rows
          payload['target_rows'] = sum(int(r.get('target_rows', 0) or 0) for r in rows)
          Path('targets.json').write_text(json.dumps(payload, indent=2) + '\n')
          print({'targets': len(rows), 'target_rows': payload['target_rows'], 'platform': platform, 'year': year})
          PY
      - name: Fetch canonical source matchup sidecar
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/build_source_matchup_rescue_sidecar.py \
            --targets targets.json \
            --shard '${{ matrix.shard }}' \
            --shards '${{ inputs.shards }}' \
            --limit '${{ inputs.target_limit }}' \
            --workers 1 \
            --out out/source_matchup_rescue_${{ matrix.shard }}.parquet
      - name: Fail closed on source fetch failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(x) for x in Path('out/source_matchup_rescue_${{ matrix.shard }}.jsonl').read_text().splitlines() if x.strip()]
          allowed = {'done', 'source_returned_no_matchups', 'source_returned_no_target_weeks', 'missing_historical_source_id', 'source_fetch_failed'}
          bad = [r for r in rows if r.get('status') not in allowed]
          failed = [r for r in rows if r.get('status') == 'source_fetch_failed']
          print({'targets': len(rows), 'done': sum(r.get('status') == 'done' for r in rows), 'source_empty': sum(r.get('status') in ('source_returned_no_matchups', 'source_returned_no_target_weeks') for r in rows), 'missing_historical_id': sum(r.get('status') == 'missing_historical_source_id' for r in rows), 'source_failed_for_retry': len(failed), 'unexpected_bad': len(bad)})
          if failed:
              print('targets requiring focused retry:', failed[:10])
          if bad:
              print('first failures:', bad[:5])
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-matchup-rescue-${{ matrix.shard }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
