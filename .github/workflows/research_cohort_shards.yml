name: Research Cohort Shards

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public-only corpus + ops cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      tables:
        description: all, matchup, transactions, transactions_weekly, or draft
        required: true
        type: choice
        options: [all, matchup, transactions, transactions_weekly, draft]
        default: all
      year_ranges:
        description: 'JSON list of {label,start,end} to shard. Blank = all years. Use a subset to
          leave 2018-2025 to the required 5-bucket matchup workflow.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  shard:
    strategy:
      fail-fast: false
      # Modern matchup years run only in the five-way population workflow.  Keeping
      # them out of this whole-population matrix prevents double-counted assembly.
      max-parallel: 15
      matrix:
        table: ${{ fromJSON(inputs.tables == 'all' && '["matchup","transactions","transactions_weekly","draft"]' || format('["{0}"]', inputs.tables)) }}
        range: ${{ fromJSON(inputs.year_ranges != '' && inputs.year_ranges || '[{"label":"1997-1998","start":1997,"end":1998},{"label":"2003-2006","start":2003,"end":2006},{"label":"2007-2010","start":2007,"end":2010},{"label":"2011-2013","start":2011,"end":2013},{"label":"2014-2015","start":2014,"end":2015},{"label":"2016-2017","start":2016,"end":2017}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ matrix.range.start }}
      RESEARCH_YEAR_END: ${{ matrix.range.end }}
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_NATIVE_ID_CROSSWALK: ${{ github.workspace }}/research_public_lake/native_id_crosswalk.parquet
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: "1"
      # Newer draft years need more than the conservative 3 GB local reader cap. Each
      # table/year shard owns its runner, so this remains isolated per job.
      RESEARCH_READER_MEMORY_MB: ${{ matrix.table == 'draft' && '5500' || '3000' }}

    steps:
      - uses: actions/checkout@v5

      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1

      - name: Download deterministic native identity crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-native-id-crosswalk-v4 \
            --repo jeleff1000/league-history-workers \
            --pattern native_id_crosswalk.parquet \
            --dir research_public_lake \
            --clobber

      - name: Verify public-only inputs
        shell: bash
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out

      - name: Build shard
        shell: bash
        run: |
          case "${{ matrix.table }}" in
            matchup) python code/scripts/research_cohorts/build_research_matchup_cohort.py ;;
            transactions) python code/scripts/research_cohorts/build_research_txn_cohort.py ;;
            transactions_weekly) python code/scripts/research_cohorts/build_weekly_txn.py ;;
            draft) python code/scripts/research_cohorts/build_research_draft_cohort.py ;;
          esac

      - name: Verify artifact year bounds
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb
          lo, hi = int(os.environ["RESEARCH_YEAR_START"]), int(os.environ["RESEARCH_YEAR_END"])
          files = list(Path("out").glob("*.parquet"))
          assert files, "builder emitted no parquet"
          con = duckdb.connect()
          for path in files:
              cols = {r[0] for r in con.execute(
                  f"DESCRIBE SELECT * FROM read_parquet('{path.as_posix()}')").fetchall()}
              if "year" not in cols:
                  continue
              got = con.execute(
                  f"SELECT MIN(year), MAX(year), COUNT(*) FROM read_parquet('{path.as_posix()}')"
              ).fetchone()
              if got[2] == 0:
                  print(path, "typed empty shard")
                  continue
              assert lo <= got[0] <= got[1] <= hi, (path, got, lo, hi)
              print(path, got)
          PY

      - name: Fail-fast matchup semantic gate
        if: ${{ matrix.table == 'matchup' }}
        run: |
          python code/scripts/research_cohorts/validate_research_matchup_shard.py \
            --out out \
            --year-start "${{ matrix.range.start }}" \
            --year-end "${{ matrix.range.end }}"

      - name: Upload additive shard
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.table }}-${{ matrix.range.label }}-${{ github.sha }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
