name: Audit player week team coverage

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - run: |
          python code/scripts/research_cohorts/audit_player_week_team_coverage.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --out player_week_team_coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-player-week-team-coverage
          path: player_week_team_coverage.json
