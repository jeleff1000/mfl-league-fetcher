name: Build Cohort Dimension Fill Sidecars

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Build read-only fill sidecars
        run: |
          python code/scripts/research_cohorts/build_cohort_dimension_fill_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --ops research_public_lake/ops_cache.duckdb \
            --out dimension_fills
      - name: Validate artifact-only contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import duckdb

          out = Path('dimension_fills')
          report = json.loads((out / 'fill_report.json').read_text())
          assert report['cache_mutated'] is False
          assert report['new_lineage'] is False
          assert report['new_columns'] == []
          con = duckdb.connect()
          for name, key in [('player_position_updates.parquet', ['nfl_id', 'season_year']),
                            ('player_position_name_updates.parquet', ['row_key']),
                            ('league_settings_updates.parquet', ['db_name', 'year']),
                            ('unresolved_settings.parquet', ['db_name', 'year'])]:
              p = out / name
              assert p.exists(), p
              cols = [r[0] for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{p}')").fetchall()]
              rows = con.execute(f"SELECT COUNT(*) FROM read_parquet('{p}')").fetchone()[0]
              distinct = con.execute(f"SELECT COUNT(*) FROM (SELECT DISTINCT {', '.join(key)} FROM read_parquet('{p}'))").fetchone()[0]
              print(name, {'columns': cols, 'rows': rows, 'distinct_keys': distinct})
              assert all(k in cols for k in key), (name, key, cols)
              assert rows == distinct, (name, rows, distinct)
          settings = out / 'league_settings_updates.parquet'
          bad_flex = con.execute(f"SELECT COUNT(*) FROM read_parquet('{settings}') WHERE roster_FLX_fill IS NOT NULL AND roster_FLX_fill > 5").fetchone()[0]
          assert bad_flex == 0, ('impossible_roster_FLX_fill', bad_flex)
          con.close()
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cohort-dimension-fills-${{ github.run_id }}
          path: dimension_fills
          if-no-files-found: error
          retention-days: 30
