name: Publish compact research matchup serving tables

on:
  workflow_dispatch:
    inputs:
      compact_run_id:
        description: 'Completed compact merge replay run containing the final artifact'
        required: true
      artifact_name:
        description: 'Exact compact artifact name; defaults to compact-matchup-final-{compact_run_id}'
        required: false
        default: ''
      apply:
        description: 'Set true only after the preflight run is transfer-safe'
        required: true
        default: false
        type: boolean
      layout_probe:
        description: 'Measure coded-selector weekly serving layout only; never writes Fly'
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/code
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 requests
      - uses: actions/download-artifact@v5
        with:
          repository: jeleff1000/mfl-league-fetcher
          run-id: ${{ inputs.compact_run_id }}
          github-token: ${{ github.token }}
          name: ${{ inputs.artifact_name || format('compact-matchup-final-{0}', inputs.compact_run_id) }}
          path: compact-artifact
          merge-multiple: true
      - name: Locate exactly one compact serving artifact
        id: bundle
        run: |
          mapfile -t BUNDLES < <(find compact-artifact -name research_matchup_compact.duckdb -type f | sort)
          test "${#BUNDLES[@]}" -eq 1
          echo "path=${BUNDLES[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${BUNDLES[0]}"
      - name: Preflight and measure compact serving tables
        if: ${{ !inputs.apply && !inputs.layout_probe }}
        run: |
          python code/scripts/research_cohorts/publish_compact_matchup_to_fly.py \
            --bundle '${{ steps.bundle.outputs.path }}' \
            --stage-dir out/compact-matchup-publish \
            --build-only
      - name: Probe compact selector-code layout without Fly access
        if: ${{ inputs.layout_probe }}
        run: |
          python code/scripts/research_cohorts/publish_compact_matchup_to_fly.py \
            --bundle '${{ steps.bundle.outputs.path }}' \
            --stage-dir out/compact-matchup-publish \
            --layout-probe
      - name: Publish compact serving tables after preflight
        if: ${{ inputs.apply }}
        run: |
          python code/scripts/research_cohorts/publish_compact_matchup_to_fly.py \
            --bundle '${{ steps.bundle.outputs.path }}' \
            --stage-dir out/compact-matchup-publish \
            --apply --i-understand-this-writes-prod
