name: Apply Research Source Matchup Sidecar Only

on:
  workflow_dispatch:
    inputs:
      matchup_combine_run_id:
        description: Completed combined source matchup rescue run
        required: true
        default: "31129191026"
      base_cache_key:
        description: Current canonical public lake cache
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical-final
      output_cache_key:
        description: Versioned cache key for the source-sidecar lake
        required: true
        default: research-public-lake-v4-Linux-20260806-source-sidecar-31129191026

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download combined source sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p rescue
          gh run download '${{ inputs.matchup_combine_run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'research-source-matchup-rescue-combined-*' \
            --dir rescue
      - name: Materialize empty outcome overlay and source overlay
        run: |
          MATCHUP=$(find rescue -name 'source_matchup_rescue.parquet' | head -1)
          test -s "$MATCHUP"
          python - "$MATCHUP" <<'PY'
          import duckdb
          import sys
          matchup = sys.argv[1]
          out = duckdb.connect('overlay_outcome_targets.duckdb')
          out.execute('create schema public')
          out.execute('''create table public.outcome_targets (
              db_name varchar, year integer, week integer,
              NFL_player_id varchar, win integer, team_points double
          )''')
          out.close()
          rescue = duckdb.connect('overlay_source_matchup_rescue.duckdb')
          rescue.execute('create schema public')
          rescue.execute('create table public.source_matchup_rescue as select * from read_parquet(?)', [matchup])
          rescue.close()
          PY
      - name: Merge source sidecar and validate
        run: |
          python code/scripts/research_cohorts/merge_research_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out merged_corpus_snapshot.duckdb \
            --outcomes overlay_outcome_targets.duckdb \
            --matchups overlay_source_matchup_rescue.duckdb
          mv merged_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      - uses: actions/upload-artifact@v4
        with:
          name: research-public-lake-source-sidecar-${{ github.run_id }}
          path: research_public_lake/corpus_snapshot.duckdb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
