          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_outer_rows(
              c,
              source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='cmc_all_season_outer',
              year=None,
              player_id='00-0033280',
          )
          season_rows = c.execute("""
            SELECT year, array_length(cohort_cells)
            FROM cmc_all_season_outer ORDER BY year
          """).fetchall()
          assert season_rows == [(year, 1) for year in range(2017, 2026)], season_rows
          materialize_career_outer_rows(
