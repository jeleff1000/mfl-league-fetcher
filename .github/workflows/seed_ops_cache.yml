        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v4-Linux-nfl_player_stats_all-batch-02
      - name: Restore stats checkpoint 03
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v4-Linux-nfl_player_stats_all-batch-03
      - name: Restore stats checkpoint 04
