name: MFL Saved Chunk Validator

on:
  workflow_dispatch:
    inputs:
      chunk_key:
        description: 'Immutable chunk cache key to validate'
        required: true
        type: string
      index_key:
        description: 'Immutable index cache key to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore immutable chunk
        uses: actions/cache/restore@v5
        with:
          path: chunk_state
          key: ${{ inputs.chunk_key }}
          fail-on-cache-miss: true
      - name: Restore immutable index
        uses: actions/cache/restore@v5
        with:
          path: index_state
          key: ${{ inputs.index_key }}
          fail-on-cache-miss: true
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore pip download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: mfl-pip-duckdb-v1-${{ runner.os }}-py311
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check duckdb==1.5.1
      - name: Validate saved proof and rows
        env:
          CHUNK_KEY: ${{ inputs.chunk_key }}
          INDEX_KEY: ${{ inputs.index_key }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import duckdb

          chunk_key = os.environ['CHUNK_KEY']
          index_key = os.environ['INDEX_KEY']
          proof = json.loads(Path('chunk_state/cache_append_proof.json').read_text())
          index = json.loads(Path('index_state/mfl_register_all_runs.json').read_text())
          print(json.dumps({'index_key': index_key, 'accepted_by_year': index.get('accepted_by_year', {})}, sort_keys=True), flush=True)

          required = {
              'schema_unchanged': True,
              'prior_rows_preserved': True,
              'new_lineage': False,
              'duplicate_league_year_keys': False,
          }
          for key, expected in required.items():
              if proof.get(key) != expected:
                  raise SystemExit(f'proof gate failed: {key}={proof.get(key)!r}')
          if proof.get('chunk_cache_key') not in (None, chunk_key):
              raise SystemExit('proof chunk key mismatch')
          if index.get('league_count') != proof.get('final_league_count'):
              raise SystemExit('index league count mismatch')
          rejected = index.get('rejected', [])
          if index.get('rejected_count', len(rejected)) != len(rejected):
              raise SystemExit('index rejected count mismatch')
          if 'source_chunk_count' not in proof and index.get('attempted_count', index.get('league_count', 0) + len(rejected)) != index.get('league_count', 0) + len(rejected):
              raise SystemExit('index attempted count mismatch')
          if index.get('manifest_count') is not None:
              expected_pending = index['manifest_count'] - index['league_count'] - len(rejected)
              if index.get('pending_count') != max(0, expected_pending):
                  raise SystemExit('index pending count mismatch')
          if not any(c.get('cache_key') == chunk_key for c in index.get('chunks', [])):
              raise SystemExit('index does not reference saved chunk')

          db = Path('chunk_state/mfl_register_chunk.duckdb')
          con = duckdb.connect(str(db), read_only=True)
          actual = {}
          for table in ('league_settings', 'matchup', 'player_fantasy'):
              exists = con.execute(
                  "select count(*) from information_schema.tables "
                  "where table_schema='main' and table_name=?", [table]
              ).fetchone()[0]
              actual[table] = int(con.execute(f'select count(*) from "{table}"').fetchone()[0]) if exists else 0
          con.close()
          if actual != proof.get('added_rows'):
              raise SystemExit(f'chunk row counts mismatch: actual={actual} proof={proof.get("added_rows")}')
          print(json.dumps({'live_cache_validated': True, 'index_key': index_key, 'accepted_by_year': index.get('accepted_by_year', {}), 'proof': proof, 'chunk_rows': actual}, sort_keys=True))
          PY
