name: Research matchup CMC compact read-only pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and validate only CMC 2025 compact rows
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_core_cohort_position_batch, materialize_season_core_cohort_position_batch, materialize_season_bracket_grade_position_batch
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          cmc_rows=c.execute("SELECT COUNT(*), COUNT(*) FILTER (WHERE is_rostered=1) FROM lake.public.player_fantasy WHERE NFL_player_id='00-0033280' AND year=2025 AND position='RB'").fetchone()
          assert cmc_rows[0] >= 5000 and cmc_rows[1] > 0, cmc_rows
          materialize_weekly_core_cohort_position_batch(c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all', output_table='weekly', year=2025, position='RB', split_threshold=150, player_id='00-0033280')
          weekly=c.execute("SELECT week FROM weekly WHERE NFL_player_id='00-0033280' ORDER BY week").fetchall()
          assert [w for w, in weekly] == list(range(1,14))+list(range(15,19)), weekly
          full=c.execute("SELECT cell.eligible_leagues,cell.rostered_leagues,cell.started_leagues,cell.valid_started_outcomes,cell.win_equivalent FROM weekly, UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND week=1 AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
          assert full == (9838,9768,9600,9578,6019.0), full
          materialize_season_core_cohort_position_batch(c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all', output_table='season', year=2025, position='RB', split_threshold=50, player_id='00-0033280')
          season=c.execute("SELECT cell.eligible_leagues,cell.rostered_league_weeks,cell.eligible_league_weeks,cell.started_league_weeks,cell.valid_started_outcomes,cell.win_equivalent,cell.active_weeks,cell.inactive_weeks FROM season, UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
          assert season == (9980,157712,158687,155272,149661,91505.0,17,0), season
          materialize_season_bracket_grade_position_batch(c, source_table='lake.public.player_fantasy', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all', output_table='grades', year=2025, position='RB', split_threshold=50, player_id='00-0033280')
          grades=c.execute("SELECT cell.eligible_leagues,cell.playoff_leagues,cell.champ_leagues FROM grades, UNNEST(grade_cells) u(cell) WHERE NFL_player_id='00-0033280' AND cell.q_playoff_teams='ALL'").fetchone()
          assert grades == (9980,6853,2031), grades
          print('cmc_compact_readonly_pilot='+json.dumps({'weekly_outer_rows':len(weekly),'week1_full_pool':full,'season_full_pool':season,'grades_full_pool':grades}))
          PY
