          rows = c.execute("""
            SELECT o.NFL_player_id, o.position, cell.*
            FROM cmc_career_outer o, UNNEST(o.cohort_cells) AS u(cell)
          """).fetchall()
          assert len(rows) == 1, rows
          columns = [d[0] for d in c.description]
          row = dict(zip(columns, rows[0]))
          assert row['NFL_player_id'] == '00-0033280' and row['position'] == 'RB', row
          assert row['cohort_key'] == 'ALL' and row['qualifying_seasons'] == 9, row
          assert abs(row['expected_wins'] + row['expected_losses'] - row['expected_starts']) < 1e-8, row
          assert 0 <= row['champ_rate_pct'] <= row['playoff_rate_pct'] <= 100, row
