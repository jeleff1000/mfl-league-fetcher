name: Fly League Settings Recovery

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Validated Fly volume snapshot to source league_settings from
        required: true
        type: string
      existing_volume_id:
        description: Optional retained, restored wkupd_rebuild volume to reuse instead of restoring snapshot_id
        required: false
        default: ''
        type: string
      snapshot_created_at:
        description: UTC cutoff used to preserve every later import/update settings row
        required: true
        type: string
      preservation_snapshot_id:
        description: Created snapshot preserving the current pre-recovery volume
        required: true
        type: string
      expected_final_rows:
        description: Exact live row count after overlay, or auto to derive and verify it
        required: true
        default: auto
        type: string
      expected_overlay_leagues:
        description: Exact changed-league count since the source snapshot
        required: true
        type: string
      expected_overlay_rows:
        description: Exact current settings rows across the changed-league overlay
        required: true
        type: string
      expected_source_sha:
        description: Exact public main SHA containing the guarded recovery endpoint
        required: true
        type: string
      apply_recovery:
        description: Upload and atomically apply after isolated validation
        required: true
        default: false
        type: boolean
      recover_derived_rollups:
        description: Restore the five validated derived tables and rebuild changed leagues from persisted sources
        required: true
        default: false
        type: boolean
      recover_settings:
        description: Replace league_settings as part of this recovery
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fly-league-settings-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact public main
        uses: actions/checkout@v5

      - name: Verify requested source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SOURCE_SHA"

      - name: Install flyctl
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate snapshot and optionally recover league_settings
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
          FLY_APP: league-history-duckdb
          SNAPSHOT_ID: ${{ inputs.snapshot_id }}
          EXISTING_VOLUME_ID: ${{ inputs.existing_volume_id }}
          SNAPSHOT_CREATED_AT: ${{ inputs.snapshot_created_at }}
          PRESERVATION_SNAPSHOT_ID: ${{ inputs.preservation_snapshot_id }}
          EXPECTED_FINAL_ROWS: ${{ inputs.expected_final_rows }}
          EXPECTED_OVERLAY_LEAGUES: ${{ inputs.expected_overlay_leagues }}
          EXPECTED_OVERLAY_ROWS: ${{ inputs.expected_overlay_rows }}
          APPLY_RECOVERY: ${{ inputs.apply_recovery }}
          RECOVER_DERIVED_ROLLUPS: ${{ inputs.recover_derived_rollups }}
          RECOVER_SETTINGS: ${{ inputs.recover_settings }}
        run: |
          set -euo pipefail
          for value in "$SNAPSHOT_ID" "$PRESERVATION_SNAPSHOT_ID"; do
            [[ "$value" =~ ^vs_[A-Za-z0-9]+$ ]] || { echo "Invalid snapshot ID" >&2; exit 2; }
          done
          if [ -n "$EXISTING_VOLUME_ID" ]; then
            [[ "$EXISTING_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]] || exit 2
          fi
          [[ "$EXPECTED_FINAL_ROWS" = "auto" || "$EXPECTED_FINAL_ROWS" =~ ^[1-9][0-9]*$ ]] || exit 2
          [[ "$EXPECTED_OVERLAY_LEAGUES" =~ ^[0-9]+$ ]] || exit 2
          [[ "$EXPECTED_OVERLAY_ROWS" =~ ^[0-9]+$ ]] || exit 2
          [ "$RECOVER_SETTINGS" = "true" ] || [ "$RECOVER_DERIVED_ROLLUPS" = "true" ] || exit 2

          flyctl machines list --app "$FLY_APP" --json > machines.json
          flyctl volumes list --app "$FLY_APP" --json > volumes.json
          source_volume_id="$(jq -r 'map(select(.name == "duckdb_data"))[0].id // empty' volumes.json)"
          source_region="$(jq -r 'map(select(.name == "duckdb_data"))[0].region // empty' volumes.json)"
          source_size_gb="$(jq -r 'map(select(.name == "duckdb_data"))[0].size_gb // empty' volumes.json)"
          image_ref="$(jq -r 'map(select(.state == "started"))[0].config.image // empty' machines.json)"
          test -n "$source_volume_id"
          test -n "$source_region"
          test -n "$source_size_gb"
          test -n "$image_ref"

          if [ -n "$EXISTING_VOLUME_ID" ]; then
            existing_name="$(jq -r --arg id "$EXISTING_VOLUME_ID" \
              'map(select(.id == $id))[0].name // empty' volumes.json)"
            existing_region="$(jq -r --arg id "$EXISTING_VOLUME_ID" \
              'map(select(.id == $id))[0].region // empty' volumes.json)"
            existing_state="$(jq -r --arg id "$EXISTING_VOLUME_ID" \
              'map(select(.id == $id))[0].state // empty' volumes.json)"
            existing_attached_machine="$(jq -r --arg id "$EXISTING_VOLUME_ID" \
              'map(select(.id == $id))[0].attached_machine_id' volumes.json)"
            [[ "$existing_name" == wkupd_rebuild_* ]]
            test -n "$existing_region"
            test "$existing_state" = "created"
            test "$existing_attached_machine" = "null"
            test "$EXISTING_VOLUME_ID" != "$source_volume_id"
            source_region="$existing_region"
          fi

          snapshots_json="$(flyctl volumes snapshots list "$source_volume_id" --app "$FLY_APP" --json)"
          printf '%s' "$snapshots_json" | jq -e --arg id "$SNAPSHOT_ID" \
            '.[] | select(.id == $id and .status == "created")' >/dev/null
          printf '%s' "$snapshots_json" | jq -e --arg id "$PRESERVATION_SNAPSHOT_ID" \
            '.[] | select(.id == $id and .status == "created")' >/dev/null

          recovery_volume_id=""
          recovery_machine_id=""
          owns_recovery_volume="false"
          cleanup() {
            if [ -n "$recovery_machine_id" ]; then
              flyctl machine destroy "$recovery_machine_id" --app "$FLY_APP" --force || true
            fi
            if [ "$owns_recovery_volume" = "true" ] && [ -n "$recovery_volume_id" ]; then
              flyctl volumes destroy "$recovery_volume_id" --app "$FLY_APP" --yes || true
            fi
          }
          trap cleanup EXIT

          if [ -n "$EXISTING_VOLUME_ID" ]; then
            recovery_volume_id="$EXISTING_VOLUME_ID"
          else
            recovery_json="$(flyctl volumes create "wkupd_${GITHUB_RUN_ID}" --app "$FLY_APP" \
              --region "$source_region" --size "$source_size_gb" --snapshot-id "$SNAPSHOT_ID" \
              --scheduled-snapshots=false --require-unique-zone=false --yes --json)"
            recovery_volume_id="$(printf '%s' "$recovery_json" | jq -r '.id')"
            test -n "$recovery_volume_id"
            test "$recovery_volume_id" != "null"
            owns_recovery_volume="true"

            recovery_state="restoring"
            for _ in $(seq 1 720); do
              recovery_state="$(flyctl volumes show "$recovery_volume_id" --app "$FLY_APP" --json | jq -r '.state')"
              [ "$recovery_state" = "created" ] && break
              sleep 5
            done
            [ "$recovery_state" = "created" ] || { echo "Snapshot restore timed out" >&2; exit 3; }
          fi

          cat > build_recovery_overlay_manifest.py <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.request
          from pathlib import Path

          server = os.environ["DATABASE_SERVER_URL"].rstrip("/")
          token = os.environ["DATABASE_READ_TOKEN"]
          cutoff = dt.datetime.fromisoformat(
              os.environ["SNAPSHOT_CREATED_AT"].replace("Z", "+00:00")
          ).isoformat()

          def query(database, sql):
              request = urllib.request.Request(
                  f"{server}/query",
                  data=json.dumps({"database": database, "sql": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          context_names = {
              str(row["db_name"])
              for row in query(
                  "___leagues",
                  "SELECT DISTINCT db_name FROM public.league_context "
                  f"WHERE updated_at >= TIMESTAMPTZ '{cutoff}' AND db_name IS NOT NULL",
              )
          }
          dispatch_names = {
              str(row["database_name"])
              for row in query(
                  "___ops",
                  "SELECT DISTINCT database_name FROM accounts.league_update_dispatches "
                  f"WHERE updated_at >= TIMESTAMPTZ '{cutoff}' AND database_name IS NOT NULL",
              )
          }
          names = sorted(context_names | dispatch_names)
          overlay_rows = 0
          overlay_keys = 0
          derived_keys = {
              "homepage_manager_rankings": ("db_name", "franchise_id"),
              "matchup_h2h_career": (
                  "db_name", "franchise_id", "opponent_franchise_id",
              ),
              "player_fantasy_season": ("db_name", "NFL_player_id", "year"),
              "player_fantasy_season_all": ("db_name", "NFL_player_id", "year"),
              "standings_by_year": ("db_name", "franchise_id", "year"),
          }
          derived_overlay = {
              table: {"rows": 0, "keys": 0}
              for table in derived_keys
          } if os.environ.get("RECOVER_DERIVED_ROLLUPS", "").lower() == "true" else {}
          for db_name in names:
              db_literal = "'" + db_name.replace("'", "''") + "'"
              scope = query(
                  "___leagues",
                  "SELECT COUNT(*) AS rows, COUNT(DISTINCT (db_name, year)) AS keys "
                  f"FROM public.league_settings WHERE db_name = {db_literal}",
              )[0]
              overlay_rows += int(scope["rows"])
              overlay_keys += int(scope["keys"])
              if os.environ.get("RECOVER_DERIVED_ROLLUPS", "").lower() == "true":
                  for table, key_columns in derived_keys.items():
                      key_sql = ", ".join(key_columns)
                      table_scope = query(
                          "___leagues",
                          "SELECT COUNT(*) AS rows, "
                          f"COUNT(DISTINCT ({key_sql})) AS keys "
                          f"FROM public.{table} WHERE db_name = {db_literal}",
                      )[0]
                      table_rows = int(table_scope["rows"])
                      table_keys = int(table_scope["keys"])
                      if table_rows != table_keys:
                          raise RuntimeError(
                              f"live {table} overlay has duplicate keys: "
                              f"rows={table_rows}, keys={table_keys}"
                          )
                      derived_overlay[table]["rows"] += table_rows
                      derived_overlay[table]["keys"] += table_keys
          expected_leagues = int(os.environ["EXPECTED_OVERLAY_LEAGUES"])
          expected_rows = int(os.environ["EXPECTED_OVERLAY_ROWS"])
          if len(names) != expected_leagues or overlay_rows != expected_rows:
              raise RuntimeError(
                  "live overlay changed while recovery was prepared: "
                  f"leagues={len(names)}/{expected_leagues}, rows={overlay_rows}/{expected_rows}"
              )
          if overlay_keys != overlay_rows:
              raise RuntimeError(
                  f"live overlay has duplicate settings keys: rows={overlay_rows}, keys={overlay_keys}"
              )
          manifest = {
              "cutoff": cutoff,
              "names": names,
              "overlay_rows": overlay_rows,
              "overlay_keys": overlay_keys,
              "derived_overlay": derived_overlay,
          }
          Path("recovery-overlay-manifest.json").write_text(
              json.dumps(manifest, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps({"overlay_leagues": len(names), "overlay_rows": overlay_rows}, sort_keys=True))
          PY
          python build_recovery_overlay_manifest.py

          cat > snapshot_export.py <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import duckdb

          source_path = Path("/data/___leagues.duckdb")
          output_path = Path("/tmp/league_settings_snapshot.duckdb")
          overlay_manifest = json.loads(
              Path("/tmp/recovery-overlay-manifest.json").read_text(encoding="utf-8")
          )
          output_path.unlink(missing_ok=True)

          source = duckdb.connect(str(source_path), read_only=True)
          checks = {
              "league_settings": "SELECT COUNT(*), COUNT(DISTINCT (db_name, year)), MAX(year) FROM public.league_settings",
              "league_context": "SELECT COUNT(*), COUNT(DISTINCT db_name) FROM public.league_context",
              "matchup": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.matchup",
              "player_fantasy": "SELECT COUNT(*), COUNT(DISTINCT db_name), MAX(year) FROM public.player_fantasy",
          }
          results = {name: source.execute(sql).fetchone() for name, sql in checks.items()}
          ddl_row = source.execute(
              "SELECT sql FROM duckdb_tables() "
              "WHERE database_name = '___leagues' AND schema_name = 'public' "
              "AND table_name = 'league_settings'"
          ).fetchone()
          if not ddl_row or not ddl_row[0]:
              raise RuntimeError("snapshot has no league_settings DDL")
          ddl = str(ddl_row[0])
          source.close()

          output = duckdb.connect(str(output_path))
          output.execute("CREATE SCHEMA public")
          output.execute(ddl)
          output.execute(f"ATTACH '{source_path.as_posix()}' AS snapshot (READ_ONLY)")
          output.execute(
              "INSERT INTO public.league_settings BY NAME "
              "SELECT * FROM snapshot.public.league_settings"
          )
          overlay_names = list(overlay_manifest["names"])
          snapshot_overlay_rows = 0
          if overlay_names:
              placeholders = ",".join("?" for _ in overlay_names)
              snapshot_overlay_rows = output.execute(
                  "SELECT COUNT(*) FROM snapshot.public.league_settings "
                  f"WHERE db_name IN ({placeholders})",
                  overlay_names,
              ).fetchone()[0]
          output.execute("DETACH snapshot")
          exported = output.execute(
              "SELECT COUNT(*), COUNT(DISTINCT (db_name, year)) FROM public.league_settings"
          ).fetchone()
          output.execute("CHECKPOINT")
          output.close()
          if exported[0] != exported[1] or exported[0] != results["league_settings"][0]:
              raise RuntimeError(f"snapshot export key/count mismatch: {exported!r}")

          digest = hashlib.sha256(output_path.read_bytes()).hexdigest()
          calculated_final_rows = (
              int(exported[0])
              - int(snapshot_overlay_rows)
              + int(overlay_manifest["overlay_rows"])
          )
          derived_bundles = {}
          if os.environ.get("RECOVER_DERIVED_ROLLUPS", "").lower() == "true":
              derived_keys = {
                  "homepage_manager_rankings": ("db_name", "franchise_id"),
                  "matchup_h2h_career": (
                      "db_name", "franchise_id", "opponent_franchise_id",
                  ),
                  "player_fantasy_season": ("db_name", "NFL_player_id", "year"),
                  "player_fantasy_season_all": ("db_name", "NFL_player_id", "year"),
                  "standings_by_year": ("db_name", "franchise_id", "year"),
              }
              for table, key_columns in derived_keys.items():
                  bundle_path = Path(f"/tmp/{table}_snapshot.duckdb")
                  bundle_path.unlink(missing_ok=True)
                  source = duckdb.connect(str(source_path), read_only=True)
                  ddl_row = source.execute(
                      "SELECT sql FROM duckdb_tables() "
                      "WHERE database_name = '___leagues' AND schema_name = 'public' "
                      "AND table_name = ?",
                      [table],
                  ).fetchone()
                  if not ddl_row or not ddl_row[0]:
                      raise RuntimeError(f"snapshot has no {table} DDL")
                  table_ddl = str(ddl_row[0])
                  quoted_keys = ", ".join('"' + key.replace('"', '""') + '"' for key in key_columns)
                  expected = source.execute(
                      f'SELECT COUNT(*), COUNT(*) - COUNT(DISTINCT ({quoted_keys})) '
                      f'FROM public."{table}"'
                  ).fetchone()
                  snapshot_overlay_rows = 0
                  overlay_names = list(overlay_manifest["names"])
                  if overlay_names:
                      placeholders = ",".join("?" for _ in overlay_names)
                      snapshot_overlay_rows = int(source.execute(
                          f'SELECT COUNT(*) FROM public."{table}" '
                          f'WHERE db_name IN ({placeholders})',
                          overlay_names,
                      ).fetchone()[0])
                  source.close()
                  if int(expected[0]) <= 0 or int(expected[1]) != 0:
                      raise RuntimeError(
                          f"snapshot {table} has invalid rows/keys: {expected!r}"
                      )

                  bundle = duckdb.connect(str(bundle_path))
                  bundle.execute("CREATE SCHEMA public")
                  bundle.execute(table_ddl)
                  bundle.execute(f"ATTACH '{source_path.as_posix()}' AS snapshot (READ_ONLY)")
                  bundle.execute(
                      f'INSERT INTO public."{table}" BY NAME '
                      f'SELECT * FROM snapshot.public."{table}"'
                  )
                  bundle.execute("DETACH snapshot")
                  verified = bundle.execute(
                      f'SELECT COUNT(*), COUNT(*) - COUNT(DISTINCT ({quoted_keys})) '
                      f'FROM public."{table}"'
                  ).fetchone()
                  bundle.execute("CHECKPOINT")
                  bundle.close()
                  if verified != expected:
                      raise RuntimeError(
                          f"snapshot {table} export mismatch: expected={expected!r}, actual={verified!r}"
                      )
                  derived_bundles[table] = {
                      "rows": int(verified[0]),
                      "sha256": hashlib.sha256(bundle_path.read_bytes()).hexdigest(),
                      "bytes": bundle_path.stat().st_size,
                      "snapshot_overlay_rows": snapshot_overlay_rows,
                      "live_overlay_rows": int(
                          overlay_manifest["derived_overlay"][table]["rows"]
                      ),
                      "calculated_final_rows": (
                          int(verified[0])
                          - snapshot_overlay_rows
                          + int(overlay_manifest["derived_overlay"][table]["rows"])
                      ),
                  }
          print(json.dumps({
              "checks": results,
              "bundle_rows": exported[0],
              "bundle_sha256": digest,
              "bundle_bytes": output_path.stat().st_size,
              "snapshot_overlay_rows": snapshot_overlay_rows,
              "calculated_final_rows": calculated_final_rows,
              "derived_bundles": derived_bundles,
          }, sort_keys=True))
          PY
          recovery_machine_name="wkupd-recover-${GITHUB_RUN_ID}"
          flyctl machine run "$image_ref" --app "$FLY_APP" \
            --name "$recovery_machine_name" \
            --region "$source_region" --volume "$recovery_volume_id:/data" \
            --entrypoint /bin/sh --file-local "/tmp/snapshot_export.py=snapshot_export.py" \
            --file-local "/tmp/recovery-overlay-manifest.json=recovery-overlay-manifest.json" \
            --restart no --detach --vm-cpus 1 --vm-memory 2048 -- -lc 'sleep 3600' \
            | tee recovery-machine-run.log
          for _ in $(seq 1 30); do
            recovery_machine_id="$(flyctl machines list --app "$FLY_APP" --json \
              | jq -r --arg name "$recovery_machine_name" 'map(select(.name == $name))[0].id // empty')"
            [ -n "$recovery_machine_id" ] && break
            sleep 2
          done
          test -n "$recovery_machine_id"
          test "$recovery_machine_id" != "null"

          recovery_machine_state=""
          for _ in $(seq 1 60); do
            recovery_machine_state="$(flyctl machines list --app "$FLY_APP" --json \
              | jq -r --arg id "$recovery_machine_id" '.[] | select(.id == $id) | .state')"
            [ "$recovery_machine_state" = "started" ] && break
            sleep 2
          done
          [ "$recovery_machine_state" = "started" ] || exit 4

          flyctl ssh console --app "$FLY_APP" --machine "$recovery_machine_id" \
            -C "python /tmp/snapshot_export.py" | tee snapshot-export.log
          flyctl ssh sftp get /tmp/league_settings_snapshot.duckdb \
            league_settings_snapshot.duckdb --app "$FLY_APP" --machine "$recovery_machine_id"
          if [ "$RECOVER_DERIVED_ROLLUPS" = "true" ]; then
            for table in homepage_manager_rankings matchup_h2h_career player_fantasy_season player_fantasy_season_all standings_by_year; do
              flyctl ssh sftp get "/tmp/${table}_snapshot.duckdb" \
                "${table}_snapshot.duckdb" --app "$FLY_APP" --machine "$recovery_machine_id"
            done
          fi

          bundle_sha256="$(sha256sum league_settings_snapshot.duckdb | awk '{print $1}')"
          bundle_rows="$(grep '^{' snapshot-export.log | tail -1 | jq -r '.bundle_rows')"
          logged_sha256="$(grep '^{' snapshot-export.log | tail -1 | jq -r '.bundle_sha256')"
          calculated_final_rows="$(grep '^{' snapshot-export.log | tail -1 | jq -r '.calculated_final_rows')"
          test "$bundle_sha256" = "$logged_sha256"
          test "$bundle_rows" -gt 0
          test "$calculated_final_rows" -gt 0
          if [ "$RECOVER_DERIVED_ROLLUPS" = "true" ]; then
            for table in homepage_manager_rankings matchup_h2h_career player_fantasy_season player_fantasy_season_all standings_by_year; do
              expected_sha="$(grep '^{' snapshot-export.log | tail -1 | jq -r --arg table "$table" '.derived_bundles[$table].sha256')"
              expected_rows="$(grep '^{' snapshot-export.log | tail -1 | jq -r --arg table "$table" '.derived_bundles[$table].rows')"
              actual_sha="$(sha256sum "${table}_snapshot.duckdb" | awk '{print $1}')"
              test "$expected_sha" = "$actual_sha"
              test "$expected_rows" -gt 0
            done
          fi
          if [ "$EXPECTED_FINAL_ROWS" != "auto" ]; then
            test "$EXPECTED_FINAL_ROWS" = "$calculated_final_rows"
          fi
          FINAL_EXPECTED_ROWS="$calculated_final_rows"

          if [ "$APPLY_RECOVERY" != "true" ]; then
            echo "Snapshot bundle validated; apply_recovery=false, production unchanged"
            exit 0
          fi

          if [ "$RECOVER_SETTINGS" = "true" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST "${DATABASE_SERVER_URL%/}/replace-canonical-table" \
              -H "Authorization: Bearer ${DATABASE_ADMIN_TOKEN}" \
              -H "X-Db-Name: ___leagues" \
              -H "X-Table-Name: league_settings" \
              -H "X-Expected-Rows: ${FINAL_EXPECTED_ROWS}" \
              -H "X-Content-Sha256: ${bundle_sha256}" \
              -H "X-Recovery-Since: ${SNAPSHOT_CREATED_AT}" \
              -H "X-Expected-Overlay-Leagues: ${EXPECTED_OVERLAY_LEAGUES}" \
              -H "X-Expected-Overlay-Rows: ${EXPECTED_OVERLAY_ROWS}" \
              -F "file=@league_settings_snapshot.duckdb;type=application/octet-stream" \
              | tee recovery-response.json

            jq -e --argjson rows "$FINAL_EXPECTED_ROWS" \
              '.status == "replaced" and .rows == $rows and .distinct_keys == $rows and
               (.checkpointed == true or
                ((.checkpoint_error // "") | test("checksum"; "i")))' \
              recovery-response.json >/dev/null
            echo "Accepted intermediate canonical replacement; final checkpoint follows all table swaps."
          fi

          if [ "$RECOVER_DERIVED_ROLLUPS" = "true" ]; then
            for table in homepage_manager_rankings matchup_h2h_career player_fantasy_season player_fantasy_season_all standings_by_year; do
              table_rows="$(grep '^{' snapshot-export.log | tail -1 | jq -r --arg table "$table" '.derived_bundles[$table].calculated_final_rows')"
              table_overlay_rows="$(grep '^{' snapshot-export.log | tail -1 | jq -r --arg table "$table" '.derived_bundles[$table].live_overlay_rows')"
              table_sha="$(grep '^{' snapshot-export.log | tail -1 | jq -r --arg table "$table" '.derived_bundles[$table].sha256')"
              curl --fail-with-body --silent --show-error \
                -X POST "${DATABASE_SERVER_URL%/}/replace-canonical-table" \
                -H "Authorization: Bearer ${DATABASE_ADMIN_TOKEN}" \
                -H "X-Db-Name: ___leagues" \
                -H "X-Table-Name: ${table}" \
                -H "X-Expected-Rows: ${table_rows}" \
                -H "X-Content-Sha256: ${table_sha}" \
                -H "X-Recovery-Since: ${SNAPSHOT_CREATED_AT}" \
                -H "X-Expected-Overlay-Leagues: ${EXPECTED_OVERLAY_LEAGUES}" \
                -H "X-Expected-Overlay-Rows: ${table_overlay_rows}" \
                -F "file=@${table}_snapshot.duckdb;type=application/octet-stream" \
                | tee "recovery-response-${table}.json"
              jq -e --arg table "$table" --argjson rows "$table_rows" \
                --argjson overlay_leagues "$EXPECTED_OVERLAY_LEAGUES" \
                --argjson overlay_rows "$table_overlay_rows" \
                '.status == "replaced" and .table == $table and .rows == $rows and
                 .distinct_keys == $rows and .overlay_leagues == $overlay_leagues and
                 .overlay_rows == $overlay_rows and
                 (.checkpointed == true or
                  ((.checkpoint_error // "") | test("checksum"; "i")))' \
                "recovery-response-${table}.json" >/dev/null
              echo "Accepted intermediate canonical replacement for ${table}; final checkpoint follows all table swaps."
            done

            recovery_run_id="fly-derived-recovery-${GITHUB_RUN_ID}"
            jq -r '.names[]' recovery-overlay-manifest.json | while IFS= read -r db_name; do
              rebuild_body="$(jq -cn --arg db "$db_name" --arg run "$recovery_run_id" \
                '{db_name:$db,run_id:$run}')"
              curl --fail-with-body --silent --show-error \
                -X POST "${DATABASE_SERVER_URL%/}/rebuild-league-derived" \
                -H "Authorization: Bearer ${DATABASE_ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "$rebuild_body" \
                | tee "derived-rebuild-${db_name}.json"
              jq -e --arg db "$db_name" \
                '(.status == "COMMITTED" or .status == "ALREADY_COMMITTED") and .db_name == $db' \
                "derived-rebuild-${db_name}.json" >/dev/null
            done
          fi

          if [ "$RECOVER_SETTINGS" = "true" ]; then
            query_body="$(jq -cn '{database:"___leagues",sql:"SELECT COUNT(*) AS rows, COUNT(DISTINCT (db_name, year)) AS distinct_keys, MAX(year) AS max_year FROM public.league_settings"}')"
            curl --fail-with-body --silent --show-error \
              -X POST "${DATABASE_SERVER_URL%/}/query" \
              -H "Authorization: Bearer ${DATABASE_READ_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$query_body" | tee recovery-readback.json
            jq -e --argjson rows "$FINAL_EXPECTED_ROWS" \
              '.[0].rows == $rows and .[0].distinct_keys == $rows' recovery-readback.json >/dev/null
          fi

          if [ "$RECOVER_DERIVED_ROLLUPS" = "true" ]; then
            cat > verify_recovered_rollups.py <<'PY'
          import json
          import os
          import urllib.request

          server = os.environ["DATABASE_SERVER_URL"].rstrip("/")
          token = os.environ["DATABASE_READ_TOKEN"]
          tables = [
              "homepage_manager_rankings",
              "matchup_h2h_career",
              "player_fantasy_season",
              "player_fantasy_season_all",
              "standings_by_year",
          ]

          def query(sql):
              request = urllib.request.Request(
                  f"{server}/query",
                  data=json.dumps({"database": "___leagues", "sql": sql}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          result = {}
          for table in tables:
              columns = query(
                  "SELECT column_name FROM information_schema.columns "
                  "WHERE table_catalog='___leagues' AND table_schema='public' "
                  f"AND table_name='{table}' ORDER BY ordinal_position"
              )
              quoted = ", ".join(
                  '"' + row["column_name"].replace('"', '""') + '"' for row in columns
              )
              row = query(
                  f'SELECT COUNT(*) AS rows, BIT_XOR(hash({quoted})) AS digest '
                  f'FROM public."{table}"'
              )[0]
              if int(row["rows"]) <= 0 or row["digest"] is None:
                  raise RuntimeError(f"recovered table is empty or unreadable: {table} {row}")
              result[table] = row
          print(json.dumps(result, sort_keys=True))
          PY
            python verify_recovered_rollups.py | tee derived-recovery-readback.json

            checkpoint_body='{"database":"___leagues","sql":"CHECKPOINT"}'
            curl --fail-with-body --silent --show-error \
              -X POST "${DATABASE_SERVER_URL%/}/query-rw" \
              -H "Authorization: Bearer ${DATABASE_ADMIN_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$checkpoint_body" \
              | tee derived-recovery-checkpoint.json
          fi

          trap - EXIT
          cleanup
