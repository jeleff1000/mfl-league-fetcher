name: Research matchup compact CMC cache pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      mode:
        description: Immutable cache-only pilot scope
        required: true
        type: choice
        default: cmc_week1
        options:
          - cmc_week1
          - cmc_2025_weekly
          - cmc_2025_season_only
          - cmc_2025_season
          - cmc_2025_all_grains
          - myles_2025_season
          - rb_2025_weekly
          - all_2025_weekly
          - rb_2025_lane
          - rb_2025_week1_inventory
          - rb_2025_week1_distribution
          - rb_2025_week1_residual_shapes
          - rb_2025_bucket_inventory
          - rb_2025_bucket
          - rb_2025_bucket_core
          - rb_2025_bucket_grade
          - rb_2025_bucket_grade_shapes
          - cache_schedule_lookup_probe
          - local_cache_export
      bucket:
        description: One deterministic balanced 2025 RB bucket (1-15)
        required: true
        default: '3'

permissions:
  contents: read

jobs:
  cmc_cache_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and validate exactly CMC 2025 week 1
        env:
          PYTHONPATH: ${{ github.workspace }}/code
          CACHE_KEY: ${{ inputs.cache_key }}
          PILOT_MODE: ${{ inputs.mode }}
          PILOT_BUCKET: ${{ inputs.bucket }}
        run: |
          python - <<'PY'
          import duckdb
          import os
          import resource
          from time import perf_counter
          from scripts.research_cohorts.compact_matchup_cells import (
              _source_without_bad_identity_rows,
              _canonical_position_sql,
              materialize_career_cohort_grade_cells,
              materialize_career_core_cohort_cells,
              materialize_narrow_position_year_source,
              materialize_player_id_subset_source,
              materialize_season_bracket_grade_cells,
              materialize_season_bracket_grade_position_batch,
              materialize_season_core_cohort_cells,
              materialize_season_core_cohort_position_batch,
              materialize_weekly_core_cohort_cells,
          )

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          c.execute("""
            CREATE TEMP VIEW cached_regular_player_weeks AS
            SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
              CAST(year AS INTEGER) AS year, CAST(week AS INTEGER) AS week
            FROM lake.public.player_active_week
            WHERE week BETWEEN 1 AND 18
          """)
          c.execute("""
            CREATE TEMP VIEW cached_regular_team_game_weeks AS
            SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
              CAST(year AS INTEGER) AS year, CAST(week AS INTEGER) AS week
            FROM lake.public.player_team_game_week
            WHERE week BETWEEN 1 AND 18
          """)
          mode = os.environ['PILOT_MODE']
          if mode not in {'cmc_week1', 'cmc_2025_weekly', 'cmc_2025_season_only', 'cmc_2025_season', 'cmc_2025_all_grains', 'myles_2025_season', 'rb_2025_weekly', 'all_2025_weekly', 'rb_2025_lane', 'rb_2025_week1_inventory', 'rb_2025_week1_distribution', 'rb_2025_week1_residual_shapes', 'rb_2025_bucket_inventory', 'rb_2025_bucket', 'rb_2025_bucket_core', 'rb_2025_bucket_grade', 'rb_2025_bucket_grade_shapes', 'cache_schedule_lookup_probe', 'local_cache_export'}:
            raise ValueError(f'unsupported pilot mode: {mode}')
          if mode == 'cache_schedule_lookup_probe':
              required = {
                  'player_active_week': ['NFL_player_id', 'year', 'week'],
                  'player_team_game_week': ['NFL_player_id', 'year', 'week'],
              }
              probe = {}
              for table, expected_columns in required.items():
                  columns = [row[0] for row in c.execute(
                      f'DESCRIBE lake.public.{table}'
                  ).fetchall()]
                  missing = sorted(set(expected_columns) - set(columns))
                  if missing:
                      raise RuntimeError(f'{table} missing required columns: {missing}; actual={columns}')
                  probe[table] = {
                      'columns': columns,
                      '2025_regular_rows': c.execute(
                          f'SELECT COUNT(*) FROM lake.public.{table} '
                          'WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER) BETWEEN 1 AND 18'
                      ).fetchone()[0],
                      'cmc_2025_regular_rows': c.execute(
                          f"SELECT COUNT(*) FROM lake.public.{table} "
                          "WHERE CAST(NFL_player_id AS VARCHAR)='00-0033280' "
                          'AND CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER) BETWEEN 1 AND 18'
                      ).fetchone()[0],
                  }
              receipt = {'mode': mode, 'cache_key': os.environ['CACHE_KEY'], 'lookup_probe': probe}
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Immutable cache schedule lookup gate\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only schema/count probe; no cache save, aggregation output, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          if mode == 'local_cache_export':
              receipt = {
                'mode': mode,
                'cache_key': os.environ['CACHE_KEY'],
                'cache_path': 'research_public_lake',
                'operation': 'read_only_restore_then_single_transfer_bundle',
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## Immutable cache local diagnostic export\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- No cache save, source mutation, Fly access, API request, aggregation output, or publish step.\n')
              raise SystemExit(0)
          rollup_source = _source_without_bad_identity_rows(c, 'lake.public.player_fantasy')
          if mode in {'rb_2025_week1_inventory', 'rb_2025_week1_distribution', 'rb_2025_week1_residual_shapes'}:
              source_rows = c.execute("SELECT COUNT(*) FROM lake.public.player_fantasy WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1").fetchone()[0]
              filtered_source_rows = c.execute(f"SELECT COUNT(*) FROM {rollup_source} WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1").fetchone()[0]
          if mode == 'rb_2025_week1_inventory':
              inventory = c.execute(f"""
                WITH rb AS (
                  SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                    CASE WHEN is_rostered IS NULL OR CAST(is_rostered AS INTEGER) <> 0 THEN 1 ELSE 0 END AS rostered
                  FROM {rollup_source}
                  WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                    AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                )
                SELECT COUNT(DISTINCT NFL_player_id) AS distinct_rb_players,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE rostered=1) AS rostered_rb_players,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE rostered=0) AS explicitly_unrostered_rb_players
                FROM rb
              """).fetchone()
              receipt = {
                'mode': mode, 'source_rows_read': source_rows, 'filtered_source_rows': filtered_source_rows,
                'distinct_rb_players': inventory[0],
                'rostered_rb_players': inventory[1],
                'explicitly_unrostered_rb_players': inventory[2],
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 week 1 immutable-cache inventory\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only count; no aggregation table, cache save, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          if mode == 'rb_2025_week1_distribution':
              c.execute(f"""
                CREATE TEMP TABLE rb_week1_exposure AS
                SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                  COUNT(DISTINCT db_name) FILTER (
                    WHERE is_rostered IS NULL OR CAST(is_rostered AS INTEGER) <> 0
                  )::BIGINT AS rostered_leagues
                FROM {rollup_source}
                WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                  AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                GROUP BY 1
              """)
              distribution = c.execute("""
                SELECT COUNT(*) AS distinct_rb_players,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 1) AS ge_1,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 5) AS ge_5,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 10) AS ge_10,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 25) AS ge_25,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 50) AS ge_50,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 100) AS ge_100,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 150) AS ge_150,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 500) AS ge_500,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 1000) AS ge_1000,
                  COUNT(*) FILTER (WHERE rostered_leagues >= 5000) AS ge_5000,
                  MIN(rostered_leagues) AS min_leagues,
                  MAX(rostered_leagues) AS max_leagues
                FROM rb_week1_exposure
              """).fetchone()
              player_directory = """
                SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                  ANY_VALUE(CAST(player AS VARCHAR)) AS player,
                  ANY_VALUE(CAST(position AS VARCHAR)) AS stats_position
                FROM ops.nfl_historical.nfl_player_stats_all
                WHERE CAST(year AS INTEGER)=2025
                GROUP BY 1
              """
              lowest = c.execute(f"""
                SELECT e.NFL_player_id, d.player, d.stats_position, e.rostered_leagues
                FROM rb_week1_exposure e
                LEFT JOIN ({player_directory}) d USING (NFL_player_id)
                ORDER BY e.rostered_leagues, e.NFL_player_id
                LIMIT 20
              """).fetchall()
              highest = c.execute(f"""
                SELECT e.NFL_player_id, d.player, d.stats_position, e.rostered_leagues
                FROM rb_week1_exposure e
                LEFT JOIN ({player_directory}) d USING (NFL_player_id)
                ORDER BY e.rostered_leagues DESC, e.NFL_player_id
                LIMIT 20
              """).fetchall()
              receipt = {
                'mode': mode, 'source_rows_read': source_rows, 'filtered_source_rows': filtered_source_rows,
                'distribution': distribution,
                'lowest_exposure': lowest, 'highest_exposure': highest,
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 week 1 immutable-cache exposure distribution\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only diagnostic; no aggregation output, cache save, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          if mode == 'rb_2025_week1_residual_shapes':
              residual_shapes = c.execute(f"""
                WITH rb AS (
                  SELECT *
                  FROM {rollup_source}
                  WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                    AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                ), exposure AS (
                  SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                    COUNT(DISTINCT CAST(db_name AS VARCHAR)) FILTER (
                      WHERE is_rostered IS NULL OR CAST(is_rostered AS INTEGER)<>0
                    )::BIGINT AS rostered_leagues
                  FROM rb GROUP BY 1
                ), active_2025 AS (
                  SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id
                  FROM lake.public.player_active_week
                  WHERE CAST(year AS INTEGER)=2025
                ), residual AS (
                  SELECT rb.* FROM rb INNER JOIN exposure USING (NFL_player_id)
                  WHERE rostered_leagues < 50
                ), classified AS (
                  SELECT residual.*,
                    CASE WHEN active_2025.NFL_player_id IS NULL THEN 'not_active_2025' ELSE 'active_2025' END AS active_status
                  FROM residual
                  LEFT JOIN active_2025 USING (NFL_player_id)
                )
                SELECT
                  active_status,
                  COALESCE(NULLIF(TRIM(CAST(platform AS VARCHAR)), ''), '<blank_platform>'),
                  CASE WHEN COALESCE(TRIM(CAST(player AS VARCHAR)), '')='' THEN 'blank_player' ELSE 'named_player' END,
                  CASE WHEN COALESCE(TRIM(CAST(manager AS VARCHAR)), '')='' THEN 'blank_manager' ELSE 'manager_present' END,
                  CASE WHEN COALESCE(TRIM(CAST(team_key AS VARCHAR)), '')='' THEN 'blank_team_key' ELSE 'team_key_present' END,
                  CASE WHEN COALESCE(TRIM(CAST(team_name AS VARCHAR)), '')='' THEN 'blank_team_name' ELSE 'team_name_present' END,
                  CASE WHEN team_points IS NULL THEN 'null_team_points' ELSE 'team_points_present' END,
                  CASE WHEN fantasy_points IS NULL THEN 'null_player_points' WHEN fantasy_points=0 THEN 'zero_player_points' ELSE 'nonzero_player_points' END,
                  COUNT(*)::BIGINT AS rows,
                  COUNT(DISTINCT CAST(NFL_player_id AS VARCHAR))::BIGINT AS players,
                  COUNT(DISTINCT CAST(db_name AS VARCHAR))::BIGINT AS leagues
                FROM classified
                GROUP BY ALL ORDER BY rows DESC
              """).fetchall()
              residual_players = c.execute(f"""
                WITH rb AS (
                  SELECT * FROM {rollup_source}
                  WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                    AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                ), exposure AS (
                  SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                    COUNT(DISTINCT CAST(db_name AS VARCHAR)) FILTER (
                      WHERE is_rostered IS NULL OR CAST(is_rostered AS INTEGER)<>0
                    )::BIGINT AS rostered_leagues
                  FROM rb GROUP BY 1
                ), active_2025 AS (
                  SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id
                  FROM lake.public.player_active_week
                  WHERE CAST(year AS INTEGER)=2025
                )
                SELECT e.NFL_player_id, ANY_VALUE(CAST(rb.player AS VARCHAR)) AS player,
                  CASE WHEN MAX(active_2025.NFL_player_id) IS NULL THEN 'not_active_2025' ELSE 'active_2025' END AS active_status,
                  ANY_VALUE(CAST(rb.platform AS VARCHAR)) AS platform,
                  e.rostered_leagues, COUNT(*)::BIGINT AS rows,
                  SUM(CASE WHEN COALESCE(TRIM(CAST(rb.manager AS VARCHAR)), '')='' THEN 1 ELSE 0 END)::BIGINT AS blank_manager_rows,
                  SUM(CASE WHEN rb.fantasy_points IS NOT NULL AND rb.fantasy_points<>0 THEN 1 ELSE 0 END)::BIGINT AS nonzero_points_rows,
                  SUM(CASE WHEN rb.team_points IS NOT NULL THEN 1 ELSE 0 END)::BIGINT AS team_points_rows
                FROM exposure e
                INNER JOIN rb USING (NFL_player_id)
                LEFT JOIN active_2025 USING (NFL_player_id)
                WHERE e.rostered_leagues < 50
                GROUP BY 1,5 ORDER BY e.rostered_leagues, e.NFL_player_id LIMIT 100
              """).fetchall()
              candidate_impact = c.execute(f"""
                WITH active_2025 AS (
                  SELECT DISTINCT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id
                  FROM lake.public.player_active_week
                  WHERE CAST(year AS INTEGER)=2025
                ), rb AS (
                  SELECT CAST(NFL_player_id AS VARCHAR) AS NFL_player_id,
                    CAST(db_name AS VARCHAR) AS db_name,
                    CASE WHEN active_2025.NFL_player_id IS NULL
                              AND COALESCE(TRIM(CAST(team_key AS VARCHAR)), '')=''
                              AND COALESCE(TRIM(CAST(team_name AS VARCHAR)), '')=''
                         THEN 1 ELSE 0 END AS would_exclude
                  FROM {rollup_source}
                  LEFT JOIN active_2025 USING (NFL_player_id)
                  WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
                    AND UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                )
                SELECT COUNT(*)::BIGINT AS rows_after_first_guard,
                  SUM(would_exclude)::BIGINT AS candidate_rows,
                  COUNT(DISTINCT NFL_player_id)::BIGINT AS rb_ids_after_first_guard,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE would_exclude=1)::BIGINT AS candidate_rb_ids,
                  COUNT(DISTINCT NFL_player_id) FILTER (WHERE would_exclude=0)::BIGINT AS rb_ids_after_candidate
                FROM rb
              """).fetchone()
              receipt = {
                'mode': mode, 'source_rows_read': source_rows, 'filtered_source_rows': filtered_source_rows,
                'residual_shapes': residual_shapes, 'residual_player_sample': residual_players,
                'inactive_identityless_candidate_impact': candidate_impact,
              }
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 week 1 residual-shape diagnostic\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only diagnostic; no cache save, Fly access, API request, aggregation output, or publish step.\n')
              raise SystemExit(0)
          if mode == 'rb_2025_bucket_inventory':
              players = c.execute(f"""
                SELECT
                  CAST(p.NFL_player_id AS VARCHAR) AS NFL_player_id,
                  ANY_VALUE(CAST(p.player AS VARCHAR)) AS player,
                  COUNT(*)::BIGINT AS guarded_rows,
                  COUNT(DISTINCT CAST(p.db_name AS VARCHAR)) FILTER (
                    WHERE p.is_rostered IS NULL OR CAST(p.is_rostered AS INTEGER) <> 0
                  )::BIGINT AS rostered_leagues,
                  COUNT(DISTINCT CAST(p.week AS INTEGER)) FILTER (
                    WHERE p.is_rostered IS NULL OR CAST(p.is_rostered AS INTEGER) <> 0
                  )::BIGINT AS rostered_weeks
                FROM {rollup_source} AS p
                INNER JOIN cached_regular_player_weeks AS g
                  ON g.NFL_player_id = CAST(p.NFL_player_id AS VARCHAR)
                 AND g.year = CAST(p.year AS INTEGER)
                 AND g.week = CAST(p.week AS INTEGER)
                WHERE CAST(p.year AS INTEGER)=2025
                  AND {_canonical_position_sql('p.position')}='RB'
                GROUP BY 1
                HAVING COUNT(*) FILTER (
                    WHERE p.is_rostered IS NULL OR CAST(p.is_rostered AS INTEGER) <> 0
                ) > 0
                ORDER BY guarded_rows DESC, NFL_player_id
              """).fetchall()
              assert len(players) == 163, len(players)
              buckets = [{'weight': 0, 'players': []} for _ in range(15)]
              for player in players:
                  bucket = min(buckets, key=lambda value: value['weight'])
                  bucket['weight'] += player[2]
                  bucket['players'].append({
                    'id': player[0], 'player': player[1], 'guarded_rows': player[2],
                    'rostered_leagues': player[3], 'rostered_weeks': player[4],
                  })
              receipt = {
                'mode': mode, 'valid_rostered_rb_players': len(players),
                'total_guarded_rows': sum(player[2] for player in players),
                'buckets': [
                  {'bucket': index + 1, 'weight': bucket['weight'],
                   'player_count': len(bucket['players']), 'players': bucket['players']}
                  for index, bucket in enumerate(buckets)
                ],
              }
              assert max(bucket['weight'] for bucket in buckets) <= min(bucket['weight'] for bucket in buckets) * 1.10
              print(receipt)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('## RB 2025 fifteen-bucket immutable-cache inventory\n')
                  summary.write(f'- Receipt: `{receipt}`\n')
                  summary.write('- Cache-only inventory; no cache save, aggregation table, Fly access, API request, artifact, or publish step.\n')
              raise SystemExit(0)
          if mode in {'rb_2025_bucket', 'rb_2025_bucket_core', 'rb_2025_bucket_grade', 'rb_2025_bucket_grade_shapes'}:
              bucket_number = int(os.environ['PILOT_BUCKET'])
              assert 1 <= bucket_number <= 15, bucket_number
              players = c.execute(f"""
                SELECT
                  CAST(p.NFL_player_id AS VARCHAR) AS NFL_player_id,
                  COUNT(*)::BIGINT AS guarded_rows
                FROM {rollup_source} AS p
                INNER JOIN cached_regular_player_weeks AS g
                  ON g.NFL_player_id = CAST(p.NFL_player_id AS VARCHAR)
                 AND g.year = CAST(p.year AS INTEGER)
                 AND g.week = CAST(p.week AS INTEGER)
                WHERE CAST(p.year AS INTEGER)=2025
                  AND {_canonical_position_sql('p.position')}='RB'
                GROUP BY 1
                HAVING COUNT(*) FILTER (
                  WHERE p.is_rostered IS NULL OR CAST(p.is_rostered AS INTEGER) <> 0
                ) > 0
                ORDER BY guarded_rows DESC, NFL_player_id
              """).fetchall()
              assert len(players) == 163, len(players)
              buckets = [{'weight': 0, 'ids': []} for _ in range(15)]
              for player_id, weight in players:
                  bucket = min(buckets, key=lambda value: value['weight'])
                  bucket['weight'] += weight
                  bucket['ids'].append(player_id)
              selected_bucket = buckets[bucket_number - 1]
              assert selected_bucket['ids'], selected_bucket
              if bucket_number == 3:
                  assert '00-0033280' in selected_bucket['ids'], selected_bucket
              materialize_narrow_position_year_source(
                  c, source_table='lake.public.player_fantasy', output_table='rb_2025_lane',
                  year=2025, position='RB',
              )
              materialize_player_id_subset_source(
                  c, source_table='rb_2025_lane', output_table='rb_2025_bucket_source',
                  player_ids=selected_bucket['ids'],
              )
              if mode == 'rb_2025_bucket_grade_shapes':
                  shapes = c.execute("""
                    WITH facts AS (
                      SELECT * FROM rb_2025_bucket_source p
                      INNER JOIN cached_regular_player_weeks w
                        ON w.NFL_player_id=CAST(p.NFL_player_id AS VARCHAR)
                       AND w.year=CAST(p.year AS INTEGER) AND w.week=CAST(p.week AS INTEGER)
                    ), player_league AS (
                      SELECT CAST(NFL_player_id AS VARCHAR) AS player_id, CAST(db_name AS VARCHAR) AS db_name,
                        CAST(position AS VARCHAR) AS position, CAST(cohort_teams AS VARCHAR) AS teams,
                        CAST(cohort_roster AS VARCHAR) AS roster, CAST(cohort_scoring AS VARCHAR) AS scoring,
                        CAST(cohort_pass_td AS VARCHAR) AS pass_td, CAST(cohort_dynasty AS VARCHAR) AS dynasty,
                        CAST(cohort_best_ball AS VARCHAR) AS best_ball, CAST(cohort_playoff_teams AS VARCHAR) AS bracket
                      FROM facts GROUP BY ALL
                    ), player_profile AS (
                      SELECT player_id, position, teams, roster, scoring, pass_td, dynasty, best_ball, bracket
                      FROM player_league GROUP BY ALL
                    ), inventory AS (
                      SELECT db_name, position, teams, roster, scoring, pass_td, dynasty, best_ball, bracket
                      FROM player_league GROUP BY ALL
                    )
                    SELECT
                      (SELECT COUNT(*) FROM facts)::BIGINT AS source_rows,
                      (SELECT COUNT(*) FROM player_league)::BIGINT AS player_league_rows,
                      (SELECT COUNT(*) FROM player_profile)::BIGINT AS player_profile_rows,
                      (SELECT COUNT(*) FROM inventory)::BIGINT AS inventory_rows,
                      (SELECT COUNT(DISTINCT player_id) FROM player_league)::BIGINT AS players,
                      (SELECT COUNT(DISTINCT db_name) FROM player_league)::BIGINT AS leagues,
                      (SELECT COUNT(*) FROM player_league)::BIGINT * 128 AS raw_cube_upper_bound,
                      (SELECT COUNT(*) FROM player_profile)::BIGINT * 128 AS profile_cube_upper_bound
                  """).fetchone()
                  receipt = {
                    'mode': mode, 'bucket': bucket_number, 'bucket_players': len(selected_bucket['ids']),
                    'bucket_weight': selected_bucket['weight'], 'grade_shapes': shapes,
                  }
                  print(receipt)
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                      summary.write('## RB 2025 season grade cardinality gate\n')
                      summary.write(f'- Receipt: `{receipt}`\n')
                      summary.write('- Cache-only shape probe; no grade output, cache save, artifact, Fly access, API request, or publish step.\n')
                  raise SystemExit(0)
              if mode == 'rb_2025_bucket_grade':
                  grade_started = perf_counter()
                  materialize_season_bracket_grade_position_batch(
                      c, source_table='rb_2025_bucket_source', nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
                      player_regular_weeks_table='cached_regular_player_weeks',
                      output_table='rb_2025_bucket_season_grade', year=2025, position='RB', split_threshold=50,
                  )
                  grade_seconds = perf_counter() - grade_started
                  grade_rows, grade_cells = c.execute("""
                    SELECT COUNT(*), COALESCE(SUM(list_count(grade_cells)),0)
                    FROM rb_2025_bucket_season_grade
