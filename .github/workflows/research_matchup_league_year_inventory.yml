name: Inventory matchup league-years from GH lake
# Targeted-rescue inventory revision: emits source-week scopes for sidecars.

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public research lake cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      years:
        description: Comma-separated seasons; blank means every season in the lake
        required: false
        default: '2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_YEAR_START: '2003'
      RESEARCH_YEAR_END: '2025'
      RESEARCH_READER_MEMORY_MB: '6000'
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Verify public-only inputs
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Inventory every league-year and emit focused rescue list
        run: >-
          python code/scripts/research_cohorts/inventory_matchup_league_years.py
          --root research_public_lake
          --years '${{ inputs.years }}'
          --out out
      - name: Build single actionable gap artifact
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          rows = json.loads(Path('out/matchup_league_year_inventory.json').read_text())
          targets = [r for r in rows if r.get('needs_rescue')]
          reason_counts = Counter()
          reason_platform = defaultdict(Counter)
          reason_year = defaultdict(Counter)
          for row in targets:
              platform = row.get('platform') or 'unknown'
              for reason in row.get('reason_codes') or []:
                  reason_counts[reason] += 1
                  reason_platform[reason][platform] += 1
                  reason_year[reason][str(row.get('year'))] += 1
          summary = {
              'schema_version': 1,
              'population_rows': len(rows),
              'populated_league_years': sum(bool(r.get('populated_league_year')) for r in rows),
              'settings_only_or_unidentified': sum(not bool(r.get('populated_league_year')) for r in rows),
              'actionable_league_years': len(targets),
              'reason_counts': dict(sorted(reason_counts.items())),
              'reason_by_platform': {k: dict(sorted(v.items())) for k, v in sorted(reason_platform.items())},
              'reason_by_year': {k: dict(sorted(v.items())) for k, v in sorted(reason_year.items())},
              'targets_missing_source_id': sum(not str(r.get('source_id') or '').strip() for r in targets),
          }
          Path('out/actionable_gap_inventory.json').write_text(json.dumps({
              'summary': summary,
              'targets': targets,
          }, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload league-year inventory and rescue targets
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-league-year-inventory-${{ github.run_id }}
          path: |
            out/matchup_league_year_inventory.json
            out/matchup_league_year_inventory.csv
            out/matchup_rescue_targets.json
            out/actionable_gap_inventory.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
