name: Sleeper missing started-outcome rescue

on:
  workflow_dispatch:
    inputs:
      shards:
        description: Deterministic API shard count
        required: true
        default: "256"

permissions:
  contents: read
  actions: read

concurrency:
  group: sleeper-missing-outcome-rescue
  cancel-in-progress: false

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_list: ${{ steps.matrix.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1
      - name: Build exact missing-outcome week inventory
        run: |
          mkdir -p inventory
          python code/scripts/research_cohorts/build_mfl_underpopulated_week_targets.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --platform sleeper --expected-groups 0 --expected-league-years 0 \
            --out inventory/sleeper_missing_outcome_targets.json
      - id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n=int(os.environ['SHARDS'])
          if not 1 <= n <= 256: raise SystemExit('shards must be 1..256')
          print('shard_list='+json.dumps(list(range(n))))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sleeper-missing-outcome-targets-${{ github.run_id }}
          path: inventory/sleeper_missing_outcome_targets.json
          retention-days: 90
          compression-level: 0

  rescue:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pandas==2.2.3 pyarrow==15.0.2 duckdb==1.5.1 requests==2.32.4 polars==1.35.2
      - name: Download exact target inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          gh run download '${{ github.run_id }}' --repo '${{ github.repository }}' \
            --name 'sleeper-missing-outcome-targets-${{ github.run_id }}' --dir inventory
      - name: Fetch only targeted Sleeper weeks
        run: |
          mkdir -p out
          PYTHONPATH="${{ github.workspace }}/code/fantasy_football_data_scripts" \
          python code/scripts/research_cohorts/build_source_matchup_rescue_sidecar.py \
            --targets inventory/sleeper_missing_outcome_targets.json \
            --shard '${{ matrix.shard }}' --shards '${{ inputs.shards }}' --workers 1 \
            --out out/sleeper_missing_outcome_rescue_${{ matrix.shard }}.parquet
      - name: Fail closed on fetch failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('out/sleeper_missing_outcome_rescue_${{ matrix.shard }}.jsonl').read_text().splitlines() if x.strip()]
          bad=[r for r in rows if r.get('status') in {'source_fetch_failed','unsupported_platform'}]
          print({'targets':len(rows),'done':sum(r.get('status')=='done' for r in rows),'source_empty':sum(r.get('status') in {'source_returned_no_matchups','source_returned_no_target_weeks'} for r in rows),'bad':len(bad)})
          if bad: raise SystemExit('source fetch failures require retry')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sleeper-missing-outcome-rescue-${{ matrix.shard }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
