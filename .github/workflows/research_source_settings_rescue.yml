name: Research Source Settings Rescue

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      platform:
        required: true
        type: choice
        options: [fleaflicker, mfl, sleeper]
      shards:
        required: true
        default: "256"
      pilot:
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      shard_list: ${{ steps.matrix.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4 polars==1.35.1
      - name: Inventory only missing settings
        run: |
          python code/scripts/research_cohorts/build_source_settings_fill_sidecar.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --platform '${{ inputs.platform }}' --out inventory
          if [[ "${{ inputs.pilot }}" =~ ^([Tt][Rr][Uu][Ee]|1)$ ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('inventory/source_settings_targets.json')
          x=json.loads(p.read_text())
          x['targets']=x['targets'][:15]
          x['target_count']=len(x['targets'])
          p.write_text(json.dumps(x, indent=2)+'\n')
          PY
          fi
      - name: Build deterministic shard matrix
        id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib,json
          n=int(__import__('os').environ['SHARDS'])
          x=json.load(open('inventory/source_settings_targets.json'))
          v=sorted({int(hashlib.sha256(f"{r['db_name']}|{r['year']}".encode()).hexdigest()[:12],16)%n for r in x['targets']})
          if not v: raise SystemExit('empty settings target set')
          print('shard_list='+json.dumps(v))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-settings-targets-${{ github.run_id }}
          path: inventory
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  rescue:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4 polars==1.35.1
      - uses: actions/download-artifact@v5
        with:
          name: source-settings-targets-${{ github.run_id }}
          path: inventory
      - name: Fetch only targeted source settings
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/build_source_settings_fill_sidecar.py \
            --targets inventory/source_settings_targets.json --shard '${{ matrix.shard }}' \
            --shards '${{ inputs.shards }}' --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-settings-rescue-${{ inputs.platform }}-${{ matrix.shard }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
