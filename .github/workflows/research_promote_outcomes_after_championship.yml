name: Promote Outcomes After Championship Repair

on:
  workflow_dispatch:
    inputs:
      outcome_applied_run_id:
        description: Successful full outcome-applied snapshot
        required: true
        default: "31108438350"
      target_shard_run_id:
        description: Run containing the exact target shard artifacts
        required: true
        default: "31057089304"
      target_tail_run_id:
        description: Run containing the combined target tail artifact
        required: true
        default: "31060749133"
      base_cache_key:
        description: Repaired championship cache to use as parent
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v1
      output_cache_key:
        description: New canonical cache containing championship and outcomes
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-outcomes-v1

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Fail-fast verify outcome artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="research-outcome-applied-lake-${{ inputs.outcome_applied_run_id }}"
          row=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ inputs.outcome_applied_run_id }}/artifacts" --jq ".artifacts[] | select(.name == \"$name\") | [.expired,.size_in_bytes] | @tsv")
          test -n "$row"
          test "$(cut -f1 <<<"$row")" = false
          test "$(cut -f2 <<<"$row")" -gt 1000000000
          echo "outcome artifact PASS: $(cut -f2 <<<"$row") bytes"
      - name: Download prior outcome snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p outcome_base
          gh run download '${{ inputs.outcome_applied_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-outcome-applied-lake-${{ inputs.outcome_applied_run_id }}' \
            --dir outcome_base
          find outcome_base -name corpus_snapshot.duckdb -type f -size +1000000000c | head -1 > outcome_path.txt
          test -s outcome_path.txt
      - name: Download exact outcome target inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target_shards target_tail
          gh run download '${{ inputs.target_shard_run_id }}' \
            --repo '${{ github.repository }}' \
            --pattern 'research-outcome-targets-*' \
            --dir target_shards
          gh run download '${{ inputs.target_tail_run_id }}' \
            --repo '${{ github.repository }}' \
            --name 'research-outcome-targets-combined-90000-1145460' \
            --dir target_tail
          test "$(find target_shards target_tail -name '*.parquet' | wc -l)" -gt 1
      - name: Extract exact outcome diff and merge
        run: |
          set -euo pipefail
          python - "$(cat outcome_path.txt)" <<'PY'
          import duckdb, os, sys
          from pathlib import Path
          old_path = sys.argv[1]
          target_files = [str(p.resolve()) for root in (Path("target_shards"), Path("target_tail")) for p in root.rglob("*.parquet")]
          if len(target_files) < 2:
              raise SystemExit(f"target inventory incomplete: {len(target_files)} parquet files")
          out = duckdb.connect("outcome_overlay.duckdb")
          out.execute("create schema public")
          old = str(Path(old_path).resolve()).replace("'", "''")
          out.execute(f"attach '{old}' as old (read_only)")
          out.execute("create temp table target_sample as select distinct db_name, year, week, NFL_player_id from read_parquet($files, union_by_name=true) limit 10", {"files": target_files})
          old_cols = [r[0] for r in out.execute("describe old.public.player_fantasy").fetchall()]
          print({"old_player_fantasy_has_NFL_player_id": "NFL_player_id" in old_cols, "old_key_columns": [c for c in old_cols if c in {"db_name","year","week","NFL_player_id","player_week","win","team_points"}]})
          print({
              "sample_exact_key_matches": out.execute("select count(*) from target_sample t join old.public.player_fantasy o on o.db_name=t.db_name and o.year=t.year and o.week=t.week and o.NFL_player_id=t.NFL_player_id").fetchone()[0],
              "sample_league_week_matches": out.execute("select count(*) from target_sample t join old.public.player_fantasy o on o.db_name=t.db_name and o.year=t.year and o.week=t.week").fetchone()[0],
          })
          pcols = {r[0] for r in out.execute("describe old.public.player_fantasy").fetchall()}
          mcols = {r[0] for r in out.execute("describe old.public.matchup").fetchall()}
          p_identity = "p.franchise_id is not distinct from m.franchise_id" if {"franchise_id"} <= pcols & mcols else "p.manager is not distinct from m.manager and p.team_name is not distinct from m.team_name"
          p_win = "p.win" if "win" in pcols else "NULL"
          m_win = "m.win" if "win" in mcols else "NULL"
          p_team = "p.team_points" if "team_points" in pcols else "NULL"
          m_team = "m.team_points" if "team_points" in mcols else "NULL"
          print({"player_identity": [c for c in ("manager","team_name","team_key","franchise_id") if c in pcols], "matchup_identity": [c for c in ("manager","team_name","team_key","franchise_id") if c in mcols], "matchup_outcome": [c for c in ("win","loss","tie","team_points","opponent_points") if c in mcols], "chosen_identity": p_identity})
          print(out.execute(f"select p.db_name,p.year,p.week,p.NFL_player_id,p.manager,p.team_name,{p_win} as player_win,{m_win} as matchup_win,{p_team} as player_points,{m_team} as matchup_points from target_sample t left join old.public.player_fantasy p on p.db_name=t.db_name and p.year=t.year and p.week=t.week and p.NFL_player_id=t.NFL_player_id left join old.public.matchup m on m.db_name=p.db_name and m.year=p.year and m.week=p.week and {p_identity} limit 10").fetchall())
          out.execute(f"""
            create table public.outcome_targets as
            select t.db_name, cast(t.year as integer) as year,
                   cast(t.week as integer) as week, t.NFL_player_id,
                   cast(max(coalesce({p_win}, {m_win})) as integer) as win,
                   cast(max(coalesce({p_team}, {m_team})) as double) as team_points
            from read_parquet($files, union_by_name=true) t
            left join old.public.player_fantasy p
              on p.db_name=t.db_name and p.year=t.year and p.week=t.week
             and p.NFL_player_id=t.NFL_player_id
            left join old.public.matchup m
              on m.db_name=p.db_name and m.year=p.year and m.week=p.week
             and {p_identity}
            group by 1,2,3,4
          """, {"files": target_files})
          count = out.execute("select count(*) from public.outcome_targets").fetchone()[0]
          unresolved = out.execute("select count(*) from public.outcome_targets where win is null and team_points is null").fetchone()[0]
          print({"target_files": len(target_files), "outcome_target_rows": count, "unresolved_from_prior_snapshot": unresolved})
          if count != 1145460 or unresolved:
              raise SystemExit(f"target reconciliation failed: rows={count}, unresolved={unresolved}")
          out.close()
          empty = duckdb.connect("empty_matchups.duckdb")
          empty.execute("create schema public")
          empty.execute("create table public.source_matchup_rescue (db_name varchar, year integer, week integer)")
          empty.close()
          os.remove(old_path)
          PY
          python code/scripts/research_cohorts/merge_research_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out merged_corpus_snapshot.duckdb \
            --outcomes outcome_overlay.duckdb \
            --matchups empty_matchups.duckdb
          mv merged_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
      - name: Validate outcome promotion and write lineage
        run: |
          set -euo pipefail
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
          python - <<'PY'
          import duckdb, json
          c=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          o=duckdb.connect('outcome_overlay.duckdb', read_only=True)
          c.execute("attach 'outcome_overlay.duckdb' as outcome_overlay (read_only)")
          missing=c.execute("""
            select count(*) from outcome_overlay.public.outcome_targets t
            join public.player_fantasy p using (db_name,year,week,NFL_player_id)
            where p.win is null or p.team_points is null
          """).fetchone()[0]
          if missing:
              raise SystemExit(f"outcome promotion left {missing} target fields unresolved")
          result={"outcome_targets":o.execute('select count(*) from public.outcome_targets').fetchone()[0],"remaining_target_rows":missing}
          print(result)
          with open('lineage_manifest.json','w') as f:
              json.dump({"parent_cache":"${{ inputs.base_cache_key }}","layers":{"championship_signals":True,"outcomes":True},"outcome_target_rows":result["outcome_targets"]},f,indent=2)
          PY
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      - uses: actions/upload-artifact@v4
        with:
          name: research-championship-outcomes-manifest-${{ github.run_id }}
          path: |
            outcome_overlay.duckdb
            lineage_manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
