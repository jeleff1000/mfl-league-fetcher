name: Cohort Precision Calibration

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public research lake cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        description: JSON array of seasons to calibrate
        required: true
        default: '[2020,2021,2022,2023,2024,2025]'
      confidence:
        description: Two-sided confidence level
        required: true
        default: '0.85'

permissions:
  contents: read

jobs:
  precision:
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        position: [QB, RB, WR, TE, K, DEF]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3
      - name: Verify public-only cache
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Build year-position calibration
        env:
          PYTHONPATH: ${{ github.workspace }}/code/scripts/research_cohorts
        run: |
          for year in $(python -c "import json; print(*json.loads('${{ inputs.years }}'))"); do
            python code/scripts/research_cohorts/build_cohort_precision_calibration.py \
              --snapshot research_public_lake/corpus_snapshot.duckdb \
              --ops research_public_lake/ops_cache.duckdb \
              --year "$year" --position '${{ matrix.position }}' \
              --confidence '${{ inputs.confidence }}' \
              --out "out/precision_${year}_${{ matrix.position }}.parquet"
          done
      - name: Upload calibration shard
        uses: actions/upload-artifact@v4
        with:
          name: precision-${{ matrix.year }}-${{ matrix.position }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
      - name: Build top-10 order-lock shard
        env:
          PYTHONPATH: ${{ github.workspace }}/code/scripts/research_cohorts
        run: |
          for year in $(python -c "import json; print(*json.loads('${{ inputs.years }}'))"); do
            python code/scripts/research_cohorts/build_cohort_top10_lock.py \
              --snapshot research_public_lake/corpus_snapshot.duckdb \
              --ops research_public_lake/ops_cache.duckdb \
              --year "$year" --position '${{ matrix.position }}' \
              --out "out/top10_${year}_${{ matrix.position }}.parquet"
          done
      - name: Upload top-10 shard
        uses: actions/upload-artifact@v4
        with:
          name: top10-${{ matrix.year }}-${{ matrix.position }}-${{ github.run_id }}
          path: out/top10_*.parquet
          if-no-files-found: error
          retention-days: 14

  reduce:
    needs: precision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reducer dependencies
        run: python -m pip install pyarrow==15.0.2 pandas==2.2.3
      - name: Download calibration shards
        uses: actions/download-artifact@v5
        with:
          pattern: precision-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Reduce and validate
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/summarize_cohort_precision.py \
            --input-dir shards --out-dir out \
            --years '${{ inputs.years }}' \
            --confidence '${{ inputs.confidence }}'
      - name: Upload calibration report
        uses: actions/upload-artifact@v4
        with:
          name: cohort-precision-report-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  reduce_top10:
    needs: precision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reducer dependencies
        run: python -m pip install pyarrow==15.0.2 pandas==2.2.3
      - name: Download top-10 shards
        uses: actions/download-artifact@v5
        with:
          pattern: top10-*-${{ github.run_id }}
          path: shards
          merge-multiple: true
      - name: Reduce top-10 lock report
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/summarize_top10_lock.py \
            --input-dir shards --out-dir out --years '${{ inputs.years }}'
      - name: Upload top-10 lock report
        uses: actions/upload-artifact@v4
        with:
          name: cohort-top10-lock-report-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
