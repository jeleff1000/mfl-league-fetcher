name: Verify Ops Cache

# One-time/manual verification and cache seeding for the prebuilt worker ops cache.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RESEARCH_LAKE_KEY: research-public-lake-v5-Linux-2000-plus-player-bio
      OPS_CACHE_RELEASE_TAG: ops-cache-v6-2000-plus-player-bio
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb

    steps:
      - name: Checkout workflow actions
        uses: actions/checkout@v5

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: ${{ env.RESEARCH_LAKE_KEY }}
          release-tag: ${{ env.OPS_CACHE_RELEASE_TAG }}

      - name: Seed the public repository cache
        if: steps.research-lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: ${{ env.RESEARCH_LAKE_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify ops cache from research lake
        run: test -s research_public_lake/ops_cache.duckdb

      - name: Verify cache contents
        run: |
          echo "[research-lake] key=${RESEARCH_LAKE_KEY}"
          echo "[research-lake] restore-hit=${{ steps.research-lake.outputs.cache-hit }}"
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::ops_cache.duckdb is missing after cache restore."
            exit 1
          }
          echo "[ops-cache] size-bytes=$(stat -c%s "${OPS_CACHE_PATH}")"
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"
          echo "[ops-cache] sha256=$(sha256sum "${OPS_CACHE_PATH}" | awk '{print $1}')"

          pip install duckdb==1.5.1
          python - <<'PYEOF'
          import os
          import duckdb

          required = [
              ("nfl_historical", "nfl_player_stats_all"),
              ("nfl_historical", "player_bio"),
              ("public", "espn_nfl_player_map"),
              ("public", "sleeper_nfl_player_map"),
              ("public", "yahoo_nfl_player_map"),
          ]
          conn = duckdb.connect(os.environ["OPS_CACHE_PATH"], read_only=True)
          try:
              for schema, table in required:
                  count = conn.execute(f"SELECT COUNT(*) FROM {schema}.{table}").fetchone()[0]
                  if count <= 0:
                      raise SystemExit(f"{schema}.{table} is empty")
                  print(f"[ops-cache] {schema}.{table}: {count:,} rows")
              data_tables = {
                  (schema, table)
                  for schema, table in conn.execute("""
                      SELECT table_schema, table_name
                      FROM information_schema.tables
                      WHERE table_type = 'BASE TABLE'
                        AND table_schema != 'main'
                      ORDER BY table_schema, table_name
                  """).fetchall()
              }
              allowed_auxiliary = {
                  ("public", "espn_nfl_player_map"),
                  ("public", "sleeper_nfl_player_map"),
                  ("public", "yahoo_nfl_player_map"),
              }
              extra = data_tables - set(required) - allowed_auxiliary
              if extra:
                  raise SystemExit(f"Unexpected data tables in ops cache: {sorted(extra)}")
          finally:
              conn.close()
          PYEOF
