name: Fly Snapshot Inventory

on:
  workflow_dispatch:
    inputs:
      create_primary_snapshot:
        description: Create one on-demand snapshot of the attached primary volume
        required: false
        default: false
        type: boolean
      set_primary_retention_60:
        description: Set the attached primary volume snapshot retention to 60 days
        required: false
        default: false
        type: boolean
      create_cross_region_backup:
        description: Fork the exact attached primary volume to one independent ord backup volume
        required: false
        default: false
        type: boolean
      cross_region_backup_name:
        description: Exact backup name, formatted duckdb_backup_YYYYMMDD
        required: false
        default: ""
        type: string
      destroy_recovery_volume_id:
        description: Exact unattached kmffl_snapshot_recovery volume to destroy
        required: false
        type: string
      destroy_wkupd_rebuild_volume_id:
        description: Exact unattached wkupd_rebuild volume to destroy
        required: false
        type: string

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: List storage-related secret names
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list --app league-history-duckdb --json \
            | jq '[.[] | (.Name // .name) | select(test("^(DUCKDB_|SHUTDOWN_|AWS_|TIGRIS_|S3_|R2_)"))]'

      - name: List Fly object-storage buckets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl storage list

      - name: Read bounded effective storage environment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl ssh console --app league-history-duckdb --machine 1781e011b69068 \
            -C "/bin/sh -lc \"python -c 'import json, os; keys=[\\\"DUCKDB_MEMORY_LIMIT\\\",\\\"DUCKDB_THREADS\\\",\\\"DUCKDB_CHECKPOINT_THRESHOLD\\\",\\\"DUCKDB_MAX_TEMP_DIRECTORY_SIZE\\\",\\\"DUCKDB_EXPECTED_VERSION\\\",\\\"SHUTDOWN_DRAIN_SECONDS\\\"]; print(json.dumps({key: os.getenv(key) for key in keys}, sort_keys=True))'\""

      - name: Destroy verified orphan recovery volume
        if: inputs.destroy_recovery_volume_id != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VOLUME_ID: ${{ inputs.destroy_recovery_volume_id }}
        run: |
          test "$VOLUME_ID" = "vol_vly006jom1xx27g4"
          flyctl volumes list --app league-history-duckdb --json > volumes.json
          NAME=$(jq -r --arg id "$VOLUME_ID" '.[] | select(.id == $id) | .name' volumes.json)
          ATTACHED=$(jq -r --arg id "$VOLUME_ID" '.[] | select(.id == $id) | .attached_machine_id // ""' volumes.json)
          test "$NAME" = "kmffl_snapshot_recovery"
          test -z "$ATTACHED"
          flyctl volumes destroy "$VOLUME_ID" --app league-history-duckdb --yes

      - name: Destroy exact unattached weekly-update rebuild volume
        if: inputs.destroy_wkupd_rebuild_volume_id != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VOLUME_ID: ${{ inputs.destroy_wkupd_rebuild_volume_id }}
        run: |
          set -euo pipefail
          [[ "$VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          flyctl volumes list --app league-history-duckdb --json > volumes.json
          NAME=$(jq -r --arg id "$VOLUME_ID" 'map(select(.id == $id))[0].name // empty' volumes.json)
          ATTACHED=$(jq -r --arg id "$VOLUME_ID" 'map(select(.id == $id))[0].attached_machine_id // ""' volumes.json)
          [[ "$NAME" == wkupd_rebuild_* ]]
          test -z "$ATTACHED"
          flyctl volumes destroy "$VOLUME_ID" --app league-history-duckdb --yes

      - name: Set primary snapshot retention to 60 days
        if: inputs.set_primary_retention_60
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_VOLUME_ID: ${{ secrets.FLY_PRIMARY_VOLUME_ID }}
        run: |
          set -euo pipefail
          test -n "$FLY_PRIMARY_VOLUME_ID"
          flyctl volumes update "$FLY_PRIMARY_VOLUME_ID" --app league-history-duckdb --snapshot-retention 60 --json

      - name: Create primary volume snapshot
        if: inputs.create_primary_snapshot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_VOLUME_ID: ${{ secrets.FLY_PRIMARY_VOLUME_ID }}
        run: |
          set -euo pipefail
          test -n "$FLY_PRIMARY_VOLUME_ID"
          flyctl volumes snapshots create "$FLY_PRIMARY_VOLUME_ID" --app league-history-duckdb --json

      - name: Create independent cross-region backup fork
        if: inputs.create_cross_region_backup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_VOLUME_ID: ${{ secrets.FLY_PRIMARY_VOLUME_ID }}
          BACKUP_VOLUME_NAME: ${{ inputs.cross_region_backup_name }}
        run: |
          set -euo pipefail
          test -n "$FLY_PRIMARY_VOLUME_ID"
          [[ "$BACKUP_VOLUME_NAME" =~ ^duckdb_backup_[0-9]{8}$ ]]
          flyctl volumes list --app league-history-duckdb --json > volumes-before-backup.json
          SOURCE_NAME=$(jq -r --arg id "$FLY_PRIMARY_VOLUME_ID" 'map(select(.id == $id))[0].name // empty' volumes-before-backup.json)
          SOURCE_ATTACHMENT=$(jq -r --arg id "$FLY_PRIMARY_VOLUME_ID" 'map(select(.id == $id))[0].attached_machine_id // empty' volumes-before-backup.json)
          EXISTING_BACKUP_COUNT=$(jq -r --arg name "$BACKUP_VOLUME_NAME" '[.[] | select(.name == $name)] | length' volumes-before-backup.json)
          test "$SOURCE_NAME" = "duckdb_data"
          test "$SOURCE_ATTACHMENT" = "1781e011b69068"
          test "$EXISTING_BACKUP_COUNT" = "0"
          flyctl volumes fork "$FLY_PRIMARY_VOLUME_ID" --app league-history-duckdb --region ord --name "$BACKUP_VOLUME_NAME" --require-unique-zone --json \
            | tee cross-region-backup.json
          jq -e --arg name "$BACKUP_VOLUME_NAME" \
            '.name == $name and .region == "ord" and .attached_machine_id == null and (.id | startswith("vol_"))' \
            cross-region-backup.json >/dev/null

      - name: List primary volume snapshots
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_PRIMARY_VOLUME_ID: ${{ secrets.FLY_PRIMARY_VOLUME_ID }}
        run: flyctl volumes snapshots list "$FLY_PRIMARY_VOLUME_ID" --app league-history-duckdb --json

      - name: List recovery resources
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl machines list --app league-history-duckdb --json
          flyctl volumes list --app league-history-duckdb --json
