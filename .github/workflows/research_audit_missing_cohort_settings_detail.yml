name: Audit Missing Cohort Settings Detail

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - run: |
          python code/scripts/research_cohorts/audit_missing_cohort_settings_detail.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out missing_cohort_settings_detail.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-cohort-settings-detail-${{ github.run_id }}
          path: missing_cohort_settings_detail.json
          if-no-files-found: error
          retention-days: 30
