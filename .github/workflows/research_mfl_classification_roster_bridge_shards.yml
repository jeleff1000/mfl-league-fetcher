name: Research MFL classification roster bridge shards

on:
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Fresh read-only MFL target inventory run against the approved cache.
        required: true
      classification_run_id:
        description: Existing MFL player-outcome classification evidence run.
        required: true
        default: '31192594062'
      completed_shards:
        description: Comma-separated shard IDs already represented by retained successful artifacts from the same target run.
        required: false
        default: ''

permissions:
  actions: read
  contents: read

env:
  CANONICAL_CACHE_KEY: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      target_groups: ${{ steps.matrix.outputs.target_groups }}
    steps:
      - uses: actions/checkout@v5
      - name: Download only the fresh exact target manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target
          gh run download '${{ inputs.target_run_id }}' --repo '${{ github.repository }}' \
            --name 'research-mfl-classification-bridge-targets-${{ inputs.target_run_id }}' --dir target
          test -f target/research_mfl_classification_bridge_targets.json
      - id: matrix
        name: Create deterministic bounded shard matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          MAX_SHARDS = 256
          groups=json.loads(Path('target/research_mfl_classification_bridge_targets.json').read_text())['groups']
          if not groups:
              raise SystemExit('no current MFL classification bridge targets; refusing an empty source run')
          shards=min(MAX_SHARDS, len(groups))
          completed={int(value) for value in '${{ inputs.completed_shards }}'.split(',') if value.strip()}
          if any(index < 0 or index >= shards for index in completed):
              raise SystemExit(f'completed shard outside deterministic range 0..{shards - 1}: {sorted(completed)}')
          remaining=[index for index in range(shards) if index not in completed]
          if not remaining:
              raise SystemExit('all deterministic shards already represented; refusing a duplicate source run')
          matrix={'include':[{'shard':index, 'shards':shards} for index in remaining]}
          print('matrix='+json.dumps(matrix, separators=(',', ':')))
          print('target_groups='+str(len(groups)))
          PY

  rescue:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.CANONICAL_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pandas==2.2.3 pyarrow==15.0.2 requests==2.32.4 polars==1.35.2
      - name: Record immutable cache pre-state
        shell: bash
        run: |
          set -euo pipefail
          sha256sum research_public_lake/ops_cache.duckdb > ops_before.sha256
          python - <<'PY'
          import duckdb, json
          from pathlib import Path
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          Path('cache_before.json').write_text(json.dumps({
            'schema':con.execute('DESCRIBE public.player_fantasy').fetchall(),
            'rows':int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]),
          })+'\n')
          con.close()
          PY
      - name: Download only current targets and historical classification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target classification
          gh run download '${{ inputs.target_run_id }}' --repo '${{ github.repository }}' \
            --name 'research-mfl-classification-bridge-targets-${{ inputs.target_run_id }}' --dir target
          gh run download '${{ inputs.classification_run_id }}' --repo '${{ github.repository }}' \
            --pattern 'mfl-player-outcome-classification-*-${{ inputs.classification_run_id }}' --dir classification
          test -f target/research_mfl_classification_bridge_targets.json
          test "$(find classification -name 'mfl_outcome_classification_*.parquet' | wc -l)" = '15'
      - name: Fetch only this deterministic target shard's source roster memberships
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          MFL_RATE_LIMIT_PER_MIN: '25'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python scripts/research_cohorts/extract_mfl_target_roster_memberships.py \
            --manifest target/research_mfl_classification_bridge_targets.json \
            --shard ${{ matrix.shard }} --shards ${{ matrix.shards }} \
            --out-memberships out/memberships.parquet \
            --out-player-directory out/player_directory.parquet \
            --out-report out/extract_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('out/extract_report.json').read_text())
          if not 1 <= int(result['groups']) <= 25:
              raise SystemExit(f"unexpected deterministic shard size: {result['groups']}")
          if result.get('cache_mutated') is not False or result.get('new_lineage') is not False:
              raise SystemExit(f"source extractor cache invariant failed: {result}")
          PY
      - name: Build source franchise/player bridge and candidate delta
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r source; do args+=(--classification "$source"); done < <(find classification -name 'mfl_outcome_classification_*.parquet' | sort)
          python scripts/research_cohorts/build_mfl_roster_player_crosswalk.py \
            --directory out/player_directory.parquet --ops-cache research_public_lake/ops_cache.duckdb \
            --out out/crosswalk.parquet --report out/crosswalk_report.json
          python scripts/research_cohorts/build_mfl_classification_team_signals.py \
            "${args[@]}" --memberships out/memberships.parquet --crosswalk out/crosswalk.parquet \
            --out out/team_signals.parquet --report out/team_signal_report.json
          python scripts/research_cohorts/build_mfl_source_team_player_bridge.py \
            --memberships out/memberships.parquet --crosswalk out/crosswalk.parquet \
            --team-signals out/team_signals.parquet --out out/player_bridge.parquet --report out/bridge_report.json
          mkdir -p candidate_input out/candidate
          cp out/team_signals.parquet candidate_input/team_signals.parquet
          cp out/player_bridge.parquet candidate_input/player_bridge.parquet
          python scripts/research_cohorts/audit_team_signal_candidates.py \
            --base research_public_lake/corpus_snapshot.duckdb --candidates candidate_input --out out/candidate
      - name: Fail fast on cache mutation or candidate conflict
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import duckdb, hashlib, json
          from pathlib import Path
          before=json.loads(Path('cache_before.json').read_text())
          con=duckdb.connect('research_public_lake/corpus_snapshot.duckdb', read_only=True)
          if con.execute('DESCRIBE public.player_fantasy').fetchall() != [tuple(row) for row in before['schema']]:
              raise SystemExit('player schema changed')
          if int(con.execute('SELECT COUNT(*) FROM public.player_fantasy').fetchone()[0]) != before['rows']:
              raise SystemExit('player row count changed')
          con.close()
          digest=hashlib.sha256()
          with Path('research_public_lake/ops_cache.duckdb').open('rb') as handle:
              for block in iter(lambda:handle.read(1024*1024), b''): digest.update(block)
          if digest.hexdigest()!=Path('ops_before.sha256').read_text().split()[0]:
              raise SystemExit('ops cache changed')
          for path in ['out/extract_report.json','out/crosswalk_report.json','out/team_signal_report.json','out/bridge_report.json','out/candidate/team_signal_candidate_report.json']:
              report=json.loads(Path(path).read_text())
              if report.get('cache_mutated') is not False or report.get('new_lineage') is not False:
                  raise SystemExit(f'cache invariant failed: {path}: {report}')
          candidate=json.loads(Path('out/candidate/team_signal_candidate_report.json').read_text())
          if any(int(value) for value in candidate.get('positive_mismatches_not_auto_promoted',{}).values()):
              raise SystemExit(f'candidate conflict requires explicit precedence: {candidate}')
          Path('shard_manifest.json').write_text(json.dumps({
            'target_run_id':'${{ inputs.target_run_id }}',
            'classification_run_id':'${{ inputs.classification_run_id }}',
            'shard':${{ matrix.shard }}, 'shards':${{ matrix.shards }},
            'cache_key':'${{ env.CANONICAL_CACHE_KEY }}',
            'candidate_rows':candidate.get('delta_rows', 0),
          }, indent=2)+'\n')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-mfl-classification-roster-bridge-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            shard_manifest.json
            out/
            cache_before.json
            ops_before.sha256
          retention-days: 90
          compression-level: 0
