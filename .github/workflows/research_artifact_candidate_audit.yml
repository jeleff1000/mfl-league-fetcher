name: Audit research artifacts for canonical cache improvements

on:
  push:
    paths:
      - .github/research_artifact_candidate_audit.trigger
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: Completed 9,479-artifact audit run
        required: true
        default: '31337901490'
      base_cache_key:
        description: Frozen canonical research cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      shard_count:
        description: Candidate extraction shards; runners remain capped at 15
        required: true
        default: '256'
      apply:
        description: Apply only validated NULL-fill candidates to the same cache key
        required: true
        default: 'false'

permissions:
  actions: write
  contents: read

concurrency:
  group: research-artifact-candidate-audit
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  AUDIT_RUN_ID: ${{ inputs.audit_run_id || '31337901490' }}
  BASE_CACHE_KEY: ${{ inputs.base_cache_key || 'research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613' }}
  SHARD_COUNT: ${{ inputs.shard_count || '256' }}
  APPLY: ${{ inputs.apply || 'false' }}

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
      candidate_artifact_count: ${{ steps.make.outputs.candidate_artifact_count }}
      file_count: ${{ steps.make.outputs.file_count }}
    steps:
      - uses: actions/checkout@v4
      - name: Load the frozen complete artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          unzip -p research_artifact_inventory_31337901490.json.zip \
            > audit/artifact_audit_complete.json
      - id: make
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os
          from pathlib import Path

          report = json.loads(Path('audit/artifact_audit_complete.json').read_text())
          if not report.get('complete') or int(report.get('manifest_artifacts', 0)) != 9479:
              raise SystemExit('the 9,479-artifact audit is not complete')
          signal = {'win','team_points','is_playoffs','champion','has_po_signal','made_playoffs'}
          settings = {'pass_td_fill','playoff_teams_fill','roster_FLX_fill','roster_SUPER_FLEX_fill','roster_IDP_fill','best_ball_fill'}
          player_signal = {'win','is_playoffs','champion','team_points','source_team_points','source_opponent_points'}
          rows=[]; artifacts={}
          for rec in report['records']:
              aid=int(rec['artifact_id'])
              artifacts.setdefault(aid, {'artifact_id':aid,'artifact':rec['artifact'],'workflow_run_id':int(rec['workflow_run_id']),'size_in_bytes':int(rec.get('size_in_bytes',0)),'files':[]})
              for f in rec.get('files',[]):
                  cols=set(f.get('columns',[])); kind=f.get('kind'); name=f.get('file','')
                  disposition='metadata_or_validation'
                  reason='No direct row identity and no canonical player-field payload.'
                  candidate=False
                  if kind=='exact_canonical_player':
                      disposition='direct_player_candidate'; reason='Exact base player row; cache may carry seven cohort columns.'; candidate=True
                  elif f.get('type')=='parquet' and {'db_name','year'} <= cols and ({'team_key','week'} <= cols) and (cols & signal):
                      disposition='team_week_signal_candidate'; reason='Team/week signals can fan out to existing player rows.'; candidate=True
                  elif f.get('type')=='parquet' and {'db_name','year','week','NFL_player_id'} <= cols and (cols & player_signal):
                      disposition='player_signal_candidate'; reason='Player/week signal can join by canonical player identity.'; candidate=True
                  elif f.get('type')=='parquet' and {'db_name','year'} <= cols and (cols & settings):
                      disposition='settings_candidate'; reason='League-year settings evidence; not a player-row update.'; candidate=True
                  elif f.get('type')=='parquet' and ('clutch' in ''.join(cols).lower() or 'lamar' in ''.join(cols).lower()):
                      disposition='aggregate_clutch_evidence'; reason='Clutch/LAMAR payload lacks canonical player-week identity or is aggregate grain; audit only.'
                  elif f.get('type')!='parquet' and any(x in name.lower() for x in ('source','outcome','setting','delta','candidate','rescue','playoff','champ','clutch')):
                      disposition='structured_evidence_candidate'; reason='Structured evidence file must be copied and parsed before promotion.'; candidate=True
                  item={'artifact_id':aid,'artifact':rec['artifact'],'workflow_run_id':int(rec['workflow_run_id']),'file':name,'type':f.get('type'),'kind':kind,'rows':int(f.get('rows',0) or 0),'columns':f.get('columns',[]),'disposition':disposition,'reason':reason,'candidate':candidate}
                  rows.append(item); artifacts[aid]['files'].append(item)
          Path('out').mkdir()
          Path('out/file_candidate_ledger.json').write_text(json.dumps({'complete_artifact_audit_run':int(os.environ['AUDIT_RUN_ID']),'artifact_count':9479,'file_count':len(rows),'files':rows},indent=2,sort_keys=True)+'\n')
          with Path('out/file_candidate_ledger.csv').open('w',newline='',encoding='utf-8') as fh:
              w=csv.DictWriter(fh,fieldnames=['artifact_id','artifact','workflow_run_id','file','type','kind','rows','disposition','reason','candidate']); w.writeheader()
              for r in rows: w.writerow({k:r.get(k,'') for k in w.fieldnames})
          selected=[]
          for a in artifacts.values():
              a['files']=[f for f in a['files'] if f['candidate']]
              if a['files']:
                  a['candidate_bytes']=a['size_in_bytes']; selected.append(a)
          # Downloads use manifest artifact IDs directly, so artifacts can be
          # balanced independently across all 256 shards. This avoids a few
          # source runs becoming huge sequential buckets.
          packages=[{'workflow_run_id':int(a['workflow_run_id']),'artifacts':[a],
                     'size_in_bytes':int(a.get('size_in_bytes',0))} for a in selected]
          n=int(os.environ['SHARD_COUNT']); buckets=[[] for _ in range(n)]; loads=[0]*n
          for package in sorted(packages,key=lambda x:(-x['size_in_bytes'],x['workflow_run_id'])):
              i=min(range(n),key=lambda j:(loads[j],len(buckets[j]),j)); buckets[i].append(package); loads[i]+=package['size_in_bytes']
          assigned_artifacts=[int(p['artifacts'][0]['artifact_id']) for bucket in buckets for p in bucket]
          if len(assigned_artifacts) != len(selected) or len(assigned_artifacts) != len(set(assigned_artifacts)):
              raise SystemExit('manifest invariant failed: an artifact was assigned more than once or omitted')
          Path('out/candidate_artifact_shards.json').write_text(json.dumps(buckets,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'artifacts':9479,'files':len(rows),'candidate_files':sum(len(a['files']) for a in selected),'candidate_artifacts':len(selected),'source_runs':len(set(int(a['workflow_run_id']) for a in selected)),'assigned_artifacts':len(assigned_artifacts),'duplicate_artifacts':0,'shards':n,'nonempty_shards':sum(bool(x) for x in buckets)}))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps(list(range(n)),separators=(',',':'))+'\n')
              out.write(f'candidate_artifact_count={len(selected)}\nfile_count={len(rows)}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: out/*
          retention-days: 90
          compression-level: 0

  extract:
    needs: manifest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: manifest
      - name: Download assigned candidate archives and emit file ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/candidates raw
          python - '${{ matrix.shard }}' <<'PY'
          import json, os, shutil, sys, urllib.error, urllib.request, zipfile
          from pathlib import Path
          import duckdb
          shard=int(sys.argv[1]); buckets=json.loads(Path('manifest/candidate_artifact_shards.json').read_text()); packages=buckets[shard]
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']
          def download_artifact(artifact_id, dest):
              url=f'https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','User-Agent':'research-artifact-audit'})
              for attempt in range(6):
                  try:
                      # The API returns a signed blob URL. Do not forward the
                      # GitHub bearer token to that storage host: it causes a
                      # 401 even though the API request is authorized.
                      class NoRedirect(urllib.request.HTTPRedirectHandler):
                          def redirect_request(self, req, fp, code, msg, headers, newurl):
                              return None
                      api_opener=urllib.request.build_opener(NoRedirect())
                      try:
                          api_opener.open(req,timeout=90)
                      except urllib.error.HTTPError as redirect:
                          if redirect.code not in (301,302,303,307,308): raise
                          blob_url=redirect.headers['Location']
                      else:
                          raise SystemExit(f'artifact {artifact_id} did not return a signed download redirect')
                      blob_req=urllib.request.Request(blob_url,headers={'User-Agent':'research-artifact-audit'})
                      with urllib.request.urlopen(blob_req,timeout=300) as resp, dest.open('wb') as fh:
                          shutil.copyfileobj(resp,fh)
                      return
                  except (urllib.error.HTTPError, urllib.error.URLError):
                      if attempt == 5: raise
                      import time; time.sleep(2 ** attempt)
          ledger=[]
          for package in packages:
              run_id=int(package['workflow_run_id']); run_root=Path('raw')/str(run_id); run_root.mkdir(parents=True,exist_ok=True)
              # The frozen manifest already contains the exact artifact IDs.
              # Do not enumerate the source run: that API call was the source
              # of the repeated rate-limit failures in the prior implementation.
              for item in package['artifacts']:
                  archive=Path('raw')/f"{item['artifact_id']}.zip"
                  try:
                      download_artifact(int(item['artifact_id']),archive)
                  except Exception as exc:
                      for meta in item['files']:
                          ledger.append({**meta,'status':'archive_download_failed','error':repr(exc),'artifact_id':item['artifact_id']})
                      continue
                  target=run_root/item['artifact']; target.mkdir(parents=True,exist_ok=True)
                  with zipfile.ZipFile(archive) as z: z.extractall(target)
                  archive.unlink()
              for item in package['artifacts']:
                  target=run_root/item['artifact']
                  for meta in item['files']:
                    matches=sorted(target.rglob(meta['file']))
                    if len(matches)!=1:
                      ledger.append({**meta,'status':'candidate_file_missing_or_ambiguous','matches':len(matches)}); continue
                    path=matches[0]
                    if meta['type']=='parquet':
                      parquet_path="'" + str(path.resolve()).replace("'", "''") + "'"
                      con=duckdb.connect(); cols=[r[0] for r in con.execute(f'DESCRIBE SELECT * FROM read_parquet({parquet_path})').fetchall()]; rows=con.execute(f'SELECT COUNT(*) FROM read_parquet({parquet_path})').fetchone()[0]; con.close()
                      dest=Path('out/candidates')/(f"{item['artifact_id']}__{path.name}"); shutil.copy2(path,dest)
                      ledger.append({**meta,'status':'candidate_extracted','extracted_file':str(dest),'actual_rows':int(rows),'actual_columns':cols})
                    else:
                      dest=Path('out/candidates')/(f"{item['artifact_id']}__{path.name}"); shutil.copy2(path,dest)
                      ledger.append({**meta,'status':'structured_evidence_extracted','extracted_file':str(dest),'bytes':path.stat().st_size})
              shutil.rmtree(run_root,ignore_errors=True)
          Path('out/file_candidate_ledger.jsonl').write_text('\n'.join(json.dumps(x,sort_keys=True) for x in ledger)+'\n')
          print(f'shard={shard} source_runs={len(packages)} artifacts={sum(len(p["artifacts"]) for p in packages)} candidate_files={len(ledger)} parquet={sum(x.get("status")=="candidate_extracted" for x in ledger)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-candidate-extract-${{ github.run_id }}-${{ matrix.shard }}
          path: out/*
          retention-days: 90
          compression-level: 0

  compare:
    needs: [manifest, extract]
    if: ${{ always() && needs.extract.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: research-artifact-candidate-extract-${{ github.run_id }}-*
          path: candidates
          merge-multiple: false
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.BASE_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Compare candidates against canonical cache without mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, re
          from pathlib import Path
          import duckdb
          from scripts.research_cohorts.canonical_player_schema import BASE_PLAYER_COLUMNS, OPTIONAL_PLAYER_COLUMNS, validate_player_schema
          base=Path('research_public_lake/corpus_snapshot.duckdb')
          con=duckdb.connect(str(base),read_only=True)
          pcols=[r[0] for r in con.execute('DESCRIBE public.player_fantasy').fetchall()]
          base_canonical=BASE_PLAYER_COLUMNS
          cohort_columns, optional_present = validate_player_schema(pcols)
          files=sorted(Path('candidates').rglob('*.parquet'))
          by=[]
          for f in files:
              parquet_path="'" + str(f.resolve()).replace("'", "''") + "'"
              cols=[r[0] for r in con.execute(f'DESCRIBE SELECT * FROM read_parquet({parquet_path})').fetchall()]
              by.append((str(f),set(cols)))
          exact=[f for f,c in by if set(base_canonical)<=c and len(c)>=len(base_canonical)]
          team=[f for f,c in by if {'db_name','year','week','team_key'}<=c and (c & {'win','team_points','is_playoffs','champion','has_po_signal','made_playoffs'}) and f not in exact]
          player=[f for f,c in by if {'db_name','year','week','NFL_player_id'}<=c and (c & {'win','source_team_points','is_playoffs','champion'}) and f not in exact]
          Path('out').mkdir()
          summary={'cache_mutated':False,'new_lineage':False,'canonical_schema_unchanged':True,'cache_player_columns':pcols,'cohort_dimension_columns':cohort_columns,'optional_player_columns':optional_present,'candidate_parquet_files':len(files),'exact_files':len(exact),'team_signal_files':len(team),'player_signal_files':len(player),'settings_files':sum(1 for f,c in by if {'db_name','year'}<=c and (c & {'pass_td_fill','playoff_teams_fill','roster_FLX_fill','roster_SUPER_FLEX_fill','roster_IDP_fill','best_ball_fill'}))}
          # Exact player comparison. Null fills are the only automatic promotion class.
          if exact:
              exact_paths="[" + ",".join("'" + str(Path(f).resolve()).replace("'", "''") + "'" for f in exact) + "]"
              con.execute(f'CREATE OR REPLACE TEMP VIEW exact_source AS SELECT * FROM read_parquet({exact_paths}, union_by_name=true)')
              fallback='COALESCE('+','.join(f"NULLIF(TRIM(CAST(s.\"{c}\" AS VARCHAR)), '')" for c in ['NFL_player_id','sleeper_player_id','fleaflicker_player_id','mfl_player_id','espn_player_id','yahoo_player_id'])+')'
              pid=f"CASE LOWER(NULLIF(TRIM(CAST(s.\"platform\" AS VARCHAR)),'')) WHEN 'sleeper' THEN COALESCE(NULLIF(TRIM(CAST(s.\"sleeper_player_id\" AS VARCHAR)),''),{fallback}) WHEN 'fleaflicker' THEN COALESCE(NULLIF(TRIM(CAST(s.\"fleaflicker_player_id\" AS VARCHAR)),''),{fallback}) WHEN 'mfl' THEN COALESCE(NULLIF(TRIM(CAST(s.\"mfl_player_id\" AS VARCHAR)),''),{fallback}) ELSE {fallback} END"
              key=f"CONCAT_WS('|',CAST(s.\"db_name\" AS VARCHAR),CAST(s.\"year\" AS VARCHAR),CAST(s.\"week\" AS VARCHAR),CAST(s.\"platform\" AS VARCHAR),CAST(s.\"manager\" AS VARCHAR),CAST(s.\"team_name\" AS VARCHAR),CAST(s.\"team_key\" AS VARCHAR),CAST(s.\"fantasy_position\" AS VARCHAR),{pid})"
              con.execute(f'CREATE OR REPLACE TEMP VIEW exact_keyed AS SELECT s.*,{key} AS join_key FROM exact_source s')
              pfallback='COALESCE('+','.join(f"NULLIF(TRIM(CAST(p.\"{c}\" AS VARCHAR)), '')" for c in ['NFL_player_id','sleeper_player_id','fleaflicker_player_id','mfl_player_id','espn_player_id','yahoo_player_id'])+')'
              ppid=f"CASE LOWER(NULLIF(TRIM(CAST(p.\"platform\" AS VARCHAR)),'')) WHEN 'sleeper' THEN COALESCE(NULLIF(TRIM(CAST(p.\"sleeper_player_id\" AS VARCHAR)),''),{pfallback}) WHEN 'fleaflicker' THEN COALESCE(NULLIF(TRIM(CAST(p.\"fleaflicker_player_id\" AS VARCHAR)),''),{pfallback}) WHEN 'mfl' THEN COALESCE(NULLIF(TRIM(CAST(p.\"mfl_player_id\" AS VARCHAR)),''),{pfallback}) ELSE {pfallback} END"
              pkey=f"CONCAT_WS('|',CAST(p.\"db_name\" AS VARCHAR),CAST(p.\"year\" AS VARCHAR),CAST(p.\"week\" AS VARCHAR),CAST(p.\"platform\" AS VARCHAR),CAST(p.\"manager\" AS VARCHAR),CAST(p.\"team_name\" AS VARCHAR),CAST(p.\"team_key\" AS VARCHAR),CAST(p.\"fantasy_position\" AS VARCHAR),{ppid})"
              con.execute(f'CREATE OR REPLACE TEMP VIEW player_keyed AS SELECT p.*,{pkey} AS join_key FROM public.player_fantasy p')
              for col in base_canonical + optional_present:
                  n=con.execute(f'SELECT COUNT(*) FROM exact_keyed s JOIN player_keyed p USING(join_key) WHERE p."{col}" IS NULL AND s."{col}" IS NOT NULL').fetchone()[0]
                  x=con.execute(f'SELECT COUNT(*) FROM exact_keyed s JOIN player_keyed p USING(join_key) WHERE p."{col}" IS NOT NULL AND s."{col}" IS NOT NULL AND CAST(p."{col}" AS VARCHAR)<>CAST(s."{col}" AS VARCHAR)').fetchone()[0]
                  summary.setdefault('exact_null_fills',{})[col]=int(n); summary.setdefault('exact_conflicts',{})[col]=int(x)
              con.execute("COPY (SELECT s.db_name,s.year,s.week,s.platform,s.manager,s.team_name,s.team_key,s.fantasy_position,s.NFL_player_id,s.clutch_equity source_clutch_equity,p.clutch_equity canonical_clutch_equity FROM exact_keyed s JOIN player_keyed p USING(join_key) WHERE p.clutch_equity IS NULL AND s.clutch_equity IS NOT NULL) TO 'out/exact_clutch_null_fill_candidates.parquet' (FORMAT PARQUET)")
          else:
              summary['exact_null_fills']={};summary['exact_conflicts']={}
          Path('out/exact_source_files.txt').write_text('\n'.join(str(f) for f in exact) + ('\n' if exact else ''))
          # Team candidates are inventoried here; promotion is emitted only after a
          # second, fieldwise fan-out gate. Clutch is intentionally excluded from
          # team-level sources because it is player-specific.
          summary['team_sources_note']='team-level sources are not yet promoted in this read-only pass; only canonical player rows can supply clutch_equity'
          Path('out/cache_candidate_comparison.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          con.close(); print(json.dumps(summary,sort_keys=True))
          PY
      - name: Compare team/week signals with canonical player rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/team_signal
          python scripts/research_cohorts/audit_team_signal_candidates.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --candidates candidates \
            --out out/team_signal
      - name: Audit structured candidate files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/research_cohorts/audit_structured_candidate_files.py \
            --candidates candidates \
            --out out/structured_evidence_audit.json
      - name: Build exact player null-fill delta (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s out/exact_source_files.txt ]]; then
            mapfile -t exact_sources < out/exact_source_files.txt
            python scripts/research_cohorts/build_exact_player_delta.py \
              --base research_public_lake/corpus_snapshot.duckdb \
              --sources "${exact_sources[@]}" \
              --out out/exact_promotable_player_delta.parquet \
              --insert-out out/exact_new_player_rows.parquet \
              --report out/exact_player_delta_report.json
          else
            printf '%s\n' '{"source_files":0,"delta_rows":0,"cache_mutated":false,"new_lineage":false}' > out/exact_player_delta_report.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-cache-comparison-${{ github.run_id }}
          path: out/*
          retention-days: 90
          compression-level: 0

  reconcile:
    needs: [manifest, extract, compare]
    if: ${{ always() && needs.extract.result == 'success' && needs.compare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-candidate-manifest-${{ github.run_id }}
          path: manifest
      - uses: actions/download-artifact@v5
        with:
          pattern: research-artifact-candidate-extract-${{ github.run_id }}-*
          path: extracts
          merge-multiple: false
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-cache-comparison-${{ github.run_id }}
          path: comparison
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reconcile every manifest file and cache invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ledgers < <(find extracts -name file_candidate_ledger.jsonl -type f | sort)
          test "${#ledgers[@]}" -gt 0
          python scripts/research_cohorts/reconcile_artifact_cache_audit.py \
            --manifest manifest/file_candidate_ledger.json \
            --extract-ledger "${ledgers[@]}" \
            --comparison comparison/cache_candidate_comparison.json \
            --structured-audit comparison/structured_evidence_audit.json \
            --out out/complete_artifact_cache_audit.json
          python scripts/research_cohorts/audit_artifact_promotion_ledger.py \
            --manifest manifest/file_candidate_ledger.json \
            --extract-ledger "${ledgers[@]}" \
            --comparison comparison \
            --out out/file_promotion_ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifact-complete-cache-audit-${{ github.run_id }}
          path: |
            out/complete_artifact_cache_audit.json
            out/file_promotion_ledger.json
          retention-days: 90
          compression-level: 0

  apply:
    needs: [compare, reconcile]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == 'true' && needs.compare.result == 'success' && needs.reconcile.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-cache-comparison-${{ github.run_id }}
          path: comparison
      - uses: actions/download-artifact@v5
        with:
          name: research-artifact-complete-cache-audit-${{ github.run_id }}
          path: reconciliation
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ env.BASE_CACHE_KEY }}
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Require the complete audit before applying
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=next(Path('reconciliation').rglob('complete_artifact_cache_audit.json'))
          r=json.loads(p.read_text())
          if not r.get('promotion_ready'):
              raise SystemExit('complete artifact/cache audit did not authorize promotion')
          PY
      - name: Apply only the validated player delta in place
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t deltas < <(find comparison -type f -name '*promotable_player_delta.parquet' | sort)
          test "${#deltas[@]}" -gt 0
          i=0
          for delta in "${deltas[@]}"; do
            new_rows_arg=()
            if [[ "$delta" == *exact_promotable_player_delta.parquet && -f comparison/exact_new_player_rows.parquet ]]; then
              new_rows_arg=(--new-rows comparison/exact_new_player_rows.parquet)
            fi
            python scripts/research_cohorts/apply_team_signal_delta_in_place.py \
              --base research_public_lake/corpus_snapshot.duckdb \
              --delta "$delta" \
              "${new_rows_arg[@]}" \
              --report "comparison/player_delta_apply_${i}.json"
            i=$((i + 1))
          done
      - name: Verify every promoted source value in the updated cache
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t deltas < <(find comparison -type f -name '*promotable_player_delta.parquet' | sort)
          test "${#deltas[@]}" -gt 0
          python scripts/research_cohorts/audit_promoted_deltas.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --deltas "${deltas[@]}" \
            --new-rows comparison/exact_new_player_rows.parquet \
            --out comparison/promoted_cache_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-team-signal-apply-${{ github.run_id }}
          path: |
            comparison/team_signal_apply_report.json
            comparison/player_delta_apply_*.json
            comparison/promoted_cache_audit.json
          retention-days: 90
          compression-level: 0
      - name: Refuse destructive Actions-cache replacement
        shell: bash
        run: |
          set -euo pipefail
          cat >&2 <<'EOF'
          REFUSING PROMOTION: GitHub Actions caches are immutable. Replacing the
          canonical cache requires deleting its existing cache entry first. This
          workflow is forbidden from deleting the one approved research cache.
          The validated database remains in this run's workspace/artifact until an
          approved mutable canonical-storage promotion path is supplied.
          EOF
          exit 1
