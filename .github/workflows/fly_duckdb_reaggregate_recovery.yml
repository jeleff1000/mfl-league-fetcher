name: Fly DuckDB One-Table Storage Pilot

on:
  workflow_dispatch:
    inputs:
      recovery_volume_id:
        description: Existing unattached wkupd_rebuild volume; never primary
        required: true
        type: string
      expected_source_sha:
        description: Exact public main revision
        required: true
        type: string
      action:
        description: Inspect one block without SQL, locate, or test removal of one old table
        required: true
        default: locate
        type: choice
        options: [inspect, locate, remove, donor_headers, retained_headers, engine_probe, engine_inventory, engine_identity, engine_recover, engine_logs, service_health]
      diagnostic_machine_id:
        description: Isolated pilot machine for read-only exit diagnostics
        required: false
        type: string
      target_table:
        description: One confirmed blocker
        required: true
        default: player_fantasy_season
        type: choice
        options: [player_fantasy_season, player_fantasy_season_all, homepage_manager_rankings, matchup_h2h_career, standings_by_year]
      witness_db_name:
        description: Existing league used for an unrelated matchup preservation witness
        required: true
        default: nyu_ffl
        type: string

permissions:
  contents: read

concurrency:
  group: fly-duckdb-storage-recovery
  cancel-in-progress: false

jobs:
  synthetic-engine-probe:
    if: inputs.action == 'engine_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        scenario: [normal, indexed, shared, budget, real_scope, adapter]
    # No Fly secret or volume: synthetic files only, removed by TemporaryDirectory.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify public main and exact revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = "jeleff1000/mfl-league-fetcher"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Tiny engine corruption and removal pilot - hard 40 seconds
        env:
          PILOT_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          timeout --signal=KILL 40s bash <<'PILOT' 2>&1 | tee engine-pilot.jsonl
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps duckdb==1.5.4
          if [ "$PILOT_SCENARIO" = adapter ]; then
            python -m pip install --disable-pip-version-check pytest==8.3.3
            python -m pytest -q tests/test_duckdb_recovery_adapter.py --tb=short
          else
            python -u scripts/diagnostics/duckdb_drop_recovery_spike.py --scenario "$PILOT_SCENARIO"
          fi
          PILOT
      - name: Upload only synthetic pilot receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: synthetic-engine-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
          path: engine-pilot.jsonl
          if-no-files-found: warn
  pilot:
    if: inputs.action != 'engine_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FLY_APP: league-history-duckdb
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PILOT_MACHINE_NAME: wkupd-table-pilot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify public main and exact revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = "jeleff1000/mfl-league-fetcher"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Install flyctl (setup, not storage work)
        run: |
          curl --fail --max-time 15 -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: One-table pilot - 40 second hard ceiling including machine startup
        if: inputs.action != 'engine_logs' && inputs.action != 'service_health'
        env:
          RECOVERY_VOLUME_ID: ${{ inputs.recovery_volume_id }}
          PILOT_ACTION: ${{ inputs.action }}
          TARGET_TABLE: ${{ inputs.target_table }}
          WITNESS_DB_NAME: ${{ inputs.witness_db_name }}
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          export PILOT_DEADLINE="$(( $(date +%s) + 38 ))"
          timeout --signal=KILL 40s bash <<'PILOT' 2>&1 | tee table-pilot.jsonl
          set -euo pipefail
          echo "stage=pilot_start utc=$(date -u +%FT%TZ) hard_deadline=$PILOT_DEADLINE"
          [[ "$RECOVERY_VOLUME_ID" =~ ^vol_[A-Za-z0-9]+$ ]]
          test "$RECOVERY_VOLUME_ID" != vol_rkg7mmd17llez224
          [[ "$WITNESS_DB_NAME" =~ ^[a-z0-9_]+$ ]]
          case "$PILOT_ACTION" in inspect|locate|remove|donor_headers|retained_headers|engine_inventory|engine_identity|engine_recover) ;; *) exit 2 ;; esac
          if [ "$PILOT_ACTION" = engine_inventory ] || [ "$PILOT_ACTION" = engine_identity ] || [ "$PILOT_ACTION" = engine_recover ]; then
            test "$RECOVERY_VOLUME_ID" = vol_4919j2m0wzg0xw5r
          fi
          case "$TARGET_TABLE" in player_fantasy_season|player_fantasy_season_all|homepage_manager_rankings|matchup_h2h_career|standings_by_year) ;; *) exit 2 ;; esac
          flyctl machines list --app "$FLY_APP" --json > machines.json
          flyctl volumes show "$RECOVERY_VOLUME_ID" --app "$FLY_APP" --json > volume.json
          if [ "$PILOT_ACTION" = donor_headers ] || [ "$PILOT_ACTION" = retained_headers ]; then
            case "$PILOT_ACTION:$RECOVERY_VOLUME_ID" in
              donor_headers:vol_vp26dp2g9x3167j4|retained_headers:vol_vp26dp2g9x3167j4)
                witness_name=wkupd_35290038040 ;;
              retained_headers:vol_4919j2m0wzg0xw5r)
                witness_name=wkupd_rebuild_35166181636 ;;
              *) exit 2 ;;
            esac
            jq -e --arg name "$witness_name" '.state == "created" and .name == $name and ((.attached_machine_id // "") == "")' volume.json
          else
            jq -e '.state == "created" and (.name | startswith("wkupd_rebuild_")) and ((.attached_machine_id // "") == "")' volume.json
          fi
          region="$(jq -r '.region' volume.json)"
          image="$(jq -r '.[] | select(.id == "1781e011b69068" and .state == "started") | .config.image' machines.json)"
          test -n "$image"
          vm_memory=512
          vm_cpu_kind=shared
          vm_cpus=1
          files=()
          if [ "$PILOT_ACTION" = engine_inventory ] || [ "$PILOT_ACTION" = engine_recover ]; then
            vm_memory=4096
            # Fly volume bandwidth: shared 1/2 CPU=16 MiB/s, 4 CPU=32 MiB/s.
            # Temporary pilot only; cleanup destroys this VM, retaining the volume.
            vm_cpus=4
          fi
          if [ "$PILOT_ACTION" = engine_recover ]; then
            echo "stage=bounded_witness_export utc=$(date -u +%FT%TZ) limit_seconds=5 max_rows=20"
            timeout --signal=KILL 5s python -u scripts/diagnostics/duckdb_recovery_adapter.py \
              --export-fixture /tmp/lh_recovery_witness.json --db-name "$WITNESS_DB_NAME"
            test "$(stat -c %s /tmp/lh_recovery_witness.json)" -le 65536
            fixture_sha="$(sha256sum /tmp/lh_recovery_witness.json | cut -d ' ' -f 1)"
            files+=(--file-local /tmp/lh_recovery_witness.json=/tmp/lh_recovery_witness.json)
            echo "stage=compile_helper utc=$(date -u +%FT%TZ) limit_seconds=5"
            timeout --signal=KILL 5s c++ -shared -fPIC -O0 -Wall -Werror -DLH_REAL_FILE \
              scripts/diagnostics/duckdb_drop_recovery_spike.cpp -ldl -o /tmp/lh_five_drop.so
            test "$(stat -c %s /tmp/lh_five_drop.so)" -lt 1048576
            helper_sha="$(sha256sum /tmp/lh_five_drop.so | cut -d ' ' -f 1)"
            files+=(--file-local /tmp/lh_five_drop.so=/tmp/lh_five_drop.so)
            files+=(--file-local /tmp/duckdb_recovery_adapter.py=scripts/diagnostics/duckdb_recovery_adapter.py)
          fi
          echo "stage=isolated_machine_start utc=$(date -u +%FT%TZ)"
          flyctl machine run "$image" --app "$FLY_APP" --region "$region" \
            --name "$PILOT_MACHINE_NAME" --volume "$RECOVERY_VOLUME_ID:/data" \
            --entrypoint /bin/sh --restart no --detach --vm-cpu-kind "$vm_cpu_kind" --vm-cpus "$vm_cpus" --vm-memory "$vm_memory" \
            --file-local "/tmp/fly_table_storage_pilot.py=scripts/fly_table_storage_pilot.py" \
            --file-local "/tmp/fly_duckdb_block_probe.py=scripts/fly_duckdb_block_probe.py" \
            "${files[@]}" \
            -- -lc 'sleep 45'
          machine_id="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg name "$PILOT_MACHINE_NAME" '.[] | select(.name == $name) | .id')"
          test -n "$machine_id"
          test "$machine_id" != 1781e011b69068
          flyctl machines list --app "$FLY_APP" --json | jq --arg id "$machine_id" '.[] | select(.id == $id)' > pilot-machine.json
          flyctl volumes show "$RECOVERY_VOLUME_ID" --app "$FLY_APP" --json > attached-volume.json
          remaining="$(( PILOT_DEADLINE - $(date +%s) ))"
          test "$remaining" -gt 0
          case "$PILOT_ACTION" in
            engine_inventory) stage_limit=10 ;;
            inspect|engine_identity) stage_limit=5 ;;
            *) stage_limit="$remaining" ;;
          esac
          if [ "$remaining" -gt "$stage_limit" ]; then remaining="$stage_limit"; fi
          echo "stage=sql_pilot_start remaining_seconds=$remaining"
          if [ "$PILOT_ACTION" = engine_recover ]; then
            inventory="$(jq -cn --argjson machine "$(jq '{id,name,state,config:{mounts:.config.mounts}}' pilot-machine.json)" \
              --argjson volume "$(jq '{id,name,attached_machine_id}' attached-volume.json)" \
              '{machine:$machine,volume:$volume}' | base64 -w0)"
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" \
              -C "/bin/sh -lc 'remaining=\$(( $PILOT_DEADLINE - \$(date +%s) )); test \"\$remaining\" -gt 0 || exit 124; exec timeout --signal=KILL \"\${remaining}s\" python -u /tmp/duckdb_recovery_adapter.py --inventory-base64 $inventory --receipt-id ${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT} --helper-sha256 $helper_sha --witness-fixture /tmp/lh_recovery_witness.json --fixture-sha256 $fixture_sha --db-name $WITNESS_DB_NAME --deadline $PILOT_DEADLINE'"
            echo "stage=isolated_recovery_finished utc=$(date -u +%FT%TZ)"
            exit 0
          fi
          flyctl ssh console --app "$FLY_APP" --machine "$machine_id" \
            -C "/bin/sh -lc 'remaining=\$(( $PILOT_DEADLINE - \$(date +%s) )); if [ \"\$remaining\" -gt $stage_limit ]; then remaining=$stage_limit; fi; test \"\$remaining\" -gt 0 || exit 124; exec timeout --signal=KILL \"\${remaining}s\" python -u /tmp/fly_table_storage_pilot.py --action $PILOT_ACTION --target-table $TARGET_TABLE --db-name $WITNESS_DB_NAME --machine-id $machine_id --volume-id $RECOVERY_VOLUME_ID --deadline $PILOT_DEADLINE'"
          echo "stage=pilot_finished utc=$(date -u +%FT%TZ)"
          PILOT

      - name: Read isolated pilot exit diagnostics - hard 15 seconds
        if: inputs.action == 'engine_logs'
        env:
          DIAGNOSTIC_MACHINE_ID: ${{ inputs.diagnostic_machine_id }}
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_MACHINE_ID" =~ ^[a-f0-9]{14}$ ]]
          test "$DIAGNOSTIC_MACHINE_ID" != 1781e011b69068
          timeout --signal=KILL 15s flyctl logs --app "$FLY_APP" --instance "$DIAGNOSTIC_MACHINE_ID" --no-tail 2>&1 | tee table-pilot.jsonl

      - name: Read production health only - hard 15 seconds, no machine changes
        if: inputs.action == 'service_health'
        run: |
          timeout --signal=KILL 15s bash <<'HEALTH'
          set -u
          curl --silent --show-error --connect-timeout 2 --max-time 5 https://league-history-duckdb.fly.dev/ready > service-ready.json 2>&1 &
          ready_pid=$!
          timeout --signal=KILL 5s flyctl checks list --app "$FLY_APP" > service-checks.txt 2>&1 &
          checks_pid=$!
          timeout --signal=KILL 5s flyctl machines list --app "$FLY_APP" --json | jq '[.[] | {id,name,state,checks}]' > service-machines.json &
          machines_pid=$!
          result=0
          wait "$ready_pid" || result=1
          wait "$checks_pid" || result=1
          wait "$machines_pid" || result=1
          cat service-ready.json service-checks.txt service-machines.json
          exit "$result"
          HEALTH

      - name: Remove only this disposable pilot machine (never its volume)
        if: always() && inputs.action != 'engine_logs' && inputs.action != 'service_health'
        run: |
          timeout --signal=KILL 20s bash <<'CLEANUP'
          set -euo pipefail
          ids="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg name "$PILOT_MACHINE_NAME" '.[] | select(.name == $name) | .id')"
          for id in $ids; do
            test "$id" != 1781e011b69068
            timeout --signal=KILL 5s flyctl logs --app "$FLY_APP" --instance "$id" --no-tail | tail -n 40 || true
            flyctl machine destroy "$id" --app "$FLY_APP" --force
          done
          CLEANUP

      - name: Upload small pilot receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fly-table-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            machines.json
            volume.json
            pilot-machine.json
            attached-volume.json
            table-pilot.jsonl
            service-ready.json
            service-checks.txt
            service-machines.json
          if-no-files-found: warn
