name: Research matchup compact 15-runner rollup

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: 'Validated immutable public-lake cache key to read; must contain literal 08tm/10tm/12tm/14tm fanout'
        required: true
      year_start:
        required: true
        default: '2025'
      year_end:
        required: true
        default: '2025'
      positions:
        description: 'Optional comma-separated canonical UI positions for an isolated edge pilot'
        required: false
        default: ''
      runners:
        description: 'Number of duration-balanced runners; use 1 only for an isolated edge pilot'
        required: false
        default: '15'
      career_buckets:
        description: 'Disjoint parallel career partitions; use 1 only for an isolated career pilot'
        required: false
        default: '15'
      capacity_only:
        description: 'Run only immutable-cache position-capacity allocation gates; emit no compact artifacts'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lane_count: ${{ steps.plan.outputs.lane_count }}
      task_count: ${{ steps.plan.outputs.task_count }}
      career_matrix: ${{ steps.plan.outputs.career_matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - id: plan
        run: |
          capacity_args=()
          if [ '${{ inputs.capacity_only }}' = 'true' ]; then
            capacity_args+=(--capacity-only)
          fi
          python code/scripts/research_cohorts/plan_balanced_matchup_tasks.py --snapshot research_public_lake/corpus_snapshot.duckdb --ops-cache research_public_lake/ops_cache.duckdb --year-start '${{ inputs.year_start }}' --year-end '${{ inputs.year_end }}' --positions '${{ inputs.positions }}' --runners '${{ inputs.runners }}' "${capacity_args[@]}" --output matrix.json
          echo "matrix=$(tr -d '\n' < matrix.json)" >> "$GITHUB_OUTPUT"
          lane_count="$(python -c 'import json; print(len(json.load(open("matrix.json"))["include"]))')"
          echo "lane_count=$lane_count" >> "$GITHUB_OUTPUT"
          task_count="$(python -c 'import json; print(sum(len(x["tasks"]) for x in json.load(open("matrix.json"))["include"]))')"
          echo "task_count=$task_count" >> "$GITHUB_OUTPUT"
          career_matrix="$(python -c 'import json; n=int("${{ inputs.career_buckets }}"); assert n > 0; print(json.dumps({"include":[{"bucket":i} for i in range(n)]}))')"
          echo "career_matrix=$career_matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TASKS: ${{ toJSON(matrix.tasks) }}
      CAPACITY_ONLY: ${{ inputs.capacity_only }}
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build assigned compact outer-row tasks
        run: |
          mkdir -p out/tasks
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          capacity_only=os.environ.get('CAPACITY_ONLY','false').lower() == 'true'
          audit_results=[]
          for task in json.loads(os.environ['TASKS']):
              cmd=[sys.executable,'code/scripts/research_cohorts/build_compact_matchup_bundle.py','--snapshot','research_public_lake/corpus_snapshot.duckdb','--year',str(task['year']),'--position',task['position']]
              if capacity_only:
                  cmd.append('--capacity-only')
              else:
                  name=f"{task['task_id']}.duckdb"
                  cmd.extend(['--ops-cache','research_public_lake/ops_cache.duckdb','--output',str(Path('out/tasks')/name)])
                  if task.get('player_buckets', 1) > 1:
                      cmd.extend(['--player-bucket-count',str(task['player_buckets']),'--player-bucket',str(task['player_bucket'])])
                  if task.get('player_ids'):
                      cmd.extend(['--player-ids-json',json.dumps(task['player_ids'])])
              print(json.dumps(task),flush=True)
              completed=subprocess.run(cmd,check=False,text=True,capture_output=capacity_only)
              if completed.returncode:
                  if capacity_only:
                      print('capacity_task_failed='+json.dumps({
                          'task':task,'returncode':completed.returncode,
                          'stdout':completed.stdout,'stderr':completed.stderr,
                      }),flush=True)
                      print(completed.stdout or '',end='',flush=True)
                      print(completed.stderr or '',end='',file=sys.stderr,flush=True)
                  raise SystemExit(completed.returncode)
              if capacity_only:
                  print(completed.stdout, end='', flush=True)
                  lines=[line for line in completed.stdout.splitlines() if line.startswith('compact_task_capacity_allocation=')]
                  assert len(lines)==1,(task,completed.stdout)
                  audit_results.append(json.loads(lines[0].split('=',1)[1]))
          if capacity_only:
              Path('out/capacity-allocation.json').write_text(json.dumps(audit_results,sort_keys=True),encoding='utf-8')
          PY
          if [ "$CAPACITY_ONLY" != 'true' ]; then
            python code/scripts/research_cohorts/merge_compact_matchup_parts.py --parts out/tasks/*.duckdb --output out/lane.duckdb --no-career
          fi
      - if: inputs.capacity_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compact-matchup-capacity-${{ matrix.bucket }}-${{ github.run_id }}
          path: out/capacity-allocation.json
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: inputs.capacity_only != 'true'
        with:
          name: compact-matchup-lane-${{ matrix.bucket }}-${{ github.run_id }}
          path: out/lane.duckdb
          retention-days: 1
          compression-level: 0

  capacity_audit_summary:
    needs: [plan, build]
    if: inputs.capacity_only == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: compact-matchup-capacity-*-${{ github.run_id }}
          path: capacity
          merge-multiple: false
      - name: Fail closed on every position-year allocation
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          files=sorted(Path('capacity').glob('**/capacity-allocation.json'))
          results=[row for path in files for row in json.loads(path.read_text())]
          assert len(results)==${{ needs.plan.outputs.task_count }},(len(results),${{ needs.plan.outputs.task_count }})
          keys=[(row['year'],row['position']) for row in results]
          duplicates=[key for key,count in Counter(keys).items() if count != 1]
          assert not duplicates,duplicates
          bad=[row for row in results if any(row[key] for key in ('invalid_rostered_lanes','invalid_started_lanes','invalid_pooled_lanes'))]
          assert not bad,bad
          totals={stat:Counter() for stat in ('rostered_tiers','started_tiers')}
          for row in results:
              for stat in totals:
                  totals[stat].update(row[stat])
          visible=sum(row['visible_eligible_lanes'] for row in results)
          ten_twelve={
              stat: totals[stat]['10tm'] + totals[stat]['12tm']
              for stat in totals
          }
          shares={
              stat: (ten_twelve[stat] / visible if visible else None)
              for stat in totals
          }
          assert all(
              share is None or share > 0.5
              for share in shares.values()
          ), {'visible_lanes': visible, 'ten_twelve_lanes': ten_twelve, 'shares': shares}
          print(json.dumps({
              'position_years':len(results),
              'visible_lanes':visible,
              'tiers':totals,
              'ten_twelve_lanes':ten_twelve,
              'ten_twelve_shares':shares,
          },sort_keys=True))
          PY

  merge_base:
    needs: [plan, build]
    if: inputs.capacity_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - uses: actions/download-artifact@v5
        with:
          pattern: compact-matchup-lane-*-${{ github.run_id }}
          path: lanes
          merge-multiple: false
      - name: Merge weekly and season lanes once
        run: |
          mapfile -t LANES < <(find lanes -name lane.duckdb | sort)
          test "${#LANES[@]}" -eq ${{ needs.plan.outputs.lane_count }}
          python code/scripts/research_cohorts/merge_compact_matchup_parts.py --parts "${LANES[@]}" --output research_matchup_compact_base.duckdb --no-career
          python - <<'PY'
          import duckdb
          c=duckdb.connect('research_matchup_compact_base.duckdb',read_only=True)
          tables={x[0] for x in c.execute('SELECT table_name FROM duckdb_tables()').fetchall()}
          assert tables >= {'research_matchup_compact_weekly','research_matchup_compact_season'},tables
          dupe=c.execute("SELECT COUNT(*) FROM (SELECT NFL_player_id,year,week,position FROM research_matchup_compact_weekly GROUP BY 1,2,3,4 HAVING COUNT(*)<>1)").fetchone()[0]
          assert dupe==0,dupe
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-matchup-base-${{ github.run_id }}
          path: research_matchup_compact_base.duckdb
          retention-days: 1
          compression-level: 0
      - name: Make narrow season source for parallel career workers
        run: |
          python - <<'PY'
          import duckdb
          source='research_matchup_compact_base.duckdb'
          target='research_matchup_compact_season_source.duckdb'
          c=duckdb.connect(target)
          c.execute(f"ATTACH '{source}' AS source (READ_ONLY)")
          c.execute('CREATE TABLE research_matchup_compact_season AS SELECT * FROM source.research_matchup_compact_season')
          c.execute('CHECKPOINT')
          c.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-matchup-season-source-${{ github.run_id }}
          path: research_matchup_compact_season_source.duckdb
          retention-days: 1
          compression-level: 0

  career:
    needs: [plan, merge_base]
    if: inputs.capacity_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.plan.outputs.career_matrix) }}
    env:
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - uses: actions/download-artifact@v5
        with:
          name: compact-matchup-season-source-${{ github.run_id }}
          path: season-source
      - name: Build one exact disjoint compact career part
        run: |
          python code/scripts/research_cohorts/merge_compact_matchup_parts.py \
            --season-bundle season-source/research_matchup_compact_season_source.duckdb \
            --output career-part.duckdb \
            --career-buckets '${{ inputs.career_buckets }}' \
            --career-bucket '${{ matrix.bucket }}'
      - uses: actions/upload-artifact@v4
        with:
          name: compact-matchup-career-${{ matrix.bucket }}-${{ github.run_id }}
          path: career-part.duckdb
          retention-days: 1
          compression-level: 0

  merge:
    needs: [plan, merge_base, career]
    if: inputs.capacity_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/code
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install duckdb==1.5.1
      - uses: actions/download-artifact@v5
        with:
          name: compact-matchup-base-${{ github.run_id }}
          path: base
      - uses: actions/download-artifact@v5
        with:
          pattern: compact-matchup-career-*-${{ github.run_id }}
          path: career-parts
          merge-multiple: false
      - name: Assemble parallel career parts and fail fast on golden output
        run: |
          mapfile -t CAREER_PARTS < <(find career-parts -name career-part.duckdb | sort)
          test "${#CAREER_PARTS[@]}" -eq '${{ inputs.career_buckets }}'
          python code/scripts/research_cohorts/merge_compact_matchup_parts.py \
            --base-bundle base/research_matchup_compact_base.duckdb \
            --career-parts "${CAREER_PARTS[@]}" \
            --output research_matchup_compact.duckdb
          python - <<'PY'
          import duckdb,json
          c=duckdb.connect('research_matchup_compact.duckdb',read_only=True)
          tables={x[0] for x in c.execute('SELECT table_name FROM duckdb_tables()').fetchall()}
          assert tables >= {
              'research_matchup_compact_weekly','research_matchup_compact_season','research_matchup_compact_career',
          },tables
          unsupported_positions=c.execute("""
            SELECT source,position
            FROM (
              SELECT 'weekly' AS source,position FROM research_matchup_compact_weekly
              UNION ALL
              SELECT 'season' AS source,position FROM research_matchup_compact_season
              UNION ALL
              SELECT 'career' AS source,position FROM research_matchup_compact_career
            )
            WHERE position NOT IN ('QB','RB','WR','TE','K','DEF','DB','DL','LB')
            GROUP BY 1,2 ORDER BY 1,2
          """).fetchall()
          print('unsupported_serving_positions='+json.dumps(unsupported_positions))
          assert not unsupported_positions,unsupported_positions
          dupe=c.execute("SELECT COUNT(*) FROM (SELECT NFL_player_id,year,week,position FROM research_matchup_compact_weekly GROUP BY 1,2,3,4 HAVING COUNT(*)<>1)").fetchone()[0]
          cmc=None
          positions={p.strip().upper() for p in '${{ inputs.positions }}'.split(',') if p.strip()}
          if 2025 <= int('${{ inputs.year_end }}') and 2025 >= int('${{ inputs.year_start }}') and (not positions or 'RB' in positions):
              cmc=c.execute("SELECT cell.eligible_leagues,cell.rostered_leagues,cell.started_leagues,cell.valid_started_outcomes,cell.win_equivalent FROM research_matchup_compact_weekly,UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND year=2025 AND week=1 AND position='RB' AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
              assert cmc==(9837,9766,9600,9579,6019.0),cmc
          if 1997 <= int('${{ inputs.year_end }}') and 1997 >= int('${{ inputs.year_start }}') and (not positions or 'QB' in positions):
              aikman=c.execute("SELECT 1 FROM research_matchup_compact_season WHERE NFL_player_id='00-0000104' AND year=1997 AND position='QB'").fetchone()
              print('aikman_1997='+json.dumps(aikman))
              assert aikman is None,aikman
          if 2019 <= int('${{ inputs.year_end }}') and 2019 >= int('${{ inputs.year_start }}') and (not positions or 'RB' in positions):
              cmc_2019_weekly=c.execute("SELECT SUM(cell.rostered_leagues),SUM(cell.eligible_leagues),SUM(cell.started_leagues),SUM(cell.valid_started_outcomes),SUM(cell.win_equivalent),COUNT(*) FROM research_matchup_compact_weekly,UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND year=2019 AND position='RB' AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
              cmc_2019_season=c.execute("SELECT cell.rostered_league_weeks,cell.eligible_league_weeks,cell.started_league_weeks,cell.valid_started_outcomes,cell.win_equivalent FROM research_matchup_compact_season,UNNEST(cohort_cells) u(cell) WHERE NFL_player_id='00-0033280' AND year=2019 AND position='RB' AND cell.q_teams='ALL' AND cell.q_roster='ALL' AND cell.q_scoring='ALL' AND cell.q_pass_td='ALL' AND cell.q_dynasty='ALL' AND cell.q_best_ball='ALL'").fetchone()
              assert cmc_2019_weekly is not None and cmc_2019_weekly[5] == 16,cmc_2019_weekly
              assert cmc_2019_season == cmc_2019_weekly[:5],(cmc_2019_season,cmc_2019_weekly)
          if 2010 <= int('${{ inputs.year_end }}') and 2010 >= int('${{ inputs.year_start }}') and (not positions or 'RB' in positions):
              marcel_max_rostered=c.execute("SELECT MAX(cell.rostered_league_weeks) FROM research_matchup_compact_season,UNNEST(roster_cells) u(cell) WHERE NFL_player_id='00-0026393' AND year=2010 AND position='RB'").fetchone()[0]
              print('marcel_reece_2010_max_rostered='+json.dumps(marcel_max_rostered))
              assert marcel_max_rostered is None or marcel_max_rostered < 150,marcel_max_rostered
          if 2017 <= int('${{ inputs.year_end }}') and 2017 >= int('${{ inputs.year_start }}') and (not positions or 'RB' in positions):
              core_ordinal,grade_ordinal=89,353
              mark_ingram_2017=c.execute(f"""SELECT core.q_scoring,core.eligible_leagues,core.rostered_league_weeks,core.eligible_league_weeks,core.started_league_weeks,core.valid_started_outcomes,core.win_equivalent,grade.playoff_rate_pct,grade.champ_rate_pct FROM research_matchup_compact_season s CROSS JOIN UNNEST(list_value(list_extract(s.cohort_cells,list_extract(s.core_selector_indices,{core_ordinal})))) u(core) CROSS JOIN UNNEST(list_value(list_extract(s.grade_cells,list_extract(s.grade_selector_indices,{grade_ordinal})))) g(grade) WHERE s.NFL_player_id='00-0027966' AND s.year=2017 AND s.position='RB'""").fetchone()
              assert mark_ingram_2017 is not None,mark_ingram_2017
              q_scoring,*_=mark_ingram_2017
              assert q_scoring == 'ALL',mark_ingram_2017
              assert mark_ingram_2017[:7] == ('ALL',105,1584,1599,1306,1185,697.0),mark_ingram_2017
              assert 0 < mark_ingram_2017[8] < mark_ingram_2017[7] < 100,mark_ingram_2017
              ranked=c.execute(f"""WITH x AS (SELECT NFL_player_id,list_extract(cohort_cells,list_extract(core_selector_indices,{core_ordinal})) core,list_extract(grade_cells,list_extract(grade_selector_indices,{grade_ordinal})) grade FROM research_matchup_compact_season WHERE year=2017 AND position='RB'), clutch AS (SELECT NFL_player_id FROM x ORDER BY core.clutch_season_sum DESC,NFL_player_id LIMIT 5), champ AS (SELECT NFL_player_id FROM x ORDER BY grade.champ_rate_pct DESC,NFL_player_id LIMIT 5), quality AS (SELECT grade.playoff_rate_pct playoff_rate_pct,grade.champ_rate_pct champ_rate_pct FROM x WHERE grade.champ_rate_pct IS NOT NULL) SELECT (SELECT COUNT(*) FROM clutch JOIN champ USING(NFL_player_id)),(SELECT COUNT(*) FROM quality WHERE NOT (champ_rate_pct >= 0 AND champ_rate_pct <= playoff_rate_pct AND playoff_rate_pct < 100))""").fetchone()
              clutch_champ_overlap,bad_clutch_champ_rates=ranked
              assert clutch_champ_overlap >= 3,ranked
              assert bad_clutch_champ_rates == 0,ranked
          bad_visible_rows=c.execute("SELECT NFL_player_id,year,position,cell.eligible_leagues,cell.clutch_season_sum,cell.expected_starts,cell.expected_wins,cell.expected_losses FROM research_matchup_compact_season,UNNEST(cohort_cells) u(cell) WHERE cell.eligible_leagues >= 150 AND ((ABS(COALESCE(cell.clutch_season_sum,0.0)) > 50 AND COALESCE(cell.start_rate_pct,0.0) >= 5.0) OR (cell.valid_started_outcomes > 0 AND ABS((COALESCE(cell.expected_wins,0.0)+COALESCE(cell.expected_losses,0.0))-COALESCE(cell.expected_starts,0.0)) > 0.000001)) ORDER BY NFL_player_id LIMIT 25").fetchall()
          bad_visible_core=len(bad_visible_rows)
          print('bad_visible_core_rows='+json.dumps(bad_visible_rows))
          assert bad_visible_core == 0,bad_visible_core
          low_sample_cells=c.execute("""
            SELECT sample_source, COUNT(*)
            FROM (
              SELECT 'weekly_core' AS sample_source FROM research_matchup_compact_weekly, UNNEST(cohort_cells) u(cell) WHERE cell.rostered_leagues < 150
              UNION ALL SELECT 'weekly_roster' AS sample_source FROM research_matchup_compact_weekly, UNNEST(roster_cells) u(cell) WHERE cell.rostered_leagues < 150
              UNION ALL SELECT 'season_core' AS sample_source FROM research_matchup_compact_season, UNNEST(cohort_cells) u(cell) WHERE cell.rostered_league_weeks < 150
              UNION ALL SELECT 'season_roster' AS sample_source FROM research_matchup_compact_season, UNNEST(roster_cells) u(cell) WHERE cell.rostered_league_weeks < 150
              UNION ALL SELECT 'career_core' AS sample_source FROM research_matchup_compact_career, UNNEST(cohort_cells) u(cell) WHERE cell.rostered_league_weeks < 150
              UNION ALL SELECT 'career_roster' AS sample_source FROM research_matchup_compact_career, UNNEST(roster_cells) u(cell) WHERE cell.rostered_league_weeks < 150
            ) GROUP BY 1 ORDER BY 1
          """).fetchall()
          print('low_sample_cells='+json.dumps(low_sample_cells))
          assert not low_sample_cells,low_sample_cells
          assert dupe==0,dupe
          print('compact_rollup='+json.dumps({'weekly':c.execute('SELECT COUNT(*) FROM research_matchup_compact_weekly').fetchone()[0],'season':c.execute('SELECT COUNT(*) FROM research_matchup_compact_season').fetchone()[0],'career':c.execute('SELECT COUNT(*) FROM research_matchup_compact_career').fetchone()[0],'cmc':cmc}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: compact-matchup-final-${{ github.run_id }}
          path: research_matchup_compact.duckdb
          retention-days: 1
          compression-level: 0
