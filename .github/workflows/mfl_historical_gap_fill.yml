name: MFL Historical Gap Fill (1997-2006)

on:
  push:
    paths:
      - .github/mfl_gap_fill_bootstrap_1997
  workflow_dispatch:
    inputs:
      id_start:
        description: "First inclusive MFL ID band"
        required: false
        default: "0"
        type: string
      id_end:
        description: "Last inclusive MFL ID band"
        required: false
        default: "999"
        type: string
      resume_year:
        description: "First season window to run (1997, 1999, 2001, 2003, or 2005)"
        required: false
        default: "1997"
        type: string
  workflow_call:
    inputs:
      id_start:
        required: false
        default: "0"
        type: string
      id_end:
        required: false
        default: "999"
        type: string
      resume_year:
        required: false
        default: "1997"
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  # Different ID bands are independent; do not let optional cleanup in an
  # older band hold the next numeric sweep.
  group: mfl-historical-gap-fill-${{ inputs.id_start || '0' }}-${{ inputs.id_end || '999' }}
  cancel-in-progress: false

jobs:
  window-1997-1998:
    if: ${{ inputs.resume_year == '1997' }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "15"
      start_year: "1997"
      end_year: "1998"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: ${{ inputs.id_start || '0' }}
      id_end: ${{ inputs.id_end || '999' }}
      artifact_namespace: "1997-1998"
    secrets: inherit

  window-1999-2000:
    needs: window-1997-1998
    if: ${{ always() && (needs.window-1997-1998.result == 'success' || needs.window-1997-1998.result == 'skipped') && (inputs.resume_year == '1997' || inputs.resume_year == '1999') }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "15"
      start_year: "1999"
      end_year: "2000"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: ${{ inputs.id_start || '0' }}
      id_end: ${{ inputs.id_end || '999' }}
      artifact_namespace: "1999-2000"
    secrets: inherit

  window-2001-2002:
    needs: window-1999-2000
    if: ${{ always() && (needs.window-1999-2000.result == 'success' || needs.window-1999-2000.result == 'skipped') && (inputs.resume_year == '1997' || inputs.resume_year == '1999' || inputs.resume_year == '2001') }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "15"
      start_year: "2001"
      end_year: "2002"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: ${{ inputs.id_start || '0' }}
      id_end: ${{ inputs.id_end || '999' }}
      artifact_namespace: "2001-2002"
    secrets: inherit

  window-2003-2004:
    needs: window-2001-2002
    if: ${{ always() && (needs.window-2001-2002.result == 'success' || (needs.window-2001-2002.result == 'skipped' && inputs.resume_year == '2003')) && (inputs.resume_year == '1997' || inputs.resume_year == '1999' || inputs.resume_year == '2001' || inputs.resume_year == '2003') }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "15"
      start_year: "2003"
      end_year: "2004"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: ${{ inputs.id_start || '0' }}
      id_end: ${{ inputs.id_end || '999' }}
      artifact_namespace: "2003-2004"
    secrets: inherit

  window-2005-2006:
    needs: window-2003-2004
    if: ${{ always() && (needs.window-2003-2004.result == 'success' || (needs.window-2003-2004.result == 'skipped' && inputs.resume_year == '2005')) && (inputs.resume_year == '1997' || inputs.resume_year == '1999' || inputs.resume_year == '2001' || inputs.resume_year == '2003' || inputs.resume_year == '2005') }}
    uses: ./.github/workflows/mfl_historical_discovery_256.yml
    with:
      shard_count: "250"
      max_parallel: "15"
      start_year: "2005"
      end_year: "2006"
      chain_next_window: "false"
      shard_indices: ""
      directory_only: "false"
      id_bands: "1-9999,10000-29999,30000-59999,60000-80000"
      request_sleep: "5.0"
      id_start: ${{ inputs.id_start || '0' }}
      id_end: ${{ inputs.id_end || '999' }}
      artifact_namespace: "2005-2006"
    secrets: inherit

  finalize:
    needs: window-2005-2006
    if: ${{ always() && (needs.window-1997-1998.result == 'success' || needs.window-1997-1998.result == 'skipped') && (needs.window-1999-2000.result == 'success' || needs.window-1999-2000.result == 'skipped') && (needs.window-2001-2002.result == 'success' || needs.window-2001-2002.result == 'skipped') && (needs.window-2003-2004.result == 'success' || needs.window-2003-2004.result == 'skipped') && needs.window-2005-2006.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Write completed gap-fill band manifest
        env:
          MFL_ID_START: ${{ inputs.id_start || '0' }}
          MFL_ID_END: ${{ inputs.id_end || '999' }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import json, os
          with open("out/mfl_gap_fill_manifest.json", "w", encoding="utf-8") as handle:
              json.dump({
                  "platform": "mfl",
                  "source_run_id": os.environ["GITHUB_RUN_ID"],
                  "start_year": "1997",
                  "end_year": "2006",
                  "id_start": os.environ["MFL_ID_START"],
                  "id_end": os.environ["MFL_ID_END"],
                  "shard_count": "1250",
                  "max_parallel": "15",
              }, handle, indent=2, sort_keys=True)
          PY
      - name: Upload completed gap-fill band manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-gap-fill-manifest-${{ github.run_id }}
          path: out/mfl_gap_fill_manifest.json
          if-no-files-found: error
          retention-days: 30
