name: Restore durable research ops cache
description: Restore the 2000+ ops cache from Actions cache, with a release-asset fallback.
inputs:
  cache-key:
    required: true
  release-tag:
    required: true
  release-repository:
    required: false
    default: jeleff1000/mfl-league-fetcher
outputs:
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore Actions cache
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: research_public_lake
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: false
    - name: Restore release backup when Actions cache is absent
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf research_public_lake
        mkdir -p research_public_lake
        curl --fail --location --retry 3 --retry-all-errors \
          --output research_public_lake/ops_cache.duckdb \
          "https://github.com/${{ inputs.release-repository }}/releases/download/${{ inputs.release-tag }}/ops_cache.duckdb"
        test -s research_public_lake/ops_cache.duckdb
    - name: Verify durable ops cache
      shell: bash
      run: test -s research_public_lake/ops_cache.duckdb
