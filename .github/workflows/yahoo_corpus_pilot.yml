name: Yahoo Corpus Pilot

# Operational owner: jeleff1000/league-history-workers only. This file is mirrored into
# yahoo_oauth for workflow-source parity, but the repository guard below keeps that copy inert.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cross-era/spacing-resume are pilots; inventory discovers EVERY grant league-year once (plan cached) and blasts through with grant-LRU spacing'
        required: true
        type: choice
        options: ['cross-era', 'spacing-resume', 'inventory']
        default: 'cross-era'
      task_limit:
        description: 'League-years in the pilot (inventory mode: 0 = all)'
        required: false
        type: string
        default: '12'
      time_budget_min:
        description: 'Stop dispatching new imports after this many minutes (job timeout is 350)'
        required: false
        type: string
        default: '300'
      shards:
        description: 'Parallel runners (inventory mode). The plan is split BY ACCOUNT so no two runners share a Yahoo rate-limit bucket.'
        required: false
        type: string
        default: '5'
      rebuild_inventory:
        description: 'Ignore the cached inventory plan and re-discover from scratch'
        required: false
        type: boolean
        default: false
      workers:
        description: 'Reserved for scale-up; pilots remain serial to prove dispatch ordering'
        required: false
        type: string
        default: '1'
      plan_only:
        description: 'Discover and report the redacted plan without importing leagues'
        required: false
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  group: yahoo-corpus-pilot
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'jeleff1000/league-history-workers'
    runs-on: ubuntu-latest
    outputs:
      shard_list: ${{ steps.mk.outputs.shard_list }}
      shard_count: ${{ steps.mk.outputs.shard_count }}
    steps:
      - name: Build shard list
        id: mk
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          mode = "${{ github.event.inputs.mode || 'cross-era' }}"
          rebuild = "${{ github.event.inputs.rebuild_inventory || 'false' }}" == "true"
          # Pilot modes stay serial (they discover their own small plan), and so
          # does a rebuild -- five shards discovering at once is a 5x API storm.
          n = int("${{ github.event.inputs.shards || '5' }}") if mode == "inventory" and not rebuild else 1
          print("shard_list=" + json.dumps(list(range(n))))
          print("shard_count=" + str(n))
          PY

  pilot:
    needs: prepare
    if: github.repository == 'jeleff1000/league-history-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.shard_count) }}
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_list) }}
    env:
      CORPUS_OUT: ${{ github.workspace }}/corpus/yahoo-pilot
      YAHOO_OAUTH_ROOT: ${{ github.workspace }}/code
      OPS_CACHE_PATH: ${{ github.workspace }}/corpus_dependencies/ops_cache.duckdb
      DRAFT_GLOBAL_SOURCE_PATH: ${{ github.workspace }}/corpus_dependencies/draft_global_source.parquet
      CORPUS_DEPENDENCY_KEY: corpus-dependencies-v1-Linux-20260717
      PYTHONPATH: ${{ github.workspace }}/worker:${{ github.workspace }}/code/fantasy_football_data_scripts
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout worker runner
        uses: actions/checkout@v5
        with:
          path: worker

      - name: Checkout private pipeline
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install private pipeline dependencies
        run: python -m pip install -r code/requirements.txt

      - name: Restore offline corpus dependencies
        id: corpus-dependencies
        uses: actions/cache/restore@v5
        with:
          path: corpus_dependencies
          key: ${{ env.CORPUS_DEPENDENCY_KEY }}

      - name: Fail fast if offline dependencies are missing
        if: steps.corpus-dependencies.outputs.cache-hit != 'true'
        run: |
          echo "::error::corpus dependency miss (${CORPUS_DEPENDENCY_KEY}); run Seed Corpus Dependencies"
          exit 1

      - name: Validate offline dependency bundle
        run: |
          python code/scripts/sleeper_corpus/build_github_dependency_bundle.py \
            --output "${{ github.workspace }}/corpus_dependencies" \
            --validate-only

      # Inventory plan persistence: discovery is expensive and hammers Yahoo right
      # before imports (the 999 storms), so the full-inventory plan is discovered
      # once and cached. Cache, not artifact -- the plan stays private.
      - name: Restore inventory plan
        id: plan-cache
        if: github.event.inputs.mode == 'inventory' && github.event.inputs.rebuild_inventory != 'true'
        uses: actions/cache/restore@v5
        with:
          path: corpus/yahoo-pilot/plan.json
          key: yahoo-corpus-inventory-v1-${{ github.run_id }}
          restore-keys: |
            yahoo-corpus-inventory-v1-

      # Keep the resumable scheduler and compact slice between automatic waves.
      # The cache is scoped to the account shard, so a later wave continues the
      # same shard without re-importing already folded league-years.
      - name: Restore shard state
        if: github.event.inputs.mode == 'inventory' && github.event.inputs.rebuild_inventory != 'true'
        uses: actions/cache/restore@v5
        with:
          path: corpus/yahoo-pilot
          key: yahoo-corpus-state-v1-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            yahoo-corpus-state-v1-${{ matrix.shard }}-

      - name: Run credential-spaced Yahoo pilot
        env:
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          CREDENTIAL_ENCRYPTION_KEY_NEW: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY_NEW }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'cross-era' }}
          TASK_LIMIT: ${{ github.event.inputs.task_limit || '12' }}
          PLAN_ONLY: ${{ github.event.inputs.plan_only || 'false' }}
          TIME_BUDGET: ${{ github.event.inputs.time_budget_min || '300' }}
        run: |
          set -euo pipefail
          mkdir -p "$CORPUS_OUT"
          COMMON=(
            --mode "$MODE"
            --task-limit "$TASK_LIMIT"
            --pipeline-root "${{ github.workspace }}/code"
            --output "$CORPUS_OUT"
            --time-budget-min "$TIME_BUDGET"
            --shard-index "${{ matrix.shard }}"
            --shard-count "${{ needs.prepare.outputs.shard_count }}"
          )
          if [ -f "${{ github.workspace }}/worker/corpus_seed/yahoo_landed.txt" ]; then
            COMMON+=( --landed-list "${{ github.workspace }}/worker/corpus_seed/yahoo_landed.txt" )
          fi
          if [ "$PLAN_ONLY" = "true" ]; then
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --plan-only
          elif [ "$MODE" = "inventory" ]; then
            EXTRA=()
            if [ -s "$CORPUS_OUT/plan.json" ]; then
              echo "[pilot] resuming from cached inventory plan"
              EXTRA+=( --resume )
            elif [ "${{ matrix.shard }}" != "0" ]; then
              echo "[pilot] no cached plan and this is not shard 0 -- skipping so only one runner discovers"
              exit 0
            else
              echo "[pilot] no cached plan -- discovering the full inventory (one-time)"
            fi
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" "${EXTRA[@]}"
          elif [ "$MODE" = "spacing-resume" ]; then
            echo "[pilot] controlled first pass: stop after four successful league-years"
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --stop-after 4
            echo "[pilot] resume from persisted scheduler state"
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}" --resume
          else
            python worker/scripts/yahoo_corpus/cli.py "${COMMON[@]}"
          fi

      - name: Save inventory plan
        if: always() && github.event.inputs.mode == 'inventory' && matrix.shard == 0 && steps.plan-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v5
        with:
          path: corpus/yahoo-pilot/plan.json
          key: yahoo-corpus-inventory-v1-${{ github.run_id }}

      - name: Save shard state for the next wave
        if: always() && github.event.inputs.mode == 'inventory'
        uses: actions/cache/save@v5
        with:
          path: corpus/yahoo-pilot
          key: yahoo-corpus-state-v1-${{ matrix.shard }}-${{ github.run_id }}

      - name: Report compact slice
        if: always()
        run: |
          if [ -s "$CORPUS_OUT/yahoo_corpus_slice.duckdb" ]; then
            python - <<'PY'
          import duckdb, os
          path = os.environ['CORPUS_OUT'] + '/yahoo_corpus_slice.duckdb'
          con = duckdb.connect(path, read_only=True)
          print('[slice] sources:', con.execute('SELECT COUNT(*) FROM _sources').fetchone()[0])
          for table in ('league_settings', 'draft', 'transactions', 'player_fantasy'):
              print(f'[slice] {table}:', con.execute(f'SELECT COUNT(*) FROM public.{table}').fetchone()[0])
          PY
          else
            echo "[slice] no compact slice produced"
          fi

      - name: Upload compact Yahoo pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-corpus-${{ github.event.inputs.mode || 'cross-era' }}-${{ github.run_id }}-s${{ matrix.shard }}
          path: |
            ${{ env.CORPUS_OUT }}/yahoo_corpus_slice.duckdb
            ${{ env.CORPUS_OUT }}/ledger.json
            ${{ env.CORPUS_OUT }}/report.json
            ${{ env.CORPUS_OUT }}/driver.log
          retention-days: 14
          if-no-files-found: warn

  continue-inventory:
    needs: [prepare, pilot]
    if: always() && github.repository == 'jeleff1000/league-history-workers' && github.event.inputs.mode == 'inventory'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download this wave's reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p wave-artifacts
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir wave-artifacts \
            --pattern "yahoo-corpus-inventory-${GITHUB_RUN_ID}-s*" || true

      - name: Dispatch the next five-runner wave only when progress remains
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = list(Path("wave-artifacts").rglob("report.json"))
          rows = []
          for path in reports:
              try:
                  rows.append(json.loads(path.read_text(encoding="utf-8")))
              except (OSError, json.JSONDecodeError):
                  pass
          pending = sum(int(row.get("pending", 0) or 0) for row in rows)
          progressed = sum(int(row.get("completed_this_run", 0) or 0) for row in rows)
          print(json.dumps({"reports": len(rows), "pending": pending, "completed_this_run": progressed}))
          if pending <= 0 or progressed <= 0:
              print("[queue] no pending work with positive progress; stopping")
              raise SystemExit(0)
          Path("dispatch.env").write_text("DISPATCH=1\n", encoding="utf-8")
          PY
          if [ ! -f dispatch.env ]; then
            exit 0
          fi
          gh workflow run yahoo_corpus_pilot.yml \
            --repo "$REPO" \
            --ref main \
            -f mode=inventory \
            -f task_limit=0 \
            -f time_budget_min=300 \
            -f shards=5 \
            -f rebuild_inventory=false \
            -f workers=1 \
            -f plan_only=false
          echo "[queue] dispatched next five-runner wave"
