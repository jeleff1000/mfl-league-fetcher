name: MFL Reduce Saved Chunk

on:
  workflow_dispatch:
    inputs:
      source_chunk_key:
        description: Exact cache key containing a standalone chunk DuckDB
        required: true
        type: string
      source_index_key:
        description: Exact cache key containing the standalone chunk index
        required: true
        type: string
      prior_index_key:
        description: Exact cache key for the current canonical index
        required: true
        type: string
      prior_index_cache_path:
        description: Path used when the prior canonical index cache was saved
        required: false
        type: string
        default: canonical_index_state
      cache_namespace:
        description: Canonical immutable cache namespace
        required: false
        type: string
        default: mfl-registered-2004-2018-v2
      output_suffix:
        description: Unique immutable successor suffix
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  reduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore source chunk
        uses: actions/cache/restore@v5
        with:
          path: chunk_state
          key: ${{ inputs.source_chunk_key }}
          fail-on-cache-miss: true
      - name: Preserve source chunk
        run: |
          mkdir -p source_chunk
          cp chunk_state/mfl_register_chunk.duckdb source_chunk/
      - name: Restore source index
        uses: actions/cache/restore@v5
        with:
          path: index_state
          key: ${{ inputs.source_index_key }}
          fail-on-cache-miss: true
      - name: Preserve source index
        run: |
          mkdir -p source_index
          cp index_state/mfl_register_all_runs.json source_index/
          rm -rf index_state
      - name: Restore canonical prior index
        uses: actions/cache/restore@v5
        with:
          # Actions cache versions include the path. Restore using the exact
          # path used by the predecessor that created this cache key.
          path: ${{ inputs.prior_index_cache_path }}
          key: ${{ inputs.prior_index_key }}
          fail-on-cache-miss: true
      - name: Normalize canonical prior index filename
        shell: bash
        run: |
          prior_dir='${{ inputs.prior_index_cache_path }}'
          test -d "$prior_dir"
          if [ ! -s "$prior_dir/mfl_register_all_runs.json" ] && [ -s "$prior_dir/canonical_mfl_register_all_runs.json" ]; then
            cp "$prior_dir/canonical_mfl_register_all_runs.json" "$prior_dir/mfl_register_all_runs.json"
          fi
          test -s "$prior_dir/mfl_register_all_runs.json"
      - name: Checkout reducer
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/merge_mfl_saved_chunk.py
            /scripts/research_cohorts/build_mfl_research_overlay.py
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install DuckDB
        run: pip install duckdb
      - name: Reduce and prove append
        env:
          OUTPUT_KEY: ${{ inputs.cache_namespace }}-chunk-${{ inputs.output_suffix }}
        run: |
          python code/scripts/extraplatform_corpus/merge_mfl_saved_chunk.py \
            --source-db source_chunk/mfl_register_chunk.duckdb \
            --source-index source_index/mfl_register_all_runs.json \
            --prior-index "${{ inputs.prior_index_cache_path }}/mfl_register_all_runs.json" \
            --output-db mfl_register_chunk.duckdb \
            --output-index mfl_register_all_runs.json \
            --proof cache_append_proof.json \
            --output-key "$OUTPUT_KEY"
          python - <<'PY'
          import json
          p=json.load(open('cache_append_proof.json', encoding='utf-8'))
          required={'schema_unchanged':True,'prior_rows_preserved':True,'new_lineage':False,'duplicate_league_year_keys':False}
          for key,value in required.items():
              if p.get(key) != value: raise SystemExit(f'{key} proof failed')
          if p.get('added_league_count', 0) < 0: raise SystemExit('reducer reported a negative league count')
          print(json.dumps(p, sort_keys=True))
          PY
      - name: Build exact research-lake source overlay
        run: |
          python code/scripts/research_cohorts/build_mfl_research_overlay.py \
            --chunk mfl_register_chunk.duckdb \
            --output mfl_research_overlay.duckdb
          python - <<'PY'
          import json, duckdb
          expected={
            'league_settings': ['db_name','year','num_teams','is_dynasty','max_keepers','sleeper_best_ball','waiver_budget','waiver_type','roster_QB','roster_RB','roster_WR','roster_TE','roster_FLX','roster_SUPER_FLEX','roster_IDP','roster_DL','roster_LB','roster_DB','roster_DB_LB','roster_DL_LB','scoring_rec','scoring_pass_td','playoff_start_week','playoff_teams','regular_season_weeks','end_week','has_multiweek_championship','roster_K','roster_DEF','roster_BN','roster_TAXI','roster_IR','platform','league_key'],
            'player_fantasy': ['db_name','year','week','NFL_player_id','player','position','fantasy_position','platform','team_key','team_name','nfl_team_api','yahoo_player_id','sleeper_player_id','espn_player_id','fleaflicker_player_id','mfl_player_id','is_started','is_rostered','fantasy_points','win','champion','clutch_equity','manager_lamar','manager','team_points','final_playoff_seed','is_playoffs','made_po_bf','is_playoffs_bf','made_po','has_po_signal'],
            'matchup': ['db_name','year','week','manager','franchise_id','opponent','team_points','opponent_points','win','loss','tie','is_playoffs','playoff_seed','final_playoff_seed','champion','is_championship','p_champ'],
          }
          c=duckdb.connect('mfl_research_overlay.duckdb',read_only=True)
          rows={}; schemas={}
          for table, cols in expected.items():
              actual=[r[0] for r in c.execute(f'DESCRIBE "{table}"').fetchall()]
              if actual != cols: raise SystemExit(f'{table} research schema mismatch: {actual}')
              rows[table]=c.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
              schemas[table]=actual
              if rows[table] <= 0: raise SystemExit(f'{table} overlay is empty')
          json.dump({'schema_unchanged':True,'rows':rows,'columns':schemas,'new_lineage':False},open('mfl_research_overlay_proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'rows':rows,'schema_unchanged':True},sort_keys=True))
          PY
          mkdir -p research_overlay_state
          cp mfl_research_overlay.duckdb research_overlay_state/
      - name: Stage successor caches
        run: |
          mkdir -p chunk_state index_state
          cp mfl_register_chunk.duckdb cache_append_proof.json chunk_state/
          cp mfl_register_all_runs.json cache_append_proof.json index_state/
      - name: Save successor chunk
        uses: actions/cache/save@v5
        with:
          path: chunk_state
          key: ${{ inputs.cache_namespace }}-chunk-${{ inputs.output_suffix }}
      - name: Save successor index
        uses: actions/cache/save@v5
        with:
          path: index_state
          key: ${{ inputs.cache_namespace }}-index-${{ inputs.output_suffix }}
      - name: Save research-lake overlay cache
        uses: actions/cache/save@v5
        with:
          path: research_overlay_state
          key: ${{ inputs.cache_namespace }}-research-overlay-${{ inputs.output_suffix }}
      - name: Upload reducer proof
        uses: actions/upload-artifact@v4
        with:
          name: mfl-reducer-proof-${{ github.run_id }}
          retention-days: 90
          path: |
            mfl_register_all_runs.json
            cache_append_proof.json
            mfl_research_overlay.duckdb
            mfl_research_overlay_proof.json
