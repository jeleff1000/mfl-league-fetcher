name: Research native player identity audit

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      db_names:
        description: Comma-separated MFL/Fleaflicker DB names
        required: true
      year_start:
        required: false
        default: '2003'
      year_end:
        required: false
        default: '2025'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Download deterministic native identity crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research_public_lake
          gh release download research-native-id-crosswalk-v4 \
            --repo jeleff1000/league-history-workers \
            --pattern native_id_crosswalk.parquet \
            --clobber \
            --dir research_public_lake
      - run: python -m pip install duckdb==1.5.1
      - name: Audit native identity repairability
        run: |
          python code/scripts/research_cohorts/audit_native_identity_repairs.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --corpus research_public_lake/no-second-source.duckdb \
            --db-names '${{ inputs.db_names }}' \
            --crosswalk research_public_lake/native_id_crosswalk.parquet \
            --espn-map code/ops_data/public/espn_nfl_player_map.parquet \
            --aliases code/scripts/research_cohorts/research_identity_aliases.csv \
            --out out/native_identity_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-native-identity-audit-${{ github.run_id }}
          path: out/native_identity_audit.json
          if-no-files-found: error
