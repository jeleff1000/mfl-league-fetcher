name: Seed Ops Cache

# Resumable publisher for the two-table ___ops DuckDB cache.
# Checkpoint caches survive failed runs; import workflows consume the newest
# validated immutable generation cache.

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional prior seed run whose checkpoint artifacts should be reused'
        required: false
        type: string
        default: ''
      resume_run_id_2:
        description: 'Optional second prior seed run whose checkpoint artifacts should be reused'
        required: false
        type: string
        default: ''
      resume_checkpoint_ids:
        description: 'Comma-separated checkpoint IDs already present in resume artifacts'
        required: false
        type: string
        default: ''
      checkpoint_ids:
        description: 'Optional comma-separated subset to process in this batch'
        required: false
        type: string
        default: ''
      resume_run_ids:
        description: 'Comma-separated prior seed run IDs for final artifact assembly'
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write

env:
  CHECKPOINT_CACHE_PREFIX: ops-cache-checkpoint-v4-Linux-

jobs:
  preflight:
    # The research lake now carries the validated ops snapshot. Keep this
    # legacy workflow dispatchable for history, but make stale/manual
    # dispatches a no-op so checkpoint caches cannot evict the canonical lake.
    if: ${{ false }}
    name: Plan missing checkpoints
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_missing: ${{ steps.plan.outputs.has_missing }}
    steps:
      - name: Find missing checkpoint cache keys
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PREFIX: ops-cache-checkpoint-v4-Linux-
          RESUME_RUN_1: ${{ github.event.inputs.resume_run_id }}
          RESUME_RUN_2: ${{ github.event.inputs.resume_run_id_2 }}
          RESUME_CHECKPOINT_IDS: ${{ github.event.inputs.resume_checkpoint_ids }}
          TARGET_CHECKPOINT_IDS: ${{ github.event.inputs.checkpoint_ids }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TARGET_CHECKPOINT_IDS" ]; then
            all_keys="$(printf '%s' "$TARGET_CHECKPOINT_IDS" | jq -R 'split(",") | map(select(length > 0))')"
          else
            all_keys="$(jq -cn '[range(0;110) | "nfl_player_stats_all-batch-" + (if . < 10 then "0" else "" end) + tostring] + ["player_bio-all"]')"
          fi
          cached_keys="$(gh cache list --repo jeleff1000/mfl-league-fetcher --key "$CACHE_PREFIX" --limit 1000 --json key | jq -c '[.[].key | sub("^ops-cache-checkpoint-v4-Linux-"; "")]')"
          artifact_keys='[]'
          for resume_id in "$RESUME_RUN_1" "$RESUME_RUN_2"; do
            if [ -n "$resume_id" ]; then
              gh api --paginate \
                "/repos/jeleff1000/mfl-league-fetcher/actions/runs/$resume_id/artifacts" \
                | jq -r '.artifacts[]?.name' \
                | sed -n 's/^ops-checkpoint-//p' \
                | jq -R -s 'split("\\n") | map(select(length > 0))' > /tmp/ops-artifacts.json
              artifact_keys="$(jq -cn --argjson a "$artifact_keys" --argjson b "$(jq -c . /tmp/ops-artifacts.json)" '$a + $b | unique')"
            fi
          done
          manual_keys="$(printf '%s' "$RESUME_CHECKPOINT_IDS" | jq -R 'split(",") | map(select(length > 0))')"
          artifact_keys="$(jq -cn --argjson a "$artifact_keys" --argjson b "$manual_keys" '$a + $b | unique')"
          available="$(jq -cn --argjson cached "$cached_keys" --argjson artifacts "$artifact_keys" '$cached + $artifacts | unique')"
          missing="$(jq -cn --argjson all "$all_keys" --argjson available "$available" '$all - $available | map({batch_id: .}) | {include: .}')"
          count="$(jq '.include | length' <<< "$missing")"
          echo "matrix=$missing" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "has_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_missing=false" >> "$GITHUB_OUTPUT"
          fi
          echo "[ops-cache] cached=$(jq 'length' <<< "$cached_keys") artifacts=$(jq 'length' <<< "$artifact_keys") missing-checkpoints=$count"

  checkpoint:
    name: Checkpoint ${{ matrix.batch_id }}
    needs: preflight
    if: needs.preflight.outputs.has_missing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The single Fly DuckDB machine can spend 10-30 seconds on metadata
      # scans; serialize cold-cache batches to keep health checks responsive.
      max-parallel: 6
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Restore checkpoint
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

      - name: Download or reuse checkpoint
        id: download
        env:
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          if [ '${{ matrix.batch_id }}' = '__none__' ]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install duckdb==1.5.1 pandas
          succeeded=false
          for attempt in 1 2 3; do
            echo "[ops-cache] checkpoint attempt $attempt/3"
            if python fantasy_football_data_scripts/build_ops_cache.py \
              --output ops_cache/unused.duckdb \
              --checkpoint-dir ops_cache/checkpoints \
              --batch-id '${{ matrix.batch_id }}' \
              --status-file ops_cache/checkpoints/${{ matrix.batch_id }}.status.json; then
              succeeded=true
              break
            fi
            if [ "$attempt" != 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          if [ "$succeeded" != true ]; then
            echo "[ops-cache] checkpoint failed after 3 attempts"
            exit 1
          fi
          reused=$(python -c "import json; print(str(json.load(open('ops_cache/checkpoints/${{ matrix.batch_id }}.status.json'))['reused']).lower())")
          echo "reused=$reused" >> "$GITHUB_OUTPUT"

      - name: Save checkpoint
        if: steps.download.outcome == 'success' && steps.download.outputs.reused != 'true'
        uses: actions/cache/save@v5
        with:
          path: ops_cache/checkpoints
          key: ${{ env.CHECKPOINT_CACHE_PREFIX }}${{ matrix.batch_id }}

      # Artifacts are the run-scoped handoff to assembly.  Unlike Actions
      # caches, they are not evicted when research caches consume the quota.
      - name: Upload checkpoint artifact
        if: steps.download.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: ops-checkpoint-${{ matrix.batch_id }}
          path: ops_cache/checkpoints
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble and publish ops cache
    needs: [preflight, checkpoint]
    if: always() && needs.preflight.result == 'success' && (needs.checkpoint.result == 'success' || needs.checkpoint.result == 'skipped') && github.event.inputs.checkpoint_ids == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPS_CACHE_PREFIX: ops-cache-v5-Linux-manual-
      OPS_CACHE_KEY: ops-cache-v5-Linux-manual-${{ github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Protect research-lake caches
        shell: bash
        run: |
          set -euo pipefail
          echo "[ops-cache] research-public-lake caches are immutable and are never deleted by this workflow"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download checkpoint artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ops-checkpoint-*
          path: ops_cache/checkpoints
          merge-multiple: true

      - name: Download artifacts from resumed seed run
        if: ${{ github.event.inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: jeleff1000/mfl-league-fetcher
          run-id: ${{ github.event.inputs.resume_run_id }}
          pattern: ops-checkpoint-*
          path: ops_cache/checkpoints
          merge-multiple: true

      - name: Download artifacts from second resumed seed run
        if: ${{ github.event.inputs.resume_run_id_2 != '' }}
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: jeleff1000/mfl-league-fetcher
          run-id: ${{ github.event.inputs.resume_run_id_2 }}
          pattern: ops-checkpoint-*
          path: ops_cache/checkpoints
          merge-multiple: true

      - name: Download artifacts from all resumed seed runs
        if: ${{ github.event.inputs.resume_run_ids != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_IDS: ${{ github.event.inputs.resume_run_ids }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops_cache/checkpoints
          IFS=',' read -ra run_ids <<< "$RESUME_RUN_IDS"
          for run_id in "${run_ids[@]}"; do
            gh api --paginate \
              "/repos/jeleff1000/mfl-league-fetcher/actions/runs/$run_id/artifacts" \
              | jq -r '.artifacts[]? | select(.name | startswith("ops-checkpoint-")) | .archive_download_url' \
              | while read -r url; do
                  [ -z "$url" ] && continue
                  archive="$(mktemp)"
                  gh api "$url" --output "$archive"
                  unzip -oq "$archive" -d ops_cache/checkpoints
                  rm -f "$archive"
                done
          done

      - name: Restore stats checkpoint 00
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v4-Linux-nfl_player_stats_all-batch-00
      - name: Restore stats checkpoint 01
        uses: actions/cache/restore@v5
        with:
          path: ops_cache/checkpoints
          key: ops-cache-checkpoint-v4-Linux-nfl_player_stats_all-batch-01
