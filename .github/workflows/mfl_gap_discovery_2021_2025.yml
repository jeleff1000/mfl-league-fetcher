name: MFL Gap Discovery (2021-2025)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2021, 2022, 2023, 2025]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/extraplatform_corpus/
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Discover missing season-scoped MFL leagues
        env:
          MFL_YEARS: ${{ matrix.year }}
          MFL_TARGET: '50'
          MFL_REQ_CAP: '250'
          MFL_SLEEP: '4.2'
          MFL_HTTP_TIMEOUT: '30'
          MFL_SEED_OUT: ${{ github.workspace }}/out/mfl_gap_${{ matrix.year }}.json
          MFL_DISCOVERY_PROGRESS: ${{ github.workspace }}/out/mfl_gap_${{ matrix.year }}.log
        run: |
          mkdir -p out
          python -u code/scripts/extraplatform_corpus/discover_mfl_leagues.py
      - uses: actions/upload-artifact@v4
        with:
          name: mfl-gap-discovery-${{ matrix.year }}-${{ github.run_id }}
          path: out/mfl_gap_${{ matrix.year }}.*
          retention-days: 30
