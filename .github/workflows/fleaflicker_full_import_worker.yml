name: Fleaflicker Full Import Worker (Manual QA)

# Manual-only QA worker for bringing Fleaflicker into the shared DDL/import
# pipeline. This checks out yahoo_oauth, runs the Fleaflicker import script,
# then optionally runs fleet validators against the uploaded Fly database.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Fleaflicker league ID'
        required: true
        type: string
        default: '30323'
      start_year:
        description: 'First season to import; leave blank/auto for full-history discovery'
        required: false
        type: string
        default: ''
      end_year:
        description: 'Last season to import; leave blank/auto for latest scored season'
        required: false
        type: string
        default: ''
      database_name:
        description: 'Target db_name in ___leagues'
        required: true
        type: string
        default: 'fleaflicker_public_30323'
      import_mode:
        description: 'Import mode'
        required: true
        type: choice
        options:
          - full
          - quick
        default: full
      skip_track_1:
        description: 'Skip NFL super table verification'
        required: false
        type: boolean
        default: false
      skip_upload:
        description: 'Skip Fly upload'
        required: false
        type: boolean
        default: false
      run_validators:
        description: 'Run validation_v2 after upload'
        required: false
        type: boolean
        default: true
      rate_limit_per_min:
        description: 'Fleaflicker API request budget per minute (0 disables client-side throttling)'
        required: false
        type: string
        default: '60'
      max_workers:
        description: 'Concurrent Fleaflicker roster requests per week'
        required: false
        type: string
        default: '1'

  repository_dispatch:
    types: [fleaflicker_full_import]

permissions:
  actions: write
  contents: read

concurrency:
  group: league-update-${{ github.event.inputs.database_name || github.event.client_payload.database_name || 'fleaflicker_public_30323' }}
  cancel-in-progress: false
  queue: max

jobs:
  import-fleaflicker:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: 1
      IMPORT_PIPELINE_V2: ${{ vars.IMPORT_PIPELINE_V2 }}
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
      FLY_UPLOAD_MAX_RETRIES: 40
      FLY_UPLOAD_RETRY_BASE_DELAY: 3
      FLY_UPLOAD_RETRY_MAX_DELAY: 30
      FLY_UPLOAD_RETRY_JITTER_SECONDS: 2
      FLY_PUBLISH_FORMAT: delta
      REQUIRE_IMPORT_BASE_GENERATION: '1'
      FLY_DELTA_FALLBACK_TO_DUCKDB: '0'
      FLY_FINALIZE_INVENTORY: '1'
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      LEAGUE_ID: ${{ github.event.inputs.league_id || github.event.client_payload.league_id || '30323' }}
      START_YEAR: ${{ github.event.inputs.start_year || github.event.client_payload.start_year || '' }}
      END_YEAR: ${{ github.event.inputs.end_year || github.event.client_payload.end_year || '' }}
      DB_NAME: ${{ github.event.inputs.database_name || github.event.client_payload.database_name || 'fleaflicker_public_30323' }}
      IMPORT_MODE: ${{ github.event.inputs.import_mode || github.event.client_payload.import_mode || 'full' }}
      SKIP_TRACK_1: ${{ github.event.inputs.skip_track_1 || github.event.client_payload.skip_track_1 || 'false' }}
      SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || github.event.client_payload.skip_upload || 'false' }}
      RUN_VALIDATORS: ${{ github.event.inputs.run_validators || github.event.client_payload.run_validators || 'true' }}
      FLEAFLICKER_RATE_LIMIT_PER_MIN: ${{ github.event.inputs.rate_limit_per_min || github.event.client_payload.rate_limit_per_min || '60' }}
      FLEAFLICKER_MAX_WORKERS: ${{ github.event.inputs.max_workers || github.event.client_payload.max_workers || '1' }}
      FLEAFLICKER_AUTH_TOKEN: ${{ secrets.FLEAFLICKER_AUTH_TOKEN }}
      FLEAFLICKER_COOKIE: ${{ secrets.FLEAFLICKER_COOKIE }}
      DATA_DIR: ${{ github.workspace }}/fantasy_football_data/fleaflicker

    steps:
      - name: Require canonical public main for publication
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Checkout yahoo_oauth
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Capture Fleaflicker import generation
        run: python scripts/capture_import_generation.py --db-name "${DB_NAME}"

      - name: Restore canonical research public lake
        id: research-lake
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache from research lake
        shell: bash
        run: |
          test -s research_public_lake/ops_cache.duckdb

      - name: Log cached ops cache
        run: |
          echo "[ops-cache] key-prefix=ops-cache-v5-${{ runner.os }}-manual-"
          echo "[research-lake] restore-hit=${{ steps.research-lake.outputs.cache-hit }}"
          echo "[ops-cache] OPS_CACHE_PATH=${OPS_CACHE_PATH}"
          test -s "${OPS_CACHE_PATH}" || {
            echo "::error::research_public_lake/ops_cache.duckdb is missing from the canonical research lake cache."
            exit 1
          }
          echo "[ops-cache] size-bytes=$(stat -c%s "${OPS_CACHE_PATH}")"
          echo "[ops-cache] size-human=$(du -h "${OPS_CACHE_PATH}" | cut -f1)"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate venv
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Echo import parameters
        run: |
          echo "league_id=${LEAGUE_ID}"
          echo "years=${START_YEAR:-auto}-${END_YEAR:-auto}"
          echo "db_name=${DB_NAME}"
          echo "import_mode=${IMPORT_MODE}"
          echo "skip_track_1=${SKIP_TRACK_1}"
          echo "skip_upload=${SKIP_UPLOAD}"
          echo "run_validators=${RUN_VALIDATORS}"
          echo "rate_limit_per_min=${FLEAFLICKER_RATE_LIMIT_PER_MIN}"
          echo "max_workers=${FLEAFLICKER_MAX_WORKERS}"
          echo "data_dir=${DATA_DIR}"

      - name: Run Fleaflicker import
        run: |
          source .venv/bin/activate
          mkdir -p "${DATA_DIR}"

          args=(
            --league-id "${LEAGUE_ID}"
            --database-name "${DB_NAME}"
            --data-dir "${DATA_DIR}"
            --import-mode "${IMPORT_MODE}"
            --rate-limit-per-min "${FLEAFLICKER_RATE_LIMIT_PER_MIN}"
            --max-workers "${FLEAFLICKER_MAX_WORKERS}"
          )

          if [ -n "${START_YEAR}" ] && [ "${START_YEAR}" != "auto" ]; then
            args+=(--start-year "${START_YEAR}")
          fi

          if [ -n "${END_YEAR}" ] && [ "${END_YEAR}" != "auto" ]; then
            args+=(--end-year "${END_YEAR}")
          fi

          if [ "${IMPORT_MODE}" = "full" ] && { [ -z "${START_YEAR}" ] || [ "${START_YEAR}" = "auto" ] || [ -z "${END_YEAR}" ] || [ "${END_YEAR}" = "auto" ]; }; then
            args+=(--discover-years)
          fi

          if [ "${SKIP_TRACK_1}" = "true" ]; then
            args+=(--skip-track-1)
          fi

          if [ "${SKIP_UPLOAD}" = "true" ]; then
            args+=(--skip-track-2-upload)
          fi

          python fantasy_football_data_scripts/fleaflicker_initial_import.py "${args[@]}"

      - name: Run validators
        if: ${{ env.RUN_VALIDATORS == 'true' && env.SKIP_UPLOAD != 'true' }}
        run: |
          source .venv/bin/activate
          export PYTHONPATH="${{ github.workspace }}/fantasy_football_data_scripts:${PYTHONPATH:-}"
          python -m multi_league.validation_v2 --db "${DB_NAME}" -v

      # ==================== REVALIDATE + WARM VERCEL CACHE ====================
      - name: Revalidate and warm Vercel cache
        if: ${{ env.SKIP_UPLOAD != 'true' }}
        env:
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
        run: |
          source .venv/bin/activate
          python scripts/warm_vercel_cache.py \
            --db "${DB_NAME}" \
            --secret "${REVALIDATION_SECRET}" \
            --site-url "https://www.leaguehistory.app" \
            --mode "${IMPORT_MODE}" \
            --strategy expire \
            --jitter-seconds 0 \
            --warm-attempts 2 \
            --strict \
            --soft-warm-failures \
            --verify-hot

      # G10 remediation (2026-07-06): artifact upload removed. Logs and
      # data files on a PUBLIC repo are downloadable by any GitHub user
      # and contained league/manager-identifying data. Diagnostics belong
      # in PRIVATE storage (see weekly-update-system-plan.md, G10).
