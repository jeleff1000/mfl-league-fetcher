name: Research Matchup Direct Cache Release to Fly
# Release after canonical cache normalization; all lookup data is in GitHub cache.

on:
  push:
    paths:
      - ".release_dispatch_once"
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable GitHub cache key for the public research lake
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      publish:
        description: Apply the verified adaptive bundle to Fly production
        required: true
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: research-matchup-direct-release-career-v2
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 requests
      - name: Inspect cached CMC availability inputs
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          cols={r[0] for r in c.execute("DESCRIBE ops.nfl_historical.nfl_player_stats_all").fetchall()}
          selected=[x for x in ('week','season_type','player_week','fpts_4pt_half','fantasy_points','game_date') if x in cols]
          print('cached_stats_columns=', selected)
          qcols=','.join('"'+x+'"' for x in selected)
          print(c.execute(f"SELECT {qcols} FROM ops.nfl_historical.nfl_player_stats_all WHERE NFL_player_id='00-0033280' AND year=2025 ORDER BY week,player_week").fetchall())
          pcols={r[0] for r in c.execute("DESCRIBE lake.public.player_fantasy").fetchall()}
          selected=[x for x in ('week','is_rostered','is_started','position','fantasy_points','season_games') if x in pcols]
          print('cached_player_columns=', selected)
          source_league_years = c.execute("""
            SELECT COUNT(*) FROM (
              SELECT DISTINCT db_name, CAST(year AS INTEGER) AS year
              FROM lake.public.player_fantasy
              WHERE year IS NOT NULL
            )
          """).fetchone()[0]
          print('source_league_years=', source_league_years)
          assert source_league_years >= 60000, {'source_league_years': source_league_years}
          qcols=','.join('"'+x+'"' for x in selected)
          print(c.execute(f"SELECT {qcols} FROM lake.public.player_fantasy WHERE NFL_player_id='00-0033280' AND year=2025 ORDER BY week LIMIT 30").fetchall())
          cmc_total, cmc_position_null = c.execute("""
            SELECT COUNT(*), COUNT(*) FILTER (WHERE position IS NULL)
            FROM lake.public.player_fantasy
            WHERE NFL_player_id='00-0033280' AND CAST(year AS INTEGER)=2025
          """).fetchone()
          if cmc_total < 5000 or cmc_position_null:
              raise SystemExit(f'CMC cache gate failed: total_2025={cmc_total} position_null={cmc_position_null}')
          inventory = c.execute("""
            WITH week1 AS (
              SELECT *
              FROM lake.public.player_fantasy
              WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
            )
            SELECT
              COUNT(*) AS week1_rows,
              COUNT(DISTINCT db_name) AS week1_leagues,
              COUNT(DISTINCT db_name) FILTER (
                WHERE UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
              ) AS rb_position_leagues,
              COUNT(DISTINCT db_name) FILTER (
                WHERE UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                  AND CAST(cohort_position_eligible AS INTEGER)=1
              ) AS rb_eligible_leagues,
              COUNT(DISTINCT db_name) FILTER (
                WHERE CAST(cohort_position_eligible AS INTEGER)=1
              ) AS any_position_eligible_leagues,
              COUNT(DISTINCT db_name) FILTER (
                WHERE cohort_teams IS NOT NULL
                   OR cohort_roster IS NOT NULL
                   OR cohort_scoring IS NOT NULL
                   OR cohort_pass_td IS NOT NULL
                   OR cohort_playoff_teams IS NOT NULL
              ) AS cohort_labeled_leagues,
              COUNT(DISTINCT db_name) FILTER (
                WHERE UPPER(TRIM(CAST(position AS VARCHAR)))='RB'
                  AND cohort_position_eligible IS NULL
              ) AS rb_null_eligibility_leagues
            FROM week1
          """).fetchone()
          cmc_week1_present = c.execute("""
            SELECT COUNT(DISTINCT db_name)
            FROM lake.public.player_fantasy
            WHERE NFL_player_id='00-0033280' AND CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
          """).fetchone()[0]
          print('full_week1_inventory=', {
            'week1_rows': inventory[0],
            'week1_leagues': inventory[1],
            'rb_position_leagues': inventory[2],
            'rb_eligible_leagues': inventory[3],
            'any_position_eligible_leagues': inventory[4],
            'cohort_labeled_leagues': inventory[5],
            'rb_null_eligibility_leagues': inventory[6],
            'cmc_rows_present': cmc_week1_present,
          })
          missing_rb = c.execute("""
            WITH week1 AS (
              SELECT *
              FROM lake.public.player_fantasy
              WHERE CAST(year AS INTEGER)=2025 AND CAST(week AS INTEGER)=1
            ),
            leagues AS (
              SELECT db_name,
                     ANY_VALUE(cohort_teams) AS teams,
                     ANY_VALUE(cohort_roster) AS roster,
                     ANY_VALUE(cohort_scoring) AS scoring,
                     ANY_VALUE(cohort_pass_td) AS pass_td,
                     ANY_VALUE(cohort_playoff_teams) AS playoff_teams
              FROM week1
              GROUP BY db_name
            ),
            positions AS (
              SELECT db_name,
                     STRING_AGG(DISTINCT COALESCE(NULLIF(TRIM(CAST(position AS VARCHAR)),''),'NULL'), ',' ORDER BY COALESCE(NULLIF(TRIM(CAST(position AS VARCHAR)),''),'NULL')) AS positions
              FROM week1
              GROUP BY db_name
            )
            SELECT l.teams, l.roster, l.scoring, l.pass_td, l.playoff_teams,
                   COUNT(*) AS leagues,
                   STRING_AGG(p.positions, ' | ' ORDER BY p.positions) AS position_sets
            FROM leagues l
            JOIN positions p USING (db_name)
            WHERE NOT EXISTS (
              SELECT 1 FROM week1 r
              WHERE r.db_name=l.db_name
                AND UPPER(TRIM(CAST(r.position AS VARCHAR)))='RB'
            )
            GROUP BY 1,2,3,4,5
            ORDER BY leagues DESC
          """).fetchall()
          print('week1_leagues_without_rb_rows=', missing_rb)
          assert inventory[3] >= 9500, {'full_week1_rb_eligible': inventory[3]}
          print('cmc_2025_gate=', {'rows': cmc_total, 'position_null': cmc_position_null})
          print('cached_cmc_week1_target_counts=', c.execute("""
            WITH target AS (
              SELECT DISTINCT db_name, CAST(year AS INTEGER) AS year
              FROM lake.public.player_fantasy
              WHERE year=2025 AND cohort_teams='12t'
                AND cohort_roster='flx' AND cohort_scoring='half'
                AND cohort_pass_td='4pt' AND cohort_playoff_teams='6po'
            )
            SELECT COUNT(DISTINCT t.db_name) AS eligible_leagues,
                   COUNT(DISTINCT p.db_name) AS rows_present,
                   COUNT(DISTINCT p.db_name) FILTER (WHERE CAST(p.is_rostered AS INTEGER)=1) AS rostered_leagues,
                   COUNT(DISTINCT p.db_name) FILTER (WHERE CAST(p.is_started AS INTEGER)=1) AS started_leagues,
                   COUNT(*) FILTER (WHERE CAST(p.is_rostered AS INTEGER)=0) AS unrostered_rows
            FROM target t
            LEFT JOIN lake.public.player_fantasy p
              ON p.db_name=t.db_name AND p.year=t.year AND p.week=1 AND p.NFL_player_id='00-0033280'
          """).fetchall())
          PY
      - name: Build the complete adaptive matchup lattice from cache
        run: |
          mkdir -p out
          started_at=$(date +%s)
          (while true; do echo "rollup heartbeat $(date -u +%FT%TZ)"; sleep 60; done) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          python code/scripts/research_cohorts/build_bounded_matchup_cache.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --ops-cache research_public_lake/ops_cache.duckdb \
            --output out/research_matchup_adaptive.duckdb
          elapsed=$(( $(date +%s) - started_at ))
          echo "rollup_seconds=$elapsed"
          # The build is still one direct cache-to-table operation; its private
          # year windows only bound DuckDB memory and are deleted before exit.
          test "$elapsed" -le 1200
      - name: Validate adaptive output contract
        run: |
          python - <<'PY'
          import duckdb
          c=duckdb.connect('out/research_matchup_adaptive.duckdb', read_only=True)
          required={'research_matchup_adaptive','research_matchup_adaptive_weekly','research_matchup_adaptive_career'}
          got={r[0] for r in c.execute("select table_name from information_schema.tables where table_schema='main'").fetchall()}
          assert required <= got, sorted(required-got)
          for t in sorted(required):
              n=c.execute(f'select count(*) from "{t}"').fetchone()[0]
              assert n > 0, (t,n)
              cols={r[0] for r in c.execute(f'describe "{t}"').fetchall()}
              assert {'NFL_player_id','q_teams','q_roster','q_ppr','q_td','q_bracket','q_league_type','q_lineup_mode','n_leagues'} <= cols
              print(t,n,len(cols))
          ppr_lanes={r[0] for r in c.execute("SELECT DISTINCT q_ppr FROM research_matchup_adaptive").fetchall()}
          td_lanes={r[0] for r in c.execute("SELECT DISTINCT q_td FROM research_matchup_adaptive").fetchall()}
          assert {'std','half','ppr'} <= ppr_lanes, sorted(ppr_lanes)
          assert {'4pt','6pt'} <= td_lanes, sorted(td_lanes)
          format_lanes=c.execute("""
            SELECT COUNT(*) FROM (
              SELECT q_teams,q_roster,q_ppr,q_td
              FROM research_matchup_adaptive
              GROUP BY 1,2,3,4
            )
          """).fetchone()[0]
          assert format_lanes >= 6, format_lanes
          dims=c.execute("select count(*) from research_matchup_adaptive where q_teams='12t' and q_roster='flx' and q_ppr='half' and q_td='4pt' and q_bracket in ('ALL','4po','6po','8po') and q_league_type in ('ALL','dynasty') and q_lineup_mode in ('ALL','best_ball')").fetchone()[0]
          assert dims > 0, dims
          # Output gate: the source-cache gate above does not prove the rollup
          # preserved CMC's full population.
          cmc_weekly = c.execute("""
            SELECT COUNT(*) FROM research_matchup_adaptive_weekly
            WHERE NFL_player_id='00-0033280' AND year=2025
          """).fetchone()[0]
          cmc_season = c.execute("""
            SELECT COUNT(*) FROM research_matchup_adaptive
            WHERE NFL_player_id='00-0033280' AND year=2025
          """).fetchone()[0]
          cmc_wk1 = c.execute("""
            SELECT n_leagues FROM research_matchup_adaptive_weekly
            WHERE NFL_player_id='00-0033280' AND year=2025 AND week=1
              AND q_teams='12t' AND q_roster='flx' AND q_ppr='half'
              AND q_td='4pt' AND q_bracket='6po'
              AND q_league_type='ALL' AND q_lineup_mode='ALL'
          """).fetchone()
          assert cmc_weekly >= 5000, {'cmc_weekly_rows': cmc_weekly}
          assert cmc_season >= 300, {'cmc_season_rows': cmc_season}
          assert cmc_wk1 and cmc_wk1[0] >= 300, {'cmc_week1_n_leagues': cmc_wk1}
          cmc_career = c.execute("""
            SELECT n_years, active_weeks, inactive_weeks,
                   expected_champs, expected_playoffs
            FROM research_matchup_adaptive_career
            WHERE NFL_player_id='00-0033280' AND q_teams='12t'
              AND q_roster='flx' AND q_ppr='half' AND q_td='4pt'
              AND q_bracket='6po' AND q_league_type='ALL'
              AND q_lineup_mode='ALL'
          """).fetchone()
          assert cmc_career and cmc_career[0] >= 9, {'cmc_career': cmc_career}
          assert cmc_career[1] >= 100, {'cmc_career': cmc_career}
          assert cmc_career[3] is not None and cmc_career[4] is not None, {'cmc_career': cmc_career}
          print({'ppr_lanes':sorted(ppr_lanes),'td_lanes':sorted(td_lanes),'format_lanes':format_lanes,'request_lane_rows':dims,'cmc_weekly_rows':cmc_weekly,'cmc_season_rows':cmc_season,'cmc_week1_n_leagues':cmc_wk1[0],'cmc_career':cmc_career})
          PY
      - name: Publish adaptive tables to Fly
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          python code/scripts/research_cohorts/publish_research_matchup_to_fly.py \
            --bundle out/research_matchup_adaptive.duckdb --adaptive-only \
            --slug 12t_flx_half_4pt --apply --i-understand-this-writes-prod
      - uses: actions/upload-artifact@v4
        with:
          name: research-matchup-direct-cache-${{ github.run_id }}
          path: out/research_matchup_adaptive.duckdb
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
