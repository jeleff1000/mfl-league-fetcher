name: Refresh Live NFL Ops
run-name: >-
  Refresh Live NFL Ops — ${{ (github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && 'scheduled' || inputs.game_date || 'manual' }} ${{ github.event.client_payload.dispatch_key || '' }} ${{ github.event.client_payload.refresh_attempt && format('attempt-{0}', github.event.client_payload.refresh_attempt) || '' }}

# Track 1 only: this workflow builds a complete local ___ops_nfl replacement
# from finalized NFLverse data. It never imports, reads, writes, or rebuilds
# any league table. Promotion is opt-in after the local eight-table artifact
# passes its receipt and schema gates.
on:
  # The isolated Fly clock dispatches at 03:00 America/New_York. GitHub's
  # best-effort schedule is intentionally absent: it was delivering hours late.
  repository_dispatch:
    types:
      - live-nfl-ops-refresh
  workflow_dispatch:
    inputs:
      year:
        description: NFL season to refresh
        required: true
        default: "2026"
        type: string
      week:
        description: NFL week to refresh
        required: true
        default: "1"
        type: string
      season_type:
        description: REG or POST scope for a manual refresh
        required: true
        default: REG
        type: choice
        options:
          - REG
          - POST
      game_date:
        description: Optional YYYY-MM-DD constraint for a manual refresh
        required: false
        default: ""
        type: string
      apply:
        description: Atomically replace ___ops_nfl after local validation
        required: true
        default: false
        type: boolean
      revisions_only:
        description: Materialize compact league-update revisions from already-published canonical Ops rows only
        required: false
        default: false
        type: boolean
      verify_only:
        description: Read-only Fly verification against a saved candidate and original run scope
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Original refresh run whose scope artifact should be verified
        required: false
        default: ""
        type: string
      expected_candidate_sha256:
        description: Required candidate digest for verify-only; prevents using a newer mutable baseline
        required: false
        default: ""
        type: string
      baseline_release_tag:
        description: Durable release holding the complete pre-refresh ___ops_nfl baseline
        required: true
        default: ops-nfl-live-current
        type: string

permissions:
  actions: read
  # The durable baseline lives in this worker repository, so the scoped
  # workflow token can replace only these release assets.
  contents: write

concurrency:
  group: live-nfl-ops-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.revisions_only && !inputs.verify_only) }}
    # The clock owns retries and the terminal alert. Missing completion
    # receipts still count as failed attempts even when GitHub reports success.
    continue-on-error: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.refresh_attempt != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 225
    env:
      OPS_REPOSITORY: ${{ github.repository }}
      BASELINE_RELEASE_TAG: ${{ inputs.baseline_release_tag || 'ops-nfl-live-current' }}
      GH_TOKEN: ${{ github.token }}
      BASELINE_PATH: ${{ github.workspace }}/baseline/ops_nfl.duckdb
      OUTPUT_PATH: ${{ github.workspace }}/output/ops_nfl.duckdb
      CHECKPOINT_STATE: ${{ github.workspace }}/nfl-checkpoint.json
      CLOCK_DISPATCH_KEY: ${{ github.event.client_payload.dispatch_key || '' }}
      CLOCK_REFRESH_ATTEMPT: ${{ github.event.client_payload.refresh_attempt || '' }}
      DISPATCH_GAME_DATE: ${{ github.event.client_payload.game_date || '' }}

    steps:
      - name: Record clock and runner timestamps
        env:
          CLOCK_SCHEDULED_FOR: ${{ github.event.client_payload.scheduled_for || '' }}
          CLOCK_DISPATCHED_AT: ${{ github.event.client_payload.dispatched_at || '' }}
          CLOCK_DISPATCH_KEY: ${{ github.event.client_payload.dispatch_key || '' }}
        run: |
          jq -n --arg scheduled_for "$CLOCK_SCHEDULED_FOR" \
            --arg dispatched_at "$CLOCK_DISPATCHED_AT" --arg dispatch_key "$CLOCK_DISPATCH_KEY" \
            --arg runner_started_at "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" \
            '{scheduled_for:$scheduled_for, dispatched_at:$dispatched_at,
              dispatch_key:$dispatch_key, runner_started_at:$runner_started_at}'

      - name: Checkout pipeline source
        uses: actions/checkout@v5
        with:
          path: code

      - name: Authorize dispatched refresh in the Eastern window
        id: boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLOCK_SCHEDULED_FOR: ${{ github.event.client_payload.scheduled_for || '' }}
          CLOCK_DISPATCH_KEY: ${{ github.event.client_payload.dispatch_key || '' }}
        run: |
          python code/scripts/live_nfl_ops_dispatch_gate.py \
            --event "$EVENT_NAME" \
              --scheduled-for "$CLOCK_SCHEDULED_FOR" \
              --dispatch-key "$CLOCK_DISPATCH_KEY" \
              --refresh-attempt "$CLOCK_REFRESH_ATTEMPT" \
              --game-date "$DISPATCH_GAME_DATE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        run: python -m pip install --disable-pip-version-check pandas duckdb pyarrow requests

      - name: Select durable baseline or same-date checkpoint
        id: checkpoint
        if: ${{ steps.boundary.outputs.should_run == 'true' && github.event_name == 'repository_dispatch' }}
        run: |
          python code/scripts/live_nfl_ops_checkpoint.py select --state "$CHECKPOINT_STATE" \
            --key "$CLOCK_DISPATCH_KEY" --scope code/refresh_scope.json

      - name: Resolve final live refresh scope
        id: scope
        if: ${{ steps.boundary.outputs.should_run == 'true' }}
        working-directory: code
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_YEAR: ${{ inputs.year || '2026' }}
          MANUAL_WEEK: ${{ inputs.week || '1' }}
          MANUAL_SEASON_TYPE: ${{ inputs.season_type || 'REG' }}
          MANUAL_GAME_DATE: ${{ inputs.game_date || '' }}
          DISPATCH_GAME_DATE: ${{ github.event.client_payload.game_date || '' }}
        run: |
          set -euo pipefail
          if [[ -f refresh_scope.json ]]; then
            test "$(jq -r '.game_date' refresh_scope.json)" = "$DISPATCH_GAME_DATE"
          elif [[ "$EVENT_NAME" == "repository_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            default_game_date=$(TZ=America/New_York date --date=yesterday +%F)
            game_date="${DISPATCH_GAME_DATE:-$default_game_date}"
            python scripts/discover_live_nfl_ops_refresh.py \
              --game-date "$game_date" \
              --output refresh_scope.json
          else
            jq -n \
              --argjson year "$MANUAL_YEAR" \
              --argjson week "$MANUAL_WEEK" \
              --arg season_type "$MANUAL_SEASON_TYPE" \
              --arg game_date "$MANUAL_GAME_DATE" \
              '{
                status: "ready",
                game_date: (if $game_date == "" then null else $game_date end),
                scope: {
                  year: $year,
                  week: $week,
                  season_type: $season_type,
                  game_date: (if $game_date == "" then null else $game_date end)
                }
              }' > refresh_scope.json
          fi

          status=$(jq -r '.status' refresh_scope.json)
          if [[ "$status" == "ready" ]]; then
            test "$(jq -r '.scope | type' refresh_scope.json)" == "object"
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
            echo "refresh_year=$(jq -r '.scope.year' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_week=$(jq -r '.scope.week' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_season_type=$(jq -r '.scope.season_type' refresh_scope.json)" >> "$GITHUB_OUTPUT"
            echo "refresh_game_date=$(jq -r '.scope.game_date // empty' refresh_scope.json)" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "no-op" ]]; then
            test "$(jq -r '.scope' refresh_scope.json)" == "null"
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
            echo "refresh_year=" >> "$GITHUB_OUTPUT"
            echo "refresh_week=" >> "$GITHUB_OUTPUT"
            echo "refresh_season_type=" >> "$GITHUB_OUTPUT"
            echo "refresh_game_date=" >> "$GITHUB_OUTPUT"
          else
            echo "unexpected refresh scope status: $status" >&2
            exit 1
          fi

      - name: Upload refresh scope receipt
        if: ${{ always() && steps.boundary.outputs.should_run == 'true' }}
        continue-on-error: ${{ github.event.client_payload.refresh_attempt != null }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-scope-${{ github.run_id }}
          overwrite: true
          path: code/refresh_scope.json
          if-no-files-found: warn
          retention-days: 30

      - name: Reconstruct and verify the durable baseline
        if: ${{ steps.scope.outputs.should_refresh == 'true' && steps.checkpoint.outputs.mode != 'resume' && steps.checkpoint.outputs.mode != 'verify' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$CHECKPOINT_STATE" ]]; then
            python code/scripts/live_nfl_ops_checkpoint.py select --state "$CHECKPOINT_STATE"
          fi
          python code/scripts/live_nfl_ops_checkpoint.py restore --state "$CHECKPOINT_STATE" --database "$BASELINE_PATH"

      - name: Restore the exact saved candidate for this date
        if: ${{ steps.checkpoint.outputs.mode == 'resume' && steps.scope.outputs.should_refresh == 'true' }}
        run: |
          python code/scripts/live_nfl_ops_checkpoint.py restore --state "$CHECKPOINT_STATE" --database "$OUTPUT_PATH"

      - name: Build and verify the local eight-table candidate
        if: ${{ steps.scope.outputs.should_refresh == 'true' && steps.checkpoint.outputs.mode != 'resume' && steps.checkpoint.outputs.mode != 'verify' }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          refresh_args=(
            --base "$BASELINE_PATH"
            --output "$OUTPUT_PATH"
            --year "${{ steps.scope.outputs.refresh_year }}"
            --week "${{ steps.scope.outputs.refresh_week }}"
            --season-type "${{ steps.scope.outputs.refresh_season_type }}"
          )
          if [[ -n "${{ steps.scope.outputs.refresh_game_date }}" ]]; then
            refresh_args+=(--game-date "${{ steps.scope.outputs.refresh_game_date }}")
          fi
          python scripts/refresh_live_nfl_ops.py "${refresh_args[@]}"

      - name: Publish the verified candidate as the next durable baseline
        if: ${{ steps.scope.outputs.should_refresh == 'true' && steps.checkpoint.outputs.mode != 'resume' && steps.checkpoint.outputs.mode != 'verify' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.apply) }}
        shell: bash
        run: |
          set -euo pipefail
          python code/scripts/live_nfl_ops_checkpoint.py publish --database "$OUTPUT_PATH" \
            --scope code/refresh_scope.json --key "$CLOCK_DISPATCH_KEY"

      - name: Atomically promote the verified ops artifact
        if: ${{ steps.scope.outputs.should_refresh == 'true' && steps.checkpoint.outputs.mode != 'verify' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.apply) }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code:${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
          FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.refresh_live_nfl_ops import promote_complete_artifact

          output = Path(os.environ["OUTPUT_PATH"])
          baseline = Path(os.environ["BASELINE_PATH"])
          receipt = json.loads(output.with_suffix(".manifest.json").read_text(encoding="utf-8"))
          promote_complete_artifact(
              output,
              baseline if baseline.exists() else output,
              receipt["table_counts"],
              receipt["schema_columns"],
          )
          PY

      - name: Materialize compact league-update NFL revisions
        if: ${{ steps.scope.outputs.should_refresh == 'true' && steps.checkpoint.outputs.mode != 'verify' && steps.scope.outputs.refresh_season_type == 'REG' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.apply) }}
        working-directory: code
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
          DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
          FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
        run: |
          python scripts/materialize_league_update_nfl_revisions.py \
            --year "${{ steps.scope.outputs.refresh_year }}" \
            --week "${{ steps.scope.outputs.refresh_week }}"

      - name: Verify promoted Fly receipt
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.apply) }}
        env:
          CHECKPOINT_MODE: ${{ steps.checkpoint.outputs.mode }}
          PYTHONPATH: ${{ github.workspace }}/code:${{ github.workspace }}/code/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          set -euo pipefail
          candidate=(--candidate "$OUTPUT_PATH")
          if [[ "$CHECKPOINT_MODE" == "verify" ]]; then
            candidate=(--checkpoint "$CHECKPOINT_STATE")
          fi
          python code/scripts/verify_live_nfl_ops_receipt.py \
            --scope code/refresh_scope.json \
            "${candidate[@]}" \
            --output output/ops_nfl.fly-receipt.json

      - name: Upload the local validation receipt
        if: ${{ always() && steps.scope.outputs.should_refresh == 'true' }}
        continue-on-error: ${{ github.event.client_payload.refresh_attempt != null }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-receipt-${{ steps.scope.outputs.refresh_year }}-w${{ steps.scope.outputs.refresh_week }}-${{ github.run_id }}
          overwrite: true
          path: |
            output/ops_nfl.manifest.json
            output/ops_nfl.fly-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload clock completion receipt
        if: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.refresh_attempt && steps.scope.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-complete-${{ github.event.client_payload.game_date }}-${{ github.run_attempt }}
          path: ${{ steps.scope.outputs.should_refresh == 'true' && 'output/ops_nfl.fly-receipt.json' || 'code/refresh_scope.json' }}
          if-no-files-found: error
          retention-days: 30

      - name: Retain the latest two durable candidates
        if: ${{ steps.scope.outputs.should_refresh == 'true' && (github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || inputs.apply) }}
        continue-on-error: true
        run: python code/scripts/live_nfl_ops_checkpoint.py prune

  materialize-revisions-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.revisions_only && !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}/fantasy_football_data_scripts
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}
    steps:
      - name: Checkout public canonical source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install compact revision dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Enforce explicit canonical REG apply scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.apply }}" != "true" ]]; then
            echo "revisions_only requires apply=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.season_type }}" != "REG" ]]; then
            echo "compact league-update revisions currently support REG only" >&2
            exit 1
          fi

      - name: Materialize already-published week revisions
        run: |
          python scripts/materialize_league_update_nfl_revisions.py \
            --year "${{ inputs.year }}" \
            --week "${{ inputs.week }}"


  verify-saved-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      OPS_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      BASELINE_RELEASE_TAG: ${{ inputs.baseline_release_tag }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
      APPLY: ${{ inputs.apply }}
      REVISIONS_ONLY: ${{ inputs.revisions_only }}
    steps:
      - name: Reject mutation flags and require pinned recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$APPLY" != "true"
          test "$REVISIONS_ONLY" != "true"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$BASELINE_RELEASE_TAG"

      - name: Checkout receipt verifier
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install read-only verifier dependencies
        run: python -m pip install --disable-pip-version-check duckdb requests

      - name: Restore original scope and checksum-pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/scope
          gh run download "$SOURCE_RUN_ID" --repo "$OPS_REPOSITORY" \
            --name "live-nfl-ops-scope-$SOURCE_RUN_ID" --dir recovery/scope
          python scripts/live_nfl_ops_checkpoint.py restore --sha256 "$EXPECTED_CANDIDATE_SHA256" \
            --database recovery/ops_nfl.duckdb

      - name: Verify saved candidate through Fly read path
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/fantasy_football_data_scripts
          DATABASE_BACKEND: fly
          DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
          DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
        run: |
          python scripts/verify_live_nfl_ops_receipt.py \
            --scope recovery/scope/refresh_scope.json \
            --candidate recovery/ops_nfl.duckdb \
            --output recovery/ops_nfl.fly-receipt.json

      - name: Upload read-only verification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nfl-ops-readback-${{ github.run_id }}
          path: |
            recovery/scope/refresh_scope.json
            recovery/ops_nfl.fly-receipt.json
          if-no-files-found: warn
          retention-days: 30
