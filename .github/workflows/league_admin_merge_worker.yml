name: League Admin Merge Worker

on:
  workflow_dispatch:
    inputs:
      merge_data_b64:
        description: 'Base64-encoded JSON with source_db, target_db, and merge_years'
        required: true
        type: string
      user_id:
        description: 'Unique identifier for this merge job'
        required: true
        type: string
      import_lock_key:
        description: 'Target db_name used by the shared league publication queue'
        required: true
        type: string
  repository_dispatch:
    types: [league_admin_merge]


permissions:
  contents: read

concurrency:
  group: league-update-${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
  cancel-in-progress: false
  queue: max

jobs:
  merge-league:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      FLY_PRIMARY_MACHINE_ID: ${{ secrets.FLY_PRIMARY_MACHINE_ID }}

    steps:
      - name: Require canonical public main for publication
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Validate target league lock
        env:
          MERGE_DATA_B64: ${{ github.event.inputs.merge_data_b64 || github.event.client_payload.merge_data_b64 }}
          IMPORT_LOCK_KEY: ${{ github.event.inputs.import_lock_key || github.event.client_payload.import_lock_key }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re
          key = os.environ.get('IMPORT_LOCK_KEY', '')
          if not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]*', key):
              raise SystemExit('Target league import_lock_key is required')
          payload = json.loads(base64.b64decode(os.environ['MERGE_DATA_B64']))
          if payload.get('target_db') != key:
              raise SystemExit('Target league lock does not match merge target_db')
          PY

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run league merge
        env:
          MERGE_DATA_B64: ${{ github.event.inputs.merge_data_b64 || github.event.client_payload.merge_data_b64 }}
        run: python scripts/merge_league_admin.py
