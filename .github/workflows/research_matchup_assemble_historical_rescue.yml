name: Assemble historical matchup rescue

on:
  workflow_dispatch:
    inputs:
      shard_run:
        description: Comma-separated completed old-season 10-bucket matchup runs
        required: true
      assembled_runs:
        description: Optional comma-separated runs containing complete weighted year assemblies
        required: false
        default: ''
      normalized_years:
        description: Comma-separated years to accept from normalized five-way artifacts
        required: false
        default: ''
      years:
        description: JSON list of rebuilt seasons
        required: true
        default: '[2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]'
      cache_key:
        description: Immutable public research cache key
        required: true
        default: research-public-lake-v3-Linux-20260730

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_ASSEMBLE_MEMORY_MB: '12000'
      RESEARCH_ASSEMBLE_THREADS: '2'
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Download all requested historical shards
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_RUNS: ${{ inputs.shard_run }}
          ASSEMBLED_RUNS: ${{ inputs.assembled_runs }}
          NORMALIZED_YEARS: ${{ inputs.normalized_years }}
          YEARS: ${{ inputs.years }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, re, urllib.parse, urllib.request, zipfile
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          years = set(json.loads(os.environ['YEARS']))
          token = os.environ['GH_TOKEN']
          shard_runs = [x.strip() for x in os.environ['SHARD_RUNS'].split(',') if x.strip()]
          assembled_runs = [x.strip() for x in os.environ['ASSEMBLED_RUNS'].split(',') if x.strip()]
          normalized_years = {int(x.strip()) for x in os.environ['NORMALIZED_YEARS'].split(',') if x.strip()}
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  h = dict(req.headers)
                  if urllib.parse.urlparse(newurl).netloc != urllib.parse.urlparse(req.full_url).netloc: h.pop('Authorization', None)
                  return urllib.request.Request(newurl, req.data, h, method=req.get_method())
          opener = urllib.request.build_opener(Redirect)
          artifacts = []
          def run_artifacts(run_id):
              found, page = [], 1
              api = f'https://api.github.com/repos/jeleff1000/mfl-league-fetcher/actions/runs/{run_id}/artifacts'
              while True:
                  req = urllib.request.Request(f'{api}?per_page=100&page={page}', headers=headers)
                  with opener.open(req, timeout=120) as resp: payload = json.load(resp)
                  batch = payload.get('artifacts', [])
                  found.extend(batch)
                  if len(batch) < 100: return found
                  page += 1
          for run_id in shard_runs:
              for item in run_artifacts(run_id):
                  m = re.fullmatch(r'research-matchup-(\d{4})-b\d+-of10-[0-9a-f]+', item['name'])
                  if m and int(m.group(1)) in years: artifacts.append(item)
          for run_id in assembled_runs:
              for item in run_artifacts(run_id):
                  name = item['name']
                  # Older rescue outputs used normalized five-way names. They
                  # are raw shard parents and must go through the denominator
                  # assembler, not the final-format merge below.
                  normalized = re.fullmatch(r'research-matchup-(\d{4})-normalized-5way-[0-9a-f]+', name)
                  if normalized and int(normalized.group(1)) in years and (
                      not normalized_years or int(normalized.group(1)) in normalized_years):
                      artifacts.append(item)
                      continue
                  # Some completed multi-year assemblies predate the
                  # assembled-YYYY naming convention. Their contents are
                  # final-format parquet and belong in assembled_sources.
                  legacy_final = re.fullmatch(
                      r'research-matchup-(?:2011-2013|2014-2015|2016-2017)-[0-9a-f]+', name)
                  if re.fullmatch(r'research-matchup-assembled-\d{4}-run-\d+', name) or legacy_final:
                      artifacts.append(item)
          if not artifacts: raise SystemExit('no shard or assembled artifacts found')
          out = Path('shards'); out.mkdir(parents=True, exist_ok=True)
          assembled_out = Path('assembled_sources'); assembled_out.mkdir(parents=True, exist_ok=True)
          def download(item):
              name = item['name']
              legacy_final = re.fullmatch(
                  r'research-matchup-(?:2011-2013|2014-2015|2016-2017)-[0-9a-f]+', name)
              root = assembled_out if (name.startswith('research-matchup-assembled-') or legacy_final) else out
              target = root / item['name']; target.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(item['archive_download_url'], headers=headers)
              with opener.open(req, timeout=300) as resp: data = resp.read()
              with zipfile.ZipFile(io.BytesIO(data)) as zf: zf.extractall(target)
              return item['name']
          with ThreadPoolExecutor(max_workers=8) as pool:
              for i, future in enumerate(as_completed([pool.submit(download, a) for a in artifacts]), 1): print(f'downloaded {i}/{len(artifacts)}: {future.result()}', flush=True)
          PY
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Build population denominator lattices
        run: |
          mkdir -p out/denominators
          python code/scripts/research_cohorts/build_population_denominators.py --output out/denominators --ops-cache research_public_lake/ops_cache.duckdb
      - name: Assemble historical replacement
        run: |
          roots=()
          while IFS= read -r root; do roots+=(--input "$root"); done < <(find shards -mindepth 1 -maxdepth 2 -type d -name 'research-matchup-*')
          python code/scripts/research_cohorts/assemble_research_shards.py --table matchup "${roots[@]}" --allow-unmanifested --denom-season out/denominators/research_matchup_denom_season.parquet --denom-week out/denominators/research_matchup_denom_week.parquet --pos-grp out/denominators/research_matchup_pos_grp.parquet --output out/assembled
          mkdir -p out/replacement
          python - <<'PY'
          from pathlib import Path
          import duckdb
          con = duckdb.connect()
          old = Path('out/assembled')
          final_sources = sorted(Path('assembled_sources').rglob('research_matchup_player_season.parquet'))
          final_weekly = sorted(Path('assembled_sources').rglob('research_matchup_weekly.parquet'))
          if not final_sources or not final_weekly:
              raise SystemExit('assembled final-format sources are missing')
          for name, extra in [('research_matchup_player_season.parquet', final_sources), ('research_matchup_weekly.parquet', final_weekly)]:
              paths = [old / name, *extra]
              quoted = ','.join("'" + str(p.resolve()).replace("'", "''") + "'" for p in paths)
              target = (Path('out/replacement') / name).resolve()
              target_sql = str(target).replace("'", "''")
              con.execute(f"COPY (SELECT * FROM read_parquet([{quoted}], union_by_name=true)) TO '{target_sql}' (FORMAT PARQUET, COMPRESSION ZSTD)")
              print(name, con.execute(f"SELECT COUNT(*) FROM read_parquet('{target_sql}')").fetchone()[0])
          con.close()
          PY
      - name: Verify replacement years and expected-record identity
        env:
          YEARS: ${{ inputs.years }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import duckdb
          years = sorted(json.loads(os.environ['YEARS'])); con = duckdb.connect()
          for name in ('research_matchup_player_season.parquet','research_matchup_weekly.parquet'):
              path = Path('out/replacement') / name
              got = [r[0] for r in con.execute('SELECT DISTINCT CAST(year AS INTEGER) FROM read_parquet(?) ORDER BY 1', [str(path)]).fetchall()]
              if got != years: raise SystemExit(f'{name}: years {got} != {years}')
              bad = con.execute('SELECT COUNT(*) FROM read_parquet(?) WHERE expected_wins IS NOT NULL AND expected_losses IS NOT NULL AND expected_starts IS NOT NULL AND ABS(expected_wins + expected_losses - expected_starts) > 0.0002', [str(path)]).fetchone()[0]
              if bad: raise SystemExit(f'{name}: {bad} expected-record failures')
              print(f'PASS {name}: {got}, identity failures={bad}')
          PY
      - name: Upload historical replacement artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-assembled-historical-run-${{ github.run_id }}
          path: out/replacement/*.parquet
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
