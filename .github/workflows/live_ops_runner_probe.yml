name: Live Ops Runner Timing Probe
run-name: Live Ops clock probe ${{ github.event.client_payload.dispatch_key || inputs.dispatch_key }}

on:
  repository_dispatch:
    types: [live-nfl-ops-clock-probe]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner labels as a JSON array
        default: '["ubuntu-latest"]'
        type: string
      dispatch_key:
        description: Probe correlation key
        required: true
        type: string
      scheduled_for:
        description: Intended clock trigger time
        required: true
        type: string

permissions: {}

jobs:
  timestamp:
    runs-on: ${{ fromJSON(github.event.client_payload.runner || inputs.runner || '["ubuntu-latest"]') }}
    timeout-minutes: 1
    steps:
      - name: Record actual runner execution
        env:
          DISPATCH_KEY: ${{ github.event.client_payload.dispatch_key || inputs.dispatch_key }}
          SCHEDULED_FOR: ${{ github.event.client_payload.scheduled_for || inputs.scheduled_for }}
          DISPATCHED_AT: ${{ github.event.client_payload.dispatched_at || '' }}
        run: |
          set -euo pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          started_epoch=$(date -d "$started" +%s.%N)
          due_epoch=$(date -d "$SCHEDULED_FOR" +%s.%N)
          latency=$(awk -v started="$started_epoch" -v due="$due_epoch" 'BEGIN {printf "%.3f", started-due}')
          jq -n --arg key "$DISPATCH_KEY" --arg due "$SCHEDULED_FOR" \
            --arg sent "$DISPATCHED_AT" --arg started "$started" \
            --arg runner "$RUNNER_NAME" --argjson latency "$latency" \
            '{dispatch_key:$key, scheduled_for:$due, dispatched_at:$sent,
              runner_started_at:$started, runner_name:$runner,
              start_latency_seconds:$latency, database_access:false}' \
            | tee clock-probe-receipt.json
          awk -v latency="$latency" 'BEGIN {exit !(latency >= 0 && latency <= 60)}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-probe-receipt
          path: clock-probe-receipt.json
          retention-days: 7
