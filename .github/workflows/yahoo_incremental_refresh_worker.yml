name: Yahoo Active-Season Refresh Worker

on:
  workflow_dispatch:
    inputs:
      db_name:
        description: 'Existing Yahoo league db_name to refresh'
        required: true
        type: string
      year:
        description: 'Optional active NFL season override, e.g. 2026'
        required: false
        type: string
      through_week:
        description: 'Optional finalized-week ceiling, e.g. 1'
        required: false
        type: string
      execute:
        description: 'Publish the scoped active-season refresh to Fly (false is read-only)'
        required: true
        type: boolean
        default: false
      cache_only:
        description: 'Finish a previously committed cache publication without refetching'
        required: false
        type: boolean
        default: false
      dispatch_token:
        description: 'Opaque UI claim token; blank for manual/QA runs'
        required: false
        type: string
      attempt_id:
        description: 'Attempt identity paired with the UI claim token'
        required: false
        type: string
      claim_version:
        description: 'Compare-and-swap version for the claimed attempt'
        required: false
        default: '1'
        type: string
      observed_manifest_digest:
        description: 'Exact provider/NFL source manifest claimed by the UI'
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: league-update-${{ inputs.db_name }}
  cancel-in-progress: false
  queue: max

jobs:
  yahoo-active-season-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      data_committed: ${{ steps.publication.outputs.committed == 'true' || steps.cache_recovery.outcome == 'success' }}
      cache_verified: ${{ steps.cache_publish.outcome == 'success' || steps.cache_recovery.outcome == 'success' }}
      diagnostics_uploaded: ${{ steps.diagnostic_artifact.outcome == 'success' }}

    env:
      PYTHONUNBUFFERED: 1
      DATABASE_BACKEND: fly
      LEAGUE_UPDATE_REQUIRE_CLAIM: ${{ inputs.execute && '1' || '0' }}
      INPUT_DB_NAME: ${{ inputs.db_name }}
      INPUT_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
      INPUT_ATTEMPT_ID: ${{ inputs.attempt_id }}
      INPUT_CLAIM_VERSION: ${{ inputs.claim_version }}
      DATABASE_SERVER_URL: ${{ secrets.DATABASE_SERVER_URL }}
      DATABASE_READ_TOKEN: ${{ secrets.DATABASE_READ_TOKEN }}
      DATABASE_ADMIN_TOKEN: ${{ secrets.DATABASE_ADMIN_TOKEN }}
      YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
      YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}

    steps:
      - name: Require canonical public main for publication
        if: inputs.execute
        env:
          INPUT_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "${INPUT_WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "::error::League publication must run from the canonical public main branch."
            exit 1
          fi

      - name: Checkout Yahoo application code
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /fantasy_football_data_scripts/
            /scripts/
            /requirements.txt
            /pyproject.toml

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Fly claim dependency
        if: inputs.execute && !inputs.cache_only
        run: python -m pip install --disable-pip-version-check --quiet requests

      - name: Claim paid manual update
        id: manual_claim
        if: inputs.execute && !inputs.cache_only && inputs.dispatch_token == ''
        run: >-
          python scripts/claim_manual_league_update.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"

      - name: Claim paid UI update
        if: inputs.execute && !inputs.cache_only && inputs.dispatch_token != ''
        run: >-
          python scripts/record_league_update_status.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --status running
          --dispatch-token "${INPUT_DISPATCH_TOKEN}"
          --attempt-id "${INPUT_ATTEMPT_ID}"
          --claim-version "${INPUT_CLAIM_VERSION}"
          --require-entitled

      - name: Start paid manual update
        if: inputs.execute && !inputs.cache_only && steps.manual_claim.outcome == 'success'
        env:
          UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token }}
          UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id }}
          UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version }}
        run: >-
          python scripts/record_league_update_status.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --status running
          --dispatch-token "${UPDATE_TOKEN}"
          --attempt-id "${UPDATE_ATTEMPT_ID}"
          --claim-version "${UPDATE_CLAIM_VERSION}"
          --require-entitled

      - name: Restore canonical research ops cache
        if: ${{ !inputs.cache_only }}
        uses: ./.github/actions/restore-research-ops-cache
        with:
          cache-key: research-public-lake-v5-Linux-2000-plus-player-bio
          release-tag: ops-cache-v6-2000-plus-player-bio

      - name: Verify ops cache
        if: ${{ !inputs.cache_only }}
        run: test -s "${OPS_CACHE_PATH}"

      - name: Cache Python virtualenv
        uses: actions/cache@v5
        id: cache-venv
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: Create virtualenv
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: python -m venv .venv

      - name: Install dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Activate virtualenv
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Validate cache-only recovery request
        if: inputs.cache_only
        env:
          EXECUTE: ${{ inputs.execute }}
        run: |
          test "${EXECUTE}" = "true"

      - name: Recover committed cache publication
        id: cache_recovery
        if: inputs.cache_only && inputs.execute
        run: |
          set -euo pipefail
          args=(--db "${INPUT_DB_NAME}" --platform yahoo)
          if [ -n "${INPUT_DISPATCH_TOKEN}" ]; then
            args+=(--dispatch-token "${INPUT_DISPATCH_TOKEN}"
                   --attempt-id "${INPUT_ATTEMPT_ID}"
                   --claim-version "${INPUT_CLAIM_VERSION}")
          fi
          python scripts/recover_league_update_cache.py "${args[@]}"

      - name: Refresh Yahoo active season
        if: ${{ !inputs.cache_only }}
        env:
          DB_NAME: ${{ inputs.db_name }}
          LEAGUE_UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token || inputs.dispatch_token }}
          LEAGUE_UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id || inputs.attempt_id }}
          LEAGUE_UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version || inputs.claim_version }}
          YEAR: ${{ inputs.year }}
          THROUGH_WEEK: ${{ inputs.through_week }}
          EXECUTE: ${{ inputs.execute }}
          OBSERVED_MANIFEST_DIGEST: ${{ inputs.observed_manifest_digest }}
        run: |
          set -euo pipefail
          args=(--db "${DB_NAME}" --json-out yahoo_active_season_refresh.json)
          if [ -n "${YEAR}" ]; then
            args+=(--year "${YEAR}")
          fi

          if [ -n "${THROUGH_WEEK}" ]; then
            args+=(--through-week "${THROUGH_WEEK}")
          fi
          if [ "${EXECUTE}" = "true" ]; then
            args+=(--execute)
          fi
          if [ -n "${OBSERVED_MANIFEST_DIGEST}" ]; then
            args+=(--observed-manifest-digest "${OBSERVED_MANIFEST_DIGEST}")
          fi
          python scripts/refresh_yahoo_active_season.py "${args[@]}"

      - name: Classify Fly publication
        id: publication
        if: ${{ !inputs.cache_only && inputs.execute }}
        env:
          UI_DISPATCH_TOKEN: ${{ inputs.dispatch_token }}
        run: |
          set -euo pipefail
          args=(--receipt yahoo_active_season_refresh.json)
          if [ -n "${UI_DISPATCH_TOKEN}" ]; then
            args+=(--require-publication)
          fi
          python scripts/league_update_workflow_receipt.py "${args[@]}"

      - name: Settle unchanged paid manual update
        if: inputs.execute && !inputs.cache_only && steps.manual_claim.outputs.token != '' && steps.publication.outputs.no_op == 'true'
        env:
          UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token }}
          UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id }}
          UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version }}
        run: >-
          python scripts/record_league_update_status.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --status no_change
          --dispatch-token "${UPDATE_TOKEN}"
          --attempt-id "${UPDATE_ATTEMPT_ID}"
          --claim-version "${UPDATE_CLAIM_VERSION}"
          --require-entitled

      - name: Record Fly commit
        if: inputs.execute && (steps.manual_claim.outputs.token != '' || inputs.dispatch_token != '') && steps.publication.outputs.committed == 'true'
        env:
          UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token || inputs.dispatch_token }}
          UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id || inputs.attempt_id }}
          UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version || inputs.claim_version }}
        run: >-
          python scripts/record_league_update_status.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --status committed
          --dispatch-token "${UPDATE_TOKEN}"
          --attempt-id "${UPDATE_ATTEMPT_ID}"
          --claim-version "${UPDATE_CLAIM_VERSION}"
          --receipt yahoo_active_season_refresh.json

      - name: Publish refreshed cache
        id: cache_publish
        if: inputs.execute && steps.publication.outputs.committed == 'true'
        run: >-
          python scripts/warm_vercel_cache.py
          --db "${INPUT_DB_NAME}"
          --secret "${REVALIDATION_SECRET}"
          --site-url "https://www.leaguehistory.app"
          --mode quick
          --strategy expire
          --jitter-seconds 0
          --strict
          --verify-hot
          --required-only
          --timeout 5
          --warm-attempts 1
          --hot-verify-attempts 1

      - name: Complete league update
        if: inputs.execute && (steps.manual_claim.outputs.token != '' || inputs.dispatch_token != '') && steps.publication.outputs.committed == 'true'
        env:
          UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token || inputs.dispatch_token }}
          UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id || inputs.attempt_id }}
          UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version || inputs.claim_version }}
        run: >-
          python scripts/record_league_update_status.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --status succeeded
          --dispatch-token "${UPDATE_TOKEN}"
          --attempt-id "${UPDATE_ATTEMPT_ID}"
          --claim-version "${UPDATE_CLAIM_VERSION}"
          --receipt yahoo_active_season_refresh.json
          --cache-verified

      - name: Settle failed partial manual claim
        if: ${{ failure() && inputs.execute && !inputs.cache_only && inputs.dispatch_token == '' && steps.manual_claim.outcome == 'failure' }}
        continue-on-error: true
        run: >-
          python scripts/claim_manual_league_update.py
          --db "${INPUT_DB_NAME}"
          --platform yahoo
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --fail-owned-claim

      - name: Fail league update
        if: ${{ (failure() || cancelled()) && !inputs.cache_only && (steps.manual_claim.outputs.token != '' || inputs.dispatch_token != '') }}
        env:
          UPDATE_TOKEN: ${{ steps.manual_claim.outputs.token || inputs.dispatch_token }}
          UPDATE_ATTEMPT_ID: ${{ steps.manual_claim.outputs.attempt_id || inputs.attempt_id }}
          UPDATE_CLAIM_VERSION: ${{ steps.manual_claim.outputs.claim_version || inputs.claim_version }}
          WORKFLOW_WAS_CANCELLED: ${{ job.status == 'cancelled' && '1' || '0' }}
        run: |
          set -euo pipefail
          classifier_args=(--receipt yahoo_active_season_refresh.json --failure-status)
          if [ "${WORKFLOW_WAS_CANCELLED}" = "1" ]; then classifier_args+=(--cancelled); fi
          recovery_status=$(python scripts/league_update_workflow_receipt.py "${classifier_args[@]}")
          args=(
            --db "${INPUT_DB_NAME}"
            --platform yahoo
            --status "${recovery_status}"
            --dispatch-token "${UPDATE_TOKEN}"
            --attempt-id "${UPDATE_ATTEMPT_ID}"
            --claim-version "${UPDATE_CLAIM_VERSION}"
          )
          if [ "${recovery_status}" = "committed_cache_pending" ]; then
            args+=(--receipt yahoo_active_season_refresh.json --error "Data published; cache finalization requires retry")
          else
            args+=(--error "Yahoo active-season refresh did not publish")
          fi
          python scripts/record_league_update_status.py "${args[@]}"

      - name: Upload refresh receipt
        id: diagnostic_artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: yahoo-active-season-refresh-${{ github.run_id }}
          path: yahoo_active_season_refresh.json
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: always()
        continue-on-error: true
        run: |
          echo "# Yahoo Active-Season Refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f yahoo_active_season_refresh.json ]; then
            python - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("yahoo_active_season_refresh.json", encoding="utf-8") as handle:
              receipt = json.load(handle)

          print(f"- **League:** `{receipt.get('db_name', 'unknown')}`")
          print(f"- **Year:** `{receipt.get('year', 'unknown')}`")
          print(f"- **Weeks:** `{receipt.get('refresh_weeks', [])}`")
          print(f"- **Status:** `{receipt.get('status', 'missing receipt')}`")
          print(f"- **Execute:** `{receipt.get('executed', False)}`")
          print("")
          print("## Provider rows")
          for name, count in sorted((receipt.get("fetch_rows") or {}).items()):
              print(f"- `{name}`: {count}")
          if receipt.get("published_tables"):
              print("")
              print("## Published tables")
              for table_name in receipt["published_tables"]:
                  print(f"- `{table_name}`")
          PYEOF
          else
            echo "No receipt was written; inspect the failed worker step." >> "$GITHUB_STEP_SUMMARY"
          fi
