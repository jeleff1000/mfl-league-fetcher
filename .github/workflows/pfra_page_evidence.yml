name: PFRA bounded page evidence

on:
  workflow_dispatch:
    inputs:
      manifest_sha256:
        description: Canonical SHA-256 of the frozen ledger-bound manifest
        required: true
        type: string
      public_evidence_approved:
        description: Explicit approval to publish this batch's manifest and OCR evidence as public-repo artifacts
        required: true
        type: boolean
        default: false
      staging_only:
        description: Create or verify the temporary public source prerelease without running evidence workers
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pfra-evidence-${{ inputs.manifest_sha256 }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PFRA_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

jobs:
  stage:
    if: ${{ inputs.staging_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create or verify temporary public staging release using only GITHUB_TOKEN
        id: release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PFRA_PUBLIC_EVIDENCE_APPROVED: ${{ inputs.public_evidence_approved }}
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = "jeleff1000/mfl-league-fetcher"
          digest = os.environ.get("PFRA_MANIFEST_SHA256", "")
          commit = os.environ.get("GITHUB_SHA", "")
          token = os.environ.get("GH_TOKEN", "")
          if (os.environ.get("PFRA_PUBLIC_EVIDENCE_APPROVED") != "true"
                  or os.environ.get("GITHUB_REPOSITORY") != repo
                  or os.environ.get("GITHUB_REF") != "refs/heads/main"
                  or not re.fullmatch(r"[0-9a-f]{64}", digest)
                  or not re.fullmatch(r"[0-9a-f]{40}", commit) or not token):
              raise SystemExit("Explicit approval, reviewed main, and valid staging identity are required.")

          def api(path, body=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28"},
                  method="GET" if body is None else "POST")
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if body is None and error.code == 404:
                      return None
                  raise SystemExit("Staging API request failed.") from None
              except (urllib.error.URLError, OSError, ValueError):
                  raise SystemExit("Staging API request failed.") from None

          tag_name = "pfra-staging-" + digest[:24]
          description = "Temporary PFRA source staging for manifest " + digest + "."
          release = api("releases/tags/" + tag_name)
          tag = api("git/ref/tags/" + tag_name)
          if tag is not None and (tag.get("object", {}).get("type") != "commit"
                                  or tag.get("object", {}).get("sha") != commit):
              raise SystemExit("Existing staging tag does not match the execution commit.")
          if release is not None:
              if (tag is None or release.get("tag_name") != tag_name or release.get("name") != tag_name
                      or release.get("prerelease") is not True or release.get("draft") is not False
                      or release.get("body") != description):
                  raise SystemExit("Existing staging release does not match the frozen staging identity.")
          else:
              if tag is None:
                  api("git/refs", {"ref": "refs/tags/" + tag_name, "sha": commit})
              release = api("releases", {"tag_name": tag_name, "target_commitish": commit, "name": tag_name,
                                         "body": description, "draft": False, "prerelease": True,
                                         "make_latest": "false"})
          release_id = release.get("id")
          upload_url = release.get("upload_url")
          if (type(release_id) is not int or release_id <= 0
                  or upload_url != f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets{{?name,label}}"):
              raise SystemExit("Staging API returned an invalid release identity.")
          summary = json.dumps({"release_id": release_id, "upload_url": upload_url, "tag": tag_name})
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("Temporary public PFRA source staging (no workers started):\n\n```json\n" + summary + "\n```\n")

  prepare:
    if: ${{ !inputs.staging_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.manifest.outputs.shards }}
    steps:
      - name: Require delivery configuration and explicit evidence-publication approval
        id: authorization
        shell: python
        env:
          PFRA_PUBLIC_EVIDENCE_APPROVED: ${{ inputs.public_evidence_approved }}
          PFRA_SOURCE_BASE_URL: ${{ secrets.PFRA_SOURCE_BASE_URL }}
        run: |
          import os
          import re
          if os.environ.get("PFRA_PUBLIC_EVIDENCE_APPROVED") != "true":
              raise SystemExit("Explicit public evidence artifact approval is required.")
          if os.environ.get("GITHUB_REPOSITORY") != "jeleff1000/mfl-league-fetcher":
              raise SystemExit("PFRA execution repository mismatch.")
          if os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("PFRA execution requires reviewed main.")
          if not re.fullmatch(r"[0-9a-f]{64}", os.environ.get("PFRA_MANIFEST_SHA256", "")):
              raise SystemExit("Invalid frozen manifest hash.")
          if not os.environ.get("PFRA_SOURCE_BASE_URL"):
              raise SystemExit("PFRA source delivery configuration is required.")

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch and verify the exact manifest before allocating workers
        id: manifest
        shell: python
        env:
          PFRA_SOURCE_BASE_URL: ${{ secrets.PFRA_SOURCE_BASE_URL }}
          PFRA_SOURCE_READ_TOKEN: ${{ secrets.PFRA_SOURCE_READ_TOKEN }}
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "pfra-manifest.json"
          result = subprocess.run([
              sys.executable, "scripts/pfra_page_shard.py", "fetch-manifest",
              "--manifest-sha256", os.environ["PFRA_MANIFEST_SHA256"],
              "--execution-commit", os.environ["GITHUB_SHA"], "--output", str(output),
          ], capture_output=True, text=True)
          if result.returncode:
              raise SystemExit("Frozen PFRA manifest preflight failed; no workers started.")
          summary = json.loads(result.stdout)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write("shards=" + json.dumps(summary["shard_ids"], separators=(",", ":")) + "\n")
      - uses: actions/upload-artifact@v4
        with:
          name: pfra-${{ github.run_id }}-manifest
          path: ${{ runner.temp }}/pfra-manifest.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  shard:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard_id: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pfra-${{ github.run_id }}-manifest
          path: ${{ runner.temp }}/pfra-input
      - name: Install bounded page evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF==1.28.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Read each source once and collect only requested page regions
        env:
          PFRA_SOURCE_BASE_URL: ${{ secrets.PFRA_SOURCE_BASE_URL }}
          PFRA_SOURCE_READ_TOKEN: ${{ secrets.PFRA_SOURCE_READ_TOKEN }}
          PFRA_SHARD_ID: ${{ matrix.shard_id }}
        run: |
          python scripts/pfra_page_shard.py run-remote-shard \
            --manifest "$RUNNER_TEMP/pfra-input/pfra-manifest.json" \
            --manifest-sha256 "$PFRA_MANIFEST_SHA256" \
            --shard-id "$PFRA_SHARD_ID" \
            --source-workers 4 \
            --execution-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/pfra-shard-$PFRA_SHARD_ID.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pfra-${{ github.run_id }}-shard-${{ matrix.shard_id }}
          path: ${{ runner.temp }}/pfra-shard-${{ matrix.shard_id }}.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  validate:
    needs: [prepare, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pfra-${{ github.run_id }}-manifest
          path: ${{ runner.temp }}/pfra-input
      - uses: actions/download-artifact@v4
        with:
          pattern: pfra-${{ github.run_id }}-shard-*
          path: ${{ runner.temp }}/pfra-results
          merge-multiple: true
      - name: Verify exact evidence coverage; never write a classification ledger
        run: |
          python scripts/pfra_page_shard.py validate-results \
            --manifest "$RUNNER_TEMP/pfra-input/pfra-manifest.json" \
            --manifest-sha256 "$PFRA_MANIFEST_SHA256" \
            --results "$RUNNER_TEMP"/pfra-results/pfra-shard-*.json \
            --output "$RUNNER_TEMP/pfra-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: pfra-${{ github.run_id }}-coverage
          path: ${{ runner.temp }}/pfra-coverage.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true
