name: MFL Plan And Launch Unique Next Wave

on:
  workflow_dispatch:
    inputs:
      campaign_count:
        description: 'Number of independent campaigns to queue'
        required: false
        type: string
        default: '50'
      batches_per_campaign:
        description: 'Unique batches assigned to each campaign'
        required: false
        type: string
        default: '256'
      batch_size:
        description: 'League-years per runner'
        required: false
        type: string
        default: '2'
      max_parallel:
        description: 'Maximum concurrent runners in the new wave'
        required: false
        type: string
        default: '50'
      mfl_rate_limit:
        description: 'Per-runner MFL request rate limit'
        required: false
        type: string
        default: '6'
      target_years:
        description: 'Comma-separated seasons'
        required: false
        type: string
        default: '2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015,2016,2017,2018'
      collect_all:
        description: 'Process every row in the manifest instead of stopping at the per-year target'
        required: false
        type: string
        default: 'true'
      campaign_cutoff:
        description: 'Include campaigns created after this UTC timestamp as reservations'
        required: false
        type: string
        default: '2026-08-16T03:00:00Z'

permissions:
  actions: write
  contents: read

concurrency:
  group: mfl-bottom-up-dispatch
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout worker repository for GitHub CLI context
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /scripts/
          sparse-checkout-cone-mode: false
      - name: Checkout private population manifest
        uses: actions/checkout@v5
        with:
          path: code
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /corpus_seed/
            /scripts/extraplatform_corpus/build_mfl_pending_manifest.py
            /corpus_seed/mfl_missing_execution_manifest_20260826.json

      - name: Collect run inventory and canonical proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runs canonical prior_reservations
          gh run list --workflow mfl_register_batch_campaign.yml --limit 1000 \
            --json databaseId,status,conclusion,createdAt,updatedAt > runs/campaigns.json
          gh run list --workflow mfl_plan_next_wave.yml --limit 1000 \
            --json databaseId,status,conclusion,createdAt,updatedAt > runs/planners.json
          gh run list --workflow mfl_reduce_saved_chunk.yml --limit 1000 \
            --json databaseId,status,conclusion,createdAt,updatedAt > runs/reducers.json
          reducer=$(jq -r '[.[] | select(.conclusion == "success")][0].databaseId' runs/reducers.json)
          test -n "$reducer" && test "$reducer" != null
          gh run download "$reducer" --repo "${{ github.repository }}" \
            --name "mfl-reducer-proof-$reducer" --dir canonical
          test -s canonical/mfl_register_all_runs.json
          planner=$(jq -r '[.[] | select(.conclusion == "success")][0].databaseId' runs/planners.json)
          planner_created=$(jq -r --arg id "$planner" '.[] | select((.databaseId|tostring)==$id) | .createdAt' runs/planners.json)
          test -n "$planner" && test "$planner" != null
          test -n "$planner_created" && test "$planner_created" != null
          gh run download "$planner" --repo "${{ github.repository }}" \
            --name "mfl-reservations-$planner" --dir prior_reservations
          test -s prior_reservations/reserved_keys.json
          echo "PRIOR_PLANNER_CREATED_AT=$planner_created" >> "$GITHUB_ENV"

      - name: Build pending queue and reserve active assignments
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_YEARS: ${{ inputs.target_years }}
          COLLECT_ALL: ${{ inputs.collect_all }}
          CUTOFF: ${{ inputs.campaign_cutoff }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          CAMPAIGN_COUNT: ${{ inputs.campaign_count }}
          BATCHES_PER_CAMPAIGN: ${{ inputs.batches_per_campaign }}
        run: |
          python3 code/scripts/extraplatform_corpus/build_mfl_pending_manifest.py \
            --manifest code/corpus_seed/mfl_missing_execution_manifest_20260826.json \
            --index canonical/mfl_register_all_runs.json \
            --output pending_manifest.json \
            --target-per-year 10000 --target-years "$TARGET_YEARS" $([ "$COLLECT_ALL" = true ] && echo --collect-all) \
            --preserve-order
          python3 - <<'PY'
          import json, os, re, subprocess, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from datetime import datetime

          runs=json.loads(Path('runs/campaigns.json').read_text())
          reservation_anchor=datetime.fromisoformat(os.environ['PRIOR_PLANNER_CREATED_AT'].replace('Z','+00:00'))
          batch_size=int(os.environ['BATCH_SIZE'])
          pending=json.loads(Path('pending_manifest.json').read_text())['rows']
          prior=json.loads(Path('prior_reservations/reserved_keys.json').read_text())
          reserved={(int(row['season']),str(row['league_id']).zfill(5)) for row in prior.get('rows',[])}
          evidence=[]
          planned_runs=set()
          evidence.append({'source':'prior_reservation_artifact',
                           'reserved_count':len(reserved),
                           'reservation_anchor':os.environ['PRIOR_PLANNER_CREATED_AT']})

          def load_jobs(run_id):
              command=['gh','run','view',run_id,'--repo',os.environ['GITHUB_REPOSITORY'],'--json','jobs']
              last_error=''
              for attempt in range(1, 7):
                  print(f'jobs lookup {run_id} attempt {attempt}/6', flush=True)
                  try:
                      result=subprocess.run(command,capture_output=True,text=True,timeout=45)
                  except subprocess.TimeoutExpired:
                      last_error='gh run view timed out after 45 seconds'
                      print(f'jobs lookup timeout for {run_id} attempt {attempt}/6', flush=True)
                      if attempt < 6:
                          time.sleep(min(30, 2 ** attempt))
                      continue
                  if result.returncode == 0:
                      return json.loads(result.stdout).get('jobs',[])
                  last_error=(result.stderr or result.stdout).strip()
                  print(f'jobs lookup retry {attempt}/6 for {run_id}: {last_error}', flush=True)
                  if attempt < 6:
                      time.sleep(min(30, 2 ** attempt))
              raise SystemExit(f'cannot safely determine ingest width for campaign {run_id}: {last_error}')

          def download_named(run_id, artifact, out):
              command=['gh','run','download',run_id,'--repo',os.environ['GITHUB_REPOSITORY'],
                      '--name',artifact,'--dir',str(out)]
              try:
                  return subprocess.run(command,capture_output=True,text=True,timeout=120)
              except subprocess.TimeoutExpired as exc:
                  raise SystemExit(f'artifact download timed out for campaign {run_id} ({artifact})') from exc

          def artifact_names(run_id):
              names=set()
              # Query the authoritative pending receipt first.  Only make a
              # second lookup for the legacy accepted-key fallback; do not
              # scan every artifact for every campaign.
              for artifact in (f'mfl-pending-manifest-{run_id}',
                               f'mfl-accepted-keys-{run_id}'):
                  command=['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/artifacts?name={artifact}&per_page=10']
                  try:
                      result=subprocess.run(command,capture_output=True,text=True,timeout=30)
                  except subprocess.TimeoutExpired:
                      raise SystemExit(f'artifact inventory timed out for campaign {run_id} ({artifact})')
                  if result.returncode != 0:
                      raise SystemExit(f'artifact inventory failed for campaign {run_id} ({artifact}): {(result.stderr or result.stdout).strip()}')
                  try:
                      payload=json.loads(result.stdout)
                      page_items=payload.get('artifacts',[])
                  except (TypeError,json.JSONDecodeError):
                      raise SystemExit(f'artifact inventory was malformed for campaign {run_id} ({artifact})')
                  if not isinstance(page_items,list):
                      raise SystemExit(f'artifact inventory had invalid items for campaign {run_id} ({artifact})')
                  names.update(str(item['name']) for item in page_items if isinstance(item,dict) and 'name' in item)
                  if f'mfl-pending-manifest-{run_id}' in names:
                      break
              return names

          unusable_conclusions={'cancelled','failure','timed_out','startup_failure','action_required','skipped','stale','neutral'}
          # This is an attempt ledger. Every campaign publishes the exact
          # pending manifest it was assigned; once it starts, those rows are
          # attempted and must not return to the queue merely because a fetch
          # failed. Keep inventories for failed runs too.
          inventory_runs=[run for run in runs
                          if run.get('createdAt','') >= os.environ['PRIOR_PLANNER_CREATED_AT']]
          artifacts_by_run={}
          workers=min(16, max(1, len(inventory_runs)))
          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures={pool.submit(artifact_names, str(run['databaseId'])): str(run['databaseId'])
                       for run in inventory_runs}
              for index, future in enumerate(as_completed(futures), start=1):
                  run_id=futures[future]
                  artifacts_by_run[run_id]=future.result()
                  if index % 25 == 0 or index == len(futures):
                      print(f'artifact inventories completed {index}/{len(futures)}', flush=True)
          for run in runs:
              if run.get('createdAt','') < os.environ['PRIOR_PLANNER_CREATED_AT']:
                  continue
              conclusion=str(run.get('conclusion') or '').lower()
              run_id=str(run['databaseId'])
              available=artifacts_by_run.get(run_id,set())
              artifact=f'mfl-pending-manifest-{run_id}'
              # The pending manifest is the authoritative attempted-row
              # receipt for active, successful, and failed campaigns.
              if artifact not in available:
                  # Compatibility for legacy successful campaigns that predate
                  # pending-manifest receipts.
                  if conclusion == 'success':
                      accepted_name=f'mfl-accepted-keys-{run_id}'
                      if accepted_name in available:
                          accepted_out=Path('accepted_keys')/run_id
                          accepted_out.mkdir(parents=True,exist_ok=True)
                          accepted_result=download_named(run_id,accepted_name,accepted_out)
                          accepted_path=accepted_out/'accepted_keys.json'
                          if accepted_result.returncode == 0 and accepted_path.is_file():
                              accepted=json.loads(accepted_path.read_text())
                              accepted_rows=accepted.get('rows',[])
                              for row in accepted_rows:
                                  reserved.add((int(row['season']),str(row['league_id']).zfill(5)))
                              evidence.append({'run_id':run_id,'source':'legacy_accepted_keys',
                                               'reserved_count':len(accepted_rows)})
                              planned_runs.add(run_id)
                              continue
                  evidence.append({'run_id':run_id,'source':'attempt_receipt_missing',
                                   'reserved_count':0,'conclusion':conclusion})
                  continue
              out=Path('run_manifests')/run_id
              out.mkdir(parents=True,exist_ok=True)
              result=download_named(run_id,artifact,out)
              path=out/'pending_manifest.json'
              if result.returncode != 0 or not path.is_file():
                  continue
              payload=json.loads(path.read_text())
              rows=payload.get('rows',[])
              print(f'processing attempted campaign {run_id}: {len(rows)} planned rows; conclusion={conclusion or "active"}', flush=True)
              # Derive the exact attempted width from the ingest job count.
              jobs=load_jobs(run_id)
              ingest=sum(1 for job in jobs if str(job.get('name','')).startswith('ingest ('))
              if ingest <= 0:
                  continue
              take=min(len(rows), ingest*batch_size)
              for row in rows[:take]:
                  reserved.add((int(row['season']),str(row['league_id']).zfill(5)))
              evidence.append({'run_id':run_id,'source':'attempted_rows',
                               'ingest_jobs':ingest,'reserved_count':take,
                               'conclusion':conclusion or 'active',
                               'target_years':payload.get('target_years',[])})

          rows=[]
          seen=set()
          for row in pending:
              key=(int(row['season']),str(row['league_id']).zfill(5))
              if key in reserved or key in seen:
                  continue
              seen.add(key)
              rows.append(row)
          campaign_count=int(os.environ['CAMPAIGN_COUNT'])
          batches_per_campaign=int(os.environ['BATCHES_PER_CAMPAIGN'])
          size=int(os.environ['BATCH_SIZE'])
          capacity_per_campaign=batches_per_campaign*size
          # The final wave may contain fewer rows than three full campaigns.
          # Dispatch only the number of campaigns that have real reserved rows;
          # empty campaigns create false failures and can make the watchdog
          # re-plan the same reservation.
          effective_campaign_count=max(1, min(campaign_count, (len(rows)+capacity_per_campaign-1)//capacity_per_campaign))
          total_batches=effective_campaign_count*batches_per_campaign
          selected=rows[:total_batches*size]
          if not selected:
              raise SystemExit('no unique rows available for next wave')
          if len(selected) < total_batches*size:
              print(f'partial final wave: selected {len(selected)} unique rows; requested {total_batches*size}', flush=True)
          Path('reserved_keys.json').write_text(json.dumps({'schema_version':'mfl_reservations_v1',
              'rows':[{'season':s,'league_id':lid} for s,lid in sorted(reserved)]},indent=2)+'\n')
          Path('next_wave_plan.json').write_text(json.dumps({
              'schema_version':'mfl_next_wave_plan_v1','source_run_id':os.environ['GITHUB_RUN_ID'],
              'campaign_count':effective_campaign_count,'requested_campaign_count':campaign_count,
              'batches_per_campaign':batches_per_campaign,
              'batch_size':size,'planned_league_years':selected,
              'reserved_by_prior_work':len(reserved)},indent=2)+'\n')
          Path('reservation_evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps({'prior_reserved':len(reserved),'selected':len(selected),
                            'campaign_count':effective_campaign_count,
                            'first':selected[0],'last':selected[-1]},sort_keys=True))
          PY
      - name: Publish reservation plan before launch
        uses: actions/upload-artifact@v4
        with:
          name: mfl-reservations-${{ github.run_id }}
          retention-days: 90
          path: |
            reserved_keys.json
            next_wave_plan.json
            reservation_evidence.json

      - name: Launch exactly the reserved wave
        env:
          GH_TOKEN: ${{ github.token }}
          MFL_RATE_LIMIT: ${{ inputs.mfl_rate_limit }}
        run: |
          # Fetch-only waves use the retained reducer proof as their immutable
          # predecessor. Do not guess at an Actions cache key: historical
          # campaign/research-overlay keys may still be listed after eviction.
          index_key=""
          reducer_run_id=$(jq -r '[.[] | select(.conclusion == "success")][0].databaseId' runs/reducers.json)
          test -n "$reducer_run_id" && test "$reducer_run_id" != null
          prior_artifact_run_id=""
          prior_artifact_name=""
          if [ -z "$index_key" ] || [ "$index_key" = null ]; then
            prior_artifact_run_id="$reducer_run_id"
            prior_artifact_name="mfl-reducer-proof-$reducer_run_id"
            echo "canonical index cache absent; using retained reducer artifact $prior_artifact_name"
          fi
          effective_campaign_count=$(python3 -c "import json; print(json.load(open('next_wave_plan.json'))['campaign_count'])")
          failures=0
          for ((campaign=0; campaign<effective_campaign_count; campaign++)); do
            start=$((campaign * ${{ inputs.batches_per_campaign }}))
            if ! gh workflow run mfl_register_batch_campaign.yml \
              -f manifest_path="corpus_seed/mfl_missing_execution_manifest_20260826.json" \
              --repo "${{ github.repository }}" --ref main \
              -f batch_start="$start" \
              -f batch_count="${{ inputs.batches_per_campaign }}" \
              -f batch_size="${{ inputs.batch_size }}" \
              -f max_parallel="${{ inputs.max_parallel }}" \
              -f cache_namespace="mfl-fetch-wave-v11-${{ github.run_id }}-c${campaign}" \
              -f storage_mode=fetch_only \
              -f prior_index_key="$index_key" \
              -f prior_index_cache_path=canonical_index_state \
              -f prior_index_artifact_run_id="$prior_artifact_run_id" \
              -f prior_index_artifact_name="$prior_artifact_name" \
              -f reservation_artifact_run_id="${{ github.run_id }}" \
              -f reservation_artifact_name="mfl-reservations-${{ github.run_id }}" \
              -f target_years="${{ inputs.target_years }}" \
              -f collect_all="${{ inputs.collect_all }}" \
              -f target_per_year=10000 \
              -f mfl_rate_limit="$MFL_RATE_LIMIT"; then
              failures=$((failures + 1))
              echo "dispatch failed for campaign $campaign" >&2
            fi
          done
          printf '{"campaign_count":%s,"batches_per_campaign":%s,"dispatch_failures":%s}\n' \
            "$effective_campaign_count" "${{ inputs.batches_per_campaign }}" "$failures" > campaign_dispatches.json
          test "$failures" -eq 0
      - name: Publish dispatch manifest
        uses: actions/upload-artifact@v4
        with:
          name: mfl-dispatch-manifest-${{ github.run_id }}
          retention-days: 90
          path: campaign_dispatches.json
