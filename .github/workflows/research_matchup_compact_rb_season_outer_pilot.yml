name: Research matchup compact RB season outer pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  season_outer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and gate RB 2025 compact season outer rows
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json
          from scripts.research_cohorts.compact_matchup_cells import (
              materialize_season_bracket_grade_position_batch,
              materialize_season_compact_outer_rows,
              materialize_season_core_cohort_position_batch,
          )

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          materialize_season_core_cohort_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='rb_core', year=2025, position='RB', split_threshold=50,
          )
          materialize_season_bracket_grade_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='rb_grade', year=2025, position='RB', split_threshold=50,
          )
          materialize_season_compact_outer_rows(
              c, core_outer_table='rb_core', grade_outer_table='rb_grade', output_table='rb_season_outer',
          )
          assert c.execute('SELECT COUNT(*) FROM rb_season_outer').fetchone()[0] == 164
          duplicates = c.execute("""
            SELECT COUNT(*) FROM (
              SELECT NFL_player_id,year FROM rb_season_outer GROUP BY 1,2 HAVING COUNT(*) > 1
            )
          """).fetchone()[0]
          assert duplicates == 0, duplicates
          cmc = c.execute("""
            SELECT array_length(cohort_cells), array_length(grade_cells),
              core.eligible_leagues, core.started_league_weeks, core.expected_starts,
              grade.eligible_leagues, grade.playoff_leagues, grade.champ_leagues
            FROM rb_season_outer o,
              UNNEST(o.cohort_cells) AS u(core),
              UNNEST(o.grade_cells) AS v(grade)
            WHERE o.NFL_player_id='00-0033280'
              AND core.q_teams='ALL' AND core.q_roster='ALL' AND core.q_scoring='ALL'
              AND core.q_pass_td='ALL' AND core.q_dynasty='ALL' AND core.q_best_ball='ALL'
              AND grade.q_playoff_teams='ALL'
          """).fetchone()
          assert cmc is not None
          assert cmc[0] > 0 and cmc[1] > 0, cmc
          assert cmc[2:] == (9980, 155272, 16.634154026479802, 9980, 6853, 2031), cmc
          print('rb_2025_season_outer=' + json.dumps({
              'outer_rows': 164,
              'cmc': cmc,
          }))
          PY
