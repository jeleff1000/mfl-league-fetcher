name: Research Matchup Rescue Weighted League Batches

on:
 workflow_dispatch:
   inputs:
     cache_key:
       description: Immutable public-only corpus + ops cache key
       required: true
       default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical-final
     years:
       description: JSON list of seasons to rebuild
       required: true
       default: '[2023,2024,2025]'
     batches:
       description: Number of balanced league-season batches per year
       required: true
       default: '100'
     only_batch:
       description: Optional single batch number for a targeted retry/debug run
       required: false
       default: ''
     global_batches:
       description: Build one global batch matrix across all supplied years
       required: false
       default: 'false'

concurrency:
 group: research-matchup-weighted-${{ github.repository }}
 cancel-in-progress: true

permissions:
 contents: read

jobs:
 plan:
   runs-on: ubuntu-24.04
   timeout-minutes: 15
   outputs:
     matrix: ${{ steps.plan.outputs.matrix }}
   steps:
     - uses: actions/checkout@v5

     - name: Checkout private pipeline code
       uses: actions/checkout@v5
       with:
         path: code

     - uses: actions/setup-python@v6
       with:
         python-version: "3.12"

     - name: Restore immutable public research lake
       uses: actions/cache/restore@v5
       with:
         path: research_public_lake
         key: ${{ inputs.cache_key }}
         fail-on-cache-miss: true

     - name: Install bounded dependencies
       run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 pytest==8.3.3

     - name: Run fast planner contract test
       working-directory: code
       run: python -m pytest -q scripts/research_cohorts/test_build_league_batch_plan.py

     - name: Verify public-only inputs
       shell: bash
       run: |
         test -s research_public_lake/corpus_snapshot.duckdb
         test -s research_public_lake/ops_cache.duckdb
         test ! -e research_public_lake/leagues_snapshot.duckdb

     - name: Build balanced league-season plan
       env:
         YEARS: ${{ inputs.years }}
         BATCHES: ${{ inputs.batches }}
         ONLY_BATCH: ${{ inputs.only_batch }}
         GLOBAL_BATCHES: ${{ inputs.global_batches }}
         RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
         RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
         RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
         RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
       run: |
         mapfile -t year_args < <(python -c 'import json,os; print("\n".join(str(x) for x in json.loads(os.environ["YEARS"])))')
         python code/scripts/research_cohorts/build_league_batch_plan.py \
           --years "${year_args[@]}" \
           --batches "${BATCHES}" \
           --out plan/league_batch_plan.parquet
         python - <<'PY'
         import json
         import os
         import pathlib
         matrix = json.loads(pathlib.Path("plan/matrix.json").read_text())
         only = os.environ.get("ONLY_BATCH", "").strip()
         global_batches = os.environ.get("GLOBAL_BATCHES", "false").strip().lower() == "true"
         years = json.loads(os.environ["YEARS"])
         batches = int(os.environ["BATCHES"])
         if global_batches:
             matrix = [
                 {"year_start": min(years), "year_end": max(years), "batch": batch}
                 for batch in range(batches)
             ]
         if only:
             n = int(only)
             matrix = [x for x in matrix if int(x["batch"]) == n]
             if not matrix:
                 raise SystemExit(f"batch {n} not present in plan")
             pathlib.Path("plan/matrix.json").write_text(json.dumps(matrix))
         if not matrix:
             raise SystemExit("empty rescue matrix")
         print(f"planned {len(matrix)} build jobs")
         with open("matrix-output.json", "w") as f:
             json.dump(matrix, f, separators=(",", ":"))
         PY

     - name: Upload league batch plan
       uses: actions/upload-artifact@v4
       with:
         name: research-league-batch-plan-${{ github.run_id }}
         path: |
           plan/league_batch_plan.parquet
           plan/summary.json
         if-no-files-found: error
         retention-days: 14
         compression-level: 6

     - id: plan
       shell: bash
       run: echo "matrix=$(cat matrix-output.json)" >> "${GITHUB_OUTPUT}"

 matchup:
   needs: plan
   strategy:
     fail-fast: false
     max-parallel: 15
     matrix:
       include: ${{ fromJSON(needs.plan.outputs.matrix) }}
   runs-on: ubuntu-24.04
   timeout-minutes: 355
   env:
     RESEARCH_YEAR_START: ${{ matrix.year_start || matrix.year }}
     RESEARCH_YEAR_END: ${{ matrix.year_end || matrix.year }}
     RESEARCH_LEAGUE_BATCHES: ${{ inputs.batches }}
     RESEARCH_LEAGUE_BATCH: ${{ matrix.batch }}
     RESEARCH_LEAGUE_BATCH_PLAN: ${{ github.workspace }}/plan/league_batch_plan.parquet
     RESEARCH_OUT_DIR: ${{ github.workspace }}/out
     RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
     RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
     RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
     RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
     RESEARCH_NO_CACHE: "1"
     RESEARCH_READER_MEMORY_MB: "10000"
     RESEARCH_MATCHUP_MEMORY_MB: "10000"
     RESEARCH_MATCHUP_THREADS: "1"

   steps:
     - uses: actions/checkout@v5

     - name: Checkout private pipeline code
       uses: actions/checkout@v5
       with:
         path: code

     - uses: actions/setup-python@v6
       with:
         python-version: "3.12"

     - name: Download league batch plan
       uses: actions/download-artifact@v5
       with:
         name: research-league-batch-plan-${{ github.run_id }}
         path: plan

     - name: Restore immutable public research lake
       uses: actions/cache/restore@v5
       with:
         path: research_public_lake
         key: ${{ inputs.cache_key }}
         fail-on-cache-miss: true

     - name: Install bounded dependencies
       run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1

     - name: Verify public-only inputs
       shell: bash
       run: |
         test -s research_public_lake/corpus_snapshot.duckdb
         test -s research_public_lake/ops_cache.duckdb
         test ! -e research_public_lake/leagues_snapshot.duckdb
         test -s plan/league_batch_plan.parquet
         mkdir -p out

     - name: Build weighted league-season batch
       run: python code/scripts/research_cohorts/build_research_matchup_cohort.py

     - name: Verify artifact year and batch bounds
       shell: bash
       run: |
         python - <<'PY'
         import os
         from pathlib import Path
         import duckdb
         year_start = int(os.environ["RESEARCH_YEAR_START"])
         year_end = int(os.environ["RESEARCH_YEAR_END"])
         batch = int(os.environ["RESEARCH_LEAGUE_BATCH"])
         batches = int(os.environ["RESEARCH_LEAGUE_BATCHES"])
         files = list(Path("out").glob("*.parquet"))
         assert files, "builder emitted no parquet"
         con = duckdb.connect()
         for path in files:
             cols = {r[0] for r in con.execute(
                 f"DESCRIBE SELECT * FROM read_parquet('{path.as_posix()}')").fetchall()}
             if "year" not in cols:
                 continue
             got = con.execute(
                 f"SELECT MIN(year), MAX(year), COUNT(*) FROM read_parquet('{path.as_posix()}')"
             ).fetchone()
             if got[2] == 0:
                 continue
             assert year_start <= got[0] <= got[1] <= year_end, (path, got, year_start, year_end)
         print(f"validated years={year_start}-{year_end} batch={batch}/{batches}")
         PY

     - name: Fail-fast validate matchup shard
       run: |
         python code/scripts/research_cohorts/validate_research_matchup_shard.py \
           --out out \
           --year-start "${RESEARCH_YEAR_START}" \
           --year-end "${RESEARCH_YEAR_END}"

     - name: Preserve failed shard diagnostics
       if: ${{ failure() }}
       uses: actions/upload-artifact@v4
       with:
         name: research-matchup-${{ matrix.year_start || matrix.year }}-${{ matrix.year_end || matrix.year }}-batch${{ matrix.batch }}-of${{ inputs.batches }}-${{ github.sha }}-diagnostic
         path: out
         if-no-files-found: ignore
         retention-days: 14
         compression-level: 0

     - name: Upload additive weighted batch
       uses: actions/upload-artifact@v4
       with:
         name: research-matchup-${{ matrix.year_start || matrix.year }}-${{ matrix.year_end || matrix.year }}-batch${{ matrix.batch }}-of${{ inputs.batches }}-${{ github.sha }}
         path: out/*.parquet
         if-no-files-found: error
         retention-days: 14
         compression-level: 6
