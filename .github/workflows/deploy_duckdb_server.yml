name: Deploy DuckDB Server

on:
  workflow_dispatch:
    inputs:
      allow_unready_recovery:
        description: Allow image-only recovery when the current server cannot report idle state
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fly-duckdb-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install flyctl
        run: |
          curl -sL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Build bounded server image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          timeout 300s flyctl deploy --config duckdb-server/fly.toml --dockerfile duckdb-server/Dockerfile --ignorefile duckdb-server/Dockerfile.dockerignore --build-context-warn-size 20MB --remote-only --build-only --push --image-label "server-${GITHUB_SHA}"

      - name: Update existing primary without resetting capacity or storage identity
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ALLOW_UNREADY_RECOVERY: ${{ inputs.allow_unready_recovery }}
        run: |
          set -euo pipefail
          # Preserve live guest/service/volume identity while overlaying only
          # the committed runtime, shutdown, and volume-growth contract.
          machines="$(flyctl machines list --app league-history-duckdb --json)"
          echo "$machines" | jq -e 'length == 1 and .[0].id == "1781e011b69068" and .[0].state == "started"' >/dev/null
          # A normal image restart must never resolve an unfinished league-file
          # swap. Require that no league replacement artifacts are present so
          # this deployment can only perform the scoped ___ops WAL recovery.
          flyctl ssh console --app league-history-duckdb --machine 1781e011b69068 \
            -C "/bin/sh -lc 'test ! -e /data/___leagues.duckdb.incoming && test ! -e /data/___leagues.duckdb.prev'"
          safe_to_update=false
          for attempt in 1 2 3 4 5; do
            # /ready intentionally returns 503 during startup.  Use the
            # always-available state endpoint so a startup regression can be
            # repaired without requiring the broken image to become ready.
            state="$(curl --silent --show-error --max-time 10 https://league-history-duckdb.fly.dev/internal/server-state || true)"
            if echo "$state" | jq -e '.ops_writes == 0 and .delta_publishes == 0' >/dev/null 2>&1; then
              safe_to_update=true
              break
            fi
            sleep 1
          done
          if [ "$safe_to_update" != true ]; then
            test "$ALLOW_UNREADY_RECOVERY" = true
            echo "Current image is unresponsive; proceeding with explicit image-only recovery"
          fi
          # These two predate the committed runtime contract and override
          # machine config at process launch. Stage only their removal so the
          # one guarded machine update below performs the sole restart.
          legacy_runtime_secrets=("DUCKDB_MEMORY_LIMIT" "DUCKDB_THREADS")
          present_secret_names="$(flyctl secrets list --app league-history-duckdb --json \
            | jq -r '.[] | (.Name // .name)')"
          secrets_to_unset=()
          for secret_name in "${legacy_runtime_secrets[@]}"; do
            if grep -Fxq "$secret_name" <<<"$present_secret_names"; then
              secrets_to_unset+=("$secret_name")
            fi
          done
          if [ "${#secrets_to_unset[@]}" -gt 0 ]; then
            flyctl secrets unset --app league-history-duckdb --stage "${secrets_to_unset[@]}"
          fi
          update_ok=false
          for update_attempt in 1 2 3; do
            flyctl machines list --app league-history-duckdb --json > current-machines.json
            jq -e 'length == 1 and .[0].id == "1781e011b69068"' current-machines.json >/dev/null
            jq '.[0]' current-machines.json > current-machine.json
            python scripts/build_fly_machine_update_config.py \
              --machine-json current-machine.json \
              --fly-toml duckdb-server/fly.toml \
              --output machine-config.json
            if timeout 330s flyctl machine update 1781e011b69068 \
                --app league-history-duckdb \
                --image "registry.fly.io/league-history-duckdb:server-${GITHUB_SHA}" \
                --machine-config machine-config.json --wait-timeout 300 --yes; then
              update_ok=true
              break
            fi
            test "$update_attempt" != 3
            sleep 2
          done
          test "$update_ok" = true
          ready=false
          for attempt in $(seq 1 20); do
            state="$(curl --fail --silent --max-time 5 https://league-history-duckdb.fly.dev/ready || true)"
            if echo "$state" | jq -e '.accepting_queries == true' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
          echo "$state" | jq -e '
            .storage_health.healthy == true and
            .runtime_contract.duckdb_version == "v1.5.5" and
            .runtime_contract.threads == 2
          ' >/dev/null
          updated_machines="$(flyctl machines list --app league-history-duckdb --json)"
          echo "$updated_machines" | jq -e '
            length == 1 and
            .[0].id == "1781e011b69068" and
            .[0].state == "started" and
            .[0].config.stop_config.signal == "SIGTERM" and
            .[0].config.stop_config.timeout == 300000000000 and
            .[0].config.mounts[0].extend_threshold_percent == 80 and
            .[0].config.mounts[0].add_size_gb == 10 and
            .[0].config.mounts[0].size_gb_limit == 200
          ' >/dev/null
