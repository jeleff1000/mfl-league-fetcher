      - name: Normalize initial canonical proof
        if: ${{ (inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only') && inputs.prior_index_key == '' }}
        env:
          CANONICAL_CHUNK_KEY: ${{ inputs.canonical_namespace }}-chunk-campaign-${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          key=os.environ['CANONICAL_CHUNK_KEY']
          proof=json.load(open('canonical_append_proof.json', encoding='utf-8'))
          source_key=proof.get('chunk_cache_key')
          proof['chunk_cache_key']=key
          register=json.load(open('canonical_mfl_register_all_runs.json', encoding='utf-8'))
          for chunk in register.get('chunks', []):
              if chunk.get('cache_key') == source_key:
                  chunk['cache_key']=key
          json.dump(proof,open('canonical_append_proof.json','w'),indent=2,sort_keys=True)
          json.dump(register,open('canonical_mfl_register_all_runs.json','w'),indent=2,sort_keys=True)
          PY
      - name: Build canonical research overlay
        if: ${{ inputs.storage_mode == 'chunked' || inputs.storage_mode == 'fetch_only' }}
        run: |
          python3 code/scripts/research_cohorts/build_mfl_research_overlay.py \
            --chunk canonical_mfl_register_chunk.duckdb \
            --output canonical_mfl_research_overlay.duckdb
          python3 - <<'PY'
          import json, duckdb
          source=duckdb.connect('mfl_research_overlay.duckdb',read_only=True)
          canonical=duckdb.connect('canonical_mfl_research_overlay.duckdb',read_only=True)
          tables=['league_settings','player_fantasy','matchup']
          rows={}
          for table in tables:
              source_schema=[r[0] for r in source.execute(f'DESCRIBE "{table}"').fetchall()]
              canonical_schema=[r[0] for r in canonical.execute(f'DESCRIBE "{table}"').fetchall()]
              if source_schema != canonical_schema:
                  raise SystemExit(f'{table} canonical research schema mismatch')
              rows[table]=canonical.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
              if rows[table] <= 0:
                  raise SystemExit(f'{table} canonical overlay is empty')
          json.dump({'schema_unchanged':True,'rows':rows,'new_lineage':False},open('canonical_mfl_research_overlay_proof.json','w'),indent=2,sort_keys=True)
          print(json.dumps({'rows':rows,'schema_unchanged':True},sort_keys=True))
          source.close(); canonical.close()
