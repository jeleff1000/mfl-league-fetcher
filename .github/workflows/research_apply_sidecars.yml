name: Apply Research Outcome and Signal Sidecars

on:
  workflow_dispatch:
    inputs:
      outcome_run_id:
        description: Combined outcome sidecar run
        required: true
        default: "31061116294"
      matchup_combine_run_id:
        description: Combined source matchup rescue run
        required: true
        default: "31062200000"
      base_cache_key:
        description: Current immutable public lake cache
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-canonical
      output_cache_key:
        description: Explicit versioned cache key for the validated merged lake
        required: true
        default: research-public-lake-v4-Linux-20260806-signal-rescue-championship-v10

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.base_cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Download combined sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outcomes rescue
          gh run download '${{ inputs.outcome_run_id }}' --repo '${{ github.repository }}' --pattern 'research-outcome-targets-combined-*' --dir outcomes
          gh run download '${{ inputs.matchup_combine_run_id }}' --repo '${{ github.repository }}' --pattern 'research-source-matchup-rescue-combined-*' --dir rescue
      - name: Materialize overlay DuckDBs
        run: |
          OUTCOME=$(find outcomes -name '*.parquet' | head -1)
          MATCHUP=$(find rescue -name 'source_matchup_rescue.parquet' | head -1)
          test -s "$OUTCOME"; test -s "$MATCHUP"
          python - "$OUTCOME" "$MATCHUP" <<'PY'
          import duckdb, sys
          outcome, matchup = sys.argv[1:]
          for path, table in [(outcome, 'outcome_targets'), (matchup, 'source_matchup_rescue')]:
              db = f'overlay_{table}.duckdb'
              con = duckdb.connect(db)
              con.execute('create schema public')
              con.execute(f"create table public.{table} as select * from read_parquet(?)", [path])
              con.close()
          PY
      - name: Merge sidecars and validate
        run: |
          python code/scripts/research_cohorts/merge_research_sidecars.py \
            --base research_public_lake/corpus_snapshot.duckdb \
            --out merged_corpus_snapshot.duckdb \
            --outcomes overlay_outcome_targets.duckdb \
            --matchups overlay_source_matchup_rescue.duckdb
          mv merged_corpus_snapshot.duckdb research_public_lake/corpus_snapshot.duckdb
          python code/scripts/research_cohorts/validate_research_public_lake.py research_public_lake
      - uses: actions/cache/save@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      - uses: actions/upload-artifact@v4
        with:
          name: research-public-lake-signal-rescue-${{ github.run_id }}
          path: research_public_lake/corpus_snapshot.duckdb
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
