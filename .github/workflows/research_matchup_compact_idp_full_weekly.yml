name: Research matchup compact full IDP weekly pilot

on:
  workflow_dispatch:
    inputs:
      cache_key:
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613

permissions:
  contents: read

jobs:
  idp-weekly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        player_bucket: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1
      - name: Build and gate every 2025 IDP weekly outer row
        env:
          PYTHONPATH: ${{ github.workspace }}/code
        run: |
          python - <<'PY'
          import duckdb, json, time
          from scripts.research_cohorts.compact_matchup_cells import materialize_weekly_core_cohort_position_batch

          c = duckdb.connect()
          c.execute("ATTACH 'research_public_lake/corpus_snapshot.duckdb' AS lake (READ_ONLY)")
          c.execute("ATTACH 'research_public_lake/ops_cache.duckdb' AS ops (READ_ONLY)")
          started = time.monotonic()
          materialize_weekly_core_cohort_position_batch(
              c, source_table='lake.public.player_fantasy',
              nfl_stats_table='ops.nfl_historical.nfl_player_stats_all',
              output_table='idp_weekly', year=2025, position='IDP', split_threshold=150,
              player_bucket_count=4, player_bucket=${{ matrix.player_bucket }},
          )
          outer_rows, cells, myles_rows = c.execute("""
            SELECT COUNT(*), COALESCE(SUM(array_length(cohort_cells)),0),
              COUNT(*) FILTER (WHERE NFL_player_id='00-0033868')
            FROM idp_weekly
          """).fetchone()
          result={'player_bucket': ${{ matrix.player_bucket }}, 'outer_rows': outer_rows, 'cohort_cells': cells, 'myles_weekly_rows': myles_rows,
                  'seconds': round(time.monotonic()-started, 3)}
          expected = {
              0: (3397, 1517856, 0),
              1: (2990, 1345934, 0),
              2: (2918, 1287538, 0),
              3: (3222, 1436860, 17),
          }
          assert (outer_rows, cells, myles_rows) == expected[result['player_bucket']], result
          print('idp_full_weekly_2025=' + json.dumps(result))
          PY
