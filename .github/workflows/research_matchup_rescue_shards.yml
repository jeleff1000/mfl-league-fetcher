name: Research Matchup Rescue Shards

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable public-only corpus + ops cache key
        required: true
        default: research-public-lake-v3-Linux-20260730
      years:
        description: 'JSON list of 2018-2025 seasons. Each season is separately partitioned into five buckets.'
        required: true
        default: '["2025","2024","2023","2022","2021","2020","2019","2018"]'
      max_parallel:
        description: 'Maximum concurrent full-lake shard builds; keep low enough to avoid runner memory contention.'
        required: true
        default: '5'
      buckets:
        description: 'JSON list of bucket IDs to build; use [0] for an isolated pilot.'
        required: true
        default: '[0,1,2,3,4]'
      bucket_count:
        description: 'Total league buckets used by the builder; increase this when a five-way bucket is too large.'
        required: true
        default: '5'

permissions:
  contents: read

jobs:
  matchup:
    strategy:
      fail-fast: false
      # Full-lake DuckDB builds contend heavily when too many run at once.  Keep
      # this dispatch-configurable; the five bucket IDs still cover each year
      # exactly once regardless of concurrency.
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        year: ${{ fromJSON(inputs.years) }}
        bucket: ${{ fromJSON(inputs.buckets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ matrix.year }}
      RESEARCH_YEAR_END: ${{ matrix.year }}
      RESEARCH_LEAGUE_BUCKETS: ${{ inputs.bucket_count }}
      RESEARCH_LEAGUE_BUCKET: ${{ matrix.bucket }}
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_NATIVE_ID_CROSSWALK: ${{ github.workspace }}/research_public_lake/native_id_crosswalk.parquet
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: "1"
      RESEARCH_READER_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_MEMORY_MB: "10000"
      RESEARCH_MATCHUP_THREADS: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore immutable public research lake
        uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true

      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 pytest==8.3.3

      - name: Fail-fast source SQL guards
        run: |
          env -u RESEARCH_YEAR_START -u RESEARCH_YEAR_END \
            -u RESEARCH_LEAGUE_BUCKETS -u RESEARCH_LEAGUE_BUCKET \
            -u RESEARCH_OUT_DIR -u RESEARCH_SNAPSHOT_PATH \
            -u RESEARCH_CORPUS_PATH -u RESEARCH_OPS_CACHE_PATH \
            -u RESEARCH_NATIVE_ID_CROSSWALK -u RESEARCH_REF_DIR \
            -u RESEARCH_NO_CACHE -u RESEARCH_READER_MEMORY_MB \
            -u RESEARCH_MATCHUP_MEMORY_MB -u RESEARCH_MATCHUP_THREADS \
            python -m pytest -q \
            code/scripts/research_cohorts/test_build_research_matchup_canon.py \
            code/scripts/research_cohorts/test_matchup_po_validation.py \
            code/scripts/research_cohorts/test_matchup_sql_binds.py

      - name: Download deterministic native identity crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-native-id-crosswalk-v4 \
            --repo jeleff1000/league-history-workers \
            --pattern native_id_crosswalk.parquet \
            --dir research_public_lake

      - name: Verify public-only inputs
        shell: bash
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out

      - name: Build matchup population shard
        run: python code/scripts/research_cohorts/build_research_matchup_cohort.py

      - name: Verify artifact year bounds
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import duckdb
          year = int(os.environ["RESEARCH_YEAR_START"])
          files = list(Path("out").glob("*.parquet"))
          assert files, "builder emitted no parquet"
          con = duckdb.connect()
          for path in files:
              cols = {r[0] for r in con.execute(
                  f"DESCRIBE SELECT * FROM read_parquet('{path.as_posix()}')").fetchall()}
              if "year" not in cols:
                  continue
              got = con.execute(
                  f"SELECT MIN(year), MAX(year), COUNT(*) FROM read_parquet('{path.as_posix()}')"
              ).fetchone()
              if got[2] == 0:
                  print(path, "typed empty shard")
                  continue
              assert got[0] == got[1] == year, (path, got, year)
              print(path, got)
          PY

      - name: Fail-fast matchup semantic gate
        run: |
          python code/scripts/research_cohorts/validate_research_matchup_shard.py \
            --out out \
            --year-start "${{ matrix.year }}" \
            --year-end "${{ matrix.year }}"

      - name: Upload additive population shard
        uses: actions/upload-artifact@v4
        with:
          # bucket count comes from the env that actually partitions the leagues, so the
          # artifact name cannot go stale the way a hardcoded "of4" did when it became 5
          name: research-matchup-${{ matrix.year }}-b${{ matrix.bucket }}-of${{ env.RESEARCH_LEAGUE_BUCKETS }}-${{ github.sha }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
