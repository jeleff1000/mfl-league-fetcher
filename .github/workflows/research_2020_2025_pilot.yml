name: Research 2020-2025 Matchup Rollup Pilot

on:
  push:
    paths:
      - ".2020_2025_pilot_dispatch_once"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollup:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
          fail-on-cache-miss: true
      - name: Install dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1 requests
      - name: Build and validate 2020-2025
        run: |
          set -euo pipefail
          mkdir -p out
          started=$(date +%s)
          python code/scripts/research_cohorts/build_bounded_matchup_cache.py \
            --snapshot research_public_lake/corpus_snapshot.duckdb \
            --ops-cache research_public_lake/ops_cache.duckdb \
            --output out/rollup_2020_2025.duckdb \
            --year-start 2020 --year-end 2025
          elapsed=$(( $(date +%s) - started ))
          python - <<'PY'
          import duckdb
          c=duckdb.connect('out/rollup_2020_2025.duckdb', read_only=True)
          required={'research_matchup_adaptive','research_matchup_adaptive_weekly','research_matchup_adaptive_career'}
          got={r[0] for r in c.execute("select table_name from information_schema.tables where table_schema='main'").fetchall()}
          assert required <= got, required-got
          counts={t:c.execute(f'select count(*) from "{t}"').fetchone()[0] for t in required}
          assert all(v > 0 for v in counts.values()), counts
          years=c.execute("select min(year), max(year), count(distinct year) from research_matchup_adaptive").fetchone()
          cmc=c.execute("select count(*), min(year), max(year) from research_matchup_adaptive where NFL_player_id='00-0033280'").fetchone()
          print({'counts':counts,'years':years,'cmc_seasons':cmc})
          assert years[0] <= 2020 and years[1] >= 2025 and years[2] >= 6
          assert cmc[0] > 0
          PY
          echo "rollup_2020_2025_seconds=$elapsed"
