name: Targeted matchup rebuild from repaired source DBs

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Public lake cache containing the repaired source overlay
        required: true
      db_names:
        description: Comma-separated source DB names to rebuild
        required: true
      buckets:
        description: Number of disjoint league buckets to run
        required: false
        default: '1'
      year_start:
        required: true
        default: '2003'
      year_end:
        required: true
        default: '2025'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      bucket_list: ${{ steps.matrix.outputs.bucket_list }}
    steps:
      - id: matrix
        shell: bash
        env:
          BUCKETS: ${{ inputs.buckets }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n = int(os.environ["BUCKETS"])
          if n < 1:
              raise SystemExit("buckets must be positive")
          print("bucket_list=" + json.dumps(list(range(n))))
          PY

  matchup:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        bucket: ${{ fromJSON(needs.prepare.outputs.bucket_list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RESEARCH_YEAR_START: ${{ inputs.year_start }}
      RESEARCH_YEAR_END: ${{ inputs.year_end }}
      RESEARCH_LEAGUE_BUCKETS: ${{ inputs.buckets }}
      RESEARCH_LEAGUE_BUCKET: ${{ matrix.bucket }}
      RESEARCH_OUT_DIR: ${{ github.workspace }}/out
      RESEARCH_SNAPSHOT_PATH: ${{ github.workspace }}/research_public_lake/corpus_snapshot.duckdb
      RESEARCH_CORPUS_PATH: ${{ github.workspace }}/research_public_lake/no-second-source.duckdb
      RESEARCH_OPS_CACHE_PATH: ${{ github.workspace }}/research_public_lake/ops_cache.duckdb
      RESEARCH_NATIVE_ID_CROSSWALK: ${{ github.workspace }}/research_public_lake/native_id_crosswalk.parquet
      RESEARCH_REF_DIR: ${{ github.workspace }}/research_public_lake
      RESEARCH_NO_CACHE: '1'
      RESEARCH_READER_MEMORY_MB: '6000'
      RESEARCH_MATCHUP_MEMORY_MB: '10000'
      RESEARCH_MATCHUP_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 numpy==1.26.4 scipy==1.14.1
      - name: Download deterministic native identity crosswalk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download research-native-id-crosswalk-v4 \
            --repo jeleff1000/mfl-league-fetcher \
            --pattern native_id_crosswalk.parquet \
            --dir research_public_lake
      - name: Create focused DB target list
        shell: bash
        env:
          TARGET_DB_NAMES: ${{ inputs.db_names }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = sorted({x.strip() for x in os.environ['TARGET_DB_NAMES'].split(',') if x.strip()})
          if not names:
              raise SystemExit('empty targeted DB list')
          Path('target_leagues.json').write_text(
              json.dumps([{'db_name': name} for name in names]) + '\n', encoding='utf-8'
          )
          print(f'target DBs: {len(names)}')
          PY
      - name: Verify public-only inputs
        run: |
          test -s research_public_lake/corpus_snapshot.duckdb
          test -s research_public_lake/ops_cache.duckdb
          test ! -e research_public_lake/leagues_snapshot.duckdb
          mkdir -p out
      - name: Build focused matchup shard
        env:
          RESEARCH_LEAGUE_LIST: ${{ github.workspace }}/target_leagues.json
        run: python code/scripts/research_cohorts/build_research_matchup_cohort.py
      - name: Validate focused matchup shard
        run: |
          python code/scripts/research_cohorts/validate_research_matchup_shard.py \
            --out out --year-start '${{ inputs.year_start }}' --year-end '${{ inputs.year_end }}'
      - name: Upload focused additive matchup shard
        uses: actions/upload-artifact@v4
        with:
          name: research-matchup-targeted-b${{ matrix.bucket }}-of${{ inputs.buckets }}-${{ github.run_id }}
          path: out/*.parquet
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
