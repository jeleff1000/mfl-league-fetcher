name: Research Playoff + Championship Signal Rescue

on:
  workflow_dispatch:
    inputs:
      cache_key:
        description: Immutable canonical research lake cache key
        required: true
        default: research-public-lake-v4-Linux-20260806-championship-v2-final-playoff-anchor-outcomes-31147899613
      shards:
        description: Deterministic source shards
        required: true
        default: "256"
      pilot:
        description: Limit to 15 targets per platform for the source pilot
        required: true
        type: boolean
        default: true
      shard_list:
        description: Optional comma-separated shard numbers; empty runs every shard
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4 polars==1.35.2 scipy==1.14.1 pytest==8.3.3
      - name: Run fail-fast source contracts
        working-directory: code
        run: python -m pytest -q scripts/research_cohorts/test_source_backfill_readiness.py

  prepare:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      shard_list: ${{ steps.matrix.outputs.shard_list }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: research_public_lake
          key: ${{ inputs.cache_key }}
          fail-on-cache-miss: true
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2
      - name: Build exact 617-target manifest
        run: |
          python code/scripts/research_cohorts/build_playoff_championship_targets.py \
            --root research_public_lake --out out
          if [ '${{ inputs.pilot }}' = 'true' ]; then
            python code/scripts/research_cohorts/trim_playoff_championship_pilot.py \
              --input out/playoff_championship_targets.json \
              --output out/playoff_championship_targets.json \
              --per-platform 15
          fi
      - name: Build shard matrix
        id: matrix
        env:
          SHARDS: ${{ inputs.shards }}
          SHARD_LIST: ${{ inputs.shard_list }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          n=int(os.environ['SHARDS'])
          requested=[int(x.strip()) for x in os.environ.get('SHARD_LIST','').split(',') if x.strip()]
          values=requested or list(range(n))
          if any(x<0 or x>=n for x in values): raise SystemExit('invalid shard_list')
          print('shard_list='+json.dumps(values))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: playoff-championship-targets-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  rescue:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shard_list) }}
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private pipeline code
        uses: actions/checkout@v5
        with:
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install duckdb==1.5.1 pyarrow==15.0.2 pandas==2.2.3 requests==2.32.4 polars==1.35.2 scipy==1.14.1
      - name: Download exact target manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inventory
          gh run download '${{ github.run_id }}' --repo '${{ github.repository }}' --name 'playoff-championship-targets-${{ github.run_id }}' --dir inventory
      - name: Fetch targeted source signal sidecar
        env:
          PYTHONPATH: ${{ github.workspace }}/code/fantasy_football_data_scripts
        run: |
          mkdir -p out
          python code/scripts/research_cohorts/build_source_matchup_rescue_sidecar.py \
            --targets inventory/playoff_championship_targets.json \
            --shard '${{ matrix.shard }}' --shards '${{ inputs.shards }}' --workers 1 \
            --out out/source_matchup_rescue_${{ matrix.shard }}.parquet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-source-matchup-rescue-${{ matrix.shard }}-${{ github.run_id }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Fail closed on source errors or partial weeks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/source_matchup_rescue_${{ matrix.shard }}.jsonl')
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          allowed={'done','done_with_source_no_opponent_weeks','done_with_source_no_games_weeks','source_returned_no_matchups','source_returned_no_target_weeks','source_no_opponent_format','source_no_games_weeks','missing_historical_source_id'}
          bad=[r for r in rows if r.get('status') not in allowed]
          retry=[r for r in rows if r.get('status') in {'source_fetch_failed','source_returned_partial_target_weeks'}]
          print({'targets':len(rows),'done':sum(r.get('status')=='done' for r in rows),'source_empty':sum(r.get('status') in allowed-{'done'} for r in rows),'retry_required':len(retry),'unexpected':len(bad)})
          if retry or bad: raise SystemExit(1)
          PY
